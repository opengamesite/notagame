<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>La Piccola — Mein Zimmer</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden}
body{background:#ead8b8;color:#34271f;font-family:monospace;display:flex;flex-direction:column}
header{height:44px;flex:0 0 44px;background:#fff0d2;border-bottom:3px solid #34271f;display:flex;align-items:center;justify-content:space-between;padding:0 12px;z-index:2}
.brand{font-size:14px;font-weight:1000;letter-spacing:1px}
.brand span{background:#a94132;color:#fff0d2;padding:5px 8px}
.stats{display:flex;align-items:center;gap:6px;font-weight:bold;font-size:12px}
.pill{background:#fff9e9;border:2px solid #34271f;padding:5px 8px}
button{font:inherit;cursor:pointer;background:#fff0d2;color:#34271f;border:2px solid #34271f;box-shadow:2px 2px #34271f;padding:5px 8px;font-weight:bold;touch-action:manipulation}
button:active{transform:translate(2px,2px);box-shadow:none}
.sound{background:#476b43;color:white}
main{flex:1;min-height:0;width:100%;display:flex}
.frame{width:100%;height:100%;display:flex;flex-direction:column;min-height:0}
canvas{display:block;flex:1;min-height:0;width:100%;height:100%;image-rendering:pixelated;touch-action:none;background:#c7d9bc}
.hud{flex:0 0 auto;display:grid;grid-template-columns:1fr 1fr 1fr;gap:5px;padding:5px;background:#f7e7c8;border-top:2px solid #34271f}
.panel{min-width:0;min-height:36px;background:#fff6e3;border:2px solid #34271f;padding:4px 7px;box-shadow:2px 2px #d0b78f}
.label{font-size:9px;color:#82684d;margin-bottom:3px;letter-spacing:1px}
.value{font-size:11px;font-weight:bold;line-height:1.3;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.controls{display:none;flex:0 0 auto;justify-content:center;gap:7px;padding:5px;background:#f7e7c8}
.controls button{min-width:44px;padding:5px}
@media(max-width:650px){
 header{height:39px;flex-basis:39px;padding:0 5px}
 .brand{font-size:10px}.stats{font-size:10px;gap:3px}.pill{padding:4px}
 .hud{gap:3px;padding:4px}.panel{min-height:32px;padding:3px 4px}
 .label{font-size:8px}.value{font-size:9px}
 .controls{display:flex}.controls button{min-width:40px}
}
</style>
</head>
<body>
<header>
 <div class="brand"><span>LA PICCOLA</span> ✦</div>
 <div class="stats">
  <div class="pill">☼ <span id="clock">18:30</span></div>
  <div class="pill">◆ <span id="money">120</span></div>
  <button class="sound" id="soundBtn">♫ ON</button>
  <button id="exitBtn">↩ Stadt</button>
  <button id="fullBtn">⛶</button>
 </div>
</header>

<main><div class="frame">
 <canvas id="game" width="960" height="540"></canvas>
 <div class="hud">
  <div class="panel"><div class="label">ORDINE</div><div class="value" id="orderText">✦</div></div>
  <div class="panel"><div class="label">AL LAVORO</div><div class="value" id="taskText">…</div></div>
  <div class="panel"><div class="label">RISTORANTE</div><div class="value" id="ingredientText">✦</div></div>
 </div>
 <div class="controls">
  <button data-key="a">◀</button><button data-key="w">▲</button>
  <button data-key="d">▶</button><button id="mobileE">E ✦</button>
 </div>
</div></main>

<script>
(()=>{
"use strict";

const STORAGE_KEY="mein-zimmer-save-v1";
const JOB_KEY="pizzajob-save-v1";
const W=960,H=540,FLOOR=444,WORLD=2200;
const canvas=document.getElementById("game");
const ctx=canvas.getContext("2d");
ctx.imageSmoothingEnabled=false;

const $=id=>document.getElementById(id);

function resizeGame(){
 const r=canvas.getBoundingClientRect();
 const dpr=Math.min(devicePixelRatio||1,2);
 canvas.width=Math.max(1,Math.round(r.width*dpr));
 canvas.height=Math.max(1,Math.round(r.height*dpr));
 ctx.setTransform(canvas.width/W,0,0,canvas.height/H,0,0);
 ctx.imageSmoothingEnabled=false;
}
addEventListener("resize",resizeGame);
if(window.ResizeObserver)new ResizeObserver(resizeGame).observe(canvas);

const defaults={
 money:120,
 equipped:{head:null,face:null,clothes:null,back:null,pants:null}
};

function readMain(){
 try{
  const s=JSON.parse(localStorage.getItem(STORAGE_KEY)||"null")||{};
  return {...defaults,...s,equipped:{...defaults.equipped,...(s.equipped||{})}};
 }catch{
  return {...defaults,equipped:{...defaults.equipped}};
 }
}

function saveMain(s){
 try{localStorage.setItem(STORAGE_KEY,JSON.stringify(s))}catch{}
}

function money(){
 return Math.floor(Number(readMain().money)||0);
}

function addMoney(n){
 const s=readMain();
 s.money=Math.max(0,Number(s.money)||0)+n;
 saveMain(s);
 $("money").textContent=money();
}

function cosmetics(){return readMain().equipped||{}}

let job;
try{job=JSON.parse(localStorage.getItem(JOB_KEY)||"null")}catch{job=null}

job={
 delivered:0,
 tips:0,
 unlockedIngredients:["Tomate","Käse"],
 cleanedToilets:0,
 servedTables:0,
 bestPizza:"Margherita",
 ...(job||{})
};

if(!Array.isArray(job.unlockedIngredients))
 job.unlockedIngredients=["Tomate","Käse"];

function saveJob(){
 try{localStorage.setItem(JOB_KEY,JSON.stringify(job))}catch{}
}

const ingredients=[
 {name:"Tomate",color:"#c94732"},
 {name:"Käse",color:"#f5cd56"},
 {name:"Basilikum",color:"#416f3e"},
 {name:"Pilze",color:"#e6d3b3"},
 {name:"Salami",color:"#a52f27"},
 {name:"Oliven",color:"#343c2b"}
];

const stations=[
 {id:"dough",x:250,label:"TEIG"},
 {id:"sauce",x:470,label:"SALSA"},
 {id:"toppings",x:700,label:"INGREDIENTI"},
 {id:"oven",x:1000,label:"FORNO"},
 {id:"counter",x:1370,label:"CIAO!"}
];

const player={
 x:350,y:FLOOR-78,w:34,h:78,
 vx:0,vy:0,facing:1,grounded:true,walk:0
};

const keys={};
let gameTime=0,lastTime=0,cameraX=0;
let actionCooldown=0;
let message="",messageTimer=0;
let order=null,currentStage="dough",currentTask=null;
let taskElapsed=0,taskDuration=0;
let ovenTimer=0,ovenReady=false;
let carriedPizza=false;
let toppingsAdded=[];
let particles=[];
let soundOn=true,audio=null;
let stepTimer=0;
let customers=[];
let customerSpawn=3;
let toiletDirty=true;
let toiletCleaning=false;
let cleanProgress=0;
let room="ground";

function audioContext(){
 if(!audio){
  const A=window.AudioContext||window.webkitAudioContext;
  if(A)audio=new A();
 }
 if(audio?.state==="suspended")audio.resume();
 return audio;
}

function tone(freq=440,duration=.1,type="square",volume=.035,slide=0){
 if(!soundOn)return;
 const a=audioContext();
 if(!a)return;
 const o=a.createOscillator(),g=a.createGain();
 o.type=type;
 o.frequency.setValueAtTime(freq,a.currentTime);
 if(slide)o.frequency.linearRampToValueAtTime(Math.max(30,freq+slide),a.currentTime+duration);
 g.gain.setValueAtTime(volume,a.currentTime);
 g.gain.exponentialRampToValueAtTime(.001,a.currentTime+duration);
 o.connect(g);g.connect(a.destination);
 o.start();o.stop(a.currentTime+duration);
}

function noise(duration=.1,volume=.025,filterFreq=900){
 if(!soundOn)return;
 const a=audioContext();
 if(!a)return;
 const length=Math.floor(a.sampleRate*duration);
 const buffer=a.createBuffer(1,length,a.sampleRate);
 const data=buffer.getChannelData(0);
 for(let i=0;i<length;i++)data[i]=(Math.random()*2-1)*(1-i/length);
 const source=a.createBufferSource();
 const filter=a.createBiquadFilter();
 const gain=a.createGain();
 source.buffer=buffer;
 filter.type="lowpass";
 filter.frequency.value=filterFreq;
 gain.gain.value=volume;
 source.connect(filter);
 filter.connect(gain);
 gain.connect(a.destination);
 source.start();
}

function sound(n){
 if(!soundOn)return;
 if(n==="step")tone(90,.045,"triangle",.018,-20);
 if(n==="jump")tone(230,.12,"square",.035,160);
 if(n==="roll"){noise(.14,.045,650);tone(180,.13,"triangle",.025,-30)}
 if(n==="sauce")noise(.12,.035,1200);
 if(n==="ingredient")tone(600,.055,"square",.02,90);
 if(n==="oven"){tone(130,.22,"triangle",.04,100);noise(.18,.04,500)}
 if(n==="ding"){tone(880,.12,"sine",.045,100);tone(1175,.22,"sine",.035)}
 if(n==="cash"){tone(740,.08,"square",.035,200);tone(990,.13,"square",.03,200)}
 if(n==="unlock"){tone(523,.12,"triangle",.035);tone(659,.12,"triangle",.035);tone(784,.25,"triangle",.04,120)}
 if(n==="bell"){tone(1050,.12,"sine",.03,-180);tone(780,.2,"sine",.025,-100)}
 if(n==="thud")tone(75,.08,"triangle",.035,-35);
}

function say(s,d=2){message=s;messageTimer=d}
function rect(x,y,w,h,c){ctx.fillStyle=c;ctx.fillRect(Math.round(x),Math.round(y),Math.round(w),Math.round(h))}
function outline(x,y,w,h,c="#34271f",width=2){
 ctx.strokeStyle=c;ctx.lineWidth=width;
 ctx.strokeRect(Math.round(x),Math.round(y),Math.round(w),Math.round(h));
}
function line(x1,y1,x2,y2,c,width=2){
 ctx.strokeStyle=c;ctx.lineWidth=width;
 ctx.beginPath();ctx.moveTo(x1,y1);ctx.lineTo(x2,y2);ctx.stroke();
}
function txt(s,x,y,c="#34271f",size=12,align="left"){
 ctx.font="bold "+size+"px monospace";
 ctx.fillStyle=c;ctx.textAlign=align;
 ctx.fillText(s,x,y);ctx.textAlign="left";
}
function clamp(v,a,b){return Math.max(a,Math.min(b,v))}
function dist(s){return Math.abs(player.x+player.w/2-s.x)}

function nearby(){
 let best=null,d=75;
 for(const s of stations){
  if(dist(s)<d){best=s;d=dist(s)}
 }
 return best;
}

function burst(x,y,color,n=10){
 for(let i=0;i<n;i++){
  particles.push({
   x,y,color,
   vx:(Math.random()-.5)*110,
   vy:-Math.random()*120-15,
   life:.4+Math.random()*.65,
   size:2+Math.random()*4
  });
 }
}

function newOrder(){
 const available=ingredients.filter(i=>job.unlockedIngredients.includes(i.name));
 const extras=available.filter(i=>i.name!=="Tomate"&&i.name!=="Käse");
 const chosen=extras.length
  ?[...extras].sort(()=>Math.random()-.5).slice(0,Math.random()<.65?1:Math.min(2,extras.length)).map(i=>i.name)
  :[];

 order={
  base:["Tomate","Käse"],
  toppings:chosen,
  name:chosen.length?"Pizza "+chosen.join(" & "):"Margherita",
  reward:20+chosen.length*5,
  tip:5+Math.floor(Math.random()*11)
 };

 currentStage="dough";
 currentTask=null;
 taskElapsed=0;
 taskDuration=0;
 ovenTimer=0;
 ovenReady=false;
 carriedPizza=false;
 toppingsAdded=[];
 updateHUD();
}

function updateHUD(){
 $("money").textContent=money();
 $("orderText").textContent=order?order.name+" · "+order.reward+" ◆":"✦";
 const names={
  dough:"Farina",
  sauce:"Pomodoro",
  toppings:"Formaggio",
  oven:"Forno",
  counter:"Pronto!"
 };
 $("taskText").textContent=
  toiletCleaning?"Toilette reinigen":
  currentTask?"✦ "+Math.min(100,Math.floor(taskElapsed/taskDuration*100))+"%":
  ovenReady?"Pizza pronta!":
  room==="toilet"?"Toilettenbereich":
  room==="gallery"?"Galerie":
  names[currentStage]||"✦";

 $("ingredientText").textContent=job.delivered+" serviert";
}

function startTask(type,duration,ingredient=null){
 if(currentTask)return;
 currentTask={type,ingredient};
 taskDuration=duration;
 taskElapsed=0;
 if(type==="dough")sound("roll");
 if(type==="sauce")sound("sauce");
 if(type==="topping"||type==="cheese")sound("ingredient");
 updateHUD();
}

function completeTask(){
 const t=currentTask;
 currentTask=null;
 taskElapsed=0;

 if(t.type==="dough"){
  currentStage="sauce";
  burst(250,FLOOR-45,"#e9d2a6",9);
  sound("thud");
 }else if(t.type==="sauce"){
  currentStage="toppings";
  burst(470,FLOOR-45,"#c94732",10);
 }else if(t.type==="topping"){
  if(t.ingredient&&!toppingsAdded.includes(t.ingredient))
   toppingsAdded.push(t.ingredient);
  sound("ingredient");
 }else if(t.type==="cheese"){
  currentStage="oven";
  sound("ding");
 }
 updateHUD();
}

function deliver(){
 if(!carriedPizza)return;
 carriedPizza=false;
 addMoney(order.reward+order.tip);
 job.delivered++;
 job.tips+=order.tip;
 job.bestPizza=order.name;

 const unlocks={2:"Basilikum",4:"Pilze",6:"Salami",9:"Oliven"};
 const unlock=unlocks[job.delivered];

 if(unlock&&!job.unlockedIngredients.includes(unlock)){
  job.unlockedIngredients.push(unlock);
  sound("unlock");
 }else sound("cash");

 saveJob();
 burst(1370,FLOOR-60,"#e5b95d",24);
 say("Bestellung serviert! +"+(order.reward+order.tip)+" ◆",2);
 updateHUD();
 setTimeout(()=>{
  newOrder();
  say("✦ Neue Bestellung!",1.5);
 },1400);
}

function interact(){
 if(actionCooldown>0)return;
 actionCooldown=.25;

 // Im Toilettenraum wird E zum Reinigen verwendet.
 if(room==="toilet"){
  if(toiletDirty&&!toiletCleaning){
   toiletCleaning=true;
   cleanProgress=0;
   say("Reinigung läuft …",2);
  }else if(!toiletDirty){
   say("Alles sauber!");
  }
  return;
 }

 // Galerie: Pokale ansehen.
 if(room==="gallery"){
  say("La Piccola – Hall of Fame!");
  sound("ding");
  return;
 }

 if(room!=="ground")return;

 const s=nearby();
 if(!s)return;

 if(s.id==="dough"&&currentStage==="dough"&&!currentTask&&!carriedPizza){
  startTask("dough",2.6);return;
 }

 if(s.id==="sauce"&&currentStage==="sauce"&&!currentTask){
  startTask("sauce",2.1);return;
 }

 if(s.id==="toppings"&&currentStage==="toppings"&&!currentTask){
  const missing=order.toppings.filter(n=>!toppingsAdded.includes(n));
  if(missing.length)startTask("topping",1.45,missing[0]);
  else startTask("cheese",1.5);
  return;
 }

 if(s.id==="oven"&&currentStage==="oven"&&!ovenReady&&!currentTask&&ovenTimer<=0){
  ovenTimer=7.5;sound("oven");updateHUD();return;
 }

 if(s.id==="oven"&&currentStage==="oven"&&ovenReady){
  carriedPizza=true;
  ovenReady=false;
  currentStage="counter";
  sound("ding");
  burst(s.x,FLOOR-80,"#f5cf63",12);
  updateHUD();
  return;
 }

 if(s.id==="counter"&&currentStage==="counter"&&carriedPizza){
  deliver();return;
 }
}

function jump(){
 if(player.grounded&&!currentTask&&!toiletCleaning){
  player.vy=-390;
  player.grounded=false;
  sound("jump");
 }
}

// Kunden
function spawnCustomer(){
 const seats=[520,820,1120,1300];
 const x=seats[Math.floor(Math.random()*seats.length)];
 customers.push({x,seat:x,phase:"walk",timer:0,bob:Math.random()*5,order:false});
}

function updateCustomers(dt){
 customerSpawn-=dt;
 if(customerSpawn<=0&&customers.length<5){
  spawnCustomer();
  customerSpawn=9+Math.random()*8;
 }

 for(const c of customers){
  c.timer+=dt;
  c.bob+=dt*4;
  if(c.phase==="walk"){
   c.x+=(c.seat-c.x)*Math.min(1,dt*2);
   if(Math.abs(c.x-c.seat)<5){c.phase="sit";c.timer=0}
  }
  if(c.phase==="sit"&&!c.order&&c.timer>3){
   c.order=true;c.timer=0;sound("bell");
   say("Ein Gast wartet auf seine Pizza!",2);
  }
  if(c.phase==="sit"&&c.order&&c.timer>32)c.phase="leave";
  if(c.phase==="leave")c.x+=dt*120;
 }
 customers=customers.filter(c=>c.x<1450);
}

function drawCustomer(c){
 const x=c.x-cameraX,y=FLOOR-8+Math.sin(c.bob)*1.5;
 rect(x-10,y-3,20,4,"#99754f");
 rect(x-9,y-37,18,25,"#547b91");
 rect(x-7,y-35,14,20,"#d6a77b");
 rect(x-8,y-55,16,19,"#805b3c");
 rect(x-6,y-52,12,14,"#d5b18a");
 rect(x-5,y-47,3,3,"#34271f");
 rect(x+3,y-47,3,3,"#34271f");
 if(c.order){
  rect(x-8,y-70,16,10,"#fff0d2");
  outline(x-8,y-70,16,10);
  txt("!",x,y-62,"#a94132",10,"center");
 }
}

// Die Treppe ist eine echte schräge Lauffläche.
// Der Spieler wird abhängig von seiner X-Position auf die passende Stufenhöhe gesetzt.
const STAIRS={left:1660,right:1880,top:FLOOR-170};
const GALLERY={left:1880,right:WORLD-20,y:STAIRS.top};

function floorAt(x){
 if(x>=STAIRS.left&&x<=STAIRS.right){
  const p=(x-STAIRS.left)/(STAIRS.right-STAIRS.left);
  return FLOOR-p*(FLOOR-GALLERY.y);
 }
 if(x>STAIRS.right)return GALLERY.y;
 return FLOOR;
}

function drawStairs(){
 const left=STAIRS.left-cameraX;
 const right=STAIRS.right-cameraX;
 const steps=11;

 // Stufen
 for(let i=0;i<steps;i++){
  const x=STAIRS.left+i*(STAIRS.right-STAIRS.left)/steps-cameraX;
  const y=FLOOR-(i+1)*(FLOOR-GALLERY.y)/steps;
  const sw=(STAIRS.right-STAIRS.left)/steps+2;
  rect(x,y,sw,18,"#9c6741");
  rect(x,y,sw,5,"#d5a36b");
  line(x,y+18,x+sw,y+18,"#60412f",2);
 }

 // Seitenwange
 line(left,FLOOR-5,right,GALLERY.y+12,"#60412f",8);
 line(left,FLOOR-12,right,GALLERY.y+5,"#d5a36b",3);

 // Geländer
 line(left-5,FLOOR-65,right-5,GALLERY.y-55,"#60412f",5);
 for(let i=0;i<=steps;i++){
  const p=i/steps;
  const x=left+p*(right-left);
  const y=FLOOR-65-p*(FLOOR-GALLERY.y);
  line(x,y,x,y+30,"#805437",3);
 }
}

function drawRestaurant(){
 rect(0,0,W,H,"#c7d9bc");
 rect(0,0,W,170,"#a7c7c0");
 rect(0,170,W,18,"#e8d8b5");
 rect(0,185,W,FLOOR-185,"#f0dfbd");

 // Fenster
 for(let i=0;i<4;i++){
  const x=80+i*300-cameraX*.08;
  rect(x-8,36,162,135,"#49372b");
  rect(x,44,146,119,"#fff0d2");
  rect(x+6,50,134,107,"#8dbbb8");
  rect(x+11,55,56,97,"#b6d7c8");
  rect(x+79,55,55,97,"#9fc9c1");
  rect(x+72,50,7,107,"#fff0d2");
  rect(x+6,98,134,7,"#fff0d2");
 }

 // Boden
 rect(0,FLOOR,W,H-FLOOR,"#dfc7a0");
 for(let row=0;row<4;row++)
  for(let x=-60;x<W+60;x+=64)
   if((row+Math.floor(x/64))%2===0)
    rect(x,FLOOR+row*25,64,25,"#c5a77d");

 rect(0,FLOOR-8,W,12,"#744a32");
 rect(0,FLOOR-4,W,4,"#b48252");

 // Tische
 for(const tx of [500,820,1120,1300]){
  const x=tx-cameraX;
  if(x<-100||x>W+100)continue;
  rect(x-48,FLOOR-42,96,8,"#754a31");
  rect(x-42,FLOOR-34,8,34,"#805437");
  rect(x+34,FLOOR-34,8,34,"#805437");
  rect(x-57,FLOOR-35,12,25,"#a94132");
  rect(x+45,FLOOR-35,12,25,"#a94132");
  rect(x-5,FLOOR-53,10,10,"#fff0d2");
 }

 // Toilettenbereich links: feste Trennwand mit offenem Durchgang.
 const bathroomEnd=230;
 const doorLeft=145;
 const doorRight=205;
 const wallY=FLOOR-125;

 rect(0,wallY,doorLeft,8,"#60412f");
 rect(doorRight,wallY,bathroomEnd-doorRight,8,"#60412f");
 rect(0,wallY,8,125,"#60412f");
 rect(bathroomEnd-8,wallY,8,125,"#60412f");

 // Trennwand mit Fliesen
 rect(8,wallY+8,doorLeft-8,117,"#d7e2d9");
 rect(doorRight,wallY+8,bathroomEnd-doorRight-8,117,"#d7e2d9");

 for(let x=12;x<doorLeft;x+=22)line(x,wallY+8,x,wallY+125,"#b4c7bc",1);
 for(let x=doorRight+4;x<bathroomEnd-8;x+=22)line(x,wallY+8,x,wallY+125,"#b4c7bc",1);

 txt("WC",115,wallY-10,"#476b43",12,"center");

 // Toilette innen
 rect(20,FLOOR-62,38,30,"#fff0d2");
 outline(20,FLOOR-62,38,30);
 rect(25,FLOOR-70,28,10,"#eee8dc");
 rect(70,FLOOR-55,32,24,"#fff0d2");
 outline(70,FLOOR-55,32,24);
 rect(74,FLOOR-51,24,14,"#b9d4d4");
 rect(115,FLOOR-45,14,8,"#9b866d");

 // Galerieplattform
 rect(STAIRS.right-cameraX,GALLERY.y,WORLD-STAIRS.right,12,"#60412f");
 rect(STAIRS.right-cameraX,GALLERY.y+12,WORLD-STAIRS.right,8,"#b88755");

 for(let x=STAIRS.right+10;x<WORLD;x+=40){
  rect(x-cameraX,GALLERY.y-28,5,28,"#805437");
 }
 rect(STAIRS.right-cameraX,GALLERY.y-31,WORLD-STAIRS.right,5,"#60412f");

 // Galeriebilder

// Automatischer Raumwechsel beim Durchlaufen der offenen Toilettentür.
function updateRoom(){
 const center=player.x+player.w/2;
 const inDoor=center>145&&center<205;
 if(room==="ground"&&inDoor&&player.y+player.h>=FLOOR-5){
  room="toilet";
  say("Toilettenbereich",1.5);
  updateHUD();
 }else if(room==="toilet"&&!inDoor&&center>230){
  room="ground";
  updateHUD();
 }
}

// Physische Treppe und obere Ebene.
function update(dt){
 gameTime+=dt;
 if(actionCooldown>0)actionCooldown-=dt;
 if(messageTimer>0)messageTimer-=dt;

 const left=keys.a||keys.arrowleft;
 const right=keys.d||keys.arrowright;
 const speed=currentTask||toiletCleaning?0:205;

 player.vx=0;
 if(left){player.vx=-speed;player.facing=-1}
 if(right){player.vx=speed;player.facing=1}

 if(player.vx){
  player.x+=player.vx*dt;
  player.walk+=dt*10;
  stepTimer-=dt;
  if(stepTimer<=0&&player.grounded){
   sound("step");
   stepTimer=.29;
  }
 }else stepTimer=0;

 player.x=clamp(player.x,10,WORLD-player.w-10);

 // Höhenberechnung anhand der Treppe:
 const footX=player.x+player.w/2;
 const targetFloor=floorAt(footX);

 if(player.grounded&&player.vy===0){
  player.y=targetFloor-player.h;
 }

 // Sprung und Schwerkraft
 if(!player.grounded){
  player.vy+=980*dt;
  player.y+=player.vy*dt;
  if(player.vy>=0&&player.y+player.h>=targetFloor){
   player.y=targetFloor-player.h;
   player.vy=0;
   player.grounded=true;
  }
 }

 // Bodenhöhe nach Bewegung aktualisieren.
 if(player.grounded){
  player.y=targetFloor-player.h;
 }

 updateRoom();

 if(currentTask){
  taskElapsed+=dt;
  if(taskElapsed>=taskDuration)completeTask();
 }

 if(toiletCleaning){
  cleanProgress+=dt;
  if(cleanProgress>=4){
   toiletCleaning=false;
   toiletDirty=false;
   job.cleanedToilets++;
   addMoney(8);
   saveJob();
   say("Toiletten sauber! +8 ◆",2);
   updateHUD();
  }
 }

 if(currentStage==="oven"&&!ovenReady&&ovenTimer>0){
  ovenTimer-=dt;
  if(ovenTimer<=0){
   ovenTimer=0;
   ovenReady=true;
   sound("ding");
   burst(1000,FLOOR-90,"#f5cf63",18);
   updateHUD();
  }
 }

 if(room==="ground")updateCustomers(dt);

 cameraX+=(clamp(player.x-W*.38,0,WORLD-W)-cameraX)*Math.min(1,dt*5);

 for(const p of particles){
  p.x+=p.vx*dt;
  p.y+=p.vy*dt;
  p.vy+=210*dt;
  p.life-=dt;
 }
 particles=particles.filter(p=>p.life>0);
}

function loop(t){
 const dt=Math.min(.033,(t-(lastTime||t))/1000);
 lastTime=t;
 update(dt);
 draw();
 requestAnimationFrame(loop);
}

function leaveJob(){
 saveJob();
 location.href="Stadt.html";
}

$("exitBtn").addEventListener("click",leaveJob);

addEventListener("keydown",e=>{
 const k=e.key.toLowerCase();
 if(k==="escape"){e.preventDefault();leaveJob();return}
 if([" ","arrowleft","arrowright","arrowup"].includes(k))e.preventDefault();
 keys[k]=true;
 if(k==="e"&&!e.repeat)interact();
 if((k===" "||k==="w"||k==="arrowup")&&!e.repeat)jump();
});

addEventListener("keyup",e=>keys[e.key.toLowerCase()]=false);

document.querySelectorAll("[data-key]").forEach(b=>{
 const k=b.dataset.key;
 const down=e=>{e.preventDefault();keys[k]=true};
 const up=e=>{e.preventDefault();keys[k]=false};
 b.addEventListener("pointerdown",down);
 b.addEventListener("pointerup",up);
 b.addEventListener("pointercancel",up);
 b.addEventListener("pointerleave",up);
});

$("mobileE").addEventListener("click",interact);

$("soundBtn").addEventListener("click",()=>{

});

$("fullBtn").addEventListener("click",async()=>{

  if(!document.fullscreenElement)await document.documentElement.requestFullscreen();

});

});

$("money").textContent=money();
newOrder();
updateHUD();
resizeGame();
requestAnimationFrame(loop);

})();
