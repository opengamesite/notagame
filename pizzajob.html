<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>La Piccola — Mein Zimmer</title>
<style>
:root{--ink:#34271f;--cream:#fff0d2;--red:#a94132;--green:#476b43;--gold:#e5b95d;--wood:#9c6741}
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden}
body{background:#ead8b8;color:var(--ink);font-family:monospace;display:flex;flex-direction:column}
header{height:44px;flex:0 0 44px;background:var(--cream);border-bottom:3px solid var(--ink);display:flex;align-items:center;justify-content:space-between;padding:0 12px;z-index:2}
.brand{font-size:14px;font-weight:1000;letter-spacing:1px}
.brand span{background:var(--red);color:var(--cream);padding:5px 8px}
.stats{display:flex;align-items:center;gap:6px;font-weight:bold;font-size:12px}
.pill{background:#fff9e9;border:2px solid var(--ink);padding:5px 8px}
button{font:inherit;cursor:pointer;background:var(--cream);color:var(--ink);border:2px solid var(--ink);box-shadow:2px 2px var(--ink);padding:5px 8px;font-weight:bold;touch-action:manipulation}
button:active{transform:translate(2px,2px);box-shadow:none}
.sound{background:var(--green);color:white}
main{flex:1;min-height:0;width:100%;display:flex}
.frame{width:100%;height:100%;display:flex;flex-direction:column;min-height:0}
canvas{display:block;flex:1;min-height:0;width:100%;height:100%;image-rendering:pixelated;touch-action:none;background:#c7d9bc}
.hud{flex:0 0 auto;display:grid;grid-template-columns:1fr 1fr 1fr;gap:5px;padding:5px;background:#f7e7c8;border-top:2px solid var(--ink)}
.panel{min-width:0;min-height:36px;background:#fff6e3;border:2px solid var(--ink);padding:4px 7px;box-shadow:2px 2px #d0b78f}
.label{font-size:9px;color:#82684d;margin-bottom:3px;letter-spacing:1px}
.value{font-size:11px;font-weight:bold;line-height:1.3;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.controls{display:none;flex:0 0 auto;justify-content:center;gap:7px;padding:5px;background:#f7e7c8}
.controls button{min-width:44px;padding:5px}
@media(max-width:650px){
 header{height:39px;flex-basis:39px;padding:0 5px}
 .brand{font-size:10px}.stats{font-size:10px;gap:3px}.pill{padding:4px}
 .hud{gap:3px;padding:4px}.panel{min-height:32px;padding:3px 4px}
 .label{font-size:8px}.value{font-size:9px}
 .controls{display:flex}.controls button{min-width:40px}
}
</style>
</head>
<body>
<header>
 <div class="brand"><span>LA PICCOLA</span> ✦</div>
 <div class="stats">
  <div class="pill">☼ <span id="clock">18:30</span></div>
  <div class="pill">◆ <span id="money">120</span></div>
  <button class="sound" id="soundBtn">♫ ON</button>
  <button id="exitBtn">↩ Stadt</button>
  <button id="fullBtn">⛶</button>
 </div>
</header>
<main><div class="frame">
 <canvas id="game" width="960" height="540"></canvas>
 <div class="hud">
  <div class="panel"><div class="label">ORDINE</div><div class="value" id="orderText">✦</div></div>
  <div class="panel"><div class="label">AL LAVORO</div><div class="value" id="taskText">…</div></div>
  <div class="panel"><div class="label">RISTORANTE</div><div class="value" id="ingredientText">✦</div></div>
 </div>
 <div class="controls">
  <button data-key="a">◀</button><button data-key="w">▲</button>
  <button data-key="d">▶</button><button id="mobileE">E ✦</button>
 </div>
</div></main>
<script>
(()=>{
"use strict";
const STORAGE_KEY="mein-zimmer-save-v1",JOB_KEY="pizzajob-save-v1";
const $=id=>document.getElementById(id);
const canvas=$("game"),ctx=canvas.getContext("2d");
const W=960,H=540,FLOOR=444,WORLD=2200;
ctx.imageSmoothingEnabled=false;

function resizeGame(){
 const r=canvas.getBoundingClientRect(),dpr=Math.min(devicePixelRatio||1,2);
 canvas.width=Math.max(1,Math.round(r.width*dpr));
 canvas.height=Math.max(1,Math.round(r.height*dpr));
 ctx.setTransform(canvas.width/W,0,0,canvas.height/H,0,0);
 ctx.imageSmoothingEnabled=false;
}
addEventListener("resize",resizeGame);
if(window.ResizeObserver)new ResizeObserver(resizeGame).observe(canvas);

const defaults={money:120,unlocked:[],equipped:{head:null,face:null,clothes:null,back:null,pants:null},inventory:[],placed:[],orders:[],received:[],faucetOn:false,bucketWater:0};
function readMain(){
 try{
  const s=JSON.parse(localStorage.getItem(STORAGE_KEY)||"null")||{};
  return {...defaults,...s,equipped:{...defaults.equipped,...(s.equipped||{})}};
 }catch{return {...defaults,equipped:{...defaults.equipped}}}
}
function saveMain(s){try{localStorage.setItem(STORAGE_KEY,JSON.stringify(s))}catch{}}
function money(){return Math.floor(Number(readMain().money)||0)}
function addMoney(n){const s=readMain();s.money=Math.max(0,Number(s.money)||0)+n;saveMain(s);$("money").textContent=money()}
function cosmetics(){return readMain().equipped||{}}

let job;
try{job=JSON.parse(localStorage.getItem(JOB_KEY)||"null")}catch{job=null}
job={delivered:0,tips:0,unlockedIngredients:["Tomate","Käse"],cleanedToilets:0,servedTables:0,bestPizza:"Margherita",...(job||{})};
if(!Array.isArray(job.unlockedIngredients))job.unlockedIngredients=["Tomate","Käse"];
function saveJob(){try{localStorage.setItem(JOB_KEY,JSON.stringify(job))}catch{}}

const ingredients=[
 {name:"Tomate",color:"#c94732"},{name:"Käse",color:"#f5cd56"},
 {name:"Basilikum",color:"#416f3e"},{name:"Pilze",color:"#e6d3b3"},
 {name:"Salami",color:"#a52f27"},{name:"Oliven",color:"#343c2b"}
];
const stations=[
 {id:"dough",x:250,label:"TEIG"},{id:"sauce",x:470,label:"SALSA"},
 {id:"toppings",x:700,label:"INGREDIENTI"},{id:"oven",x:1000,label:"FORNO"},
 {id:"counter",x:1370,label:"CIAO!"}
];
const player={x:90,y:FLOOR-78,w:34,h:78,vx:0,vy:0,facing:1,grounded:true,walk:0};
const keys={};
let gameTime=0,lastTime=0,cameraX=0,actionCooldown=0;
let message="",messageTimer=0,order,currentStage,currentTask=null;
let taskElapsed=0,taskDuration=0,ovenTimer=0,ovenReady=false;
let carriedPizza=false,toppingsAdded=[],particles=[],soundOn=true,audio=null;
let ambienceTimer=0,stepTimer=0,customerBob=0,deliveryAnimation=0,delivering=false;
let room="ground",stairProgress=0,cleanProgress=0,tableTarget=null;
let customers=[],customerSpawn=0,customerOrder=null;
let toiletDirty=true,toiletCleaning=false;
let galleryStars=0;

function audioContext(){
 if(!audio){const A=window.AudioContext||window.webkitAudioContext;if(A)audio=new A()}
 if(audio?.state==="suspended")audio.resume();return audio;
}
function tone(freq=440,duration=.1,type="square",volume=.035,slide=0){
 if(!soundOn)return;const a=audioContext();if(!a)return;
 const o=a.createOscillator(),g=a.createGain();o.type=type;
 o.frequency.setValueAtTime(freq,a.currentTime);
 if(slide)o.frequency.linearRampToValueAtTime(Math.max(30,freq+slide),a.currentTime+duration);
 g.gain.setValueAtTime(volume,a.currentTime);
 g.gain.exponentialRampToValueAtTime(.001,a.currentTime+duration);
 o.connect(g);g.connect(a.destination);o.start();o.stop(a.currentTime+duration);
}
function noise(duration=.1,volume=.025,filterFreq=900){
 if(!soundOn)return;const a=audioContext();if(!a)return;
 const length=Math.floor(a.sampleRate*duration),buffer=a.createBuffer(1,length,a.sampleRate),data=buffer.getChannelData(0);
 for(let i=0;i<length;i++)data[i]=(Math.random()*2-1)*(1-i/length);
 const source=a.createBufferSource(),filter=a.createBiquadFilter(),gain=a.createGain();
 source.buffer=buffer;filter.type="lowpass";filter.frequency.value=filterFreq;
 gain.gain.value=volume;source.connect(filter);filter.connect(gain);gain.connect(a.destination);source.start();
}
function sound(n){
 if(!soundOn)return;
 if(n==="step")tone(90,.045,"triangle",.018,-20);
 if(n==="jump")tone(230,.12,"square",.035,160);
 if(n==="roll"){noise(.14,.045,650);tone(180,.13,"triangle",.025,-30)}
 if(n==="sauce")noise(.12,.035,1200);
 if(n==="ingredient")tone(600,.055,"square",.02,90);
 if(n==="oven"){tone(130,.22,"triangle",.04,100);noise(.18,.04,500)}
 if(n==="ding"){tone(880,.12,"sine",.045,100);tone(1175,.22,"sine",.035,0)}
 if(n==="cash"){tone(740,.08,"square",.035,200);tone(990,.13,"square",.03,200)}
 if(n==="unlock"){tone(523,.12,"triangle",.035);tone(659,.12,"triangle",.035);tone(784,.25,"triangle",.04,120)}
 if(n==="bell"){tone(1050,.12,"sine",.03,-180);tone(780,.2,"sine",.025,-100)}
 if(n==="thud")tone(75,.08,"triangle",.035,-35);
}
function say(s,d=2){message=s;messageTimer=d}
function rect(x,y,w,h,c){ctx.fillStyle=c;ctx.fillRect(Math.round(x),Math.round(y),Math.round(w),Math.round(h))}
function outline(x,y,w,h,c="#34271f",width=2){ctx.strokeStyle=c;ctx.lineWidth=width;ctx.strokeRect(Math.round(x),Math.round(y),Math.round(w),Math.round(h))}
function line(x1,y1,x2,y2,c,width=2){ctx.strokeStyle=c;ctx.lineWidth=width;ctx.beginPath();ctx.moveTo(x1,y1);ctx.lineTo(x2,y2);ctx.stroke()}
function txt(s,x,y,c="#34271f",size=12,align="left"){ctx.font="bold "+size+"px monospace";ctx.fillStyle=c;ctx.textAlign=align;ctx.fillText(s,x,y);ctx.textAlign="left"}
function clamp(v,a,b){return Math.max(a,Math.min(b,v))}
function dist(s){return Math.abs(player.x+player.w/2-s.x)}
function nearby(){let best=null,d=75;for(const s of stations){if(dist(s)<d){best=s;d=dist(s)}}return best}
function burst(x,y,color,n=10){
 for(let i=0;i<n;i++)particles.push({x,y,color,vx:(Math.random()-.5)*110,vy:-Math.random()*120-15,life:.4+Math.random()*.65,size:2+Math.random()*4});
}
function newOrder(){
 const available=ingredients.filter(i=>job.unlockedIngredients.includes(i.name));
 const extras=available.filter(i=>i.name!=="Tomate"&&i.name!=="Käse");
 const chosen=extras.length?[...extras].sort(()=>Math.random()-.5).slice(0,Math.random()<.65?1:Math.min(2,extras.length)).map(i=>i.name):[];
 order={base:["Tomate","Käse"],toppings:chosen,name:chosen.length?"Pizza "+chosen.join(" & "):"Margherita",reward:20+chosen.length*5,tip:5+Math.floor(Math.random()*11)};
 currentStage="dough";currentTask=null;taskElapsed=0;taskDuration=0;ovenTimer=0;ovenReady=false;
 carriedPizza=false;toppingsAdded=[];deliveryAnimation=0;delivering=false;updateHUD();
}
function updateHUD(){
 $("money").textContent=money();
 $("orderText").textContent=order?order.name+" · "+order.reward+" ◆":"✦";
 const names={dough:"Farina",sauce:"Pomodoro",toppings:"Formaggio",oven:"Forno",counter:"Pronto!"};
 $("taskText").textContent=toiletCleaning?"Toilette reinigen":currentTask?"✦ "+Math.min(100,Math.floor(taskElapsed/taskDuration*100))+"%":ovenReady?"Pizza pronta!":room==="gallery"?"Galerie":names[currentStage]||"✦";
 $("ingredientText").textContent=job.delivered+" serviert · "+job.servedTables+" Tische";
}
function startTask(type,duration,ingredient=null){
 if(currentTask)return;currentTask={type,ingredient};taskDuration=duration;taskElapsed=0;
 if(type==="dough")sound("roll");if(type==="sauce")sound("sauce");
 if(type==="topping"||type==="cheese")sound("ingredient");updateHUD();
}
function completeTask(){
 const t=currentTask;currentTask=null;taskElapsed=0;
 if(t.type==="dough"){currentStage="sauce";burst(250,FLOOR-45,"#e9d2a6",9);sound("thud")}
 else if(t.type==="sauce"){currentStage="toppings";burst(470,FLOOR-45,"#c94732",10)}
 else if(t.type==="topping"){if(t.ingredient&&!toppingsAdded.includes(t.ingredient))toppingsAdded.push(t.ingredient);sound("ingredient")}
 else if(t.type==="cheese"){currentStage="oven";sound("ding")}
 updateHUD();
}
function interact(){
 if(actionCooldown>0)return;actionCooldown=.25;
 if(room==="stairs"){return}
 if(room==="gallery"){
  if(player.x>1780&&player.x<2080){galleryStars++;say("✦ Auszeichnung angesehen!");sound("ding")}
  else say("Die besten Pizzen von La Piccola.");
  return;
 }
 if(room==="toilet"){
  if(!toiletDirty){say("Alles sauber!");return}
  if(!toiletCleaning){toiletCleaning=true;cleanProgress=0;say("Reinigung läuft …",2)}
  return;
 }
 if(room==="ground"){
  if(player.x>1740&&player.x<1870){room="gallery";player.x=1870;player.y=FLOOR-78;cameraX=clamp(player.x-W*.38,0,WORLD-W);say("Willkommen in der Galerie!");return}
  if(player.x>1570&&player.x<1700){room="toilet";player.x=1620;player.y=FLOOR-78;say("Toilettenbereich");return}
  if(player.x>1420&&player.x<1530){room="stairs";stairProgress=0;say("Treppe hochlaufen …");return}
 }
 if(room==="ground"){
  const s=nearby();
  if(!s){if(player.x>1360&&player.x<1510){say("E – Treppe");}return}
  if(s.id==="dough"){if(currentStage==="dough"&&!currentTask&&!carriedPizza)startTask("dough",2.6);return}
  if(s.id==="sauce"){if(currentStage==="sauce"&&!currentTask)startTask("sauce",2.1);return}
  if(s.id==="toppings"){
   if(currentStage!=="toppings"||currentTask)return;
   const missing=order.toppings.filter(n=>!toppingsAdded.includes(n));
   if(missing.length)startTask("topping",1.45,missing[0]);else startTask("cheese",1.5);return;
  }
  if(s.id==="oven"){
   if(currentStage==="oven"&&!ovenReady&&!currentTask&&ovenTimer<=0){ovenTimer=7.5;sound("oven");updateHUD();return}
   if(currentStage==="oven"&&ovenReady){carriedPizza=true;ovenReady=false;currentStage="counter";sound("ding");burst(s.x,FLOOR-80,"#f5cf63",12);updateHUD();return}
   return;
  }
  if(s.id==="counter"&&currentStage==="counter"&&carriedPizza&&!delivering){deliver();return}
 }
 if(room==="gallery"){return}
}
function deliver(){
 if(!carriedPizza||delivering)return;delivering=true;carriedPizza=false;
 addMoney(order.reward+order.tip);job.delivered++;job.tips+=order.tip;
 job.bestPizza=order.name;
 const unlocks={2:"Basilikum",4:"Pilze",6:"Salami",9:"Oliven"};
 const unlock=unlocks[job.delivered];
 if(unlock&&!job.unlockedIngredients.includes(unlock)){job.unlockedIngredients.push(unlock);sound("unlock")}else sound("cash");
 saveJob();burst(1370,FLOOR-60,"#e5b95d",24);deliveryAnimation=1.2;updateHUD();
 setTimeout(()=>{newOrder();say("✦ Neue Bestellung!",1.5)},1200);
}
function jump(){if(player.grounded&&!currentTask&&!toiletCleaning){player.vy=-390;player.grounded=false;sound("jump")}}
function spawnCustomer(){
 const seats=[520,850,1190,1300];
 const x=seats[Math.floor(Math.random()*seats.length)];
 customers.push({x,phase:"walk",timer:0,seat:x,order:false,bob:Math.random()*5});
}
function updateCustomers(dt){
 customerSpawn-=dt;
 if(customerSpawn<=0&&customers.length<5){spawnCustomer();customerSpawn=9+Math.random()*8}
 for(const c of customers){
  c.timer+=dt;c.bob+=dt*4;
  if(c.phase==="walk"){c.x+=(c.seat-c.x)*Math.min(1,dt*2);if(Math.abs(c.x-c.seat)<5){c.phase="sit";c.timer=0}}
  if(c.phase==="sit"&&!c.order&&c.timer>3){c.order=true;c.timer=0;sound("bell");say("Ein Gast möchte bestellen!",2)}
  if(c.phase==="sit"&&c.order&&c.timer>32){c.phase="leave"}
  if(c.phase==="leave"){c.x+=dt*120}
 }
 customers=customers.filter(c=>c.x<1450);
}
function drawCustomer(c){
 const x=c.x-cameraX,y=FLOOR-8+Math.sin(c.bob)*1.5;
 rect(x-10,y-3,20,4,"#99754f");
 rect(x-9,y-37,18,25,"#547b91");rect(x-7,y-35,14,20,"#d6a77b");
 rect(x-8,y-55,16,19,"#805b3c");rect(x-6,y-52,12,14,"#d5b18a");
 rect(x-5,y-47,3,3,"#34271f");rect(x+3,y-47,3,3,"#34271f");
 if(c.order){rect(x-8,y-70,16,10,"#fff0d2");outline(x-8,y-70,16,10);txt("!",x,y-62,"#a94132",10,"center")}
}
function drawRestaurant(){
 rect(0,0,W,H,"#c7d9bc");rect(0,0,W,170,"#a7c7c0");rect(0,170,W,18,"#e8d8b5");
 rect(0,185,W,FLOOR-185,"#f0dfbd");
 for(let row=0;row<6;row++)for(let x=-60;x<W+70;x+=72)rect(x+(row%2)*36,193+row*34,69,2,"#e3cfaa");
 // Fenster
 for(let i=0;i<3;i++){
  const x=70+i*315-cameraX*.08;
  rect(x-8,36,162,135,"#49372b");rect(x,44,146,119,"#fff0d2");
  rect(x+6,50,134,107,"#8dbbb8");rect(x+11,55,56,97,"#b6d7c8");rect(x+79,55,55,97,"#9fc9c1");
  rect(x+72,50,7,107,"#fff0d2");rect(x+6,98,134,7,"#fff0d2");
 }
 rect(0,FLOOR,W,H-FLOOR,"#dfc7a0");
 for(let row=0;row<4;row++)for(let x=-60;x<W+60;x+=64)if((row+Math.floor(x/64))%2===0)rect(x,FLOOR+row*25,64,25,"#c5a77d");
 rect(0,FLOOR-8,W,12,"#744a32");rect(0,FLOOR-4,W,4,"#b48252");
 // Tische und Stühle
 for(const tx of [500,820,1120,1300]){
  const x=tx-cameraX;if(x<-100||x>W+100)continue;
  rect(x-48,FLOOR-42,96,8,"#754a31");rect(x-42,FLOOR-34,8,34,"#805437");rect(x+34,FLOOR-34,8,34,"#805437");
  rect(x-57,FLOOR-35,12,25,"#a94132");rect(x+45,FLOOR-35,12,25,"#a94132");
  rect(x-5,FLOOR-53,10,10,"#fff0d2");rect(x-2,FLOOR-51,4,5,"#a94132");
 }
 // Toilet door
 let tx=1600-cameraX;
 rect(tx-45,FLOOR-125,90,125,"#654735");rect(tx-39,FLOOR-119,78,119,"#c8d7cf");
 rect(tx-29,FLOOR-103,58,28,"#fff0d2");txt("WC",tx,FLOOR-84,"#476b43",14,"center");
 rect(tx-4,FLOOR-62,8,8,"#e5b95d");
 // Treppe rechts im Vordergrund
 const sx=1460-cameraX;
 rect(sx-10,FLOOR-15,220,15,"#60412f");
 for(let i=0;i<9;i++){
  const x=sx+i*20,y=FLOOR-18-i*14;
  rect(x,y,24,14,"#9c6741");rect(x,y,24,4,"#d5a36b");
 }
 line(sx,FLOOR-18,sx+165,FLOOR-130,"#60412f",5);
 line(sx+20,FLOOR-18,sx+185,FLOOR-130,"#60412f",5);
 // Treppe als Vordergrundgeländer
 for(let i=0;i<9;i++)line(sx+i*20,FLOOR-18-i*14,sx+20+i*20,FLOOR-32-i*14,"#d9b17b",2);
 // Galerie oben
 rect(1740-cameraX,190,420,12,"#60412f");rect(1740-cameraX,202,420,8,"#b88755");
 for(let i=0;i<11;i++)rect(1750-cameraX+i*39,160,5,32,"#805437");
 rect(1740-cameraX,135,420,10,"#60412f");
 txt("LA PICCOLA · HALL OF FAME",1950-cameraX,119,"#fff0d2",13,"center");
 // Bilder / Pokale
 for(let i=0;i<4;i++){
  const x=1780-cameraX+i*90;
  rect(x,145,55,38,"#fff0d2");outline(x,145,55,38,"#60412f",3);
  rect(x+7,152,41,24,["#d8a45b","#a94132","#7c9d79","#7897aa"][i]);
  txt("★",x+27,169,"#fff0d2",13,"center");
 }
 for(let i=0;i<3;i++){
  const x=1830-cameraX+i*115;
  rect(x,172,20,14,"#e5b95d");rect(x+4,160,12,15,"#f3d16c");
  rect(x+7,153,6,9,"#fff0a4");rect(x+1,184,18,4,"#805437");
 }
 if(room==="toilet"){
  const x=1600-cameraX;
  rect(x-100,FLOOR-140,200,140,"#e8e4d8");rect(x-94,FLOOR-134,188,128,"#c9d8d2");
  rect(x-70,FLOOR-75,45,50,"#fff0d2");outline(x-70,FLOOR-75,45,50);
  rect(x-65,FLOOR-86,35,12,"#e9e6dc");
  rect(x+25,FLOOR-85,42,60,"#fff0d2");outline(x+25,FLOOR-85,42,60);
  rect(x+30,FLOOR-80,32,20,"#b9d4d4");
  txt("TOILETTEN",x,FLOOR-153,"#34271f",12,"center");
  if(toiletDirty){rect(x-10,FLOOR-42,20,8,"#9b866d");rect(x+65,FLOOR-30,12,8,"#a78c66")}
  if(toiletCleaning){rect(x-35,FLOOR-105,70,7,"#60412f");rect(x-33,FLOOR-103,66*clamp(cleanProgress/4,0,1),3,"#8ebd76")}
 }
 if(room==="gallery"){
  rect(0,0,W,200,"#a7c7c0");
  txt("LE MIGLIORI PIZZE",W/2,90,"#fff0d2",18,"center");
  txt("TROFEI · PREMI · RICONOSCIMENTI",W/2,115,"#fff0d2",10,"center");
  for(let i=0;i<5;i++){
   const x=170+i*145;
   rect(x,225,80,70,"#fff0d2");outline(x,225,80,70,"#60412f",3);

 if(room==="stairs"){
  txt("▲ OBEN",W/2,60,"#fff0d2",15,"center");
 }
 if(messageTimer>0&&message){
  const w=Math.min(W-50,Math.max(75,message.length*7+26));

function update(dt){
 gameTime+=dt;customerBob+=dt*3;
 if(actionCooldown>0)actionCooldown-=dt;
 if(messageTimer>0)messageTimer-=dt;
 if(deliveryAnimation>0)deliveryAnimation-=dt;
 const left=keys.a||keys.arrowleft,right=keys.d||keys.arrowright;
 const speed=currentTask||delivering||toiletCleaning?0:205;
 player.vx=0;
 if(left){player.vx=-speed;player.facing=-1}
 if(right){player.vx=speed;player.facing=1}
 if(player.vx){player.x+=player.vx*dt;player.walk+=dt*10;stepTimer-=dt;if(stepTimer<=0&&player.grounded){sound("step");stepTimer=.29}}
 else stepTimer=0;
 if(room==="ground")player.x=clamp(player.x,10,1760);
 if(room==="toilet")player.x=clamp(player.x,1510,1690);
 if(room==="gallery")player.x=clamp(player.x,1740,2140);
 if(room==="stairs"){
  stairProgress+=dt*0.45;
  player.x+=dt*150;
  player.y-=dt*105;
  if(stairProgress>=1){room="gallery";player.x=1790;player.y=FLOOR-78;cameraX=clamp(player.x-W*.38,0,WORLD-W);say("Oben angekommen!")}
 }
 if((keys.w||keys[" "]||keys.arrowup)&&player.grounded&&!currentTask&&!delivering){jump();keys.w=false;keys[" "]=false;keys.arrowup=false}
 if(room!=="stairs"){
  player.vy+=980*dt;player.y+=player.vy*dt;
  if(player.y+player.h>=FLOOR){player.y=FLOOR-player.h;player.vy=0;player.grounded=true}
 }
 if(currentTask){taskElapsed+=dt;if(taskElapsed>=taskDuration)completeTask()}
 if(toiletCleaning){cleanProgress+=dt;if(cleanProgress>=4){toiletCleaning=false;toiletDirty=false;job.cleanedToilets++;addMoney(8);saveJob();say("Toiletten sauber! +8 ◆",2);updateHUD()}}
 if(currentStage==="oven"&&!ovenReady&&ovenTimer>0){ovenTimer-=dt;if(ovenTimer<=0){ovenTimer=0;ovenReady=true;sound("ding");burst(1000,FLOOR-90,"#f5cf63",18);updateHUD()}}
 if(room==="ground")updateCustomers(dt);
 cameraX+=(clamp(player.x-W*.38,0,WORLD-W)-cameraX)*Math.min(1,dt*5);
 for(const p of particles){p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=210*dt;p.life-=dt}
 particles=particles.filter(p=>p.life>0);
}
function loop(t){const dt=Math.min(.033,(t-(lastTime||t))/1000);lastTime=t;update(dt);draw();requestAnimationFrame(loop)}

function leaveJob(){saveJob();location.href="Stadt.html"}
$("exitBtn").addEventListener("click",leaveJob);
addEventListener("keydown",e=>{
 const k=e.key.toLowerCase();
 if(k==="escape"){e.preventDefault();leaveJob();return}
 if([" ","arrowleft","arrowright","arrowup"].includes(k))e.preventDefault();
 keys[k]=true;if(k==="e"&&!e.repeat)interact();if(k===" "&&!e.repeat)jump();
});
addEventListener("keyup",e=>keys[e.key.toLowerCase()]=false);
document.querySelectorAll("[data-key]").forEach(b=>{
 const k=b.dataset.key,down=e=>{e.preventDefault();keys[k]=true},up=e=>{e.preventDefault();keys[k]=false};
 b.addEventListener("pointerdown",down);b.addEventListener("pointerup",up);b.addEventListener("pointercancel",up);b.addEventListener("pointerleave",up);
});
$("mobileE").addEventListener("click",interact);
$("soundBtn").addEventListener("click",()=>{soundOn=!soundOn;$("soundBtn").textContent=soundOn?"♫ ON":"♫ OFF";if(soundOn){audioContext();sound("ding")}});
$("fullBtn").addEventListener("click",async()=>{try{if(!document.fullscreenElement)await document.documentElement.requestFullscreen();else await document.exitFullscreen()}catch{}});
addEventListener("storage",e=>{if(e.key===STORAGE_KEY)$("money").textContent=money()});
$("money").textContent=money();newOrder();updateHUD();resizeGame();requestAnimationFrame(loop);
})();
