
<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>La Piccola — Mein Zimmer</title>
<style>
:root{--ink:#34271f;--cream:#fff0d2;--red:#a94132;--green:#476b43;--gold:#e5b95d;--wood:#9c6741}
*{box-sizing:border-box}
body{margin:0;background:#ead8b8;color:var(--ink);font-family:monospace;overflow-x:hidden}
header{height:58px;background:#fff0d2;border-bottom:4px solid var(--ink);display:flex;align-items:center;justify-content:space-between;padding:0 16px;box-shadow:0 4px #c8ad84}
.brand{font-weight:1000;font-size:16px;letter-spacing:1px}
.brand span{background:var(--red);color:#fff0d2;padding:7px 9px;box-shadow:3px 3px var(--ink)}
.stats{display:flex;gap:8px;font-weight:bold;font-size:13px}
.pill{background:#fff9e9;border:2px solid var(--ink);padding:7px 10px;box-shadow:2px 2px var(--ink)}
main{max-width:1250px;margin:18px auto;padding:0 12px}
.frame{border:4px solid var(--ink);background:#fff0d2;box-shadow:7px 7px 0 #b49a72}
.top{height:12px;background:repeating-linear-gradient(135deg,#a94132 0 12px,#f5e3c3 12px 24px);border-bottom:3px solid var(--ink)}
canvas{display:block;width:100%;height:auto;image-rendering:pixelated;image-rendering:crisp-edges;background:#c4d9c2;touch-action:manipulation}
.bottom{height:15px;background:repeating-linear-gradient(135deg,#f4e5c6 0 12px,#476b43 12px 24px);border-top:3px solid var(--ink)}
.hud{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;padding:10px;background:#f7e7c8;border-top:3px solid var(--ink)}
.panel{min-height:57px;background:#fff6e3;border:2px solid var(--ink);box-shadow:3px 3px #d0b78f;padding:8px 10px}
.panel .label{font-size:10px;color:#82684d;margin-bottom:5px;letter-spacing:1px}
.panel .value{font-size:12px;font-weight:bold;line-height:1.5}
button{font:inherit;cursor:pointer;background:#fff0d2;color:var(--ink);border:2px solid var(--ink);box-shadow:3px 3px var(--ink);padding:8px;font-weight:bold}
button:active{transform:translate(2px,2px);box-shadow:1px 1px var(--ink)}
.controls{display:none;justify-content:center;gap:8px;padding:12px;background:#f7e7c8}
.controls button{min-width:54px}
.sound{background:var(--green);color:white}
@media(max-width:650px){header{padding:0 8px}.brand{font-size:11px}.stats{font-size:11px;gap:4px}.pill{padding:5px}.hud{grid-template-columns:1fr 1fr}.controls{display:flex}main{padding:0 6px;margin:10px auto}}
</style>
</head>
<body>
<header>
  <div class="brand"><span>LA PICCOLA</span> ✦</div>
  <div class="stats">
    <div class="pill">☼ <span id="clock">18:30</span></div>
    <div class="pill">◆ <span id="money">120</span></div>
    <button class="sound" id="soundBtn" title="Sound">♫ ON</button>
  </div>
</header>

<main>
<div class="frame">
  <div class="top"></div>
  <canvas id="game" width="960" height="540"></canvas>
  <div class="bottom"></div>
  <div class="hud">
    <div class="panel"><div class="label">ORDINE</div><div class="value" id="orderText">✦</div></div>
    <div class="panel"><div class="label">AL LAVORO</div><div class="value" id="taskText">…</div></div>
    <div class="panel"><div class="label">CUCINA</div><div class="value" id="ingredientText">✦</div></div>
  </div>
  <div class="controls">
    <button data-key="a">◀</button>
    <button data-key="w">▲</button>
    <button data-key="d">▶</button>
    <button id="mobileE">E ✦</button>
  </div>
</div>
</main>

<script>
(()=>{
"use strict";
const STORAGE_KEY="mein-zimmer-save-v1";
const JOB_KEY="pizzajob-save-v1";
const $=id=>document.getElementById(id);
const canvas=$("game"),ctx=canvas.getContext("2d");
ctx.imageSmoothingEnabled=false;
const W=960,H=540,FLOOR=444,WORLD=1720;
const defaults={money:120,unlocked:[],equipped:{head:null,face:null,clothes:null},inventory:[],placed:[],orders:[],received:[],faucetOn:false,bucketWater:0};
function readMain(){
 try{
  const s=JSON.parse(localStorage.getItem(STORAGE_KEY)||"null")||{};
  return {...defaults,...s,equipped:{...defaults.equipped,...(s.equipped||{})}};
 }catch{return {...defaults,equipped:{...defaults.equipped}}}
}
function saveMain(s){try{localStorage.setItem(STORAGE_KEY,JSON.stringify(s))}catch{}}
function money(){return Math.floor(Number(readMain().money)||0)}
function addMoney(n){const s=readMain();s.money=Math.max(0,Number(s.money)||0)+n;saveMain(s);$("money").textContent=money()}
function cosmetics(){return readMain().equipped||{}}
let job;
try{job=JSON.parse(localStorage.getItem(JOB_KEY)||"null")}catch{job=null}
job={delivered:0,tips:0,unlockedIngredients:["Tomate","Käse"],...(job||{})};
if(!Array.isArray(job.unlockedIngredients))job.unlockedIngredients=["Tomate","Käse"];
function saveJob(){try{localStorage.setItem(JOB_KEY,JSON.stringify(job))}catch{}}

const ingredients=[
 {name:"Tomate",color:"#c94732"},
 {name:"Käse",color:"#f5cd56"},
 {name:"Basilikum",color:"#416f3e"},
 {name:"Pilze",color:"#e6d3b3"},
 {name:"Salami",color:"#a52f27"},
 {name:"Oliven",color:"#343c2b"}
];
const stations=[
 {id:"dough",x:250,label:"TEIG"},
 {id:"sauce",x:470,label:"SALSA"},
 {id:"toppings",x:700,label:"INGREDIENTI"},
 {id:"oven",x:1000,label:"FORNO"},
 {id:"counter",x:1370,label:"CIAO!"}
];
const player={x:90,y:FLOOR-72,w:28,h:72,vx:0,vy:0,facing:1,grounded:true,walk:0,anim:0};
const keys={};
let gameTime=0,lastTime=0,cameraX=0;
let actionCooldown=0,message="",messageTimer=0;
let order,currentStage,currentTask=null,taskElapsed=0,taskDuration=0;
let ovenTimer=0,ovenReady=false,carriedPizza=false,toppingsAdded=[];
let particles=[],soundOn=true,audio=null,ambienceTimer=0,stepTimer=0;
let customerBob=0,deliveryAnimation=0;
let introTime=0;

function audioContext(){
 if(!audio){const A=window.AudioContext||window.webkitAudioContext;if(A)audio=new A()}
 if(audio?.state==="suspended")audio.resume();
 return audio;
}
function tone(freq=440,duration=.1,type="square",volume=.035,slide=0){
 if(!soundOn)return;
 const a=audioContext();if(!a)return;
 const o=a.createOscillator(),g=a.createGain();
 o.type=type;o.frequency.setValueAtTime(freq,a.currentTime);
 if(slide)o.frequency.linearRampToValueAtTime(Math.max(30,freq+slide),a.currentTime+duration);
 g.gain.setValueAtTime(volume,a.currentTime);
 g.gain.exponentialRampToValueAtTime(.001,a.currentTime+duration);
 o.connect(g);g.connect(a.destination);o.start();o.stop(a.currentTime+duration);
}
function noise(duration=.1,volume=.025,filterFreq=900){
 if(!soundOn)return;
 const a=audioContext();if(!a)return;
 const length=Math.floor(a.sampleRate*duration);
 const buffer=a.createBuffer(1,length,a.sampleRate);
 const data=buffer.getChannelData(0);
 for(let i=0;i<length;i++)data[i]=(Math.random()*2-1)*(1-i/length);
 const source=a.createBufferSource(),filter=a.createBiquadFilter(),gain=a.createGain();
 source.buffer=buffer;filter.type="lowpass";filter.frequency.value=filterFreq;
 gain.gain.value=volume;source.connect(filter);filter.connect(gain);gain.connect(a.destination);
 source.start();
}
function sound(name){
 if(!soundOn)return;
 if(name==="step"){tone(90,.045,"triangle",.018,-20)}
 if(name==="jump"){tone(230,.12,"square",.035,160);tone(360,.08,"triangle",.02,80)}
 if(name==="roll"){noise(.14,.045,650);tone(180,.13,"triangle",.025,-30)}
 if(name==="sauce"){noise(.12,.035,1200);tone(350,.08,"triangle",.018,-90)}
 if(name==="ingredient"){tone(600,.055,"square",.02,90);tone(830,.07,"triangle",.018,-100)}
 if(name==="oven"){tone(130,.22,"triangle",.04,100);noise(.18,.04,500)}
 if(name==="ding"){tone(880,.12,"sine",.045,100);tone(1175,.22,"sine",.035,0)}
 if(name==="cash"){tone(740,.08,"square",.035,200);tone(990,.13,"square",.03,200);tone(1250,.17,"sine",.03,0)}
 if(name==="unlock"){tone(523,.12,"triangle",.035,0);tone(659,.12,"triangle",.035,0);tone(784,.25,"triangle",.04,120)}
 if(name==="bell"){tone(1050,.12,"sine",.03,-180);tone(780,.2,"sine",.025,-100)}
 if(name==="thud"){tone(75,.08,"triangle",.035,-35)}
}
function ambient(){
 if(!soundOn)return;
 ambienceTimer+=1/60;
 if(ambienceTimer>7+Math.random()*7){
  ambienceTimer=0;
  if(Math.random()<.55){tone(1700,.035,"sine",.006,-150)}else{tone(220,.09,"triangle",.005,20)}
 }
}
function say(str,d=2.2){message=str;messageTimer=d}
function rect(x,y,w,h,c){ctx.fillStyle=c;ctx.fillRect(Math.round(x),Math.round(y),Math.round(w),Math.round(h))}
function outline(x,y,w,h,c="#34271f",width=2){ctx.strokeStyle=c;ctx.lineWidth=width;ctx.strokeRect(Math.round(x),Math.round(y),Math.round(w),Math.round(h))}
function line(x1,y1,x2,y2,c,width=2){ctx.strokeStyle=c;ctx.lineWidth=width;ctx.beginPath();ctx.moveTo(x1,y1);ctx.lineTo(x2,y2);ctx.stroke()}
function txt(s,x,y,c="#34271f",size=12,align="left"){ctx.font="bold "+size+"px monospace";ctx.fillStyle=c;ctx.textAlign=align;ctx.fillText(s,x,y);ctx.textAlign="left"}
function clamp(v,a,b){return Math.max(a,Math.min(b,v))}
function dist(s){return Math.abs(player.x+player.w/2-s.x)}
function nearby(){let best=null,d=70;for(const s of stations){if(dist(s)<d){best=s;d=dist(s)}}return best}
function burst(x,y,color,n=10){
 for(let i=0;i<n;i++)particles.push({x,y,color,vx:(Math.random()-.5)*110,vy:-Math.random()*120-15,life:.4+Math.random()*.65,size:2+Math.random()*4});
}
function newOrder(){
 const available=ingredients.filter(i=>job.unlockedIngredients.includes(i.name));
 const extras=available.filter(i=>i.name!=="Tomate"&&i.name!=="Käse");
 const chosen=[];
 if(extras.length){const shuffled=[...extras].sort(()=>Math.random()-.5);chosen.push(...shuffled.slice(0,Math.random()<.65?1:Math.min(2,extras.length)).map(i=>i.name))}
 order={base:["Tomate","Käse"],toppings:chosen,name:chosen.length?"Pizza "+chosen.join(" & "):"Margherita",reward:20+chosen.length*5,tip:5+Math.floor(Math.random()*11)};
 currentStage="dough";currentTask=null;taskElapsed=0;taskDuration=0;ovenTimer=0;ovenReady=false;carriedPizza=false;toppingsAdded=[];deliveryAnimation=0;
 updateHUD();
}
function updateHUD(){
 $("money").textContent=money();
 $("orderText").textContent=order?order.name+"  ·  "+order.reward+" ◆":"✦";
 const names={dough:"Farina",sauce:"Pomodoro",toppings:"Formaggio",oven:"Forno",counter:"Pronto!"};
 $("taskText").textContent=currentTask?"✦ "+Math.min(100,Math.floor(taskElapsed/taskDuration*100))+"%":ovenReady?"Pizza pronta!":names[currentStage]||"✦";
 $("ingredientText").textContent=job.unlockedIngredients.map(n=>n==="Basilikum"?"Basilico":n==="Pilze"?"Funghi":n==="Salami"?"Salame":n==="Oliven"?"Olive":n).join(" · ");
}
function startTask(type,duration,ingredient=null){
 if(currentTask)return;
 currentTask={type,ingredient};taskDuration=duration;taskElapsed=0;
 if(type==="dough")sound("roll");
 if(type==="sauce")sound("sauce");
 if(type==="topping"||type==="cheese")sound("ingredient");
 updateHUD();
}
function completeTask(){
 const t=currentTask;currentTask=null;taskElapsed=0;
 if(t.type==="dough"){currentStage="sauce";burst(250,FLOOR-45,"#e9d2a6",9);sound("thud")}
 else if(t.type==="sauce"){currentStage="toppings";burst(470,FLOOR-45,"#c94732",10)}
 else if(t.type==="topping"){if(t.ingredient&&!toppingsAdded.includes(t.ingredient))toppingsAdded.push(t.ingredient);sound("ingredient")}
 else if(t.type==="cheese"){currentStage="oven";sound("ding")}
 updateHUD();
}
function interact(){
 if(actionCooldown>0)return;
 const s=nearby();
 if(!s){tone(120,.05,"triangle",.01,-20);return}
 actionCooldown=.25;
 if(s.id==="dough"){
  if(currentStage==="dough"&&!currentTask)startTask("dough",2.6);
  return;
 }
 if(s.id==="sauce"){
  if(currentStage==="sauce"&&!currentTask)startTask("sauce",2.1);
  return;
 }
 if(s.id==="toppings"){
  if(currentStage!=="toppings"||currentTask)return;
  const missing=order.toppings.filter(n=>!toppingsAdded.includes(n));
  if(missing.length)startTask("topping",1.45,missing[0]);
  else startTask("cheese",1.5);
  return;
 }
 if(s.id==="oven"){
  if(currentStage==="oven"&&!ovenReady&&!currentTask&&ovenTimer<=0){
   ovenTimer=7.5;sound("oven");updateHUD();return;
  }
  if(currentStage==="oven"&&ovenReady){
   carriedPizza=true;ovenReady=false;currentStage="counter";
   sound("ding");burst(s.x,FLOOR-80,"#f5cf63",12);updateHUD();return;
  }
  return;
 }
 if(s.id==="counter"&&currentStage==="counter"&&carriedPizza){
  deliver();return;
 }
}
function deliver(){
 const earned=order.reward,tip=order.tip;
 addMoney(earned+tip);
 job.delivered++;job.tips+=tip;
 const unlocks={2:"Basilikum",4:"Pilze",6:"Salami",9:"Oliven"};
 const unlock=unlocks[job.delivered];
 if(unlock&&!job.unlockedIngredients.includes(unlock)){
  job.unlockedIngredients.push(unlock);sound("unlock");
 }else sound("cash");
 saveJob();burst(1370,FLOOR-60,"#e5b95d",24);
 deliveryAnimation=2.5;updateHUD();
 setTimeout(()=>{newOrder();say("✦",1.2)},1500);
}
function jump(){if(player.grounded&&!currentTask){player.vy=-390;player.grounded=false;sound("jump")}}
function update(dt){
 gameTime+=dt;customerBob+=dt*3;
 if(actionCooldown>0)actionCooldown-=dt;
 if(messageTimer>0)messageTimer-=dt;
 if(deliveryAnimation>0)deliveryAnimation-=dt;
 ambient();

 const left=keys.a||keys.arrowleft,right=keys.d||keys.arrowright;
 const speed=currentTask?0:205;
 player.vx=0;
 if(left){player.vx=-speed;player.facing=-1}
 if(right){player.vx=speed;player.facing=1}
 if(player.vx){
  player.x+=player.vx*dt;player.walk+=dt*10;
  stepTimer-=dt;
  if(stepTimer<=0&&player.grounded){sound("step");stepTimer=.29}
 }else stepTimer=0;
 player.x=clamp(player.x,10,WORLD-player.w-10);
 if((keys.w||keys[" "]||keys.arrowup)&&player.grounded&&!currentTask){
  jump();keys.w=false;keys[" "]=false;keys.arrowup=false;
 }
 player.vy+=980*dt;player.y+=player.vy*dt;
 if(player.y+player.h>=FLOOR){player.y=FLOOR-player.h;player.vy=0;player.grounded=true}
 if(currentTask){taskElapsed+=dt;if(taskElapsed>=taskDuration)completeTask()}
 if(currentStage==="oven"&&!ovenReady&&ovenTimer>0){
  ovenTimer-=dt;
  if(ovenTimer<=0){ovenTimer=0;ovenReady=true;sound("ding");burst(1000,FLOOR-90,"#f5cf63",18);updateHUD()}
 }
 cameraX+=(clamp(player.x-W*.38,0,WORLD-W)-cameraX)*Math.min(1,dt*5);
 for(const p of particles){p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=210*dt;p.life-=dt}
 particles=particles.filter(p=>p.life>0);
}
function drawBackground(){
 rect(0,0,W,H,"#c7d9bc");
 // Abendhimmel hinter den Fenstern
 rect(0,0,W,170,"#a7c7c0");
 rect(0,170,W,18,"#e8d8b5");
 // Warmes Sonnenlicht
 rect(630-cameraX*.08,20,130,130,"#eacb83");
 rect(650-cameraX*.08,40,90,90,"#f2dca2");
 // Innenwand
 rect(0,185,W,FLOOR-185,"#f0dfbd");
 // kleine Wandflecken und Ziegel
 for(let row=0;row<6;row++)for(let x=-60;x<W+70;x+=72){
  rect(x+(row%2)*36,193+row*34,69,2,"#e3cfaa");
 }
 // Fenster mit Fensterläden
 for(let i=0;i<3;i++){
  const x=70+i*315-cameraX*.24;
  rect(x-8,36,162,135,"#49372b");
  rect(x,44,146,119,"#fff0d2");
  rect(x+6,50,134,107,"#8dbbb8");
  rect(x+11,55,56,97,"#b6d7c8");
  rect(x+79,55,55,97,"#9fc9c1");
  rect(x+72,50,7,107,"#fff0d2");
  rect(x+6,98,134,7,"#fff0d2");
  rect(x-15,39,16,127,"#a94132");
  rect(x+146,39,16,127,"#a94132");
  for(let j=0;j<7;j++){rect(x-14,45+j*17,14,4,"#d56a4e");rect(x+147,45+j*17,14,4,"#d56a4e")}
  rect(x-8,35,162,8,"#7a4b34");
  rect(x-12,163,170,8,"#9c6741");
  // Pflanzen am Fenster
  rect(x+12,142,24,9,"#8b5839");rect(x+16,132,5,12,"#476b43");rect(x+23,128,7,15,"#547d49");
  // Distant Italian rooftops
  rect(x+22,72,26,27,"#d9ad7a");rect(x+18,67,34,7,"#a94132");
  rect(x+101,78,23,22,"#e4c59b");rect(x+97,73,31,6,"#a94132");
  rect(x+31,79,5,7,"#f9e5af");rect(x+109,84,5,7,"#f9e5af");
 }
 // checker tile floor
 rect(0,FLOOR,W,H-FLOOR,"#dfc7a0");
 for(let row=0;row<4;row++)for(let x=-60;x<W+60;x+=64){
  if((row+Math.floor(x/64))%2===0)rect(x,FLOOR+row*25,64,25,"#c5a77d");
 }
 rect(0,FLOOR-8,W,12,"#744a32");
 rect(0,FLOOR-4,W,4,"#b48252");
 // wall shelf
 rect(530-cameraX*.18,68,260,9,"#6e4931");
 rect(530-cameraX*.18,77,260,4,"#b18152");
 const jarColors=["#bd4938","#d5a649","#4b7444","#e7d6b3","#8b5138","#6d8d87"];
 for(let i=0;i<6;i++){
  const x=544+i*39-cameraX*.18;
  rect(x,45,23,22,"#b7a17c");rect(x+2,48,19,17,jarColors[i]);
  rect(x+4,50,15,4,"#e8d8b5");rect(x+7,41,9,5,"#8c6946");
 }
 // hanging garlic and herbs
 for(let i=0;i<4;i++){
  const x=815+i*17-cameraX*.18;
  line(x,74,x,100,"#567448",2);
  rect(x-4,95,7,11,"#e9e0c2");
  rect(x+1,98,5,9,"#e9e0c2");
 }
 // cozy lamps
 for(const x0 of [260,610,900]){
  const x=x0-cameraX*.2;
  line(x,0,x,54,"#694a32",3);
  rect(x-17,48,34,8,"#694a32");
  rect(x-21,55,42,7,"#d9a94e");
  rect(x-16,62,32,5,"#f2d28b");
  rect(x-7,67,14,4,"#f9e8b6");
 }
 drawPicture(385-cameraX*.18,205);
 drawPicture(795-cameraX*.18,205);
 // checkered Italian tablecloth hanging on wall
 for(let i=0;i<8;i++)for(let j=0;j<3;j++){
  rect(565-cameraX*.18+i*10,111+j*10,10,10,(i+j)%2?"#fff0d2":"#a94132");
 }
}
function drawPicture(x,y){
 rect(x,y,57,60,"#60412f");rect(x+4,y+4,49,52,"#fff0d2");
 rect(x+8,y+8,41,44,"#b6d0ad");
 rect(x+12,y+12,33,36,"#f3e6c6");
 rect(x+17,y+18,23,22,"#a94132");
 rect(x+21,y+21,15,15,"#e9b44c");
 rect(x+25,y+25,7,7,"#476b43");
 rect(x+10,y+39,38,5,"#e0d1ac");
}
function drawStation(s){
 const x=s.x-cameraX,y=FLOOR;
 if(x<-130||x>W+130)return;
 if(s.id==="dough"){
  rect(x-58,y-55,116,10,"#60412f");rect(x-53,y-45,106,6,"#bc8954");
  rect(x-47,y-39,9,39,"#805437");rect(x+38,y-39,9,39,"#805437");
  rect(x-46,y-75,92,25,"#f2d8a7");rect(x-41,y-71,82,17,"#e4c18c");
  rect(x-17,y-90,34,5,"#98633b");rect(x-22,y-93,5,11,"#60412f");rect(x+17,y-93,5,11,"#60412f");
  rect(x-13,y-67,26,6,"#e6c68e");
  if(currentTask?.type==="dough"){let sh=Math.sin(taskElapsed*15)*14;rect(x-17+sh,y-90,34,5,"#98633b")}
 }else if(s.id==="sauce"){
  rect(x-54,y-55,108,10,"#60412f");rect(x-49,y-45,98,6,"#bc8954");
  rect(x-44,y-39,8,39,"#805437");rect(x+36,y-39,8,39,"#805437");
  rect(x-29,y-78,58,21,"#e8ddc7");rect(x-24,y-74,48,13,"#a94132");rect(x-18,y-72,36,6,"#d65a40");
  rect(x-4,y-88,8,11,"#a94132");
  if(currentTask?.type==="sauce"){rect(x-14+Math.sin(taskElapsed*14)*7,y-72,8,4,"#f4ad8b")}
 }else if(s.id==="toppings"){
  rect(x-59,y-55,118,10,"#60412f");rect(x-54,y-45,108,6,"#bc8954");
  rect(x-49,y-39,8,39,"#805437");rect(x+41,y-39,8,39,"#805437");
  ingredients.forEach((it,i)=>{
   const bx=x-46+(i%3)*32,by=y-78+Math.floor(i/3)*22;

function drawPicturePizza(){
 if(currentStage==="dough"&&!currentTask)return;
 const s=stations[2],x=s.x-cameraX,y=FLOOR-66;
 if(x<-100||x>W+100)return;
 rect(x-30,y+7,60,10,"#9d653a");rect(x-27,y,54,12,"#d5a04e");rect(x-23,y+2,46,8,"#f1d59a");
 if(["toppings","oven","counter"].includes(currentStage)||currentTask?.type==="cheese"||currentTask?.type==="topping"){
  rect(x-21,y+3,42,6,"#b84430");
  for(let i=0;i<9;i++){
   const a=i*2.399;
   rect(x+Math.cos(a)*(5+(i%3)*5),y+5+Math.sin(a)*(2+(i%2)*2),5,4,"#f5ce56");
  }
  toppingsAdded.forEach((n,i)=>{
   const ing=ingredients.find(v=>v.name===n);
   if(ing)for(let j=0;j<5;j++)rect(x-17+((i*13+j*9)%34),y+2+((i*7+j*3)%7),4,3,ing.color);
  });
 }
 if(currentTask){const p=clamp(taskElapsed/taskDuration,0,1);rect(x-27,y-9,54,4,"#63402e");rect(x-26,y-8,52*p,2,"#ffdf83")}
}
function drawPlayer(){
 const x=player.x-cameraX,y=player.y,cx=x+player.w/2;
 const lift=player.grounded?0:Math.sin(gameTime*12)*1.5;
 const swing=player.grounded&&!currentTask?Math.sin(player.walk)*7:0;
 const shoulder=y+31+lift,hip=y+52+lift,head=y+7+lift;
 const skin="#d5b18a",edge="#805b3c",wood="#b98552",light="#dfb47b";
 const cos=cosmetics();
 rect(cx-20,FLOOR-3,40,4,"#99754f");
 const legs=[{x:cx-6-swing*.35,y:hip+12},{x:cx+6+swing*.35,y:hip+12}];
 const feet=[{x:cx-7-swing,y:y+70+lift},{x:cx+7+swing,y:y+70+lift}];
 legs.forEach((p,i)=>{line(p.x,p.y,feet[i].x,feet[i].y,edge,8);line(p.x,p.y,feet[i].x,feet[i].y,wood,5);rect(feet[i].x-5,feet[i].y-1,10,5,edge);rect(feet[i].x-4,feet[i].y,8,3,wood)});
 const holding=carriedPizza;
 const le=holding?{x:cx-13,y:y+39+lift}:{x:cx-15-swing*.55,y:y+43+lift};
 const re=holding?{x:cx+13,y:y+39+lift}:{x:cx+15+swing*.55,y:y+43+lift};
 const lh=holding?{x:cx-7,y:y+36+lift}:{x:cx-14-swing,y:y+54+lift};
 const rh=holding?{x:cx+7,y:y+36+lift}:{x:cx+14+swing,y:y+54+lift};
 line(cx-10,shoulder,le.x,le.y,wood,6);line(le.x,le.y,lh.x,lh.y,wood,5);
 line(cx+10,shoulder,re.x,re.y,wood,6);line(re.x,re.y,rh.x,rh.y,wood,5);
 rect(cx-11,shoulder-3,22,24,edge);rect(cx-8,shoulder,16,18,wood);rect(cx-6,shoulder+2,4,13,light);
 rect(cx-5,hip-1,10,5,edge);rect(cx-4,hip,8,3,wood);
 if(cos.clothes==="scarf"){
  rect(cx-10,shoulder-2,20,6,"#4d995f");rect(cx+3,shoulder+1,5,15,"#4d995f");rect(cx+4,shoulder+2,2,11,"#78b27c");
 }else if(cos.clothes==="shirt"||cos.clothes==="hoodie"){
  const c=cos.clothes==="shirt"?"#c64c48":"#3977bd";
  rect(cx-10,shoulder-2,20,20,c);rect(cx-4,shoulder+1,3,14,cos.clothes==="shirt"?"#e1786b":"#6697d2");
  if(cos.clothes==="hoodie"){rect(cx-7,shoulder-5,14,6,"#28578b");rect(cx-3,shoulder+13,6,3,"#244f7e")}
 }
 rect(cx-4,shoulder-7,8,7,edge);rect(cx-3,shoulder-6,6,6,wood);
 rect(cx-11,head,22,23,edge);rect(cx-9,head+2,18,19,skin);rect(cx-7,head+4,14,15,wood);
 rect(cx-6,head+5,4,11,light);rect(cx-1,head+5,8,11,"#c99a64");
 rect(cx-6,head+10,3,3,"#43362c");rect(cx+4,head+10,3,3,"#43362c");rect(cx-2,head+16,5,2,"#8c5944");
 if(cos.head==="cap"){
  rect(cx-13,head+1,26,5,"#3977bd");rect(cx-10,head-5,20,7,"#3977bd");rect(cx+4,head+4,10,3,"#285a91");rect(cx-7,head-3,9,2,"#79a9e3");
 }else if(cos.head==="crown"){
  rect(cx-12,head-4,24,5,"#d8a92e");rect(cx-12,head-11,5,8,"#f4c64e");rect(cx-4,head-14,6,11,"#f4c64e");rect(cx+5,head-10,6,7,"#f4c64e");rect(cx-9,head-3,18,2,"#fff0a4");
 }
 if(cos.face==="glasses"){
  rect(cx-9,head+9,8,6,"#29323c");rect(cx+1,head+9,8,6,"#29323c");rect(cx-1,head+11,2,2,"#29323c");rect(cx-7,head+10,4,2,"#9fc9d6");rect(cx+3,head+10,4,2,"#9fc9d6");
 }
 if(carriedPizza){
  const px=cx+player.facing*22,py=y+35;
  rect(px-15,py+4,30,5,"#9b5b32");rect(px-14,py,28,5,"#e9c05e");rect(px-10,py+1,20,3,"#b84430");
  rect(px-5,py+1,4,2,"#f5ce56");rect(px+3,py+2,4,2,"#f5ce56");
 }
}
function drawEffects(){
 for(const p of particles){ctx.globalAlpha=clamp(p.life,0,1);rect(p.x-cameraX,p.y,p.size,p.size,p.color)}
 ctx.globalAlpha=1;

 ctx.clearRect(0,0,W,H);
 drawBackground();
 stations.forEach(drawStation);

 drawEffects();
 // Tiny iconography only; no tutorial text
 const s=nearby();

  txt("E",35,41,"#a94132",18,"center");

 }

  const w=Math.min(W-50,Math.max(75,message.length*7+26));
  rect((W-w)/2,H-49,w,30,"#fff0d2");outline((W-w)/2,H-49,w,30);
  txt(message,W/2,H-30,"#34271f",11,"center");
 }
}
function loop(t){
 const dt=Math.min(.033,(t-(lastTime||t))/1000);lastTime=t;
 update(dt);draw();requestAnimationFrame(loop);
}
window.addEventListener("keydown",e=>{
 const k=e.key.toLowerCase();
 if([" ","arrowleft","arrowright","arrowup"].includes(k))e.preventDefault();
 keys[k]=true;
 if(k==="e"&&!e.repeat)interact();
 if(k===" "&&!e.repeat)jump();
});
window.addEventListener("keyup",e=>keys[e.key.toLowerCase()]=false);
document.querySelectorAll("[data-key]").forEach(b=>{
 const k=b.dataset.key;
 const down=e=>{e.preventDefault();keys[k]=true};
 const up=e=>{e.preventDefault();keys[k]=false};
 b.addEventListener("pointerdown",down);b.addEventListener("pointerup",up);
 b.addEventListener("pointercancel",up);b.addEventListener("pointerleave",up);
});
$("mobileE").addEventListener("click",interact);
$("soundBtn").addEventListener("click",()=>{
 soundOn=!soundOn;
 $("soundBtn").textContent=soundOn?"♫ ON":"♫ OFF";
 if(soundOn){audioContext();sound("ding")}
});
window.addEventListener("storage",e=>{
 if(e.key===STORAGE_KEY)$("money").textContent=money();
});
$("money").textContent=money();
newOrder();
updateHUD();
requestAnimationFrame(loop);
})();
</script>
