
<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MEIN ZIMMER</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#17191b;font-family:Arial,sans-serif}
canvas{display:block;width:100%;height:100%}
#hud{position:fixed;top:15px;left:16px;z-index:5;color:#f5eee2;background:#17191bd9;border:1px solid #ffffff25;border-radius:9px;padding:10px 14px;font-size:13px;letter-spacing:1.5px}
#status{position:fixed;top:15px;right:16px;z-index:5;color:#eee;background:#17191bd9;border:1px solid #ffffff25;border-radius:9px;padding:9px 12px;font-size:12px}
#hint{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);z-index:5;color:#eee;background:#17191be8;border:1px solid #ffffff30;border-radius:8px;padding:11px 17px;font-size:13px;text-align:center;white-space:nowrap;max-width:92vw}
#money{position:fixed;top:58px;left:16px;z-index:5;color:#f4d58d;background:#17191bd9;border:1px solid #ffffff25;border-radius:8px;padding:8px 12px;font-size:13px}

</style>
</head>
<body>
<div id="hud">MEIN ZIMMER <span style="opacity:.5">/</span> ZUHAUSE</div>
<div id="status">Wird gestartet …</div>
<div id="money">0 €</div>
<div id="hint">A / D – Bewegen · LEERTASTE – Springen · E – Interagieren</div>
<div id="fade"></div>
<canvas id="game"></canvas>

<script src="supabase.js"></script>
<script>
"use strict";

/* =====================================================
   GRUNDLAGEN
===================================================== */
const canvas=document.getElementById("game");
const ctx=canvas.getContext("2d");
const W=960,H=540,WORLD=3100,FLOOR=440;
const SAVE_KEY="mein-zimmer-save-v1";

let sx=1,sy=1,cameraX=0,last=0,time=0;
let keys={};
let message="",messageUntil=0;
let onlineRoom=null,onlineReady=false;
let otherPlayers={};
let wardrobeOpen=0,computerOn=true,tapAnimation=0;
let sofaOccupied=false,bedOccupied=false;
let furnitureAction=null;

function resize(){
 const dpr=Math.min(devicePixelRatio||1,2);
 canvas.width=Math.floor(innerWidth*dpr);
 canvas.height=Math.floor(innerHeight*dpr);
 sx=canvas.width/W;
 sy=canvas.height/H;
}
window.addEventListener("resize",resize);
resize();

function clamp(v,a,b){return Math.max(a,Math.min(b,v))}
function lerp(a,b,t){return a+(b-a)*t}
function smooth(a,b,t){t=clamp(t,0,1);return a+(b-a)*(t*t*(3-2*t))}
function roundRect(c,x,y,w,h,r){
 c.beginPath();
 c.roundRect(x,y,w,h,r);
}
function say(text,duration=2400){
 message=text;
 messageUntil=performance.now()+duration;
}
function clone(v){return JSON.parse(JSON.stringify(v))}

/* =====================================================
   SPIELSTAND UND COSMETICS
===================================================== */
const defaults={
 money:120,
 inventory:[],
 equipped:{
  head:null,face:null,clothes:null,back:null,pants:null
 },
 unlocked:[],
 faucetOn:false,
 bucketWater:0,
 orders:[],
 received:[],
 playerX:180
};

function readSave(){
 try{
  const s=JSON.parse(localStorage.getItem(SAVE_KEY)||"null");
  if(!s)return clone(defaults);
  return {
   ...clone(defaults),
   ...s,
   equipped:{...defaults.equipped,...(s.equipped||{})},
   unlocked:Array.isArray(s.unlocked)?s.unlocked:[]
  };
 }catch(e){
  console.warn(e);
  return clone(defaults);
 }
}
let save=readSave();

function writeSave(){
 try{localStorage.setItem(SAVE_KEY,JSON.stringify(save))}
 catch(e){console.warn("Speichern fehlgeschlagen",e)}
 document.getElementById("money").textContent=(save.money||0)+" €";
}
writeSave();

/* =====================================================
   SPIELFIGUR
===================================================== */
const player={
 x:clamp(Number(save.playerX)||180,40,WORLD-80),
 y:FLOOR-68,
 vx:0,vy:0,
 width:48,height:68,
 grounded:true,
 facing:1,
 walk:0,
 landing:0,
 action:"normal",
 actionProgress:0,
 actionStartX:0,
 actionStartY:0
};

const chairAnim={
 legNear:0,
 legFar:0,
 kneeNear:0,
 kneeFar:0,
 bob:0
};

function woodGradient(x,y,w,h){
 const g=ctx.createLinearGradient(x,y,x+w,y+h);
 g.addColorStop(0,"#d3a16c");
 g.addColorStop(.35,"#b98552");
 g.addColorStop(.7,"#94603a");
 g.addColorStop(1,"#674127");
 return g;
}

function woodShape(points){
 ctx.beginPath();
 points.forEach((p,i)=>i?ctx.lineTo(p[0],p[1]):ctx.moveTo(p[0],p[1]));
 ctx.closePath();
 ctx.fillStyle=woodGradient(-10,-10,75,120);
 ctx.fill();
 ctx.strokeStyle="#563820";
 ctx.lineWidth=1.5;
 ctx.stroke();
}

function drawWoodGrain(x1,y1,x2,y2,alpha=.22){
 ctx.save();
 ctx.strokeStyle="#f3d0a0";
 ctx.globalAlpha=alpha;
 ctx.lineWidth=.8;
 ctx.beginPath();
 ctx.moveTo(x1,y1);
 ctx.quadraticCurveTo((x1+x2)/2+2,(y1+y2)/2,x2,y2);
 ctx.stroke();
 ctx.restore();
}

/* Gelenkbein: Ober- und Unterschenkel werden separat bewegt. */
function drawArticulatedLeg(hipX,hipY,angle,kneeAngle,near=true){
 const upper=25,lower=25;
 const kneeX=hipX+Math.sin(angle)*upper;
 const kneeY=hipY+Math.cos(angle)*upper;
 const footAngle=angle+kneeAngle;
 const footX=kneeX+Math.sin(footAngle)*lower;
 const footY=kneeY+Math.cos(footAngle)*lower;

 ctx.save();
 ctx.lineCap="round";
 ctx.lineJoin="round";

 const dark=near?"#805331":"#553a27";
 const light=near?"#d0a071":"#8e6746";

 function segment(x1,y1,x2,y2,width){
  ctx.strokeStyle="#39271b";
  ctx.lineWidth=width+2;
  ctx.beginPath();
  ctx.moveTo(x1,y1);
  ctx.lineTo(x2,y2);
  ctx.stroke();

  ctx.strokeStyle=dark;
  ctx.lineWidth=width;
  ctx.beginPath();
  ctx.moveTo(x1,y1);
  ctx.lineTo(x2,y2);
  ctx.stroke();

  ctx.strokeStyle=light;
  ctx.lineWidth=Math.max(1,width*.18);
  ctx.beginPath();
  ctx.moveTo(x1-width*.15,y1);
  ctx.lineTo(x2-width*.15,y2);
  ctx.stroke();
 }

 segment(hipX,hipY,kneeX,kneeY,near?6:5);
 segment(kneeX,kneeY,footX,footY,near?5:4);

 ctx.fillStyle="#49301f";
 ctx.beginPath();
 ctx.arc(kneeX,kneeY,3.2,0,Math.PI*2);
 ctx.fill();
 ctx.fillStyle="#d2a071";
 ctx.beginPath();
 ctx.arc(kneeX-1,kneeY-1,1,0,Math.PI*2);
 ctx.fill();

 // Kleiner Fußabschluss
 ctx.strokeStyle="#4a3020";
 ctx.lineWidth=3;
 ctx.beginPath();
 ctx.moveTo(footX-4,footY);
 ctx.lineTo(footX+4,footY);
 ctx.stroke();

 ctx.restore();

 return {hipX,hipY,kneeX,kneeY,footX,footY,angle,footAngle};
}

/* Hose folgt exakt den Gelenken der Stuhlbeine. */
function drawPantsLeg(segment,id,near=true){
 if(!id)return;

 const colors={
  jeans:"#426e9a",joggers:"#686b76",cargo:"#78805a",
  shorts:"#bd704c",sleep_pants:"#7f76a8",baggy:"#42658b",
  knight_pants:"#929ca4",rain_pants:"#4d7e87",
  camo:"#65734c",gold_pants:"#c5a13c",
  ski_pants:"#e4e9ef",overalls:"#487e9a"
 };
 const color=colors[id]||"#42658b";

 function clothSegment(x1,y1,x2,y2,width){
  ctx.save();
  ctx.lineCap="round";
  ctx.strokeStyle="#20242a";
  ctx.lineWidth=width+2;
  ctx.beginPath();
  ctx.moveTo(x1,y1);
  ctx.lineTo(x2,y2);
  ctx.stroke();

  ctx.strokeStyle=color;
  ctx.lineWidth=width;
  ctx.beginPath();
  ctx.moveTo(x1,y1);
  ctx.lineTo(x2,y2);
  ctx.stroke();

  ctx.strokeStyle="#ffffff";
  ctx.globalAlpha=.18;
  ctx.lineWidth=1;
  ctx.beginPath();
  ctx.moveTo(x1-width*.15,y1);
  ctx.lineTo(x2-width*.15,y2);
  ctx.stroke();
  ctx.restore();
 }

 const isShort=id==="shorts";
 const width=near?8:7;

 if(isShort){
  clothSegment(
   segment.hipX,segment.hipY,
   segment.kneeX,segment.kneeY,
   width+2
  );
  return;
 }

 clothSegment(
  segment.hipX,segment.hipY,
  segment.kneeX,segment.kneeY,
  width
 );
 clothSegment(
  segment.kneeX,segment.kneeY,
  segment.footX,segment.footY,
  width-1
 );

 // Details für die ausgewählten Hosen
 ctx.save();
 ctx.strokeStyle="#ffffff55";
 ctx.lineWidth=1;

 if(id==="cargo"){
  ctx.beginPath();
  ctx.moveTo(segment.kneeX-3,segment.kneeY+5);
  ctx.lineTo(segment.kneeX+3,segment.kneeY+5);
  ctx.stroke();
 }
 if(id==="gold_pants"){
  ctx.fillStyle="#f4db80";
  ctx.beginPath();
  ctx.arc(segment.kneeX,segment.kneeY,1.5,0,Math.PI*2);
  ctx.fill();
 }
 if(id==="camo"){
  ctx.fillStyle="#3e5038";
  ctx.fillRect(segment.kneeX-2,segment.kneeY+2,3,3);
 }
 if(id==="knight_pants"){
  ctx.strokeStyle="#d5dce0";
  ctx.strokeRect(segment.kneeX-3,segment.kneeY-3,6,6);
 }
 if(id==="overalls"){
  ctx.strokeStyle="#d4e0e5";
  ctx.beginPath();
  ctx.moveTo(segment.hipX-3,segment.hipY+4);
  ctx.lineTo(segment.hipX+3,segment.hipY+4);
  ctx.stroke();
 }
 ctx.restore();
}

function drawBackCosmetic(){
 const id=save.equipped.back;
 if(!id)return;

 ctx.save();
 ctx.translate(-24,-60);

 const colors={
  backpack:"#a66b3c",schoolbag:"#d45c45",
  hikingbag:"#547d57",guitarbag:"#553b31",
  toolbox:"#b37a38"
 };
 const color=colors[id]||"#986b49";

 if(id==="wings"){
  ctx.fillStyle="#eee9dc";
  ctx.strokeStyle="#a99c88";
  ctx.beginPath();
  ctx.ellipse(-7,-4,13,25,-.6,0,Math.PI*2);
  ctx.fill();ctx.stroke();
  ctx.beginPath();
  ctx.ellipse(1,-4,12,25,.6,0,Math.PI*2);
  ctx.fill();ctx.stroke();
 }else if(id==="jetpack"){
  ctx.fillStyle="#aebdc2";
  roundRect(ctx,-15,-12,13,33,3);ctx.fill();
  roundRect(ctx,1,-12,13,33,3);ctx.fill();
  ctx.fillStyle="#e8a64d";
  ctx.fillRect(-13,22,8,7);
  ctx.fillRect(3,22,8,7);
 }else if(id==="parachute"){
  ctx.fillStyle="#e4d8be";
  ctx.beginPath();
  ctx.arc(-1,-43,25,Math.PI,0);
  ctx.fill();
  ctx.strokeStyle="#8b6d52";ctx.stroke();
  ctx.strokeStyle="#766";
  ctx.beginPath();
  ctx.moveTo(-22,-43);ctx.lineTo(-2,-8);
  ctx.moveTo(20,-43);ctx.lineTo(2,-8);
  ctx.stroke();
 }else{
  ctx.fillStyle=color;
  roundRect(ctx,-14,-22,23,37,5);ctx.fill();
  ctx.strokeStyle="#49301f";ctx.stroke();
  ctx.fillStyle="#ffffff33";
  ctx.fillRect(-10,-18,3,25);
  if(id==="toolbox"){
   ctx.fillStyle="#d7a34e";
   ctx.fillRect(-11,-26,18,5);
  }
 }
 ctx.restore();
}

function drawClothing(){
 const id=save.equipped.clothes;
 if(!id)return;

 const colors={
  scarf:"#4d995f",shirt:"#c64c48",hoodie:"#3977bd",
  leather:"#513a31",raincoat:"#e3b83c",football:"#eee7dc",
  suit:"#293c55",pajamas:"#8c83b4",vest:"#e9bd37",
  astronaut:"#d9e0e4",armor:"#89969e",hawaii:"#d96b5b",
  wintercoat:"#587f9d"
 };
 const color=colors[id]||"#b98552";

 ctx.save();
 ctx.fillStyle=color;
 roundRect(ctx,-13,-65,19,37,4);
 ctx.fill();
 ctx.strokeStyle="#49301f";
 ctx.lineWidth=1;
 ctx.stroke();

 ctx.fillStyle="#ffffff22";
 ctx.fillRect(-10,-62,3,28);

 if(id==="scarf"){
  ctx.fillStyle=color;
  roundRect(ctx,-13,-68,19,8,3);ctx.fill();
  ctx.fillRect(-3,-61,6,20);
 }
 if(id==="hoodie"){
  ctx.fillStyle="#28578b";
  ctx.beginPath();
  ctx.arc(-4,-66,9,Math.PI,0);
  ctx.fill();
  ctx.strokeStyle="#244f7e";
  ctx.stroke();
 }
 if(id==="leather"){
  ctx.strokeStyle="#d1ae8c";
  ctx.beginPath();ctx.moveTo(-9,-62);ctx.lineTo(-3,-31);ctx.stroke();
 }
 if(id==="raincoat"||id==="vest"){
  ctx.fillStyle="#fff1b8";
  ctx.fillRect(-5,-61,3,27);
 }
 if(id==="suit"){
  ctx.fillStyle="#eee";
  ctx.beginPath();ctx.moveTo(-7,-63);ctx.lineTo(-2,-52);ctx.lineTo(2,-63);ctx.fill();
 }
 if(id==="astronaut"){
  ctx.fillStyle="#7f9ba8";
  roundRect(ctx,-9,-53,10,12,2);ctx.fill();
 }
 if(id==="armor"){
  ctx.fillStyle="#d6b85e";
  ctx.fillRect(-5,-54,4,8);
 }
 if(id==="hawaii"){
  ctx.fillStyle="#f6d36d";
  ctx.fillRect(-10,-55,3,4);
  ctx.fillStyle="#6d9a64";
  ctx.fillRect(-3,-44,3,4);
 }
 if(id==="wintercoat"){
  ctx.fillStyle="#d5e4ed";
  ctx.fillRect(-12,-65,17,5);
 }
 ctx.restore();
}

function drawHeadCosmetic(){
 const id=save.equipped.head;
 if(!id)return;

 ctx.save();
 ctx.translate(-20,-112);

 const gold=["crown","gold_helmet","paper_crown"].includes(id);
 if(id==="cap"){
  ctx.fillStyle="#3977bd";
  roundRect(ctx,-12,-5,27,9,4);ctx.fill();
  ctx.fillRect(-9,-11,20,8);
  ctx.fillRect(10,1,12,3);
 }else if(gold){
  ctx.fillStyle=id==="paper_crown"?"#c7a76e":"#f4c64e";
  ctx.beginPath();
  ctx.moveTo(-13,3);ctx.lineTo(-12,-9);ctx.lineTo(-5,-3);
  ctx.lineTo(0,-15);ctx.lineTo(6,-3);ctx.lineTo(14,-10);
  ctx.lineTo(14,3);ctx.closePath();ctx.fill();
  ctx.strokeStyle="#805d29";ctx.stroke();
 }else if(id==="tp_hat"){
  ctx.fillStyle="#fffaf1";ctx.fillRect(-10,-12,21,16);
  ctx.strokeStyle="#c9c1b4";ctx.strokeRect(-10,-12,21,16);
 }else if(id==="traffic_hat"){
  ctx.fillStyle="#ef8e23";
  ctx.beginPath();ctx.moveTo(0,-17);ctx.lineTo(-12,4);ctx.lineTo(12,4);ctx.closePath();ctx.fill();
  ctx.fillStyle="#fff0c9";ctx.fillRect(-7,-5,14,3);
 }else if(id==="cowboy"){
  ctx.fillStyle="#8a542d";ctx.fillRect(-17,0,34,5);
  ctx.fillRect(-10,-10,20,12);
 }else if(id==="viking"){
  ctx.fillStyle="#999b9c";ctx.fillRect(-13,-2,27,7);
  ctx.strokeStyle="#e8e1d0";ctx.lineWidth=4;
  ctx.beginPath();ctx.moveTo(-10,-3);ctx.lineTo(-17,-15);
  ctx.moveTo(10,-3);ctx.lineTo(17,-15);ctx.stroke();
 }else if(id==="chef"){
  ctx.fillStyle="#fff";ctx.beginPath();ctx.arc(0,-6,12,Math.PI,0);ctx.fill();
  ctx.fillRect(-12,-5,24,9);
 }else if(id==="frog_hat"){
  ctx.fillStyle="#4b9d56";ctx.fillRect(-13,-2,26,8);
  ctx.beginPath();ctx.arc(-8,-10,7,0,Math.PI*2);ctx.arc(8,-10,7,0,Math.PI*2);ctx.fill();
  ctx.fillStyle="#111";ctx.beginPath();ctx.arc(-8,-10,2,0,7);ctx.arc(8,-10,2,0,7);ctx.fill();
 }else if(id==="wizard"){
  ctx.fillStyle="#51468c";ctx.beginPath();ctx.moveTo(-15,3);ctx.lineTo(0,-23);ctx.lineTo(15,3);ctx.fill();
  ctx.fillStyle="#483e75";ctx.fillRect(-17,1,34,5);
  ctx.fillStyle="#f6d56c";ctx.fillRect(-2,-13,5,5);
 }else if(id==="bucket_hat"){
  ctx.fillStyle="#8b969a";ctx.fillRect(-14,-12,28,17);
  ctx.fillStyle="#657277";ctx.fillRect(-17,2,34,5);
 }else if(id==="party_hat"){
  ctx.fillStyle="#e95e70";ctx.beginPath();ctx.moveTo(0,-21);ctx.lineTo(-12,3);ctx.lineTo(12,3);ctx.fill();
  ctx.fillStyle="#f3ce63";ctx.fillRect(-6,-9,12,3);
 }
 ctx.restore();
}

const balloonColors={
 balloon_red:"#e34d4d",balloon_blue:"#438bd1",
 balloon_yellow:"#efc84b",balloon_pink:"#ed83ad",
 balloon_green:"#55a96c",balloon_purple:"#9871cf",
 balloon_party:"#e65c64",balloon_heart:"#e85b85",
 balloon_star:"#e8bd48"
};

function drawBalloon(timeNow){
 const id=save.equipped.face;
 if(!id||!id.startsWith("balloon_"))return;

 const t=timeNow/1000;
 const count=id==="balloon_party"?3:1;

 for(let i=0;i<count;i++){
  const phase=i*2.1;
  const bx=15+i*16+Math.sin(t*1.5+phase)*5;
  const by=-135-i%2*14+Math.sin(t*2+phase)*4;
  const color=id==="balloon_party"
   ?["#ed83ad","#438bd1","#efc84b"][i]
   :balloonColors[id];

  ctx.save();
  ctx.strokeStyle="#766b60";
  ctx.lineWidth=1;
  ctx.beginPath();
  ctx.moveTo(-5,-65);
  ctx.quadraticCurveTo(bx-8,-95,bx,by+14);
  ctx.stroke();

  ctx.fillStyle=color;
  ctx.beginPath();
  if(id==="balloon_heart"){
   ctx.moveTo(bx,by+12);
   ctx.bezierCurveTo(bx-25,by-4,bx-15,by-20,bx,by-10);
   ctx.bezierCurveTo(bx+15,by-20,bx+25,by-4,bx,by+12);
  }else if(id==="balloon_star"){
   for(let j=0;j<10;j++){
    const a=-Math.PI/2+j*Math.PI/5;
    const r=j%2?8:17;
    const px=bx+Math.cos(a)*r,py=by+Math.sin(a)*r;
    if(j===0)ctx.moveTo(px,py);else ctx.lineTo(px,py);
   }
  }else{
   ctx.ellipse(bx,by,12,17,0,0,Math.PI*2);
  }
  ctx.closePath();
  ctx.fill();
  ctx.strokeStyle="#7a4b4b66";ctx.stroke();
  ctx.restore();
 }
}

/* =====================================================
   STUHL – SEITENANSICHT MIT ANIMIERTEN BEINEN
===================================================== */
function drawChair(){
 const moving=Math.abs(player.vx)>5&&player.grounded&&player.action==="normal";
 const airborne=!player.grounded;
 const speed=clamp(Math.abs(player.vx)/230,0,1);
 const phase=player.walk;

 let nearAngle=0,farAngle=0,nearKnee=0,farKnee=0;

 if(moving){
  nearAngle=Math.sin(phase)*.65*speed;
  farAngle=Math.sin(phase+Math.PI)*.65*speed;
  nearKnee=Math.max(0,Math.cos(phase))*-.95*speed;
  farKnee=Math.max(0,Math.cos(phase+Math.PI))*-.95*speed;
 }

 if(airborne){
  nearAngle=.25;
  farAngle=-.25;
  nearKnee=-.9;
  farKnee=-.9;
 }

 if(player.action==="sofa"||player.action==="bed"){
  nearAngle=.75;
  farAngle=.65;
  nearKnee=-1.1;
  farKnee=-1.05;
 }

 const bodyBob=moving?Math.sin(phase*2)*.5:0;
 const landingBob=player.landing>0?Math.sin(player.landing*Math.PI)*1.5:0;

 ctx.save();
 ctx.translate(player.x+24,player.y+player.height);
 ctx.scale(player.facing*.58,.58);
 ctx.translate(0,-116+bodyBob+landingBob);

 // Cosmetics am Rücken liegen hinter dem Stuhl.
 drawBackCosmetic();

 // Zwei sichtbare, gegliederte Beine.
 const far=drawArticulatedLeg(-1, -43,farAngle,farKnee,false);
 const near=drawArticulatedLeg(27,-43,nearAngle,nearKnee,true);

 // Hosenlayer folgt den tatsächlichen Gelenken.
 drawPantsLeg(far,save.equipped.pants,false);
 drawPantsLeg(near,save.equipped.pants,true);

 // Sitzfläche in Seitenansicht
 const seat=ctx.createLinearGradient(-15,-48,45,-42);
 seat.addColorStop(0,"#70472b");
 seat.addColorStop(.35,"#bd8955");
 seat.addColorStop(1,"#684329");
 ctx.fillStyle=seat;
 ctx.beginPath();
 ctx.moveTo(-23,-54);
 ctx.lineTo(43,-54);
 ctx.lineTo(46,-46);
 ctx.lineTo(-20,-46);
 ctx.closePath();
 ctx.fill();
 ctx.strokeStyle="#563820";ctx.lineWidth=1.5;ctx.stroke();
 drawWoodGrain(-17,-52,39,-52);

 // Rückenlehne – links, klar in Seitenansicht
 const back=ctx.createLinearGradient(-32,-112,-12,-112);
 back.addColorStop(0,"#70472b");
 back.addColorStop(.35,"#b17a49");
 back.addColorStop(1,"#603d27");
 ctx.fillStyle=back;
 roundRect(ctx,-33,-116,15,66,4);
 ctx.fill();
 ctx.strokeStyle="#563820";ctx.stroke();
 drawWoodGrain(-30,-108,-21,-108);
 drawWoodGrain(-30,-91,-21,-91);
 drawWoodGrain(-30,-73,-21,-73);

 // Verbindung zwischen Rücken und Sitz
 ctx.fillStyle="#754b2e";
 ctx.fillRect(-24,-57,7,12);

 // Oberteil-Layer
 drawClothing();

 // Oberkante Sitz und Holzdetails
 ctx.strokeStyle="#d8a777";
 ctx.lineWidth=1.5;
 ctx.beginPath();
 ctx.moveTo(-20,-53);
 ctx.lineTo(40,-53);
 ctx.stroke();

 // Kopf-Cosmetics und Ballons
 drawHeadCosmetic();
 drawBalloon(time);

 ctx.restore();
}

/* =====================================================
   HINTERGRUND
===================================================== */
function drawBackground(){
 const wall=ctx.createLinearGradient(0,0,0,FLOOR);
 wall.addColorStop(0,"#d2c7b6");
 wall.addColorStop(1,"#b8a995");

/* =====================================================
   PHYSIK UND ANIMATIONEN
===================================================== */
function update(dt){
 if(furnitureAction){
  furnitureAction.elapsed+=dt;
  const p=clamp(furnitureAction.elapsed/furnitureAction.duration,0,1);
  player.x=lerp(furnitureAction.startX,furnitureAction.targetX,smooth(0,1,p));
  player.vx=0;
  player.vy=0;
  player.grounded=true;
  if(p>=1){
   player.action=furnitureAction.type;
   furnitureAction=null;
  }
 }else if(player.action==="normal"){
  const left=keys["a"]||keys["arrowleft"];
  const right=keys["d"]||keys["arrowright"];
  const speed=230;

  if(left){player.vx=-speed;player.facing=-1}
  else if(right){player.vx=speed;player.facing=1}
  else{
   player.vx*=Math.pow(.001,dt);
   if(Math.abs(player.vx)<2)player.vx=0;
  }

  player.x+=player.vx*dt;
  player.x=clamp(player.x,20,WORLD-player.width-20);

  player.vy+=1100*dt;
  player.y+=player.vy*dt;

  if(player.y+player.height>=FLOOR){
   if(!player.grounded&&player.vy>100)player.landing=1;
   player.y=FLOOR-player.height;
   player.vy=0;
   player.grounded=true;
  }else player.grounded=false;
 }else{
  player.vx=0;
  player.vy=0;
  player.grounded=true;
 }

 if(player.action==="sofa"){
  player.y=FLOOR-68+8;
 }
 if(player.action==="bed"){
  player.y=FLOOR-68+12;
 }

 if(player.grounded&&Math.abs(player.vx)>5&&player.action==="normal"){
  player.walk+=dt*(8+Math.abs(player.vx)*.025);
 }
 player.landing=Math.max(0,player.landing-dt*3);

 wardrobeOpen=lerp(wardrobeOpen,0,dt*1.5);
 if(save.faucetOn){
  tapAnimation+=dt;
  save.bucketWater=clamp((save.bucketWater||0)+dt*.12,0,100);
  if(Math.floor(time*2)!==Math.floor((time-dt)*2))writeSave();
 }

 cameraX=clamp(player.x-W*.42,0,WORLD-W);
 save.playerX=player.x;
}

===================================================== */
window.addEventListener("keydown",e=>{
 const k=e.key.toLowerCase();
 if([" ","arrowup","arrowleft","arrowright"].includes(k))e.preventDefault();

 if(!keys[k]){
  if((k===" "||k==="w"||k==="arrowup")&&player.grounded&&player.action==="normal"){
   player.vy=-440;
   player.grounded=false;
  }
  if(k==="e"){
   if(player.action==="sofa"){
    sofaOccupied=false;player.action="normal";say("Du stehst auf.");
   }else if(player.action==="bed"){
    bedOccupied=false;player.action="normal";say("Du stehst auf.");
   }else interact();
  }
  if(k==="q"){
   player.held=null;say("Gegenstand abgelegt.");
  }
 }
 keys[k]=true;
});

window.addEventListener("keyup",e=>{keys[e.key.toLowerCase()]=false});
window.addEventListener("blur",()=>keys={});

===================================================== */
async function initOnline(){
 const status=document.getElementById("status");
 try{
  const room=JSON.parse(sessionStorage.getItem("mein-zimmer-active-room")||"null");
  if(!room||!window.GameOnline){
   status.textContent="Offline – Einzelspieler";
   return;
  }
  onlineRoom=room;
  if(typeof GameOnline.login==="function")await GameOnline.login("Spieler");
  const client=typeof GameOnline.getClient==="function"?GameOnline.getClient():null;
  if(client&&typeof GameOnline.watchPlayers==="function"){
   GameOnline.watchPlayers(room.id||room.room_id,players=>{
    otherPlayers=players||{};
   });
  }
  onlineReady=true;
  status.textContent="Online – Raum aktiv";
 }catch(e){
  console.warn("Multiplayer nicht verfügbar:",e);
  status.textContent="Offline – Einzelspieler";
 }
}

let networkTimer=0;
async function sendOnline(dt){
 if(!onlineReady||!onlineRoom||!window.GameOnline)return;
 networkTimer+=dt;
 if(networkTimer<.15)return;
 networkTimer=0;
 try{
  if(typeof GameOnline.updatePosition==="function"){
   await GameOnline.updatePosition(
    onlineRoom.id||onlineRoom.room_id,
    "zimmer",
    player.x,
    player.y
   );
  }
 }catch(e){console.warn("Position konnte nicht gesendet werden:",e)}
}

/* =====================================================
   SPIELSCHLEIFE
===================================================== */
function loop(now){
 const dt=Math.min((now-last)/1000||0,.033);
 last=now;
 time+=dt;
 update(dt);
 draw();
 sendOnline(dt);
 requestAnimationFrame(loop);
}

initOnline();
requestAnimationFrame(loop);

window.addEventListener("beforeunload",()=>{
 save.playerX=player.x;
 writeSave();
});
</script>
