function rect(x,y,w,h,color) {
  ctx.fillStyle = color;
  ctx.fillRect(Math.round(x),Math.round(y),Math.round(w),Math.round(h));
}
function px(x,y,color,s=2) { rect(x,y,s,s,color); }
function line(x1,y1,x2,y2,color,width=2) {
  ctx.strokeStyle=color;
  ctx.lineWidth=width;
  ctx.beginPath();
  ctx.moveTo(Math.round(x1),Math.round(y1));
  ctx.lineTo(Math.round(x2),Math.round(y2));
  ctx.stroke();
}
function box(x,y,w,h,fill,border=C.outline) {

function noise(x,y,n,color,size=2) {

}

function tone(freq,duration=.12,type="sine",volume=.035) {
  if(!soundOn) return;
  try {
    if(!audio) audio=new (window.AudioContext||window.webkitAudioContext)();
    if(audio.state==="suspended") audio.resume();
    const o=audio.createOscillator(), g=audio.createGain();
    o.type=type;
    o.frequency.setValueAtTime(freq,audio.currentTime);
    g.gain.setValueAtTime(volume,audio.currentTime);
    g.gain.exponentialRampToValueAtTime(.0001,audio.currentTime+duration);
    o.connect(g); g.connect(audio.destination);
    o.start(); o.stop(audio.currentTime+duration);
  } catch(e){}
}
function soundPickup(){
  tone(540,.10,"triangle",.04);

  }
}

function drawBackground() {

  if(current==="garden") drawGarden();
  if(current==="forest") drawForest();
  if(current==="observatory") drawObservatory();

  drawExits();
  for(const o of objects){
    if(o.room===current && !o.hidden) drawObject(o);
  }

  if(current==="house") drawFaucetWater();
}

function drawFaucetWater() {
  if(!faucet.open) return;
  const bucket=objects.find(o=>o.id==="bucket");
  const targetX=bucket.x+bucket.w/2;
  const under=targetX>260&&targetX<316&&bucket.y>180&&bucket.y<300;

  // Animated water stream
  for(let i=0;i<5;i++){
    const yy=172+((clock*.07+i*7)%24);
    px(302+(i%2)*2,yy,"#74c6df",2);
  }
  px(300,171,"#a8e9eb",3);

  if(under){
    const bx=bucket.x+3, by=bucket.y+5;
    const h=Math.max(0,(bucket.water/100)*12);
    rect(bx,by+12-h,bucket.w-6,h,"#58a9cf");
    if(Math.floor(clock/100)%2===0) px(bx+5,by+12-h,"#b0e9ed",3);
  } else {
    const splashY=292;
    px(296,splashY,"#65b6d0",3);
    px(304,splashY-2,"#a4e0e4",2);
    px(310,splashY,"#65b6d0",2);
  }
}

function drawObject(o) {
  const x=Math.round(o.x), y=Math.round(o.y);
  if(o.type==="bucket"){
    // Handle
    ctx.strokeStyle="#8b9894";
    ctx.lineWidth=2;
    ctx.beginPath();
    ctx.arc(x+o.w/2,y+3,9,Math.PI,0);
    ctx.stroke();

    rect(x+2,y+5,o.w-4,o.h-5,"#9caaa3");
    rect(x+4,y+7,o.w-8,o.h-8,"#b8c5b9");
    rect(x+2,y+5,o.w-4,3,"#d4d8c5");
    rect(x+4,y+10,2,o.h-12,"#d7dfce");
    rect(x+o.w-5,y+9,2,o.h-11,"#7c928e");
    rect(x+2,y+o.h-3,o.w-4,3,"#778883");
    if(o.water>0){
      const h=Math.max(1,(o.water/100)*11);
      rect(x+5,y+o.h-5-h,o.w-10,h,"#62b8d5");
      rect(x+6,y+o.h-5-h,o.w-12,2,"#b0e7e7");
    }
    if(o.water>=100) px(x+o.w/2,y-8,"#e7d49c",3);
  }

  if(o.type==="crate"){
    box(x,y,o.w,o.h,"#a9764f");
    rect(x+4,y+5,o.w-8,3,"#c49364");
    rect(x+4,y+14,o.w-8,3,"#c49364");
    line(x+3,y+3,x+o.w-3,y+o.h-3,"#79533f",2);
    line(x+o.w-3,y+3,x+3,y+o.h-3,"#79533f",2);
  }

  if(o.type==="plant"||o.type==="pot"){
    rect(x+4,y+12,o.w-8,o.h-12,"#a76e59");
    rect(x+2,y+10,o.w-4,5,"#c28a6b");
    rect(x+5,y+14,o.w-10,2,"#7c5549");
    rect(x+o.w/2-1,y-1,3,14,"#557c55");
    rect(x+2,y+3,9,5,"#72986a");
    rect(x+o.w-11,y+1,9,5,"#88a978");
    px(x+o.w/2-4,y-3,"#9bb984",4);
  }

  if(o.type==="chair"){
    rect(x+3,y+1,o.w-6,5,"#b78559");
    rect(x+4,y+6,4,13,"#926344");
    rect(x+o.w-8,y+6,4,13,"#926344");
    rect(x+1,y+17,o.w-2,5,"#b78559");
    rect(x+4,y+22,4,9,"#79513d");
    rect(x+o.w-8,y+22,4,9,"#79513d");
    rect(x+3,y+2,o.w-6,2,"#d2a273");
  }

  if(o.type==="can"){
    box(x+3,y+5,o.w-6,o.h-5,"#9daaa4");
    rect(x+5,y+7,o.w-10,o.h-9,"#b9c8bd");
    rect(x+o.w-3,y+8,7,3,"#879994");
    rect(x+o.w+2,y+5,3,8,"#a7b7ae");
    rect(x+5,y+3,12,3,"#cbd5c8");
    rect(x+8,y+8,2,8,"#dce2d3");
  }

  if(o.type==="log"){
    rect(x,y+3,o.w,o.h-3,"#805b45");
    rect(x+3,y,o.w-6,5,"#b38b66");
    rect(x+6,y+1,o.w-12,3,"#d0a77b");
    px(x+12,y+2,"#8b624b",3);
    rect(x+7,y+8,o.w-14,2,"#694b3b");
  }

  if(dragging===o){
    rect(x-3,y-4,o.w+6,1,"#f5e8cc");
    rect(x-3,y+o.h+3,o.w+6,1,"#f5e8cc");
  }
}

function drawPlayer() {
  const x=Math.round(player.x), y=Math.round(player.y);
  const ground=300;
  const height=Math.max(0,ground-y-24);
  const shadowScale=Math.max(.25,1-height/120);
  ctx.globalAlpha=.20*shadowScale;
  rect(x-12*shadowScale,ground-2,24*shadowScale,3,"#252c32");
  ctx.globalAlpha=1;

  ctx.save();
  ctx.translate(x,y);
  ctx.rotate(player.angle);

  // Head and torso
  rect(-5,-31,10,10,C.outline);
  rect(-4,-30,8,8,C.wood);
  rect(-3,-29,3,3,C.woodLight);
  px(1,-27,C.woodDark,2);
  rect(-2,-20,4,6,C.woodDark);
  rect(-7,-15,14,22,C.outline);
  rect(-5,-14,10,19,C.wood);
  rect(-4,-12,3,14,C.woodLight);

  // Crossbar
  rect(-10,-12,20,5,C.outline);
  rect(-9,-11,18,3,C.wood);

  for(const p of player.parts){
    const x1=p.x, y1=p.y;
    const x2=x1+Math.cos(p.angle)*p.len;
    const y2=y1+Math.sin(p.angle)*p.len;
    line(x1,y1,x2,y2,C.outline,p.width+2);
    line(x1,y1,x2,y2,C.woodDark,p.width);
    line(x1,y1-1,x2,y2-1,C.woodLight,Math.max(1,p.width-2));
    rect(x1-2,y1-2,4,4,C.woodDark);
    rect(x1-1,y1-1,2,2,C.woodLight);

    if(p.name.endsWith("Foot")){
      line(x2,y2,x2+6,y2+1,C.outline,5);
      line(x2,y2,x2+6,y2+1,C.wood,3);
    }
  }
  ctx.restore();
}

function point(e) {
  const r=canvas.getBoundingClientRect();
  return {
    x:(e.clientX-r.left)*W/r.width,
    y:(e.clientY-r.top)*H/r.height
  };
}

function hitObject(p) {
  const list=objects.filter(o=>o.room===current);
  for(let i=list.length-1;i>=0;i--){
    const o=list[i];
    if(p.x>=o.x-5&&p.x<=o.x+o.w+5&&
       p.y>=o.y-10&&p.y<=o.y+o.h+5) return o;
  }
  return null;
}

function hitPlayer(p) {
  return Math.hypot(p.x-player.x,p.y-(player.y-12))<23;
}

function nearFaucet(p) {
  return current==="house"&&p.x>255&&p.x<320&&p.y>135&&p.y<190;
}

function startDrag(e) {
  e.preventDefault();
  pointer=point(e);
  pointerDown=true;
  canvas.setPointerCapture(e.pointerId);

  if(!audio&&soundOn){
    try{audio=new(window.AudioContext||window.webkitAudioContext)();audio.resume();}catch(_){}
  }

  // The faucet handle is a separate interactive object.
  if(nearFaucet(pointer)){
    faucet.open=!faucet.open;
    tone(faucet.open?540:340,.12,"triangle",.035);
    discoveries.add("faucet");
    return;
  }

  const obj=hitObject(pointer);
  if(obj){
    dragging=obj;
    obj.grabDX=pointer.x-obj.x;
    obj.grabDY=pointer.y-obj.y;
    obj.prevX=obj.x;
    obj.prevY=obj.y;
    soundPickup();
    return;
  }

  if(hitPlayer(pointer)){
    dragging=player;
    player.grabDX=pointer.x-player.x;
    player.grabDY=pointer.y-player.y;
    player.vx=0;player.vy=0;
  }
}

function moveDrag(e) {
  pointer=point(e);
  if(!pointerDown||!dragging) return;

  const d=dragging;
  const nx=pointer.x-d.grabDX;
  const ny=pointer.y-d.grabDY;

  if(d===player){
    player.vx=(nx-player.x)*.65;
    player.vy=(ny-player.y)*.65;
    player.x=Math.max(15,Math.min(W-15,nx));
    player.y=Math.max(35,Math.min(320,ny));
    return;
  }

  d.prevX=d.x; d.prevY=d.y;
  d.x=Math.max(0,Math.min(W-d.w,nx));
  d.y=Math.max(205,Math.min(315,ny));

  if(d.type==="bucket"&&d.water>0) {
    d.y=Math.max(185,Math.min(315,d.y));
  }
}

function endDrag() {
  if(dragging&&dragging!==player){
    const d=dragging;
    d.vx=(d.x-(d.prevX??d.x))*.35;
    d.vy=(d.y-(d.prevY??d.y))*.35;
    soundDrop();
  }
  pointerDown=false;
  dragging=null;
}

canvas.addEventListener("pointerdown",startDrag);
canvas.addEventListener("pointermove",moveDrag);
canvas.addEventListener("pointerup",endDrag);
canvas.addEventListener("pointercancel",endDrag);
canvas.addEventListener("lostpointercapture",endDrag);

function checkExits() {
  if(transition||dragging) return;
  for(const e of exits[current]||[]){
    if(player.x>e.x&&player.x<e.x+e.w&&
       player.y>e.y&&player.y<e.y+e.h){
      changeRoom(e.to,e.spawn);
      return;
    }
  }
}

function changeRoom(next,spawn) {
  if(transition) return;
  transition=true;
  soundDoor();
  fade.classList.add("active");

  setTimeout(()=>{
    current=next;
    visited.add(next);
    player.x=spawn;
    player.y=270;
    player.vx=0;player.vy=0;
    player.angle=0;
    faucet.open=false;
    locationUI.textContent=rooms[current].icon;
    setTimeout(()=>{
      fade.classList.remove("active");
      transition=false;
    },100);
  },180);
}

function updateWater(dt) {
  if(current!=="house"||!faucet.open) return;
  const bucket=objects.find(o=>o.id==="bucket");
  const center=bucket.x+bucket.w/2;
  const under=center>270&&center<320&&
    bucket.y>190&&bucket.y<300;

  if(under&&bucket.water<100){
    bucket.water=Math.min(100,bucket.water+dt*.008);
    if(Math.floor(clock/550)!==Math.floor((clock-dt)/550)) soundWater();
  }
}

function updatePhysics(dt) {
  const step=Math.min(dt/16.67,2.2);

  if(dragging!==player){
    player.vy+=.18*step;
    player.vy=Math.min(player.vy,5.5);
    player.x+=player.vx*step;
    player.y+=player.vy*step;
    player.vx*=Math.pow(.97,step);
    player.angle*=Math.pow(.98,step);

    if(player.y>=276){
      player.y=276;
      player.vy*= -.12;
      if(Math.abs(player.vy)<.5)player.vy=0;
      player.grounded=true;
    } else player.grounded=false;

    player.x=Math.max(14,Math.min(W-14,player.x));
  }

  for(const o of objects){
    if(o.room!==current||dragging===o)continue;

    if(o.vx){
      o.x+=o.vx*step;
      o.vx*=Math.pow(.88,step);
      if(Math.abs(o.vx)<.1)o.vx=0;
    }
    if(o.vy){
      o.y+=o.vy*step;
      o.vy+=.12*step;
      if(o.y>=300-o.h){
        o.y=300-o.h;
        o.vy=0;
      }
    }
  }

  // Basic solid-object collision for the player and movable objects.
  const playerBox={x:player.x-8,y:player.y-27,w:16,h:28};
  for(const o of objects){
    if(o.room!==current||dragging===o)continue;
    if(playerBox.x<o.x+o.w&&playerBox.x+playerBox.w>o.x&&
       playerBox.y<o.y+o.h&&playerBox.y+playerBox.h>o.y){
      if(player.vx>0)player.x=o.x-playerBox.w/2;
      else if(player.vx<0)player.x=o.x+o.w+playerBox.w/2;
      player.vx*=-.12;
    }
  }
}

function updateHUD() {
  locationUI.textContent=rooms[current].icon;
  itemsUI.innerHTML="";
  if(collected.size){
    for(const id of collected){
      const el=document.createElement("div");
      el.className="item-icon";
      el.textContent=id==="key"?"⚿":id==="star"?"✦":"◆";
      itemsUI.appendChild(el);
    }
  }
}

function loop(now=0) {
  const dt=last?Math.min(now-last,40):16.67;
  last=now;clock+=dt;

  updatePhysics(dt);
  updateWater(dt);
  checkExits();

  ctx.imageSmoothingEnabled=false;
  drawBackground();
  drawPlayer();

  requestAnimationFrame(loop);
}

window.addEventListener("keydown",e=>{
  if(["ArrowLeft","ArrowRight","ArrowUp","ArrowDown","Space"].includes(e.code))e.preventDefault();
  if(e.code==="ArrowLeft")player.vx-=1.1;
  if(e.code==="ArrowRight")player.vx+=1.1;
  if(e.code==="ArrowUp"||e.code==="Space")player.vy-=2.3;
  if(e.code==="KeyE"){
    if(current==="house")changeRoom("garden",36);
    else if(current==="garden")changeRoom("forest",36);
    else if(current==="forest")changeRoom("observatory",36);
    else changeRoom("house",580);
  }
});

document.querySelector("#sound").addEventListener("click",e=>{
  e.stopPropagation();
  soundOn=!soundOn;
  document.querySelector("#sound").classList.toggle("muted",!soundOn);
  if(soundOn)tone(720,.1,"sine",.03);
});

document.querySelector("#full").addEventListener("click",async e=>{
  e.stopPropagation();
  try{
    if(!document.fullscreenElement)await game.requestFullscreen();
    else await document.exitFullscreen();
  }catch(_){}
});

document.addEventListener("fullscreenchange",()=>{
  game.classList.toggle("is-fullscreen",!!document.fullscreenElement);
});

locationUI.textContent=rooms[current].icon;
updateHUD();
requestAnimationFrame(loop);
})();
</script>
</body>
</html>
