<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>MEIN ZIMMER</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#17191b;font-family:Arial,sans-serif}
canvas{display:block;width:100%;height:100%}
#hud{
 position:fixed;top:14px;left:14px;z-index:5;
 padding:13px 17px;background:#17191be8;color:#f4eadb;
 border:1px solid #ffffff25;border-radius:10px;
 font-size:12px;line-height:1.8;pointer-events:none;
 box-shadow:0 5px 20px #0004
}
#hud b{letter-spacing:2px}
#hint{
 position:fixed;bottom:14px;left:50%;transform:translateX(-50%);
 z-index:5;padding:10px 16px;background:#17191be8;
 color:#fff;border:1px solid #ffffff20;border-radius:8px;
 font-size:11px;white-space:nowrap;pointer-events:none
}
#prompt{
 position:fixed;bottom:62px;left:50%;transform:translateX(-50%);
 z-index:6;padding:11px 17px;background:#252a30ed;
 color:white;border:1px solid #ffffff30;border-radius:8px;
 font-size:13px;display:none;white-space:nowrap
}
#fade{
 position:fixed;inset:0;background:#17191b;opacity:0;
 pointer-events:none;z-index:10;transition:opacity .25s
}
#fade.active{opacity:1;pointer-events:all}
#notice{
 position:fixed;right:16px;top:16px;z-index:7;
 color:white;background:#252a30e8;border:1px solid #ffffff25;
 padding:9px 13px;border-radius:7px;font-size:11px;
 opacity:0;transition:opacity .2s;pointer-events:none
}
#notice.show{opacity:1}
@media(max-width:650px){
 #hint{font-size:9px;max-width:95%;white-space:normal;text-align:center}
 #hud{font-size:10px}
}
</style>
</head>
<body>

<canvas id="world"></canvas>

<div id="hud">
 <b>▦ MEIN ZIMMER</b><br>
 <span id="status">Willkommen zu Hause</span><br>
 <span id="held">Hände frei</span><br>
 <span>¢ <b id="money">120</b></span>
</div>

<div id="prompt"></div>
<div id="notice"></div>
<div id="hint">
 A / D · Laufen &nbsp; | &nbsp; W / LEERTASTE · Springen
 &nbsp; | &nbsp; E · Interagieren &nbsp; | &nbsp; Q · Ablegen
</div>
<div id="fade"></div>

<script src="supabase.js"></script>
<script>
"use strict";

/* =========================================================
   GRUNDLAGEN
========================================================= */

const canvas=document.getElementById("world");
const ctx=canvas.getContext("2d");

const W=960;
const H=540;
const FLOOR=440;
const WORLD=3100;
const SAVE_KEY="mein-zimmer-save-v1";

let scaleX=1;
let scaleY=1;
let cameraX=0;
let time=0;
let last=performance.now();
let noticeTimer=0;
let bucketFullNotified=false;

const $=id=>document.getElementById(id);

function resize(){
 const d=Math.min(window.devicePixelRatio||1,2);
 canvas.width=Math.round(innerWidth*d);
 canvas.height=Math.round(innerHeight*d);
 scaleX=canvas.width/W;
 scaleY=canvas.height/H;
}
window.addEventListener("resize",resize);
resize();

function clamp(v,a,b){return Math.max(a,Math.min(b,v))}
function lerp(a,b,t){return a+(b-a)*t}
function hash(n){
 const v=Math.sin(n*127.1+311.7)*43758.5453;
 return v-Math.floor(v);
}

function rect(x,y,w,h,color){
 ctx.fillStyle=color;
 ctx.fillRect(x,y,w,h);
}
function line(x,y,x2,y2,color,width=1){
 ctx.beginPath();
 ctx.moveTo(x,y);
 ctx.lineTo(x2,y2);
 ctx.strokeStyle=color;
 ctx.lineWidth=width;
 ctx.stroke();
}
function ellipse(x,y,rx,ry,color){
 ctx.beginPath();
 ctx.ellipse(x,y,rx,ry,0,0,Math.PI*2);
 ctx.fillStyle=color;
 ctx.fill();
}
function rounded(x,y,w,h,r,color,stroke){
 ctx.beginPath();
 ctx.roundRect(x,y,w,h,r);
 ctx.fillStyle=color;
 ctx.fill();
 if(stroke){
  ctx.strokeStyle=stroke;
  ctx.lineWidth=1;
  ctx.stroke();
 }
}

/* =========================================================
   SPEICHERN
========================================================= */

const defaults={
 money:120,
 unlocked:[],
 equipped:{head:null,face:null,clothes:null,back:null,pants:null},
 inventory:[],
 placed:[],
 orders:[],
 received:[],
 faucetOn:false,
 bucketWater:0,
 playerX:180
};

function loadSave(){
 try{
  const s=JSON.parse(localStorage.getItem(SAVE_KEY)||"null");
  if(!s)return structuredClone(defaults);
  return {
   ...structuredClone(defaults),
   ...s,
   equipped:{
    ...defaults.equipped,
    ...(s.equipped||{})
   },
   unlocked:Array.isArray(s.unlocked)?s.unlocked:[],
   inventory:Array.isArray(s.inventory)?s.inventory:[],
   orders:Array.isArray(s.orders)?s.orders:[],
   received:Array.isArray(s.received)?s.received:[]
  };
 }catch{
  return structuredClone(defaults);
 }
}

let save=loadSave();

/* Tragbare Gegenstände im Zimmer. Gespeicherte Positionen bleiben erhalten. */
const initialWorldItems=[
 {id:"bucket",name:"Eimer",kind:"bucket",x:2160,y:FLOOR-38,w:36,h:38},
 {id:"book",name:"Buch",kind:"book",x:1060,y:FLOOR-20,w:25,h:20},
 {id:"mug",name:"Tasse",kind:"mug",x:1375,y:FLOOR-24,w:18,h:24},
 {id:"wateringcan",name:"Gießkanne",kind:"wateringcan",x:1900,y:FLOOR-25,w:34,h:25},
 {id:"box",name:"Karton",kind:"box",x:2515,y:FLOOR-34,w:38,h:34},
 {id:"keys",name:"Schlüssel",kind:"keys",x:1250,y:FLOOR-96,w:22,h:10}
];
if(!Array.isArray(save.worldItems)){
 save.worldItems=initialWorldItems.map(item=>({...item}));
}else{
 for(const item of initialWorldItems){
  if(!save.worldItems.some(existing=>existing.id===item.id))save.worldItems.push({...item});
 }
}
if(!Number.isFinite(save.bucketWater))save.bucketWater=0;
if(typeof save.faucetOn!=="boolean")save.faucetOn=false;

function persist(){
 try{
  localStorage.setItem(SAVE_KEY,JSON.stringify(save));
  $("money").textContent=save.money;
 }catch(e){
  console.warn("Speichern fehlgeschlagen",e);
 }
}
persist();

window.addEventListener("storage",e=>{
 if(e.key!==SAVE_KEY||!e.newValue)return;
 try{
  const s=JSON.parse(e.newValue);
  save={...save,...s,equipped:{...save.equipped,...(s.equipped||{})}};
  $("money").textContent=save.money;
 }catch{}
});

/* =========================================================
   SPIELER UND STEUERUNG
========================================================= */

const keys={};

const player={
 x:save.playerX||180,
 y:FLOOR-75,
 vx:0,
 vy:0,
 width:78,
 height:75,
 grounded:true,
 facing:1,
 walk:0,
 held:null,
 landing:0,
 action:"normal",
 jumpTime:0
};

window.addEventListener("keydown",e=>{
 const k=e.key.toLowerCase();
 keys[k]=true;

 if([" ","arrowup","arrowleft","arrowright"].includes(k)){
  e.preventDefault();
 }

 if(e.repeat)return;

 if(k===" "||k==="w"||k==="arrowup")jump();
 if(k==="e")interact();
 if(k==="q")dropItem();
 if(k==="escape")closePrompt();
});

window.addEventListener("keyup",e=>{
 keys[e.key.toLowerCase()]=false;
});

function jump(){
 if(!player.grounded)return;
 player.vy=-570;
 player.grounded=false;
 player.jumpTime=0;
 playTone(260,.07,"triangle");
}

function dropItem(){
 if(!player.held)return;
 const item=save.worldItems.find(i=>i.id===player.held);
 if(item){
  item.x=clamp(player.x+(player.facing>0?player.width+8:-item.w-8),0,WORLD-item.w);
  const center=item.x+item.w/2;
  /* Auf niedrigen Ablagen und Tischplatten abstellen, sonst auf dem Boden. */
  const surfaces=[
   {x:645,w:92,y:FLOOR-57},
   {x:1160,w:190,y:FLOOR-90},
   {x:1770,w:92,y:FLOOR-57},
   {x:2380,w:125,y:FLOOR-155}
  ];
  const surface=surfaces.find(s=>center>=s.x&&center<=s.x+s.w);
  item.y=surface?surface.y-item.h:FLOOR-item.h;
 }
 const name=item?.name||"Gegenstand";
 player.held=null;
 $("held").textContent="Hände frei";
 persist();
 showNotice(name+" abgestellt.");
}

/* =========================================================
   AUDIO
========================================================= */

let audio=null;

function playTone(f=440,d=.08,type="sine"){
 try{
  audio=audio||new(window.AudioContext||window.webkitAudioContext)();
  if(audio.state==="suspended")audio.resume();

  const o=audio.createOscillator();
  const g=audio.createGain();
  o.type=type;
  o.frequency.value=f;
  o.connect(g);
  g.connect(audio.destination);

  const now=audio.currentTime;
  g.gain.setValueAtTime(.035,now);
  g.gain.exponentialRampToValueAtTime(.001,now+d);
  o.start(now);
  o.stop(now+d);
 }catch{}
}

function showNotice(text){
 $("notice").textContent=text;
 $("notice").classList.add("show");
 clearTimeout(noticeTimer);
 noticeTimer=setTimeout(()=>$("notice").classList.remove("show"),2200);
}

/* =========================================================
   ORIGINALER HOLZSTUHL
========================================================= */

function woodGradient(x,y,w,h){
 const g=ctx.createLinearGradient(x,y,x+w,y+h);
 g.addColorStop(0,"#d4a16b");
 g.addColorStop(.45,"#b98552");
 g.addColorStop(1,"#75482b");
 return g;
}

function woodPart(x,y,w,h,r=1){
 ctx.save();

 ctx.fillStyle="#35271d33";
 ctx.fillRect(x+2,y+2,w,h);

 ctx.beginPath();
 ctx.roundRect(x,y,w,h,r);
 ctx.fillStyle=woodGradient(x,y,w,h);
 ctx.fill();
 ctx.strokeStyle="#604027";
 ctx.lineWidth=1.1;
 ctx.stroke();

 ctx.save();
 ctx.beginPath();
 ctx.roundRect(x+1,y+1,w-2,h-2,r);
 ctx.clip();

 for(let i=0;i<Math.max(3,Math.floor(h/3));i++){
  const yy=y+hash(i+x*.7)*h;
  ctx.beginPath();
  ctx.moveTo(x+2,yy);
  ctx.bezierCurveTo(
   x+w*.3,yy-1,
   x+w*.7,yy+1,
   x+w-2,yy
  );
  ctx.strokeStyle=i%2?"#513820":"#f5d7ae";
  ctx.globalAlpha=i%2?.12:.18;
  ctx.lineWidth=.7;
  ctx.stroke();
 }

 ctx.restore();
 ctx.globalAlpha=1;
 ctx.strokeStyle="#f1c18b99";
 ctx.lineWidth=.8;
 ctx.beginPath();
 ctx.moveTo(x+2,y+1);
 ctx.lineTo(x+w-2,y+1);
 ctx.stroke();
 ctx.restore();
}

function drawOriginalLeg(x,y,angle){
 ctx.save();
 ctx.translate(x,y);
 ctx.rotate(angle);

 ctx.beginPath();
 ctx.moveTo(-3,0);
 ctx.lineTo(-2.5,39);
 ctx.quadraticCurveTo(0,42,2.5,39);
 ctx.lineTo(3,0);
 ctx.closePath();

 ctx.fillStyle=woodGradient(-3,0,7,42);
 ctx.fill();
 ctx.strokeStyle="#634127";
 ctx.lineWidth=1;
 ctx.stroke();

 ctx.strokeStyle="#f1c28b88";
 ctx.lineWidth=.8;
 ctx.beginPath();
 ctx.moveTo(-1.5,3);
 ctx.lineTo(-1,36);
 ctx.stroke();

 ctx.restore();
}

/* Gelenkige Laufanimation, Holzform bleibt erhalten. */
function drawAnimatedLeg(x,y,phase){
 const swing=Math.sin(phase)*.25;
 const knee=Math.sin(phase+1)*.12;

 ctx.save();
 ctx.translate(x,y);
 ctx.rotate(swing);

 ctx.beginPath();
 ctx.moveTo(-3,0);
 ctx.lineTo(-2.5,20);
 ctx.quadraticCurveTo(0,22,2.5,20);
 ctx.lineTo(3,0);
 ctx.closePath();
 ctx.fillStyle=woodGradient(-3,0,7,22);
 ctx.fill();
 ctx.strokeStyle="#634127";
 ctx.lineWidth=1;
 ctx.stroke();

 ctx.translate(0,20);
 ctx.rotate(knee);
 ctx.beginPath();
 ctx.moveTo(-2.5,0);
 ctx.lineTo(-2,19);
 ctx.quadraticCurveTo(0,21,2,19);
 ctx.lineTo(2.5,0);
 ctx.closePath();
 ctx.fillStyle=woodGradient(-3,0,6,21);
 ctx.fill();
 ctx.strokeStyle="#634127";
 ctx.stroke();

 ctx.restore();
}

/* Der ursprüngliche Stuhl bleibt in Form und Proportionen unverändert. */
function drawChair(time){
 const back=save.equipped.back;
 ctx.save();
 ctx.globalAlpha=.2;
 ctx.fillStyle="#17130f";
 ctx.beginPath();
 ctx.ellipse(60,119,45,4,0,0,Math.PI*2);
 ctx.fill();
 ctx.restore();
 if(back)drawBackItem();

 /* KORREKTUR: drawOriginalLeg statt der nicht vorhandenen drawLeg-Funktion */
 drawOriginalLeg(29,75,0);

 woodPart(23,5,13,70,2);
 woodPart(20,67,78,12,2);

 /* KORREKTUR: drawOriginalLeg statt der nicht vorhandenen drawLeg-Funktion */
 drawOriginalLeg(88,77,0);

 drawPants();
 drawClothes();
 line(25,8,25,70,"#f1c18b99",1);
 line(23,69,95,69,"#f3d0a0aa",1);
 drawHeadItem();
 drawBalloons(time);
 ctx.fillStyle="#513a29";
 ctx.globalAlpha=.25;
 ctx.fillRect(25,116,69,1);
 ctx.globalAlpha=1;
}

/* =========================================================
   KLEIDUNG UND ACCESSOIRES
========================================================= */

function drawBackItem(){
 const item=save.equipped.back;
 if(!item)return;
 ctx.save();
 if(item==="cape"){
  ctx.fillStyle="#6b2530";
  ctx.beginPath();
  ctx.moveTo(31,19);
  ctx.lineTo(18,92);
  ctx.lineTo(49,83);
  ctx.lineTo(48,22);
  ctx.fill();
 }else if(item==="wings"){
  ctx.fillStyle="#e9e0c8";
  ctx.beginPath();
  ctx.ellipse(13,45,12,25,-.35,0,Math.PI*2);
  ctx.ellipse(57,45,12,25,.35,0,Math.PI*2);
  ctx.fill();
 }
 ctx.restore();
}

function drawPants(){
 const item=save.equipped.pants;
 if(!item)return;
 ctx.save();
 if(item==="jeans"){
  ctx.fillStyle="#365b82";
  ctx.fillRect(22,77,76,9);
 }else if(item==="shorts"){
  ctx.fillStyle="#9c573c";
  ctx.fillRect(22,77,76,6);
 }
 ctx.restore();
}

function drawClothes(){
 const item=save.equipped.clothes;
 if(!item)return;
 ctx.save();
 if(item==="shirt"){
  rounded(18,64,82,14,2,"#547d91","#284555");
 }else if(item==="hoodie"){
  rounded(18,63,82,15,3,"#7b647e","#493c4b");
  line(58,65,58,77,"#d9c6dc",1);
 }else if(item==="jacket"){
  rounded(18,63,82,15,2,"#3c454b","#20282c");
  line(58,64,58,77,"#d4b783",1);
 }
 ctx.restore();
}

function drawHeadItem(){
 const item=save.equipped.head;
 if(!item)return;
 ctx.save();
 if(item==="hat"){
  rounded(30,-5,55,10,3,"#5b3e2c","#30251e");
  rounded(40,-19,35,18,4,"#78563b","#30251e");
 }else if(item==="crown"){
  ctx.fillStyle="#d6b54c";
  ctx.beginPath();
  ctx.moveTo(33,2);ctx.lineTo(35,-14);ctx.lineTo(48,-5);
  ctx.lineTo(58,-17);ctx.lineTo(68,-5);ctx.lineTo(82,-14);
  ctx.lineTo(84,2);ctx.closePath();ctx.fill();
 }else if(item==="halo"){
  ctx.strokeStyle="#e9cf6e";ctx.lineWidth=3;
  ctx.beginPath();ctx.ellipse(58,-9,22,6,0,0,Math.PI*2);ctx.stroke();
 }
 ctx.restore();
}

function drawBalloons(time){
 const count=save.equipped.face==="balloons"?2:0;
 for(let i=0;i<count;i++){
  const bx=100+i*12;
  const by=35+Math.sin(time*2+i)*4;
  line(bx,by+7,bx-6,80,"#6c6c6c",.8);
  ellipse(bx,by,6,8,i?"#a85c65":"#6b91b2");
 }
}

/* =========================================================
   HINTERGRUND UND RAUM
========================================================= */

function drawBackground(){
 const wall=ctx.createLinearGradient(0,0,0,FLOOR);
 wall.addColorStop(0,"#b7aaa0");
 wall.addColorStop(.72,"#d1c3b4");
 wall.addColorStop(1,"#a99988");
 rect(0,0,W,H,wall);

 /* Dezente Wandstruktur */
 for(let i=0;i<90;i++){
  const x=hash(i*4)*W;
  const y=hash(i*7)*FLOOR;
  rect(x,y,hash(i+20)*30+4,1,"#ffffff0b");
 }

 /* Sockelleiste */
 rect(0,FLOOR-15,W,15,"#765b48");
 rect(0,FLOOR-15,W,3,"#b69b7d");
 rect(0,FLOOR-4,W,4,"#4c3b30");

 /* Holzboden */
 const floor=ctx.createLinearGradient(0,FLOOR,0,H);
 floor.addColorStop(0,"#8c684d");
 floor.addColorStop(1,"#4f3a2d");
 rect(0,FLOOR,W,H-FLOOR,floor);

 for(let y=FLOOR+9;y<H;y+=18){
  line(0,y,W,y,"#d2a77b22",1);
 }
 for(let x=-30;x<W+80;x+=92){
  line(x,FLOOR,x,H,"#2d211b55",1);
  line(x+2,FLOOR,x+2,H,"#d9b38a18",1);
 }
 for(let i=0;i<75;i++){
  const x=hash(i+700)*W;
  const y=FLOOR+hash(i+900)*(H-FLOOR);
  line(x,y,x+hash(i+1000)*28,y,"#e3bd941c",1);
 }

 /* Licht von links */
 const glow=ctx.createRadialGradient(170,90,10,170,90,430);
 glow.addColorStop(0,"#fff0c52c");
 glow.addColorStop(1,"#fff0c500");
 rect(0,0,W,FLOOR,glow);
}

function drawWallDecor(){
 /* Fenster */
 ctx.save();
 ctx.shadowColor="#0005";ctx.shadowBlur=13;ctx.shadowOffsetY=4;
 rounded(75,70,210,190,3,"#594638","#3c3028");
 ctx.restore();
 rounded(83,78,194,174,2,"#8eb0b5","#eee0c9");
 const sky=ctx.createLinearGradient(0,78,0,252);
 sky.addColorStop(0,"#9ec4d0");sky.addColorStop(1,"#e2d6bd");
 rect(87,82,186,166,sky);

 /* Landschaft vor dem Fenster */
 ellipse(230,125,23,23,"#f2dba1");
 rect(87,188,186,60,"#82977c");
 for(let i=0;i<9;i++){
  const x=90+i*22;
  ellipse(x,190+hash(i)*18,20,17,"#617c67");
 }
 rect(178,82,5,166,"#e7d8c1");
 rect(87,162,186,5,"#e7d8c1");

 /* Vorhänge */
 ctx.fillStyle="#806b68";
 ctx.beginPath();ctx.moveTo(65,62);ctx.quadraticCurveTo(90,155,75,270);
 ctx.lineTo(103,270);ctx.quadraticCurveTo(110,155,91,62);ctx.fill();
 ctx.beginPath();ctx.moveTo(272,62);ctx.quadraticCurveTo(250,155,268,270);
 ctx.lineTo(292,270);ctx.quadraticCurveTo(291,155,290,62);ctx.fill();
 line(64,65,294,65,"#5a493f",4);

 /* Bilderrahmen */
 rounded(360,83,95,75,2,"#5a4130","#382a21");
 rect(367,90,81,61,"#d6c6aa");
 rect(371,94,73,53,"#b5c2ad");
 line(371,135,443,103,"#657b6c",4);
 ellipse(427,105,8,8,"#e8d69d");
 line(367,150,448,150,"#8b735a",2);

 rounded(510,93,70,60,2,"#624832","#3b2c22");
 rect(516,99,58,48,"#e5d7bd");
 ellipse(545,122,18,18,"#a9b5a0");
 line(535,136,556,106,"#667c66",2);

 /* Wanduhr */
 ellipse(825,104,29,29,"#634a37");
 ellipse(825,104,24,24,"#eee2c9");
 ellipse(825,104,2,2,"#3d3026");
 line(825,104,825,88,"#44362b",2);
 line(825,104,837,109,"#44362b",2);
 for(let i=0;i<12;i++){
  const a=i*Math.PI/6;
  ellipse(825+Math.sin(a)*19,104-Math.cos(a)*19,1.2,1.2,"#5d4938");
 }
}

function drawRug(x,y,w,h){
 ctx.save();
 ctx.shadowColor="#0004";ctx.shadowBlur=8;ctx.shadowOffsetY=3;
 rounded(x,y,w,h,5,"#765b50","#49372f");
 ctx.restore();
 rounded(x+7,y+4,w-14,h-8,3,"#9c7868","#c2a18b");
 for(let i=0;i<Math.floor(w/17);i++){
  line(x+12+i*17,y+6,x+12+i*17,y+h-6,"#e3c7a422",1);
 }
 line(x+14,y+h/2,x+w-14,y+h/2,"#e4c9ac77",1);
}

/* =========================================================
   MÖBEL
========================================================= */

function drawSofa(x){
 ctx.save();
 ctx.translate(x,0);
 ctx.shadowColor="#0005";ctx.shadowBlur=9;ctx.shadowOffsetY=4;

 rounded(0,FLOOR-90,220,82,10,"#66504a","#40332f");
 ctx.restore();

 rounded(x+8,FLOOR-116,204,53,12,"#8b7068","#59453f");
 rounded(x+14,FLOOR-132,91,59,12,"#9b7e75","#5e4943");
 rounded(x+116,FLOOR-132,91,59,12,"#92766e","#5e4943");
 rounded(x+7,FLOOR-82,207,20,5,"#5b4640","#3c302b");

 /* Nähte und Polsterdetails */
 line(x+108,FLOOR-126,x+108,FLOOR-80,"#d5b4a366",1);
 line(x+20,FLOOR-65,x+200,FLOOR-65,"#d4b4a244",1);
 for(let i=0;i<4;i++){
  line(x+20+i*55,FLOOR-115,x+24+i*55,FLOOR-94,"#e1c5b344",1);
 }
}

function drawSideTable(x){
 ctx.save();
 ctx.shadowColor="#0005";ctx.shadowBlur=5;ctx.shadowOffsetY=3;
 rounded(x,FLOOR-60,92,9,3,"#a77b52","#60452f");
 ctx.restore();
 rect(x+8,FLOOR-51,7,49,"#64472f");
 rect(x+77,FLOOR-51,7,49,"#64472f");
 line(x+8,FLOOR-3,x+84,FLOOR-3,"#bd956c",2);
}

function updateWater(dt){
 if(!save.faucetOn)return;
 const bucket=save.worldItems.find(i=>i.id==="bucket");
 if(!bucket)return;
 const playerNear=Math.abs(player.x+player.width/2-2165)<105;
 const bucketNear=Math.abs(bucket.x+bucket.w/2-2165)<65;
 if((player.held==="bucket"&&playerNear)||(!player.held&&bucketNear)){
  if(save.bucketWater<100){
   save.bucketWater=Math.min(100,save.bucketWater+32*dt);
   if(Math.floor(save.bucketWater)%10<1)persist();
   if(save.bucketWater>=100&&!bucketFullNotified){bucketFullNotified=true;showNotice("Der Eimer ist voll!");}
  }
 }
}

/* =========================================================
   SPIELER UND PHYSIK
========================================================= */

function update(dt){
 const left=keys.a||keys.arrowleft;
 const right=keys.d||keys.arrowright;

 let direction=0;
 if(left)direction--;
 if(right)direction++;

 const acceleration=direction?1500:1900;
 const maxSpeed=235;

 if(direction){
  player.vx+=direction*acceleration*dt;
  player.vx=clamp(player.vx,-maxSpeed,maxSpeed);
  player.facing=direction;
 }else{
  player.vx*=Math.exp(-9*dt);
  if(Math.abs(player.vx)<2)player.vx=0;
 }

 player.x+=player.vx*dt;
 player.x=clamp(player.x,0,WORLD-player.width);

 if(Math.abs(player.vx)>5&&player.grounded){
  player.walk+=dt*10;
 }

 const wasGrounded=player.grounded;
 player.vy+=1450*dt;
 player.y+=player.vy*dt;
 player.grounded=false;

 if(player.y+player.height>=FLOOR){
  player.y=FLOOR-player.height;
  player.vy=0;
  player.grounded=true;

  if(!wasGrounded){
   player.landing=.22;
   playTone(100,.04,"triangle");
  }
 }

 player.landing=Math.max(0,player.landing-dt);
 player.jumpTime+=dt;
 updateWater(dt);

 cameraX=lerp(
  cameraX,
  clamp(player.x+player.width/2-W*.43,0,WORLD-W),
  1-Math.pow(.001,dt)
 );

 save.playerX=player.x;
}

/* =========================================================

========================================================= */

const interactables=[
 {id:"sofa",x:410,w:220,label:"Auf dem Sofa entspannen"},
 {id:"wardrobe",x:690,w:125,label:"Kleiderschrank öffnen"},
 {id:"computer",x:1160,w:190,label:"PC benutzen"},
 {id:"bed",x:1510,w:240,label:"Ins Bett legen"},
 {id:"plant",x:1850,w:65,label:"Pflanze ansehen"},
 {id:"sink",x:2050,w:170,label:"Wasserhahn öffnen / schließen"},
 {id:"city",x:2870,w:110,label:"Tür zur Stadt öffnen"}
];
let nearby=null;

function getNearby(){
 const px=player.x+player.width/2;let best=null,distance=Infinity;
 for(const item of save.worldItems){
  if(item.id===player.held)continue;
  const d=Math.abs(px-(item.x+item.w/2));
  if(d<92&&d<distance){best={id:"item",item,label:item.name+" aufnehmen"};distance=d;}
 }
 for(const obj of interactables){
  const d=Math.abs(px-(obj.x+obj.w/2));
  if(d<100&&d<distance){best=obj;distance=d;}
 }
 return best;
}

function interact(){
 const obj=getNearby();
 if(!obj){
  if(player.held==="bucket"&&Math.abs(player.x+player.width/2-2165)<115){
   save.faucetOn=!save.faucetOn;
   showNotice(save.faucetOn?"Wasserhahn geöffnet – der Eimer füllt sich.":"Wasserhahn geschlossen.");
   persist();return;
  }
  showNotice(player.held?"Du trägst bereits einen Gegenstand.":"Hier gibt es gerade nichts zu tun.");return;
 }
 playTone(540,.07,"triangle");
 if(obj.id==="item"){
  if(player.held){showNotice("Deine Hände sind schon voll.");return;}
  player.held=obj.item.id;showNotice(obj.item.name+" aufgenommen.");persist();return;
 }
 switch(obj.id){
  case "wardrobe":goTo("Schrank.html");break;
  case "city":goTo("Stadt.html");break;
  case "computer":openComputer();break;
  case "sink":
   save.faucetOn=!save.faucetOn;
   showNotice(save.faucetOn?"Wasserhahn geöffnet.":"Wasserhahn geschlossen.");
   persist();break;
  case "sofa":player.vx=0;showNotice("Du entspannst dich kurz auf dem Sofa.");break;
  case "bed":player.vx=0;showNotice("Zeit für eine kleine Pause.");break;
  case "plant":showNotice("Deine Pflanze sieht ziemlich gut aus.");break;
 }
}

/* =========================================================
   MULTIPLAYER – VORHANDENE GAMEONLINE-SCHNITTSTELLE
========================================================= */

let onlineReady=false;
let onlineClient=null;
let onlineRoom=sessionStorage.getItem("mein-zimmer-active-room")||"zimmer";
let remotePlayers={};
let onlineLastSend=0;

async function initOnline(){
 if(!window.GameOnline)return;

 try{
  await GameOnline.login("Spieler");
  onlineClient=GameOnline.getClient();

  if(!onlineClient)return;

  onlineReady=true;

  if(typeof GameOnline.watchPlayers==="function"){
   GameOnline.watchPlayers(onlineRoom,players=>{
    if(!players)return;
    remotePlayers=players;
   });
  }

  showNotice("Multiplayer-Verbindung bereit");
 }catch(err){
  console.warn("Multiplayer nicht verbunden:",err);
 }
}

function sendOnline(now){
 if(!onlineReady||!GameOnline)return;
 if(now-onlineLastSend<100)return;

 onlineLastSend=now;

 try{
  GameOnline.updatePosition(
   onlineRoom,
   "zimmer",
   Math.round(player.x),
   Math.round(player.y)
  );
 }catch(err){
  console.warn("Position konnte nicht gesendet werden:",err);
 }
}

function drawRemotePlayers(){
 if(!remotePlayers)return;

 const list=Array.isArray(remotePlayers)
  ?remotePlayers
  :Object.values(remotePlayers);

 for(const other of list){
  if(!other)continue;

  const x=Number(other.x);
  const y=Number(other.y);

  if(!Number.isFinite(x)||!Number.isFinite(y))continue;
  if(Math.abs(x-player.x)>1100)continue;

  ctx.save();
  ctx.translate(x-cameraX,y+75);
  ctx.scale(.58,.58);
  ctx.translate(-42,-116);

  ctx.globalAlpha=.85;
  ellipse(60,119,45,4,"#17130f");

  drawOriginalLeg(29,75,0);
  woodPart(23,5,13,70,2);
  woodPart(20,67,78,12,2);
  drawOriginalLeg(88,77,0);

  ctx.restore();
 }
}

/* =========================================================
   RENDER-LOOP
========================================================= */

function render(){
 ctx.setTransform(scaleX,0,0,scaleY,0,0);
 ctx.clearRect(0,0,W,H);

 drawWorld();

 ctx.save();
 ctx.translate(-cameraX,0);
 drawRemotePlayers();
 ctx.restore();
}

function frame(now){
 const dt=Math.min((now-last)/1000,.033);
 last=now;
 time+=dt;

 update(dt);
 updateHUD();
 render();
 sendOnline(now);

 requestAnimationFrame(frame);
}

initOnline();
requestAnimationFrame(frame);

window.addEventListener("beforeunload",persist);
