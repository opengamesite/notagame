
<script>
const $=id=>document.getElementById(id);
const canvas=$("world"),ctx=canvas.getContext("2d");
const W=960,H=540;
let dpr=1;

function resize(){
 dpr=Math.min(devicePixelRatio||1,2);
 canvas.width=Math.round(innerWidth*dpr);
 canvas.height=Math.round(innerHeight*dpr);
 ctx.setTransform(canvas.width/W,0,0,canvas.height/H,0,0);
}
window.addEventListener("resize",resize);
resize();

const defaults={
 money:120,unlocked:[],
 equipped:{head:null,face:null,clothes:null,back:null,pants:null,seat:null,legs:null,extra:null},
 inventory:[],placed:[],orders:[],received:[],faucetOn:false,bucketWater:0
};
const STORAGE_KEY="mein-zimmer-save-v1";

function loadSave(){
 try{
  const s=JSON.parse(localStorage.getItem(STORAGE_KEY)||"null");
  if(!s)return structuredClone(defaults);
  return {...structuredClone(defaults),...s,equipped:{...defaults.equipped,...(s.equipped||{})}};
 }catch{return structuredClone(defaults)}
}
let save=loadSave();
function persist(){
 try{localStorage.setItem(STORAGE_KEY,JSON.stringify(save))}catch(e){}
 $("money").textContent=save.money;
}

const player={
 x:465,y:0,vy:0,facing:1,moving:false,walk:0,
 armsOut:false,armsAmount:0
};
const keys=new Set();
let carrying=null,nearby=null,time=0;
let bucketPosition={x:790,y:425};
let placedObjects=[];

const targets=[
 {id:"wardrobe",x:120,y:330},
 {id:"computer",x:680,y:325},
 {id:"bed",x:300,y:350},
 {id:"sink",x:830,y:340},
 {id:"door",x:900,y:350},
 {id:"bucket",x:790,y:405}
];

const objects=[
 {id:"lamp",name:"Schreibtischlampe",x:650,y:278},
 {id:"poster",name:"Poster",x:350,y:165},
 {id:"teddy",name:"Teddybär",x:285,y:390}
];

for(const p of (save.placed||[])){
 if(p.id==="bucket"){bucketPosition={x:p.x,y:p.y};continue}
 if(["plant","rug","star"].includes(p.id)){
  placedObjects.push({...p});continue;
 }
 if(!objects.some(o=>o.id===p.id))objects.push({id:p.id,name:p.id,x:p.x,y:p.y});
 else{
  const o=objects.find(o=>o.id===p.id);
  o.x=p.x;o.y=p.y;
 }
}

const colors={
 blue:"#668da8",red:"#bb7771",green:"#7d9c80",
 black:"#45494b",white:"#eee8df",gold:"#c5a46c"
};

function rounded(x,y,w,h,r,color){
 ctx.fillStyle=color;ctx.beginPath();ctx.roundRect(x,y,w,h,r);ctx.fill();
}
function ellipse(x,y,rx,ry,color){
 ctx.fillStyle=color;ctx.beginPath();ctx.ellipse(x,y,rx,ry,0,0,Math.PI*2);ctx.fill();
}
function line(x1,y1,x2,y2,color,width=2){
 ctx.strokeStyle=color;ctx.lineWidth=width;ctx.lineCap="round";
 ctx.beginPath();ctx.moveTo(x1,y1);ctx.lineTo(x2,y2);ctx.stroke();
}
function gradient(x,y,w,h,a,b){
 const g=ctx.createLinearGradient(x,y,x,y+h);
 g.addColorStop(0,a);g.addColorStop(1,b);
 ctx.fillStyle=g;ctx.fillRect(x,y,w,h);
}
function shadow(x,y,rx,ry,alpha=.12){
 ellipse(x,y,rx,ry,`rgba(55,43,33,${alpha})`);
}
function softGradient(x,y,w,h,stops){
 const g=ctx.createLinearGradient(x,y,x+w,y+h);
 stops.forEach(s=>g.addColorStop(s[0],s[1]));
 return g;
}

/* ZIMMER */

 gradient(0,0,W,430,"#f5ecdf","#e5d8c7");

 shadow(480,196,120,9,.08);
 rounded(377,52,207,145,8,"#896849");
 rounded(384,59,193,132,5,"#f4eee3");
 rounded(390,65,181,120,3,softGradient(390,65,181,120,[[0,"#b8d6d9"],[.55,"#d9e4df"],[1,"#f2dcb8"]]));
 ellipse(528,100,28,26,"#fff0c5");
 ellipse(420,101,25,10,"#ffffffaa");
 ellipse(440,96,18,11,"#ffffffaa");
 ellipse(458,103,20,8,"#ffffffaa");
 rounded(477,65,5,120,2,"#f5eee1");
 rounded(390,121,181,5,2,"#f5eee1");

 const sway=Math.sin(time*1.1)*3;
 ctx.fillStyle="#c9ad9a";

 ctx.quadraticCurveTo(360+sway,125,376,196);
 ctx.quadraticCurveTo(389,190,397,190);
 ctx.lineTo(394,50);ctx.closePath();ctx.fill();

 ctx.quadraticCurveTo(606-sway,125,589,196);
 ctx.quadraticCurveTo(578,190,570,190);
 ctx.lineTo(573,50);ctx.closePath();ctx.fill();

 rounded(55,90,105,83,5,"#947252");

 gradient(0,420,W,120,"#cba47e","#a77c5c");

 for(let x=-30;x<W;x+=120)line(x,421,x+25,540,"#916c5020",1);
 rounded(0,418,W,9,2,"#997354");
 rounded(0,418,W,3,1,"#d6b18b");

 shadow(490,468,215,35,.12);
 ellipse(490,463,205,33,"#829b9b");
 ellipse(490,460,187,25,"#9aafb0");
 ctx.strokeStyle="#c5d2c9";ctx.lineWidth=2;
 ctx.beginPath();ctx.ellipse(490,460,165,19,0,0,Math.PI*2);ctx.stroke();

 for(let i=0;i<9;i++){
  const px=(i*117+Math.sin(time*.7+i)*12)%W;
  const py=65+(i*39)%280+Math.sin(time+i)*5;
  ctx.globalAlpha=.16+Math.sin(time*1.4+i)*.08;
  ellipse(px,py,1.5,1.5,"#fffdf0");
 }
 ctx.globalAlpha=1;
}

function drawDoor(){

function drawPlant(x,y,scale=1){
 ctx.save();ctx.translate(x,y);ctx.scale(scale,scale);
 const sway=Math.sin(time*1.6+x)*3;
 shadow(0,0,15,4);
 rounded(-12,-23,24,23,4,"#b87960");
 rounded(-10,-22,20,3,2,"#d69b7e");
 line(0,-23,0,-65,"#658c67",3);
 line(0,-43,-17+sway,-57,"#658c67",3);
 line(0,-48,18+sway,-65,"#658c67",3);
 ellipse(-19+sway,-58,10,5,"#83a780");
 ellipse(20+sway,-67,10,5,"#a0b98d");
 ellipse(0,-70,8,13,"#759b72");
 ellipse(-2,-72,3,7,"#a5c19a");
 ctx.restore();
}

function drawBucket(x,y){
 shadow(x,y,17,4);
 rounded(x-13,y-25,26,25,5,"#8da6a5");
 rounded(x-10,y-23,20,3,2,"#b8c8c3");
 ctx.strokeStyle="#6e8583";ctx.lineWidth=2;
 ctx.beginPath();ctx.arc(x,y-23,14,Math.PI,Math.PI*2);ctx.stroke();
 if(save.bucketWater>0){
  rounded(x-10,y-12,20,9,3,"#7bc3d2");
  line(x-8,y-10,x+8,y-10,"#c7eff0",1);
 }
}

function drawTeddy(x,y){
 shadow(x,y+18,19,5);
 ellipse(x,y,15,16,"#b98962");
 ellipse(x-10,y-13,7,7,"#b98962");
 ellipse(x+10,y-13,7,7,"#b98962");
 ellipse(x,y-7,12,12,"#c99a70");
 ellipse(x-4,y-9,1.5,2,"#453a31");
 ellipse(x+4,y-9,1.5,2,"#453a31");
 ellipse(x,y-3,3,2,"#e7c7a7");
}

function drawTinyTeddy(x,y){
 ellipse(x,y+3,8,9,"#b98962");
 ellipse(x-6,y-5,4,4,"#b98962");

 ellipse(x+2,y-3,1,1.5,"#453a31");

function drawPoster(x,y,small=false){
 const w=small?24:58,h=small?18:42;
 rounded(x-w/2,y-h/2,w,h,3,"#927052");
 rounded(x-w/2+4,y-h/2+4,w-8,h-8,2,"#c4d4c2");
 ellipse(x,y,small?4:11,small?4:11,"#e7c99c");
}

function drawHeldItem(x,y){
 if(carrying==="bucket"){
  rounded(x-9,y-10,18,19,4,"#8da6a5");
  rounded(x-7,y-8,14,3,2,"#b8c8c3");
  if(save.bucketWater>0)rounded(x-7,y+1,14,6,2,"#7bc3d2");
 }else if(carrying==="teddy"){
  drawTinyTeddy(x,y);
 }else if(carrying==="poster"){
  drawPoster(x,y,true);
 }else if(carrying==="lamp"){
  line(x,y+8,x,y-8,"#77766c",3);
  rounded(x-9,y-16,18,9,4,"#e1c58c");
 }else{
  rounded(x-10,y-9,20,18,4,"#a5b8aa");
  rounded(x-7,y-6,14,12,3,"#c6d5c4");
 }
}

/* GEGENSTÄNDE */
function drawObjects(){
 drawPlant(510,420,.85);
 drawPlant(845,420,.9);
 if(carrying!=="bucket")drawBucket(bucketPosition.x,bucketPosition.y);

 for(const o of objects){
  if(o.id===carrying)continue;
  if(o.id==="teddy")drawTeddy(o.x,o.y);
  if(o.id==="poster")drawPoster(o.x,o.y);
  if(o.id==="lamp")drawLamp(o.x,o.y);
 }
}

function drawPlaced(){
 for(const p of placedObjects){
  if(p.id==="plant")drawPlant(p.x,p.y,.8);
  if(p.id==="rug"){
   shadow(p.x,p.y+3,55,9,.08);
   ellipse(p.x,p.y,55,12,"#829b9b");
   ctx.strokeStyle="#c5d2c9";ctx.lineWidth=1;
   ctx.beginPath();ctx.ellipse(p.x,p.y,46,8,0,0,Math.PI*2);ctx.stroke();
  }
  if(p.id==="star"){
   ctx.save();ctx.fillStyle="#d6b66f";ctx.font="22px Georgia";
   ctx.fillText("★",p.x,p.y);ctx.restore();
  }
 }
}

/* KLEINERER STUHL */
function drawChair(){
 const x=player.x,y=430-player.y;
 const bob=player.moving?Math.sin(player.walk*2)*1.2:Math.sin(time*2)*.4;
 const step=player.moving?Math.sin(player.walk*2.2):0;
 const seat=colors[save.equipped.clothes]||"#b9a58c";
 const back=colors[save.equipped.seat]||seat;
 const metal=save.equipped.seat==="gold"?"#c5a46c":"#77736c";
 const arm=player.armsAmount;

 ctx.save();
 ctx.translate(x,y+bob);
 ctx.scale(player.facing*.82,.82);

 shadow(0,0,24,4,.17);

 const rearStep=step*3,frontStep=-step*3;
 line(-5,-19,-8+rearStep,-3,metal,3.2);
 line(11,-19,13+frontStep,-3,metal,3.2);
 line(-8+rearStep,-3,-11+rearStep,-1,"#555b5a",2);
 line(13+frontStep,-3,16+frontStep,-1,"#555b5a",2);
 ellipse(-11+rearStep,-1,3,2.3,"#5b5b58");
 ellipse(16+frontStep,-1,3,2.3,"#5b5b58");
 line(-5,-19,11,-19,metal,3);
 line(3,-19,3,-29,metal,3);

 rounded(-17,-39,39,13,5,"#76583f");
 rounded(-16,-40,36,10,4,seat);
 line(-11,-37,13,-37,"#ffffff70",1);

 rounded(-17,-79,13,43,5,"#795c45");
 rounded(-15,-77,9,38,4,back);
 rounded(-18,-81,15,5,3,"#8b6c50");
 line(-12,-73,-12,-43,"#ffffff35",1);
 line(-10,-37,-7,-27,metal,3);

 // Ausfahrbare Armlehne
 rounded(5,-51,17,5,2,"#805f45");
 rounded(6,-52,15,3,2,"#b69a79");

 const reach=arm*35;
 const lift=arm*5;
 const handX=23+reach;
 const handY=-57-lift;

 // Arm wird aus dem Stuhl heraus verlängert.
 line(17,-49,handX-5,handY,"#8b694b",3.5);
 line(handX-5,handY,handX+3,handY,"#8b694b",3);
 ellipse(handX+3,handY,3,3,"#e1c18d");

 // Hinterer Arm
 line(-15,-49,-19-arm*12,-56-lift*.4,"#8b694b",2.5);
 ellipse(-19-arm*12,-56-lift*.4,2.5,2.5,"#e1c18d");

 if(save.equipped.head==="toiletroll"){
  rounded(-18,-96,15,16,5,"#f5f1e8");
  ellipse(-10.5,-88,3.5,3.5,"#bdb8ae");
  ellipse(-10.5,-88,1.8,1.8,"#fdfbf5");
 }
 if(save.equipped.head==="partyhat"){
  ctx.fillStyle="#e7a64c";ctx.beginPath();
  ctx.moveTo(-19,-80);ctx.lineTo(2,-80);ctx.lineTo(-9,-106);
  ctx.closePath();ctx.fill();ellipse(-9,-106,3,3,"#d77d78");
 }
 if(save.equipped.back==="doubleRoll"){
  for(const yy of [-68,-54]){
   ellipse(-22,yy,6,6,"#f5f1e9");
   ellipse(-22,yy,2.5,2.5,"#bdb8ae");
  }
 }
 if(save.equipped.extra==="bow"){
  ellipse(-9,-78,6,3.5,"#d98b91");
  ellipse(1,-78,6,3.5,"#d98b91");
  ellipse(-4,-78,2.5,2.5,"#ad606b");
 }

 // Item sitzt direkt an der Hand. Es existiert nicht mehr am Boden.
 if(carrying){
  drawHeldItem(handX+7,handY-7);
 }
 ctx.restore();
}

/* SHOP */
const cosmetics=[
 {id:"blue",name:"Blauer Stuhl",price:25,desc:"Blauer Stoffbezug.",slot:"clothes"},
 {id:"red",name:"Roter Stuhl",price:30,desc:"Roter Stoffbezug.",slot:"clothes"},

 {id:"partyhat",name:"Partyhut",price:30,desc:"Für deinen Party-Stuhl.",slot:"head"}
];

const shopItems=[
 {id:"plant",name:"Zimmerpflanze",price:35,desc:"Eine kleine Pflanze."},
 {id:"lamp",name:"Schreibtischlampe",price:45,desc:"Warmes Licht."},

/* MENÜS */
const panel=$("panel"),content=$("panelContent");
let activePanel=null;

function openPanel(kind){
 activePanel=kind;panel.classList.remove("hidden");renderPanel();
}
function closePanel(){
 panel.classList.add("hidden");activePanel=null;
}
$("closePanel").onclick=closePanel;

function button(text,fn,disabled=false){
 const b=document.createElement("button");
 b.className="action";b.textContent=text;b.disabled=disabled;b.onclick=fn;
 return b;
}
function card(name,detail,action){
 const el=document.createElement("div");el.className="card";
 const info=document.createElement("div");
 const strong=document.createElement("strong");strong.textContent=name;
 const small=document.createElement("small");small.textContent=detail;
 info.append(strong,small);el.append(info,action);return el;
}

function renderPanel(){
 content.innerHTML="";
 const titles={
  computer:["DEIN ZUHAUSE","Bestellungen"],
  door:["LIEFERUNG","An deiner Tür"],
  wardrobe:["DEIN STUHL","Stuhl-Cosmetics"],
  sink:["WASSER","Waschbecken"],
  bucket:["EIMER","Wasser auffüllen"]
 };
 const t=titles[activePanel]||["DEIN ZUHAUSE","Zimmer"];
 $("panelEyebrow").textContent=t[0];$("panelTitle").textContent=t[1];
 if(activePanel==="computer")renderShop();
 if(activePanel==="wardrobe")renderWardrobe();
 if(activePanel==="door")renderDoor();
 if(activePanel==="sink"||activePanel==="bucket")renderWater();
}

function renderShop(){
 const bal=document.createElement("div");bal.className="balance";
 bal.textContent=`Guthaben: ${save.money} Münzen`;content.append(bal);
 const grid=document.createElement("div");grid.className="grid";
 for(const item of shopItems){
  const owned=save.inventory.includes(item.id)||
   save.placed.some(p=>p.id===item.id)||
   save.orders.some(o=>o.id===item.id);
  grid.append(card(item.name,`${item.desc} · ${item.price} Münzen`,
   button("Bestellen",()=>{
    if(save.money<item.price)return;
    save.money-=item.price;
    save.orders.push({id:item.id,status:"ordered",remaining:20});
    persist();renderPanel();
   },owned||save.money<item.price)
  ));
 }
 content.append(grid);
 const h=document.createElement("h3");h.className="section-title";
 h.textContent="Bestellungen";content.append(h);
 for(const o of save.orders){
  const row=document.createElement("div");row.className="order";
  row.textContent=`${shopItems.find(i=>i.id===o.id)?.name||o.id} – ${o.status==="arrived"?"An der Tür":Math.ceil(o.remaining||0)+" Sekunden"}`;
  content.append(row);
 }
}

function renderWardrobe(){
 const intro=document.createElement("div");intro.className="notice";
 intro.textContent="Deine Cosmetics werden direkt am Stuhl angezeigt ♡";content.append(intro);
 for(const [slot,label] of [
  ["head","Kopf"],["back","Rücken"],["clothes","Stuhlbezug"],
  ["seat","Sitzfläche"],["extra","Extras"]
 ]){
  const heading=document.createElement("h3");heading.className="section-title";
  heading.textContent=label;content.append(heading);
  const grid=document.createElement("div");grid.className="grid";
  grid.append(card("Ohne Cosmetic","Normales Aussehen.",
   button(save.equipped[slot]?"Ablegen":"Ausgewählt",()=>{
    save.equipped[slot]=null;persist();renderPanel();
   },!save.equipped[slot])
  ));
  for(const item of cosmetics.filter(i=>i.slot===slot)){
   const owned=save.unlocked.includes(item.id);
   const active=save.equipped[slot]===item.id;
   grid.append(card(item.name,`${item.desc} · ${owned?"Freigeschaltet":item.price+" Münzen"}`,
    button(!owned?"Kaufen":active?"Ablegen":"Anziehen",()=>{
     if(!owned){
      if(save.money<item.price)return;
      save.money-=item.price;save.unlocked.push(item.id);
     }
     save.equipped[slot]=active?null:item.id;
     persist();renderPanel();
    },!owned&&save.money<item.price)
   ));
  }
  content.append(grid);
 }
}

function renderDoor(){
 const arrived=save.orders.filter(o=>o.status==="arrived");
 if(!arrived.length){content.textContent="Momentan ist keine Lieferung angekommen.";return}
 for(const o of arrived){
  const item=shopItems.find(i=>i.id===o.id);
  content.append(card(item?.name||o.id,"Dein Paket ist angekommen.",
   button("Abholen",()=>{
    o.status="received";save.received.push(o.id);
    save.inventory.push(o.id);persist();renderPanel();
   })
  ));
 }
}

function renderWater(){
 const status=document.createElement("div");status.className="balance";
 status.textContent=save.bucketWater>0?"Der Eimer enthält Wasser.":"Der Eimer ist leer.";
 content.append(status);
 content.append(button(save.faucetOn?"Wasserhahn ausschalten":"Wasserhahn einschalten",()=>{
  save.faucetOn=!save.faucetOn;persist();renderPanel();
 }));
 content.append(button("Eimer auffüllen",()=>{
  save.bucketWater=1;persist();renderPanel();
 }));
}

/* SPEICHERN */
function saveObjectPosition(id,x,y){
 save.placed=save.placed.filter(p=>p.id!==id);
 save.placed.push({id,x,y});
 persist();
}

function findNearby(){
 let best=null,dist=Infinity;
 for(const t of targets){
  const d=Math.hypot(player.x-t.x,430-player.y-t.y);
  if(d<75&&d<dist){best=t;dist=d}
 }
 return best;
}

function findNearbyObject(){
 let nearest=null,dist=58;
 for(const o of objects){
  if(o.id===carrying)continue;
  const d=Math.hypot(player.x-o.x,430-player.y-o.y);
  if(d<dist){dist=d;nearest=o}
 }
 return nearest;
}

/* AUFHEBEN UND ABLEGEN */
function pickUpObject(id){
 if(carrying)return;
 carrying=id;
 player.armsOut=true;

 // Das Item wird aus der Welt entfernt.
 if(id==="bucket")return;
 const index=objects.findIndex(o=>o.id===id);
 if(index>=0)objects.splice(index,1);
}

function dropCarried(){
 if(!carrying)return;

 const id=carrying;
 const x=Math.max(35,Math.min(925,player.x+player.facing*35));
 const y=430-player.y-55;

 if(id==="bucket"){
  bucketPosition={x,y:425};
  saveObjectPosition("bucket",x,425);
 }else{
  const o={id,name:id,x,y,vy:-35,falling:true};
  objects.push(o);
 }
 carrying=null;
 player.armsOut=false;
 persist();
}

function interact(){
 if(!panel.classList.contains("hidden"))return;

 if(carrying){
  player.armsOut=!player.armsOut;
  return;
 }

 const near=findNearby();
 if(near){
  if(near.id==="wardrobe")openPanel("wardrobe");
  if(near.id==="computer")openPanel("computer");
  if(near.id==="door"){
   if(save.orders.some(o=>o.status==="arrived"))openPanel("door");
   else window.location.href="Stadt.html";
  }
  if(near.id==="sink")openPanel("sink");
  if(near.id==="bucket")pickUpObject("bucket");
  if(near.id==="bed")player.x=300;
  return;
 }

 const object=findNearbyObject();
 if(object){pickUpObject(object.id);return}

 if(save.inventory.length){
  const id=save.inventory[0];
  if(["plant","rug","star"].includes(id)){
   save.inventory.shift();
   const p={id,x:player.x,y:id==="star"?200:420};
   placedObjects.push(p);saveObjectPosition(id,p.x,p.y);
   persist();return;
  }
  save.inventory.shift();pickUpObject(id);persist();return;
 }

 player.armsOut=!player.armsOut;
}

/* TASTATUR */
window.addEventListener("keydown",e=>{
 const k=e.key.toLowerCase();
 if(["arrowleft","arrowright","arrowup","arrowdown"," "].includes(k))e.preventDefault();

 if(k==="escape"){
  if(!panel.classList.contains("hidden"))closePanel();
  else if(carrying)dropCarried();
  return;
 }
 if(k==="q"){if(carrying)dropCarried();return}
 if(k==="e"){
  if(!e.repeat)interact();
  return;
 }
 if(!panel.classList.contains("hidden"))return;

 keys.add(k);

 // Leertaste: Springen
 if(k===" "&&!e.repeat&&player.y===0&&player.vy===0){
  player.vy=410;
 }
});
window.addEventListener("keyup",e=>keys.delete(e.key.toLowerCase()));
window.addEventListener("blur",()=>keys.clear());

/* BEWEGUNG */
function move(dt){
 let dir=0;
 if(keys.has("a")||keys.has("arrowleft"))dir--;
 if(keys.has("d")||keys.has("arrowright"))dir++;

 player.moving=dir!==0;
 if(dir){
  player.x+=dir*175*dt;
  player.facing=dir;
  player.walk+=dt*9;
 }
 player.x=Math.max(30,Math.min(930,player.x));

 if(player.y>0||player.vy>0){
  player.y+=player.vy*dt;
  player.vy-=1150*dt;
  if(player.y<=0){player.y=0;player.vy=0}
 }

 const target=player.armsOut?1:0;
 player.armsAmount+=(target-player.armsAmount)*Math.min(1,dt*10);
}

/* FALLENDE ITEMS */
function updateObjects(dt){
 for(const o of objects){
  if(!o.falling)continue;

  // Schwerkraft nach unten
  o.vy=(o.vy||0)+850*dt;
  o.y+=(o.vy||0)*dt;

  // Bodenhöhe je nach Objekt
  const ground=o.id==="poster"?390:395;
  if(o.y>=ground){
   o.y=ground;
   o.vy=0;
   o.falling=false;
   saveObjectPosition(o.id,o.x,o.y);
  }
 }
}

/* ZEICHNEN */
function draw(){
 ctx.clearRect(0,0,W,H);
 drawRoom();
 drawWardrobe();
 drawBed();
 drawDesk();
 drawSink();
 drawDoor();
 drawObjects();
 drawPlaced();
 drawChair();

 nearby=findNearby();

 if(nearby&&!carrying&&panel.classList.contains("hidden")){
  rounded(player.x-45,350-player.y,90,24,8,"#394448e8");
  ctx.fillStyle="#fff";ctx.font="bold 10px Arial";ctx.textAlign="center";
  const names={
   wardrobe:"E · Schrank",computer:"E · Computer",bed:"E · Bett",
   sink:"E · Waschbecken",door:"E · Tür",bucket:"E · Eimer"
  };
  ctx.fillText(names[nearby.id],player.x,366-player.y);
  ctx.textAlign="left";
 }else if(carrying&&panel.classList.contains("hidden")){
  rounded(player.x-49,350-player.y,98,24,8,"#394448e8");
  ctx.fillStyle="#fff";ctx.font="bold 10px Arial";ctx.textAlign="center";
  ctx.fillText("Q · Ablegen",player.x,366-player.y);
  ctx.textAlign="left";
 }
}

let last=performance.now();
function animate(now){
 const dt=Math.min((now-last)/1000,.04);
 last=now;time+=dt;

 if(panel.classList.contains("hidden"))move(dt);
 else{
  const target=player.armsOut?1:0;
  player.armsAmount+=(target-player.armsAmount)*Math.min(1,dt*10);
 }

 updateObjects(dt);

 let changed=false;
 for(const o of save.orders){
  if(o.status==="ordered"){
   o.remaining-=dt;
   if(o.remaining<=0){o.remaining=0;o.status="arrived";changed=true}
  }
 }
 if(changed)persist();

 draw();
 requestAnimationFrame(animate);
}

$("soundButton").onclick=()=>{
 $("soundButton").textContent=$("soundButton").textContent==="♫"?"♪":"♫";
};

persist();
requestAnimationFrame(animate);
</script>
