<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MEIN ZIMMER</title>
<style>
*{box-sizing:border-box}
html,body{
 margin:0;width:100%;height:100%;overflow:hidden;
 background:#17191b;font-family:Arial,sans-serif
}
canvas{display:block;width:100%;height:100%}
#hud{
 position:fixed;top:16px;left:16px;z-index:5;
 color:#fff;background:#202326dd;padding:12px 16px;
 border:1px solid #ffffff24;border-radius:9px;
 font-size:14px;line-height:1.6
}
#status{
 position:fixed;top:16px;right:16px;z-index:5;
 color:#fff;background:#202326dd;padding:10px 14px;
 border:1px solid #ffffff24;border-radius:9px;
 font-size:13px
}
#hint{
 position:fixed;bottom:20px;left:50%;transform:translateX(-50%);
 color:#fff;background:#202326e8;padding:11px 18px;
 border-radius:8px;font-size:14px;z-index:5;
 text-align:center;white-space:nowrap
}
#fade{
 position:fixed;inset:0;background:#111;opacity:0;
 pointer-events:none;z-index:10;transition:opacity .35s
}
</style>
</head>
<body>

<div id="hud">
 <strong>MEIN ZIMMER</strong><br>
 <span id="money">120 Münzen</span><br>
 <span id="position">Zimmer</span>
</div>

<div id="status">Bereit</div>
<div id="hint">A / D oder ← / → bewegen · Leertaste springen · E interagieren</div>
<div id="fade"></div>

<canvas id="game"></canvas>

<script src="supabase.js"></script>
<script>
"use strict";

/* =========================================================
   GRUNDEINSTELLUNGEN
========================================================= */

const canvas=document.getElementById("game");
const ctx=canvas.getContext("2d");

const W=960;
const H=540;
const WORLD=3100;
const FLOOR=440;
const SAVE_KEY="mein-zimmer-save-v1";

let dpr=1;

function resize(){
 dpr=Math.min(window.devicePixelRatio||1,2);
 canvas.width=W*dpr;
 canvas.height=H*dpr;
 ctx.setTransform(dpr,0,0,dpr,0,0);
}
window.addEventListener("resize",resize);
resize();

const clamp=(v,min,max)=>Math.max(min,Math.min(max,v));
const lerp=(a,b,t)=>a+(b-a)*t;

function hash(n){
 const x=Math.sin(n*127.1+311.7)*43758.5453;
 return x-Math.floor(x);
}

/* =========================================================
   SPEICHER
========================================================= */

const defaults={
 money:120,
 inventory:[],
 equipped:{
  head:null,
  face:null,
  clothes:null,
  back:null,
  pants:null
 },
 unlocked:[],
 faucetOn:false,
 bucketWater:0,
 orders:[],
 received:[],
 playerX:180
};

function readSave(){
 try{
  const old=JSON.parse(localStorage.getItem(SAVE_KEY)||"{}");
  return{
   ...defaults,
   ...old,
   equipped:{...defaults.equipped,...(old.equipped||{})}
  };
 }catch(e){
  return structuredClone(defaults);
 }
}

let save=readSave();

function writeSave(){
 try{
  localStorage.setItem(SAVE_KEY,JSON.stringify(save));
 }catch(e){}
 document.getElementById("money").textContent=
  `${save.money} Münzen`;
}

writeSave();

/* =========================================================
   SPIELER
========================================================= */

const player={
 x:clamp(Number(save.playerX)||180,40,WORLD-80),
 y:FLOOR-68,
 vx:0,
 vy:0,
 width:48,
 height:68,
 grounded:true,
 facing:1,
 walk:0,
 landing:0,
 action:"normal",
 actionProgress:0,
 actionStartX:0,
 actionStartY:0
};

let cameraX=0;
let computerOn=false;
let wardrobeOpen=0;
let sofaOccupied=false;
let bedOccupied=false;
let message="Bereit";
let messageTimer=0;
let gameTime=0;
let lastTime=0;
let saveTimer=0;
let onlineTimer=0;

/* =========================================================
   TASTEN
========================================================= */

const keys={};

window.addEventListener("keydown",e=>{
 const k=e.key.toLowerCase();
 keys[k]=true;

 if([" ","arrowup","arrowdown","arrowleft","arrowright"].includes(k)){
  e.preventDefault();
 }

 if((k===" "||k==="w"||k==="arrowup")&&!e.repeat){
  jump();
 }

 if(k==="e"&&!e.repeat)interact();
 if(k==="q"&&!e.repeat)dropItem();
});

window.addEventListener("keyup",e=>{
 keys[e.key.toLowerCase()]=false;
});

function jump(){
 if(!player.grounded||player.action!=="normal")return;
 player.vy=-440;
 player.grounded=false;
 player.landing=0;
}

/* =========================================================
   HILFSFUNKTIONEN ZEICHNEN
========================================================= */

function line(x1,y1,x2,y2,color,width=1){
 ctx.beginPath();
 ctx.moveTo(x1,y1);
 ctx.lineTo(x2,y2);
 ctx.strokeStyle=color;
 ctx.lineWidth=width;
 ctx.stroke();
}

function rounded(x,y,w,h,r,color,stroke){
 ctx.beginPath();
 ctx.roundRect(x,y,w,h,r);
 ctx.fillStyle=color;
 ctx.fill();
 if(stroke){
  ctx.strokeStyle=stroke;
  ctx.stroke();
 }
}

function woodGradient(x,y,w,h){
 const g=ctx.createLinearGradient(x,y,x+w,y+h);
 g.addColorStop(0,"#d4a16b");
 g.addColorStop(.45,"#b98552");
 g.addColorStop(1,"#75482b");
 return g;
}

function woodPart(x,y,w,h,r=1){
 ctx.save();

 ctx.fillStyle="#35271d33";
 ctx.fillRect(x+2,y+2,w,h);

 ctx.beginPath();
 ctx.roundRect(x,y,w,h,r);
 ctx.fillStyle=woodGradient(x,y,w,h);
 ctx.fill();
 ctx.strokeStyle="#604027";
 ctx.lineWidth=1.1;
 ctx.stroke();

 ctx.save();
 ctx.beginPath();
 ctx.roundRect(x+1,y+1,w-2,h-2,r);
 ctx.clip();

 for(let i=0;i<Math.max(3,Math.floor(h/3));i++){
  const yy=y+hash(i+x*.7)*h;
  ctx.beginPath();
  ctx.moveTo(x+2,yy);
  ctx.bezierCurveTo(x+w*.3,yy-1,x+w*.7,yy+1,x+w-2,yy);
  ctx.strokeStyle=i%2?"#513820":"#f5d7ae";
  ctx.globalAlpha=i%2?.12:.18;
  ctx.lineWidth=.7;
  ctx.stroke();
 }

 ctx.restore();

 ctx.globalAlpha=1;
 ctx.strokeStyle="#f1c18b99";
 ctx.lineWidth=.8;
 ctx.beginPath();
 ctx.moveTo(x+2,y+1);
 ctx.lineTo(x+w-2,y+1);
 ctx.stroke();

 ctx.restore();
}

/* =========================================================
   ORIGINALER STUHL – ANIMIERTE BEINE
========================================================= */

function drawAnimatedLeg(x,y,angle,kneeAngle){
 ctx.save();
 ctx.translate(x,y);
 ctx.rotate(angle);

 const upper=21;
 const lower=20;

 // Oberes Holzbein
 ctx.beginPath();
 ctx.moveTo(-2.8,0);
 ctx.lineTo(-2.2,upper);
 ctx.lineTo(2.2,upper);
 ctx.lineTo(2.8,0);
 ctx.closePath();
 ctx.fillStyle=woodGradient(-3,0,6,upper);
 ctx.fill();
 ctx.strokeStyle="#634127";
 ctx.lineWidth=1;
 ctx.stroke();

 // Gelenk
 ctx.translate(0,upper);
 ctx.rotate(kneeAngle);

 ctx.beginPath();
 ctx.arc(0,0,2.5,0,Math.PI*2);
 ctx.fillStyle="#70482b";
 ctx.fill();
 ctx.strokeStyle="#3d2b1c";
 ctx.stroke();

 // Unteres Holzbein
 ctx.beginPath();
 ctx.moveTo(-2.1,0);
 ctx.lineTo(-2.5,lower-2);
 ctx.quadraticCurveTo(0,lower+1,2.5,lower-2);
 ctx.lineTo(2.1,0);
 ctx.closePath();
 ctx.fillStyle=woodGradient(-2.5,0,5,lower);
 ctx.fill();
 ctx.strokeStyle="#634127";
 ctx.stroke();

 line(-1,3,-1,lower-3,"#f1c28b88",.8);

 ctx.restore();
}

function drawStaticLeg(x,y){
 ctx.save();
 ctx.translate(x,y);

 ctx.beginPath();
 ctx.moveTo(-3,0);
 ctx.lineTo(-2.5,39);
 ctx.quadraticCurveTo(0,42,2.5,39);
 ctx.lineTo(3,0);
 ctx.closePath();

 ctx.fillStyle=woodGradient(-3,0,7,42);
 ctx.fill();
 ctx.strokeStyle="#634127";
 ctx.lineWidth=1;
 ctx.stroke();

 line(-1.5,3,-1,36,"#f1c28b88",.8);
 ctx.restore();
}

/* =========================================================
   KOSMETIK
========================================================= */

function drawBackCosmetic(){
 const item=save.equipped.back;
 if(!item)return;

 if(item.toLowerCase().includes("ballon")){
  ctx.strokeStyle="#555";
  ctx.lineWidth=1;
  line(-4,-50,-13,-90,"#777",1);
  ctx.beginPath();
  ctx.ellipse(-15,-98,8,11,0,0,Math.PI*2);
  ctx.fillStyle="#e75a65";
  ctx.fill();
  return;
 }

 if(item.toLowerCase().includes("rucksack")){
  rounded(-39,-60,17,31,5,"#567b9b","#283d50");
  line(-36,-55,-25,-55,"#b5c6d2",1);
 }
}

function drawClothing(){
 const item=save.equipped.clothes;
 if(!item)return;

 let color="#4f7795";
 const n=item.toLowerCase();

 if(n.includes("rot"))color="#a94d46";
 if(n.includes("grün")||n.includes("gruen"))color="#527b58";
 if(n.includes("schwarz"))color="#343638";
 if(n.includes("gelb"))color="#d1aa48";
 if(n.includes("weiß")||n.includes("weiss"))color="#e4dfd2";

 ctx.save();
 ctx.fillStyle=color;
 ctx.strokeStyle="#35271d";
 ctx.lineWidth=1;

 ctx.beginPath();
 ctx.moveTo(-20,-53);
 ctx.lineTo(58,-53);
 ctx.lineTo(55,-38);
 ctx.lineTo(-18,-38);
 ctx.closePath();
 ctx.fill();
 ctx.stroke();

 ctx.restore();
}

function drawPants(){
 const item=save.equipped.pants;
 if(!item)return;

 let color="#3d526d";
 if(item.toLowerCase().includes("schwarz"))color="#303034";
 if(item.toLowerCase().includes("hell"))color="#b7a78d";

 ctx.fillStyle=color;
 ctx.fillRect(27,-3,7,19);
 ctx.fillRect(84,-3,7,19);
}

function drawHeadCosmetic(){
 const item=save.equipped.head;
 if(!item)return;

 const n=item.toLowerCase();

 if(n.includes("hut")){
  ctx.fillStyle="#46362b";
  ctx.beginPath();
  ctx.ellipse(28,-118,19,4,0,0,Math.PI*2);
  ctx.fill();
  ctx.fillRect(15,-133,26,16);
  ctx.fillStyle="#b18b56";
  ctx.fillRect(15,-123,26,3);
 }else if(n.includes("krone")){
  ctx.fillStyle="#e6bb4b";
  ctx.beginPath();
  ctx.moveTo(12,-119);
  ctx.lineTo(13,-134);
  ctx.lineTo(22,-126);
  ctx.lineTo(29,-138);
  ctx.lineTo(36,-126);
  ctx.lineTo(45,-134);
  ctx.lineTo(46,-119);
  ctx.closePath();
  ctx.fill();
 }else{
  rounded(13,-130,30,10,3,"#4a5869","#252b32");
 }
}

function drawFaceCosmetic(){
 const item=save.equipped.face;
 if(!item)return;

 if(item.toLowerCase().includes("brille")){
  ctx.strokeStyle="#292929";
  ctx.lineWidth=2;
  ctx.beginPath();
  ctx.arc(21,-101,6,0,Math.PI*2);
  ctx.arc(36,-101,6,0,Math.PI*2);
  ctx.moveTo(27,-101);
  ctx.lineTo(30,-101);
  ctx.stroke();
 }
}

function drawBalloon(time){
 if(!save.equipped.back||
    !save.equipped.back.toLowerCase().includes("ballon"))return;

 const sway=Math.sin(time*2)*3;
 ctx.save();
 ctx.translate(-18,-90);
 ctx.rotate(sway*.025);

 line(0,0,0,-28,"#777",1);

 ctx.beginPath();
 ctx.ellipse(0,-39,8,11,0,0,Math.PI*2);
 ctx.fillStyle="#e65a62";
 ctx.fill();
 ctx.strokeStyle="#a33b45";
 ctx.stroke();

 ctx.restore();
}

/* =========================================================
   STUHL ZEICHNEN
========================================================= */

function drawChair(time){
 const moving=Math.abs(player.vx)>5&&player.grounded&&player.action==="normal";
 const airborne=!player.grounded;
 const speed=clamp(Math.abs(player.vx)/230,0,1);
 const phase=player.walk;

 const swing=moving?Math.sin(phase)*.32*speed:0;
 const knee=moving?Math.sin(phase+1)*.52*speed:0;

 const jumpFold=airborne?clamp(-player.vy/500,0,.8):0;
 const landingBob=player.landing>0?Math.sin(player.landing*22)*2:0;
 const bodyBob=moving?Math.abs(Math.sin(phase*2))*1.2:0;

 ctx.save();

 // Spiegelung beim Laufen in Gegenrichtung
 ctx.translate(player.x+24,player.y+player.height);
 ctx.scale(player.facing*.58,.58);

 // Der Boden-Schatten wird separat gezeichnet.
 // Stuhllehne und Sitz bleiben exakt in der Form des Originals.

 ctx.translate(0,-116+bodyBob+landingBob);

 drawBackCosmetic();

 // Hinteres Bein
 drawAnimatedLeg(29,75,
  airborne?-.12-jumpFold*.35:swing*.65,
  airborne?-.25-jumpFold*.3:-knee*.8
 );

 // Originale Rückenlehne
 woodPart(23,5,13,70,2);

 // Originale Sitzfläche
 woodPart(20,67,78,12,2);

 // Vorderes Bein
 drawAnimatedLeg(88,77,
  airborne?.10+jumpFold*.35:-swing,
  airborne?.25+jumpFold*.3:knee
 );

 // Helle Kanten wie beim Original
 line(25,8,25,70,"#f1c18b99",1);
 line(23,69,95,69,"#f3d0a0aa",1);

 drawPants();
 drawClothing();
 drawHeadCosmetic();
 drawFaceCosmetic();
 drawBalloon(time);

 ctx.fillStyle="#513a29";
 ctx.globalAlpha=.25;
 ctx.fillRect(25,116,69,1);
 ctx.globalAlpha=1;

 ctx.restore();
}

/* =========================================================
   SPIELER-SCHATTEN
========================================================= */

function drawPlayerShadow(){
 const heightAboveFloor=Math.max(0,(FLOOR-(player.y+player.height)));
 const scale=clamp(1-heightAboveFloor/180,.45,1);

 ctx.save();
 ctx.globalAlpha=.22*scale;
 ctx.fillStyle="#17130f";
 ctx.beginPath();
 ctx.ellipse(
  player.x+24,
  FLOOR+2,
  30*scale,
  4*scale,
  0,0,Math.PI*2
 );
 ctx.fill();
 ctx.restore();
}

/* =========================================================
   HINTERGRUND
========================================================= */

function drawBackground(){
 const wall=ctx.createLinearGradient(0,0,0,FLOOR);
 wall.addColorStop(0,"#d9d0bf");
 wall.addColorStop(1,"#b9ad99");
 ctx.fillStyle=wall;
 ctx.fillRect(0,0,W,FLOOR);

 // Wandstruktur
 for(let i=0;i<45;i++){
  const x=(i*127-cameraX*.12)%W;
  ctx.strokeStyle="#ffffff16";
  ctx.lineWidth=1;
  line(x,0,x,FLOOR,"#ffffff12",1);
 }

 ctx.fillStyle="#897965";
 ctx.fillRect(0,FLOOR-8,W,8);

 const floor=ctx.createLinearGradient(0,FLOOR,0,H);
 floor.addColorStop(0,"#9b7858");
 floor.addColorStop(1,"#634832");
 ctx.fillStyle=floor;
 ctx.fillRect(0,FLOOR,W,H-FLOOR);

 // Parkett
 for(let x=-80;x<W+100;x+=80){
  const xx=x-(cameraX*.8%80);
  ctx.strokeStyle="#3f2d20";
  ctx.lineWidth=1;
  line(xx,FLOOR,xx,H,"#3e2b1d66",1);

  for(let y=FLOOR+24;y<H;y+=38){
   line(xx,y,xx+80,y,"#e1b88a22",1);
  }
 }

 for(let i=0;i<100;i++){
  const x=(i*83-cameraX*.8)%W;
  const y=FLOOR+10+hash(i)*85;
  ctx.fillStyle="#ffffff0a";
  ctx.fillRect(x,y,2,1);
 }
}

/* =========================================================
   FENSTER
========================================================= */

function drawWindow(x,y,w,h){
 ctx.save();

 ctx.fillStyle="#594b3c";
 ctx.fillRect(x-7,y-7,w+14,h+14);

 const g=ctx.createLinearGradient(x,y,x+w,y+h);
 g.addColorStop(0,"#a6c4d0");
 g.addColorStop(1,"#d4e1dc");
 ctx.fillStyle=g;
 ctx.fillRect(x,y,w,h);

 ctx.fillStyle="#e9e4d9";
 ctx.fillRect(x+w/2-4,y,8,h);
 ctx.fillRect(x,y+h/2-4,w,8);

 ctx.strokeStyle="#f5f0e5";
 ctx.lineWidth=4;
 ctx.strokeRect(x,y,w,h);

 // dezente Spiegelungen
 ctx.fillStyle="#ffffff36";
 ctx.beginPath();
 ctx.moveTo(x+12,y+10);
 ctx.lineTo(x+35,y+10);
 ctx.lineTo(x+8,y+h-12);
 ctx.lineTo(x+8,y+35);
 ctx.closePath();
 ctx.fill();

 ctx.restore();
}

/* =========================================================
   MÖBEL
========================================================= */

function drawSofa(x,y){
 ctx.save();

 // Schatten
 ctx.fillStyle="#241c1640";
 ctx.beginPath();
 ctx.ellipse(x+110,y+5,120,9,0,0,Math.PI*2);
 ctx.fill();

 // Füße
 ctx.fillStyle="#4b3528";
 ctx.fillRect(x+22,y-20,12,22);
 ctx.fillRect(x+190,y-20,12,22);

 // Grundkörper
 rounded(x,y-76,225,65,12,"#6b7775","#3e4a48");
 rounded(x+9,y-116,207,66,14,"#89918a","#505a55");

 // Armlehnen
 rounded(x-7,y-105,32,75,9,"#697873","#45514d");
 rounded(x+199,y-105,32,75,9,"#697873","#45514d");

 // Sitzkissen
 rounded(x+29,y-76,80,34,8,"#a4a99c","#6a756b");
 rounded(x+115,y-76,80,34,8,"#a4a99c","#6a756b");

 // Rückenpolster
 rounded(x+31,y-109,77,39,8,"#9ca59a","#657169");
 rounded(x+116,y-109,77,39,8,"#9ca59a","#657169");

 line(x+110,y-105,x+110,y-44,"#d0d0b966",1);

 ctx.restore();
}

function drawBed(x,y){
 ctx.save();

 ctx.fillStyle="#35271d";
 ctx.fillRect(x+10,y-20,12,20);
 ctx.fillRect(x+220,y-20,12,20);

 rounded(x,y-78,245,62,5,"#795c43","#4e3929");
 rounded(x-5,y-103,255,32,6,"#ded7c8","#aaa18f");

 rounded(x+14,y-101,78,24,7,"#f0e8d8","#bcb3a3");
 rounded(x+102,y-101,78,24,7,"#e9e1d2","#bcb3a3");

 ctx.fillStyle="#7d91a1";
 ctx.fillRect(x+8,y-75,229,7);

 ctx.restore();
}

function drawDesk(x,y){
 ctx.save();

 ctx.fillStyle="#5b402b";
 ctx.fillRect(x,y-72,200,12);
 ctx.fillRect(x+8,y-60,10,60);
 ctx.fillRect(x+181,y-60,10,60);

 ctx.fillStyle="#a9784b";
 ctx.fillRect(x,y-78,200,8);

 // Schubladen
 rounded(x+18,y-60,42,27,3,"#9c7049","#60432c");
 rounded(x+66,y-60,42,27,3,"#9c7049","#60432c");
 ctx.fillStyle="#d4b58b";
 ctx.fillRect(x+36,y-48,8,2);
 ctx.fillRect(x+84,y-48,8,2);

 ctx.restore();
}

function drawComputer(x,y){
 ctx.save();

 // Bildschirm
 rounded(x,y-151,100,68,5,"#22272b","#101315");

 const screen=ctx.createLinearGradient(x,y-150,x+100,y-83);
 screen.addColorStop(0,computerOn?"#182b36":"#25282a");
 screen.addColorStop(1,computerOn?"#315064":"#111719");

 rounded(x+5,y-146,90,57,2,screen);

 if(computerOn){
  ctx.fillStyle="#9bc6d4";
  ctx.font="8px Arial";
  ctx.fillText("MEIN ZIMMER",x+13,y-132);
  ctx.fillStyle="#8bc9a0";
  ctx.fillRect(x+13,y-122,56,2);
  ctx.fillRect(x+13,y-115,40,2);

  const cursorX=x+16+(gameTime*20)%65;
  ctx.fillStyle="#fff";
  ctx.fillRect(cursorX,y-105,2,6);
 }

 ctx.fillStyle="#555b5e";
 ctx.fillRect(x+44,y-83,12,8);
 ctx.fillRect(x+32,y-76,36,4);

 // Tastatur
 rounded(x+15,y-73,75,5,2,"#33383a","#17191a");

 ctx.restore();
}

function drawWardrobe(x,y){
 ctx.save();

 // Korpus
 rounded(x,y-170,125,170,3,"#805c3d","#493422");

 ctx.fillStyle="#a47a51";
 ctx.fillRect(x+6,y-164,113,158);

 // Türen
 const open=wardrobeOpen;
 ctx.save();
 ctx.translate(x+62,y-164);
 ctx.rotate(-open*.85);
 ctx.fillStyle="#946b47";
 ctx.fillRect(-56,0,56,158);
 ctx.strokeStyle="#513a27";
 ctx.strokeRect(-56,0,56,158);
 ctx.fillStyle="#d4b183";
 ctx.beginPath();
 ctx.arc(-10,80,3,0,Math.PI*2);
 ctx.fill();
 ctx.restore();

 ctx.save();
 ctx.translate(x+62,y-164);
 ctx.rotate(open*.85);
 ctx.fillStyle="#89613f";
 ctx.fillRect(0,0,56,158);
 ctx.strokeStyle="#513a27";
 ctx.strokeRect(0,0,56,158);
 ctx.fillStyle="#d4b183";
 ctx.beginPath();
 ctx.arc(10,80,3,0,Math.PI*2);
 ctx.fill();
 ctx.restore();

 // Innenraum
 ctx.fillStyle="#30251d";
 ctx.fillRect(x+8,y-156,109,142);

 ctx.restore();
}

function drawSink(x,y){
 ctx.save();

 // Unterschrank
 rounded(x+15,y-72,145,72,4,"#8b6748","#4f3928");
 ctx.fillStyle="#b18a62";
 ctx.fillRect(x+21,y-65,133,57);

 // Waschbecken
 ctx.fillStyle="#d4d4cb";
 ctx.beginPath();
 ctx.roundRect(x,y-91,185,24,8);
 ctx.fill();
 ctx.strokeStyle="#797e7b";
 ctx.stroke();

 ctx.fillStyle="#a8aaa4";
 ctx.beginPath();
 ctx.ellipse(x+90,y-82,44,8,0,0,Math.PI*2);
 ctx.fill();

 // Wasserhahn
 ctx.strokeStyle="#858c8b";
 ctx.lineWidth=5;
 ctx.beginPath();
 ctx.moveTo(x+93,y-91);
 ctx.lineTo(x+93,y-112);
 ctx.quadraticCurveTo(x+93,y-121,x+108,y-121);
 ctx.lineTo(x+119,y-121);
 ctx.stroke();

 ctx.lineWidth=2;
 ctx.strokeStyle="#c6d9dc";
 ctx.beginPath();
 ctx.moveTo(x+119,y-121);
 ctx.lineTo(x+119,y-111);
 ctx.stroke();

 if(save.faucetOn){
  const waterHeight=18+Math.sin(gameTime*12)*3;
  ctx.strokeStyle="#83c8df";
  ctx.lineWidth=2;
  line(x+119,y-110,x+119,y-110+waterHeight,"#83c8df",2);
 }

 // Eimer
 rounded(x+133,y-39,31,36,4,"#71818a","#3f4c52");

 if(save.bucketWater>0){
  const fill=clamp(save.bucketWater,0,1);
  ctx.fillStyle="#69b9d2";
  ctx.fillRect(x+137,y-3-fill*29,23,fill*29);
 }

 ctx.restore();
}

function drawPlant(x,y){
 ctx.save();

 // Topf
 ctx.fillStyle="#9a6546";
 ctx.beginPath();
 ctx.moveTo(x-18,y-36);
 ctx.lineTo(x+18,y-36);
 ctx.lineTo(x+13,y);
 ctx.lineTo(x-13,y);
 ctx.closePath();
 ctx.fill();
 ctx.strokeStyle="#68432f";
 ctx.stroke();

 // Stängel
 line(x,y-35,x,y-90,"#496c45",3);

 for(let i=0;i<5;i++){
  const side=i%2?1:-1;
  const yy=y-48-i*9;
  ctx.save();
  ctx.translate(x,yy);
  ctx.rotate(side*.5);
  ctx.fillStyle=i%2?"#66855b":"#789369";
  ctx.beginPath();
  ctx.ellipse(side*12,-4,7,14,side*.3,0,Math.PI*2);
  ctx.fill();
  ctx.restore();
 }

 ctx.restore();
}

function drawShelf(x,y){
 ctx.save();

 ctx.fillStyle="#68472e";
 ctx.fillRect(x,y-75,120,7);
 ctx.fillRect(x+5,y-68,5,68);
 ctx.fillRect(x+110,y-68,5,68);

 ctx.fillStyle="#8e6744";
 ctx.fillRect(x+8,y-112,104,5);

 // Bücher
 const colors=["#9b574a","#607a83","#c09a5d","#6e795c"];
 for(let i=0;i<4;i++){
  ctx.fillStyle=colors[i];
  ctx.fillRect(x+12+i*18,y-108,14,32);
  ctx.fillStyle="#ffffff44";
  ctx.fillRect(x+15+i*18,y-104,2,24);
 }

 ctx.restore();
}

/* =========================================================
   INTERAKTIONEN
========================================================= */

function nearObject(obj){
 return Math.abs((player.x+24)-(obj.x+obj.w/2))<obj.w/2+42;
}

function setMessage(text){
 message=text;
 messageTimer=2.5;
 document.getElementById("hint").textContent=text;
}

function beginFurnitureAction(type,targetX){
 player.action=type;
 player.actionProgress=0;
 player.actionStartX=player.x;
 player.actionStartY=player.y;
 player.targetX=targetX;
 player.vx=0;
 player.vy=0;
 player.grounded=true;
}

function interact(){
 if(player.action!=="normal")return;

 if(nearObject(objects.wardrobe)){
  wardrobeOpen=1;
  setMessage("Kleiderschrank wird geöffnet ...");
  save.playerX=player.x;
  writeSave();
  setTimeout(()=>{
   window.location.href="Schrank.html";
  },260);
  return;
 }

 if(nearObject(objects.sofa)){
  sofaOccupied=!sofaOccupied;
  bedOccupied=false;

  if(sofaOccupied){
   beginFurnitureAction("sofa",objects.sofa.x+80);
   setMessage("Du setzt dich auf das Sofa.");
  }else{
   player.action="normal";
   setMessage("Du stehst wieder auf.");
  }
  return;
 }

 if(nearObject(objects.computer)){
  computerOn=!computerOn;
  setMessage(computerOn?"Computer eingeschaltet.":"Computer ausgeschaltet.");
  return;
 }

 if(nearObject(objects.bed)){
  bedOccupied=!bedOccupied;
  sofaOccupied=false;

  if(bedOccupied){
   beginFurnitureAction("bed",objects.bed.x+105);
   setMessage("Du legst dich ins Bett.");
  }else{
   player.action="normal";
   setMessage("Du stehst wieder auf.");
  }
  return;
 }

 if(nearObject(objects.sink)){
  save.faucetOn=!save.faucetOn;
  writeSave();
  setMessage(save.faucetOn?"Wasserhahn geöffnet.":"Wasserhahn geschlossen.");
  return;
 }

 if(nearObject(objects.city)){
  transition("Stadt.html");
  return;
 }

 setMessage("Hier gibt es gerade nichts zu tun.");
}

function dropItem(){
 if(!save.inventory.length){
  setMessage("Du hast gerade nichts im Inventar.");
  return;
 }

 const item=save.inventory.pop();
 writeSave();
 setMessage(item+" wurde abgelegt.");
}

/* =========================================================
   ÜBERGANG
========================================================= */

function transition(url){
 save.playerX=player.x;
 writeSave();

 const fade=document.getElementById("fade");
 fade.style.opacity="1";

 setTimeout(()=>{
  window.location.href=url;
 },350);
}

/* =========================================================
   PHYSIK UND UPDATE
========================================================= */

function update(dt){
 gameTime+=dt;

 if(messageTimer>0){
  messageTimer-=dt;
  if(messageTimer<=0){
   document.getElementById("hint").textContent=
    "A / D oder ← / → bewegen · Leertaste springen · E interagieren";
  }
 }

 if(player.action==="sofa"||player.action==="bed"){
  player.actionProgress=clamp(player.actionProgress+dt*3,0,1);

  player.x=lerp(
   player.actionStartX,
   player.targetX,
   player.actionProgress
  );

  player.vx=0;
  player.vy=0;
  player.grounded=true;

  if(player.actionProgress>=1){
   player.action="seated";
  }
 }else if(player.action==="seated"){
  player.vx=0;
  player.vy=0;
  player.grounded=true;
 }else{
  let direction=0;
  if(keys["a"]||keys["arrowleft"])direction--;
  if(keys["d"]||keys["arrowright"])direction++;

  const speed=230;

  player.vx=direction*speed;

  if(direction!==0){
   player.facing=direction;
  }

  player.x+=player.vx*dt;
  player.x=clamp(player.x,40,WORLD-80);

  // Schwerkraft
  const gravity=1100;
  player.vy+=gravity*dt;
  player.y+=player.vy*dt;

  const groundY=FLOOR-player.height;

  if(player.y>=groundY){
   if(!player.grounded&&player.vy>120){
    player.landing=.25;
   }

   player.y=groundY;
   player.vy=0;
   player.grounded=true;
  }else{
   player.grounded=false;
  }

  if(player.grounded&&direction!==0){
   player.walk+=dt*10;
  }
 }

 if(player.action==="seated"){
  if(player.actionProgress>=1){
   if(sofaOccupied){
    player.y=FLOOR-player.height+8;
   }else if(bedOccupied){
    player.y=FLOOR-player.height+12;
   }
  }
 }else if(player.action==="normal"){
  // Kein künstliches Schweben: Füße stehen auf dem Boden.
 }

 if(player.landing>0){
  player.landing=Math.max(0,player.landing-dt);
 }

 wardrobeOpen=lerp(wardrobeOpen,0,dt*2.5);

 if(save.faucetOn){
  save.bucketWater=clamp(save.bucketWater+dt*.12,0,1);
  saveTimer+=dt;

  if(saveTimer>.5){
   saveTimer=0;
   writeSave();
  }
 }

 cameraX=clamp(player.x-W/2,0,WORLD-W);

 save.playerX=player.x;

 if(messageTimer<=0){
  const obj=getNearbyObject();
  if(obj){
   document.getElementById("hint").textContent=
    "E – "+obj.label+" benutzen";
  }else{
   document.getElementById("hint").textContent=
    "A / D oder ← / → bewegen · Leertaste springen · E interagieren";
  }
 }
}

function getNearbyObject(){
 const order=[
  objects.wardrobe,
  objects.sofa,
  objects.computer,
  objects.bed,
  objects.sink,
  objects.city
 ];

 for(const obj of order){
  if(nearObject(obj))return obj;
 }
 return null;
}

/* =========================================================
   SPIELER ZEICHNEN
========================================================= */

function drawPlayer(){
 ctx.save();
 ctx.translate(-cameraX,0);

 drawPlayerShadow();

 if(player.action==="seated"){
  // Der Stuhl bleibt bei Möbelaktionen in einer ruhigen Sitzpose.
  ctx.save();
  ctx.translate(0,0);
  drawChair(gameTime);
  ctx.restore();
 }else{
  drawChair(gameTime);
 }

 ctx.restore();
}

/* =========================================================
   HUD UND RENDERING
========================================================= */

function draw(){
 ctx.clearRect(0,0,W,H);

 drawWorld();
 drawPlayer();

 // kleine Positionsanzeige
 document.getElementById("position").textContent=
  "Zimmer · "+Math.round(player.x)+" m";
}

/* =========================================================
   MULTIPLAYER – OPTIONAL
========================================================= */

let onlineRoom=null;
let onlineReady=false;

async function initOnline(){
 try{
  const roomId=sessionStorage.getItem("mein-zimmer-active-room");
  if(!roomId||!window.GameOnline)return;

  const game=window.GameOnline;

  if(typeof game.login==="function"){
   await game.login("Spieler");
  }

  const client=typeof game.getClient==="function"
   ?game.getClient()
   :null;

  if(!client)return;

  onlineRoom={id:roomId,game};
  onlineReady=true;

  if(typeof game.watchPlayers==="function"){
   game.watchPlayers(roomId,players=>{
    // Andere Spieler können hier bei Bedarf dargestellt werden.
   });
  }

  document.getElementById("status").textContent="Online";
 }catch(e){
  onlineReady=false;
  document.getElementById("status").textContent="Offline";
 }
}

async function sendOnline(dt){
 if(!onlineReady||!onlineRoom)return;

 onlineTimer+=dt;
 if(onlineTimer<.15)return;
 onlineTimer=0;

 try{
  const game=onlineRoom.game;
  if(typeof game.updatePosition==="function"){
   await game.updatePosition(
    onlineRoom.id,
    "zimmer",
    player.x,
    player.y
   );
  }
 }catch(e){}
}

/* =========================================================
   SPIELSCHLEIFE
========================================================= */

function loop(timestamp){
 if(!lastTime)lastTime=timestamp;

 const dt=Math.min((timestamp-lastTime)/1000,.033);
 lastTime=timestamp;

 update(dt);
 draw();
 sendOnline(dt);

 requestAnimationFrame(loop);
}

window.addEventListener("beforeunload",()=>{
 save.playerX=player.x;
 writeSave();
});

initOnline();
requestAnimationFrame(loop);

</script>
