    function playTone(freq=440, duration=.07, wave="square") {
      if (!soundOn) return;
      try {
        audio ||= new (window.AudioContext || window.webkitAudioContext)();
        if (audio.state === "suspended") audio.resume();
        const osc = audio.createOscillator();
        const gain = audio.createGain();
        osc.type = wave;
        osc.frequency.value = freq;
        gain.gain.setValueAtTime(.045, audio.currentTime);
        gain.gain.exponentialRampToValueAtTime(.001, audio.currentTime + duration);
        osc.connect(gain);
        gain.connect(audio.destination);
        osc.start();
        osc.stop(audio.currentTime + duration);
      } catch {}
    }

    function rect(x,y,w,h,color) {
      ctx.fillStyle = color;
      ctx.fillRect(Math.round(x),Math.round(y),Math.round(w),Math.round(h));
    }

    function line(x1,y1,x2,y2,color,width=2) {
      ctx.strokeStyle = color;
      ctx.lineWidth = width;
      ctx.lineCap = "square";
      ctx.beginPath();
      ctx.moveTo(Math.round(x1),Math.round(y1));
      ctx.lineTo(Math.round(x2),Math.round(y2));
      ctx.stroke();
    }

    function pixelText(text,x,y,color="#433a38",size=10) {
      ctx.fillStyle = color;
      ctx.font = `${size}px monospace`;
      ctx.fillText(text,x,y);
    }

    function drawFaucetWater() {
      if (!save.faucetOn) return;
      const under = bucket.x + bucket.w > 805 && bucket.x < 855 &&

      const endY = under ? bucket.y + 5 : 329;
      const wobble = Math.sin(gameTime*15)*1.5;

      for(let i=0;i<5;i++) {
        const yy = 302 + ((gameTime*42+i*17)%Math.max(8,endY-302));
        rect(847+Math.round(Math.sin(gameTime*8+i)*2),yy,3,4,"#d6f5ff");

      if (under && save.bucketWater > 0) {

        rect(bucket.x+5,bucket.y+bucket.h-6-fill,bucket.w-10,fill,"#69c9e7");

    }

    function drawStar(x,y,r,color) {
      ctx.fillStyle=color;
      ctx.beginPath();
      for(let i=0;i<10;i++) {
        const a=-Math.PI/2+i*Math.PI/5;
        const rr=i%2===0?r:r*.45;
        const px=x+Math.cos(a)*rr, py=y+Math.sin(a)*rr;
        if(i===0) ctx.moveTo(px,py); else ctx.lineTo(px,py);
      }
      ctx.closePath();
      ctx.fill();
    }

    function drawPlayer() {
      const x=player.x, y=player.y;
      const f=player.facing;
      const moving=Math.abs(player.vx)>.1 && player.grounded && !dragging;
      const swing=moving ? Math.sin(player.walk)*7 : 0;
      const lift=player.grounded ? 0 : Math.sin(gameTime*12)*1.5;
      const skin="#d5b18a", edge="#805b3c", wood="#b98552", light="#dfb47b";
      const centerX=x+player.w/2;
      const shoulderY=y+31+lift;
      const hipY=y+52+lift;
      const headY=y+7+lift;

      // Schatten
      rect(centerX-18,FLOOR-3,36,3,"#805d46");
      rect(centerX-12,FLOOR-5,24,2,"#8b6b52");

      // Legs: joints linked together
      const leftHip={x:centerX-5,y:hipY};
      const rightHip={x:centerX+5,y:hipY};
      const leftKnee={x:centerX-7-swing*.4,y:y+65+lift};
      const rightKnee={x:centerX+7+swing*.4,y:y+65+lift};
      const leftFoot={x:centerX-9+swing,y:y+77+lift};
      const rightFoot={x:centerX+9-swing,y:y+77+lift};

      function segment(a,b,width,color,outline=edge) {
        line(a.x,a.y,b.x,b.y,outline,width+4);
        line(a.x,a.y,b.x,b.y,color,width);
        rect(a.x-width/2,a.y-width/2,width,width,light);
      }
      function joint(p,r=4) {
        rect(p.x-r-1,p.y-r-1,(r+1)*2,(r+1)*2,edge);
        rect(p.x-r,p.y-r,r*2,r*2,wood);
        rect(p.x-r+1,p.y-r+1,Math.max(2,r-1),2,light);
      }

      segment(leftHip,leftKnee,7,wood);
      segment(leftKnee,leftFoot,6,wood);
      segment(rightHip,rightKnee,7,wood);
      segment(rightKnee,rightFoot,6,wood);
      joint(leftHip,4); joint(leftKnee,4); joint(leftFoot,3);
      joint(rightHip,4); joint(rightKnee,4); joint(rightFoot,3);

      // Füße
      rect(leftFoot.x-5,leftFoot.y-1,10,5,edge);
      rect(leftFoot.x-4,leftFoot.y,8,3,wood);
      rect(rightFoot.x-5,rightFoot.y-1,10,5,edge);
      rect(rightFoot.x-4,rightFoot.y,8,3,wood);

      // Arme, mit Schulter-, Ellenbogen- und Handgelenken
      const leftShoulder={x:centerX-10,y:shoulderY};
      const rightShoulder={x:centerX+10,y:shoulderY};
      const leftElbow={x:centerX-15-swing*.55,y:y+43+lift};
      const rightElbow={x:centerX+15+swing*.55,y:y+43+lift};
      const leftHand={x:centerX-14-swing,y:y+54+lift};
      const rightHand={x:centerX+14+swing,y:y+54+lift};

      segment(leftShoulder,leftElbow,6,wood);
      segment(leftElbow,leftHand,5,wood);
      segment(rightShoulder,rightElbow,6,wood);
      segment(rightElbow,rightHand,5,wood);
      joint(leftShoulder,4); joint(rightShoulder,4);
      joint(leftElbow,3); joint(rightElbow,3);
      joint(leftHand,3); joint(rightHand,3);

      // Torso: zusammenhängender Körper
      rect(centerX-11,shoulderY-3,22,24,edge);
      rect(centerX-8,shoulderY,16,18,wood);
      rect(centerX-6,shoulderY+2,4,13,light);
      rect(centerX-5,hipY-1,10,5,edge);
      rect(centerX-4,hipY,8,3,wood);

      // Kleidung sitzt auf dem Torso
      const clothes=save.equipped.clothes;
      if(clothes==="scarf") {
        rect(centerX-10,shoulderY-2,20,6,"#4d995f");
        rect(centerX+3,shoulderY+1,5,15,"#4d995f");
        rect(centerX+4,shoulderY+2,2,11,"#78b27c");
      } else if(clothes==="shirt" || clothes==="hoodie") {
        const c=clothes==="shirt" ? "#c64c48" : "#3977bd";
        rect(centerX-10,shoulderY-2,20,20,c);
        rect(centerX-4,shoulderY+1,3,14,clothes==="shirt"?"#e1786b":"#6697d2");
        if(clothes==="hoodie") {
          rect(centerX-7,shoulderY-5,14,6,"#28578b");
          rect(centerX-3,shoulderY+13,6,3,"#244f7e");
        }
      }

      // Hals
      rect(centerX-4,shoulderY-7,8,7,edge);
      rect(centerX-3,shoulderY-6,6,6,wood);

      // Kopf: ein geschlossener, symmetrischer Block
      const headX=centerX-11;
      rect(headX,headY,22,23,edge);
      rect(headX+2,headY+2,18,19,skin);
      rect(headX+4,headY+4,14,15,wood);
      rect(headX+5,headY+5,4,11,light);
      rect(headX+10,headY+5,7,11,"#c99a64");
      rect(headX+5,headY+17,12,2,edge);

      // Gesicht
      rect(centerX-6,headY+10,3,3,"#43362c");
      rect(centerX+4,headY+10,3,3,"#43362c");
      rect(centerX-2,headY+16,5,2,"#8c5944");

      // Cosmetics
      if(save.equipped.head==="cap") {
        rect(centerX-13,headY+1,26,5,"#3977bd");
        rect(centerX-10,headY-5,20,7,"#3977bd");
        rect(centerX+4,headY+4,10,3,"#285a91");
        rect(centerX-7,headY-3,9,2,"#79a9e3");
      } else if(save.equipped.head==="crown") {
        rect(centerX-12,headY-4,24,5,"#d8a92e");
        rect(centerX-12,headY-11,5,8,"#f4c64e");
        rect(centerX-4,headY-14,6,11,"#f4c64e");
        rect(centerX+5,headY-10,6,7,"#f4c64e");
        rect(centerX-9,headY-3,18,2,"#fff0a4");
      }

      if(save.equipped.face==="glasses") {
        rect(centerX-9,headY+9,8,6,"#29323c");
        rect(centerX+1,headY+9,8,6,"#29323c");
        rect(centerX-1,headY+11,2,2,"#29323c");
        rect(centerX-7,headY+10,4,2,"#9fc9d6");
        rect(centerX+3,headY+10,4,2,"#9fc9d6");
      }
    }

    function getNearby() {
      const px=player.x+player.w/2;
      const py=player.y+player.h/2;
      let best=null, bestDistance=Infinity;

      for(const obj of objects) {
        let ox=obj.x+obj.w/2, oy=obj.y+obj.h/2;
        if(obj.id==="wardrobe") { ox=130; oy=270; }
        if(obj.id==="computer") { ox=636; oy=292; }
        if(obj.id==="faucet") { ox=842; oy=300; }
        if(obj.id==="door") { ox=900; oy=370; }
        if(obj.id==="sink") { ox=830; oy=355; }
        if(obj.id==="bucket") { ox=bucket.x+bucket.w/2; oy=bucket.y+bucket.h/2; }
        const d=Math.hypot(px-ox,py-oy);
        if(d<72 && d<bestDistance) {best=obj;bestDistance=d;}
      }
      return best;
    }

    function collidesWithFurniture(nextX) {
      const bodyLeft=nextX+4;
      const bodyRight=nextX+player.w-4;
      const bodyTop=player.y+22;
      const bodyBottom=player.y+player.h;

      // Bett, Schrank, Tisch und Waschbecken blockieren den Laufweg.
      const solids=[
        {x:45,y:315,w:236,h:124},
        {x:69,y:164,w:125,h:171},
        {x:541,y:328,w:204,h:111},
        {x:769,y:323,w:123,h:116}
      ];
      for(const s of solids) {
        const horizontal=bodyRight>s.x && bodyLeft<s.x+s.w;
        const vertical=bodyBottom>s.y+12 && bodyTop<s.y+s.h;
        if(horizontal && vertical) {
          const currentCenter=player.x+player.w/2;
          const objectCenter=s.x+s.w/2;
          return currentCenter<objectCenter ? s.x-player.w-3 : s.x+s.w+3;
        }
      }
      return null;
    }

    function update(dt) {
      gameTime+=dt;

      if(!dragging && !activePanel) {
        const left=keys.has("a")||keys.has("arrowleft");
        const right=keys.has("d")||keys.has("arrowright");
        const speed=185;
        player.vx=left?-speed:right?speed:0;
        if(player.vx) {
          player.facing=player.vx>0?1:-1;
          player.walk+=dt*10;
        }

        const nextX=player.x+player.vx*dt;
        const blocked=collidesWithFurniture(nextX);
        player.x=blocked===null?nextX:blocked;
        player.x=Math.max(8,Math.min(W-player.w-8,player.x));

        player.vy+=580*dt;
        player.y+=player.vy*dt;
        if(player.y+player.h>=FLOOR) {
          player.y=FLOOR-player.h;
          player.vy=0;
          player.grounded=true;
        } else {
          player.grounded=false;
        }
      }

      // Wasser kann nur im Becken-/Eimerbereich aufgefangen werden.
      if(save.faucetOn) {
        faucetTimer+=dt;
        const under=bucket.x<858 && bucket.x+bucket.w>842 &&
                     bucket.y+bucket.h>=FLOOR-40;
        if(under) {
          save.bucketWater=Math.min(1,save.bucketWater+dt*.035);
        }
      } else {
        faucetTimer=0;
      }

      // Lieferzeit läuft in Spielzeit; pausiert, wenn das Spiel geschlossen ist.
      let changed=false;
      for(const order of save.orders) {
        if(order.status==="ordered") {
          order.remaining-=dt;
          if(order.remaining<=0) {
            order.remaining=0;
            order.status="arrived";
            changed=true;
            playTone(660,.15,"triangle");
            showHint("Ding-dong! Der Postbote ist da. Schau an der Tür nach.");
          }
        }
      }
      if(changed || Math.floor(gameTime)%3===0) persist();
    }

    function screenToWorld(event) {
      const rect=canvas.getBoundingClientRect();
      const scale=Math.min(rect.width/W,rect.height/H);
      const drawnW=W*scale, drawnH=H*scale;
      const offsetX=(rect.width-drawnW)/2;
      const offsetY=(rect.height-drawnH)/2;
      return {
        x:(event.clientX-rect.left-offsetX)/scale,
        y:(event.clientY-rect.top-offsetY)/scale
      };
    }

    canvas.addEventListener("pointerdown",event=>{
      if(activePanel) return;
      const p=screenToWorld(event);
      const px=player.x, py=player.y;
      if(p.x>=px-8 && p.x<=px+player.w+8 && p.y>=py-8 && p.y<=py+player.h+8) {
        dragging=true;
        player.dragging=true;
        dragOffset={x:p.x-player.x,y:p.y-player.y};
        canvas.setPointerCapture(event.pointerId);
        playTone(330,.04,"triangle");
      }
    });

    canvas.addEventListener("pointermove",event=>{
      if(!dragging) return;
      const p=screenToWorld(event);
      player.x=Math.max(8,Math.min(W-player.w-8,p.x-dragOffset.x));
      player.y=Math.max(12,Math.min(FLOOR-player.h,p.y-dragOffset.y));
      player.vx=0;
      player.vy=0;
      player.grounded=player.y+player.h>=FLOOR;
    });

    function stopDragging() {
      if(!dragging) return;
      dragging=false;
      player.dragging=false;
      player.vy=0;
      player.grounded=player.y+player.h>=FLOOR;
      if(!player.grounded) playTone(220,.06,"triangle");
    }
    canvas.addEventListener("pointerup",stopDragging);
    canvas.addEventListener("pointercancel",stopDragging);
    window.addEventListener("pointerup",stopDragging);

    window.addEventListener("keydown",event=>{
      const key=event.key.toLowerCase();
      if(["arrowleft","arrowright","arrowup"," "].includes(key)) event.preventDefault();
      if(key==="escape") {
        if(activePanel) closePanel();
        return;
      }
      if(activePanel) return;
      keys.add(key);
      if((key==="w"||key==="arrowup"||key===" ") && player.grounded && !dragging) {
        player.vy=-290;
        player.grounded=false;
        playTone(340,.06,"triangle");
      }
      if(key==="e"&&!event.repeat) interact();
    });

    window.addEventListener("keyup",event=>keys.delete(event.key.toLowerCase()));
    window.addEventListener("blur",()=>keys.clear());
    $("closePanel").addEventListener("click",closePanel);
    $("soundButton").addEventListener("click",()=>{
      soundOn=!soundOn;
      $("soundButton").textContent=soundOn?"♫":"×";
      showHint(soundOn?"Sound eingeschaltet.":"Sound ausgeschaltet.");
      if(soundOn) playTone(494,.07,"triangle");
    });

    function loop(now) {
      const dt=Math.min(.04,Math.max(0,(now-lastTime)/1000));
      lastTime=now;
      update(dt);
      draw();
      requestAnimationFrame(loop);
    }

    $("money").textContent=save.money;
    persist();
    showHint("Willkommen! Geh zum Schrank oder Computer und drücke E.");
    requestAnimationFrame(loop);
  })();
  </script>
</body>
</html>
