<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>MEIN ZIMMER</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#17191b;font-family:Arial,sans-serif}
canvas{display:block;width:100%;height:100%}
#hud{position:fixed;top:14px;left:14px;padding:12px 16px;background:#17191be8;color:white;border:1px solid #ffffff22;border-radius:11px;font-size:12px;line-height:1.7;pointer-events:none}
#hint{position:fixed;bottom:15px;left:50%;transform:translateX(-50%);padding:10px 15px;background:#17191be8;color:white;border-radius:10px;font-size:12px;white-space:nowrap;pointer-events:none}
#prompt{position:fixed;bottom:65px;left:50%;transform:translateX(-50%);padding:10px 16px;background:#17191bed;color:white;border-radius:9px;font-size:13px;display:none;white-space:nowrap}
</style>
</head>
<body>
<canvas id="world"></canvas>
<div id="hud"><b>MEIN ZIMMER</b><br><span id="status">Willkommen zu Hause</span><br><span id="held">Hände frei</span></div>
<div id="prompt"></div>
<div id="hint">A / D · Laufen | LEERTASTE · Springen | E · Interagieren | Q · Ablegen</div>

<script>
"use strict";

const canvas=document.getElementById("world");
const ctx=canvas.getContext("2d");
const statusText=document.getElementById("status");
const heldText=document.getElementById("held");
const prompt=document.getElementById("prompt");

const W=960,H=540,FLOOR=440,WORLD=3100;
const SAVE_KEY="mein-zimmer-save-v1";

let sx=1,sy=1,cameraX=0,last=0,time=0;

function resize(){
 const d=Math.min(devicePixelRatio||1,2);
 canvas.width=innerWidth*d;
 canvas.height=innerHeight*d;
 sx=canvas.width/W;
 sy=canvas.height/H;
}
addEventListener("resize",resize);
resize();

const keys={};

addEventListener("keydown",e=>{
 const k=e.key.toLowerCase();
 keys[k]=true;

 if([" ","arrowleft","arrowright","arrowup"].includes(k))e.preventDefault();

 if(!e.repeat){
  if(k===" "||k==="arrowup"||k==="w")jump();
  if(k==="e")interact();
  if(k==="q")dropItem();
 }
});

addEventListener("keyup",e=>keys[e.key.toLowerCase()]=false);

const player={
 x:180,y:FLOOR-68,vx:0,vy:0,
 width:48,height:68,
 grounded:true,facing:1,walk:0,
 held:null,landing:0
};

const objects=[

 {id:"Paket",type:"box",x:680,y:0,w:43,h:38},

 {id:"Blumentopf",type:"plant",x:1240,y:0,w:34,h:50},
 {id:"Buch",type:"book",x:1640,y:0,w:39,h:12,color:"#89534b"}

const furniture=[
 {type:"table",x:470,y:FLOOR,w:180,h:85},
 {type:"sofa",x:790,y:FLOOR,w:240,h:110},

 {type:"lamp",x:1730,y:FLOOR,w:65,h:170},
 {type:"plant",x:2010,y:FLOOR,w:65,h:105},

const doors=[

 {x:2910,w:100,label:"Stadt",url:"Stadt.html"}

let waterOn=false;
let tapAngle=0;
let tapTarget=0;

const defaults={
 money:120,
 unlocked:[],
 equipped:{head:null,face:null,clothes:null,back:null,pants:null},
 inventory:[],
 placed:[],
 orders:[],
 received:[],
 faucetOn:false,
 bucketWater:0
};

function readSave(){
 try{
  const s=JSON.parse(localStorage.getItem(SAVE_KEY)||"null");
  return s?{
   ...defaults,
   ...s,
   equipped:{...defaults.equipped,...(s.equipped||{})}
  }:structuredClone(defaults);
 }catch{
  return structuredClone(defaults);
 }
}

let wardrobe=readSave().equipped;

addEventListener("storage",e=>{
 if(e.key===SAVE_KEY)wardrobe=readSave().equipped;
});

function clamp(v,a,b){
 return Math.max(a,Math.min(b,v));
}

function lerp(a,b,t){
 return a+(b-a)*t;
}

function gradient(x,y,w,h,c1,c2){
 const g=ctx.createLinearGradient(x,y,x+w,y+h);
 g.addColorStop(0,c1);
 g.addColorStop(1,c2);
 return g;
}

function rounded(x,y,w,h,r,fill,stroke){
 ctx.beginPath();
 ctx.roundRect(x,y,w,h,r);
 if(fill){
  ctx.fillStyle=fill;
  ctx.fill();
 }
 if(stroke){
  ctx.strokeStyle=stroke;
  ctx.stroke();
 }
}

function ellipse(x,y,rx,ry,fill){
 ctx.beginPath();
 ctx.ellipse(x,y,rx,ry,0,0,Math.PI*2);
 ctx.fillStyle=fill;
 ctx.fill();
}

function hash(n){
 const v=Math.sin(n*127.1+311.7)*43758.5453;
 return v-Math.floor(v);
}

function wood(x,y,w,h,base="#a8794e",seed=1){
 ctx.save();
 rounded(x+1,y+2,w,h,2,"#35271d33");
 rounded(x,y,w,h,2,gradient(x,y,w,h,"#d5b18a",base),"#62452f");

 ctx.beginPath();
 ctx.rect(x+1,y+1,Math.max(0,w-2),Math.max(0,h-2));
 ctx.clip();

 for(let i=0;i<Math.max(3,Math.floor(h/4));i++){
  const yy=y+hash(seed+i)*h;
  ctx.beginPath();
  ctx.moveTo(x-2,yy);
  ctx.bezierCurveTo(x+w*.25,yy,x+w*.7,yy-1,x+w+2,yy);
  ctx.strokeStyle=i%3===0?"#f5d7ae":"#513820";
  ctx.globalAlpha=i%3===0?.16:.09;
  ctx.lineWidth=.7;
  ctx.stroke();
 }

 ctx.globalAlpha=1;
 ctx.restore();
 ctx.strokeStyle="#f5d7ae66";
 ctx.lineWidth=1;
 ctx.beginPath();
 ctx.moveTo(x+2,y+1);
 ctx.lineTo(x+w-2,y+1);
 ctx.stroke();
}

function fabric(x,y,w,h,color){
 ctx.save();
 ctx.beginPath();
 ctx.roundRect(x,y,w,h,2);
 ctx.fillStyle=color;
 ctx.fill();
 ctx.strokeStyle="#45382d";
 ctx.lineWidth=.8;
 ctx.stroke();
 ctx.save();
 ctx.beginPath();
 ctx.roundRect(x+1,y+1,w-2,h-2,2);
 ctx.clip();

 for(let i=0;i<Math.floor(w*h/15);i++){
  ctx.fillStyle=i%2?"#ffffff":"#26302c";
  ctx.globalAlpha=.1;
  ctx.fillRect(x+hash(i+17)*w,y+hash(i+900)*h,2,1);
 }

 ctx.restore();
 ctx.globalAlpha=1;
 ctx.restore();
}

function shadow(x,y,rx,alpha=.2){
 ctx.save();
 ctx.globalAlpha=alpha;
 ellipse(x,y,rx,5,"#17130f");
 ctx.restore();
}

function softLight(x,y,rx,ry,color,alpha){
 ctx.save();
 ctx.globalAlpha=alpha;
 const g=ctx.createRadialGradient(x,y,0,x,y,rx);
 g.addColorStop(0,color);
 g.addColorStop(1,"#ffffff00");
 ctx.fillStyle=g;
 ctx.beginPath();
 ctx.ellipse(x,y,rx,ry,0,0,Math.PI*2);
 ctx.fill();
 ctx.restore();
}

/* FENSTER */

function drawWindow(x){
 ctx.fillStyle="#776957";
 ctx.fillRect(x-12,48,264,220);

 wood(x-9,47,258,12,"#806348",x);
 wood(x-9,250,258,13,"#806348",x+2);
 wood(x-9,48,12,214,"#876747",x+3);
 wood(x+237,48,12,214,"#876747",x+4);

 ctx.fillStyle=gradient(x,60,0,190,"#86b8d3","#e5e4d8");
 ctx.fillRect(x+3,60,234,190);

 ctx.fillStyle="#a3ad94";
 ctx.beginPath();
 ctx.moveTo(x+3,174);
 ctx.quadraticCurveTo(x+54,138,x+104,174);
 ctx.quadraticCurveTo(x+168,132,x+237,177);
 ctx.lineTo(x+237,250);
 ctx.lineTo(x+3,250);
 ctx.fill();

 ctx.fillStyle="#849879";
 ctx.beginPath();
 ctx.moveTo(x+3,198);
 ctx.quadraticCurveTo(x+70,166,x+126,199);
 ctx.quadraticCurveTo(x+181,164,x+237,197);
 ctx.lineTo(x+237,250);
 ctx.lineTo(x+3,250);
 ctx.fill();

 for(let i=0;i<20;i++){
  ellipse(x+8+i*12,199+hash(i+x)*22,10+hash(i+50)*7,7+hash(i+70)*6,i%2?"#718968":"#92a17c");
 }

 ctx.save();
 ctx.globalAlpha=.16;
 ctx.fillStyle="#fff";
 ctx.beginPath();
 ctx.moveTo(x+8,62);
 ctx.lineTo(x+66,62);
 ctx.lineTo(x+143,247);
 ctx.lineTo(x+110,247);
 ctx.closePath();
 ctx.fill();
 ctx.restore();

 wood(x+113,59,9,193,"#e7dfd0",x+5);
 wood(x+4,151,232,9,"#e7dfd0",x+6);
 ctx.strokeStyle="#ffffffa0";
 ctx.strokeRect(x+4,60,233,190);
 wood(x-17,250,274,12,"#a38463",x+7);
 wood(x-12,246,264,5,"#d0b28d",x+8);
 softLight(x+120,255,160,120,"#fff2c8",.09);
}

/* ZIMMER */

function drawRoom(){
 ctx.fillStyle=gradient(0,0,WORLD,FLOOR,"#eee9df","#d7cfc3");
 ctx.fillRect(0,0,WORLD,FLOOR);

 ctx.save();
 for(let i=0;i<1800;i++){
  ctx.fillStyle=i%2?"#fff":"#887b69";
  ctx.globalAlpha=.035;
  ctx.fillRect(hash(i+10)*WORLD,hash(i+4000)*FLOOR,1+hash(i)*2,1);
 }
 ctx.restore();

 ctx.strokeStyle="#ffffff25";
 for(let x=0;x<WORLD;x+=160){
  ctx.beginPath();
  ctx.moveTo(x,0);
  ctx.lineTo(x,FLOOR);
  ctx.stroke();
 }

 [100,1040,1880].forEach(drawWindow);

 for(const x of [490,1510]){
  shadow(x+40,191,48,.12);
  wood(x,92,82,94,"#70543b",x);
  ctx.fillStyle="#eee7d9";
  ctx.fillRect(x+6,98,70,82);
  ctx.fillStyle=gradient(x+7,100,68,80,"#b4c9c9","#e4d9c2");
  ctx.fillRect(x+7,100,68,80);
  ctx.fillStyle="#899a78";
  ctx.beginPath();
  ctx.moveTo(x+9,174);
  ctx.quadraticCurveTo(x+39,112,x+72,174);
  ctx.fill();
 }

 ctx.fillStyle="#9d856d";
 ctx.fillRect(0,416,WORLD,24);
 ctx.fillStyle="#d6c2a9";
 ctx.fillRect(0,416,WORLD,5);

 ctx.fillStyle=gradient(0,FLOOR,0,100,"#b99570","#76563d");
 ctx.fillRect(0,FLOOR,WORLD,100);

 for(let row=0;row<4;row++){
  const y=FLOOR+row*25;
  ctx.fillStyle=row%2?"#987451":"#a9825d";
  ctx.fillRect(0,y,WORLD,25);
  ctx.strokeStyle="#65472f88";
  ctx.beginPath();
  ctx.moveTo(0,y);
  ctx.lineTo(WORLD,y);
  ctx.stroke();

  for(let x=(row%2)*65;x<WORLD;x+=130){
   ctx.strokeStyle="#63472e66";
   ctx.beginPath();
   ctx.moveTo(x,y);
   ctx.lineTo(x,y+25);
   ctx.stroke();
  }
 }
}

/* SPIELSTUHL */

function drawChairLeg(x,y,angle){
 ctx.save();
 ctx.translate(x,y);
 ctx.rotate(angle);

 ctx.fillStyle=gradient(-3,0,7,42,"#d2a16c","#75482b");
 ctx.strokeStyle="#634127";
 ctx.lineWidth=1;

 ctx.beginPath();
 ctx.moveTo(-3,0);
 ctx.lineTo(-2.5,39);
 ctx.quadraticCurveTo(0,42,2.5,39);
 ctx.lineTo(3,0);
 ctx.closePath();
 ctx.fill();
 ctx.stroke();

 ctx.strokeStyle="#f1c28b88";
 ctx.lineWidth=.8;
 ctx.beginPath();
 ctx.moveTo(-1.5,3);
 ctx.lineTo(-1,36);
 ctx.stroke();

 ctx.restore();
}

 if(c.clothes){

  ctx.save();
  fabric(25,9,9,53,color);
  fabric(21,68,76,7,color);

  if(c.clothes==="scarf"){
   ctx.fillStyle="#347849";
   ctx.fillRect(25,10,9,8);

  }

   ctx.fillRect(26,20,6,5);
   ctx.fillRect(26,39,6,5);

 }

 if(c.face){
  ctx.save();
  const x=29,y=36;

  if(c.face==="glasses"||c.face==="sunglasses"){
   ctx.strokeStyle=c.face==="glasses"?"#29323c":"#17232c";
   ctx.lineWidth=1.5;

   if(c.face==="sunglasses"){
    ctx.fillStyle="#17232c";
    ctx.fillRect(x-4,y-4,4,5);
    ctx.fillRect(x+1,y-4,4,5);
   }else{

  if(c.face==="heart_glasses"||c.face==="star_glasses"){
   ctx.fillStyle=c.face==="heart_glasses"?"#d94d6c":"#e9bd46";
   ctx.font="10px Arial";
   ctx.fillText(c.face==="heart_glasses"?"♥":"★",x-5,y+3);
  }

  if(c.face==="monocle"){
   ctx.strokeStyle="#d6a94d";

 }

 if(c.head){

   ctx.closePath();

   ctx.fillStyle="#f6d56c";
   ctx.fillRect(29,-9,6,5);

  if(c.head==="bucket_hat"){
   ctx.fillStyle="#8b969a";
   ctx.fillRect(19,-8,27,13);
   ctx.fillRect(16,3,33,4);
   ctx.fillStyle="#b9c2c4";
   ctx.fillRect(25,-12,15,5);
  }

  ctx.restore();
 }
}

/* STUHL */

function drawChair(){
 const moving=Math.abs(player.vx)>8&&player.grounded;
 const airborne=!player.grounded;
 const phase=player.walk;

 let rearAngle=0,frontAngle=0;

 if(moving){
  rearAngle=Math.sin(phase)*.13;
  frontAngle=Math.sin(phase+Math.PI)*.13;
 }

 if(airborne){
  rearAngle=-.08;
  frontAngle=.08;
 }

 const bodyBob=moving?Math.abs(Math.sin(phase))*.4:0;
 const landingBob=player.landing*.7;

 ctx.save();
 ctx.translate(player.x,player.y+player.height);
 ctx.scale(player.facing*.58,.58);
 ctx.translate(-42,-116+bodyBob+landingBob);

 drawChairLeg(29,75,rearAngle);

 ctx.fillStyle=gradient(23,5,13,70,"#d4a16b","#80502f");
 ctx.strokeStyle="#604027";
 ctx.lineWidth=1.2;
 ctx.beginPath();
 ctx.roundRect(23,5,13,70,2);
 ctx.fill();
 ctx.stroke();

 ctx.strokeStyle="#f1c18b99";
 ctx.lineWidth=1;
 ctx.beginPath();
 ctx.moveTo(25,8);
 ctx.lineTo(25,70);
 ctx.stroke();

 ctx.fillStyle=gradient(20,67,78,12,"#e2b77f","#956039");
 ctx.strokeStyle="#604027";
 ctx.lineWidth=1.3;
 ctx.beginPath();
 ctx.roundRect(20,67,78,12,2);
 ctx.fill();
 ctx.stroke();

 ctx.strokeStyle="#f3d0a0aa";
 ctx.beginPath();
 ctx.moveTo(23,69);
 ctx.lineTo(94,69);
 ctx.stroke();

 drawChairLeg(88,77,frontAngle);

 drawChairCosmetics();

 ctx.fillStyle="#513a29";
 ctx.globalAlpha=.25;
 ctx.fillRect(25,116,69,1);
 ctx.globalAlpha=1;

 if(player.held){
  ctx.save();
  ctx.translate(48,53);
  drawHeldObject(player.held);
  ctx.restore();
 }

 ctx.restore();
}

/* MÖBEL */

function drawSofa(f){
 const x=f.x,y=f.y,w=f.w;
 shadow(x+w/2,y+4,w*.55,.25);

 wood(x+24,y-13,10,14,"#68452e",30);
 wood(x+w-34,y-13,10,14,"#68452e",31);

 rounded(x+7,y-48,w-14,44,7,gradient(x,y-48,w,44,"#69756c","#35423b"),"#39443d");

 ctx.beginPath();
 ctx.roundRect(x+17,y-110,w-34,66,18);
 ctx.fillStyle=gradient(x,y-110,w,70,"#929d91","#505c53");
 ctx.fill();
 ctx.strokeStyle="#465149";
 ctx.stroke();

 for(let i=0;i<3;i++){
  const px=x+39+i*57;
  rounded(px,y-103,53,55,10,gradient(px,y-103,53,60,"#a6afa4","#515f55"),"#536057");
 }

 for(const ax of [x,x+w-43]){
  rounded(ax,y-70,43,67,8,gradient(ax,y-70,43,70,"#9ba59a","#58645b"),"#4d5952");
 }

 for(let i=0;i<3;i++){
  rounded(x+37+i*57,y-52,54,39,9,gradient(x+37+i*57,y-52,54,40,"#b0b9ad","#707c73"),"#59645d");
 }
}

function drawTable(f){
 const x=f.x,y=f.y,w=f.w;
 shadow(x+w/2,y+3,w*.55,.2);
 wood(x+9,y-3,13,f.h-1,"#805536",51);
 wood(x+w-22,y-3,13,f.h-1,"#805536",52);
 wood(x-5,y-16,w+10,15,"#a7794d",50);
}

function drawShelf(f){
 const x=f.x,y=f.y,w=f.w,h=f.h;
 shadow(x+w/2,y+3,w*.55,.2);
 wood(x,y-h,w,11,"#815637",70);
 wood(x+2,y-h,12,h,"#8c603d",71);
 wood(x+w-14,y-h,12,h,"#805536",72);

 for(let r=0;r<3;r++){
  wood(x+9,y-h+51+r*48,w-18,7,"#835a39",73+r);
 }

 const colors=["#895447","#526d7d","#b08c58","#687b60","#a16d4d"];

 for(let r=0;r<2;r++){
  let xx=x+19;
  for(let i=0;i<5;i++){
   const bh=25+(i%3)*5;
   ctx.fillStyle=colors[(i+r*2)%5];
   ctx.fillRect(xx,y-h+48+r*48-bh,12,bh);
   xx+=20;
  }
 }
}

function drawLamp(f){
 const x=f.x,y=f.y;
 shadow(x+34,y+2,35,.18);
 ellipse(x+34,y-4,28,5,"#8b806b");

 ctx.fillStyle=gradient(x+31,y-145,7,145,"#e0d6c1","#655747");
 ctx.fillRect(x+31,y-145,7,142);

 ctx.beginPath();
 ctx.moveTo(x+3,y-143);
 ctx.quadraticCurveTo(x+12,y-175,x+20,y-181);
 ctx.lineTo(x+49,y-181);
 ctx.quadraticCurveTo(x+59,y-173,x+67,y-143);
 ctx.closePath();

 ctx.fillStyle=gradient(x,y-181,67,40,"#e2d5b9","#88745a");
 ctx.fill();
 ctx.strokeStyle="#806d53";
 ctx.stroke();

 softLight(x+35,y-120,90,130,"#ffe5a4",.035);
}

function drawPlant(x,y,w,h){
 shadow(x+w/2,y+2,w*.55,.16);
 ellipse(x+w/2,y-30,w*.32,4,"#49372b");

 ctx.beginPath();
 ctx.moveTo(x+7,y-31);
 ctx.lineTo(x+w-7,y-31);
 ctx.lineTo(x+w-12,y);
 ctx.quadraticCurveTo(x+w/2,y+4,x+12,y);
 ctx.closePath();

 ctx.fillStyle=gradient(x,y-31,w,34,"#c58b67","#80503a");
 ctx.fill();
 ctx.stroke();

 for(let i=0;i<7;i++){
  const lx=x+w/2+(hash(i)*2-1)*w*.35;
  const ly=y-h*(.3+hash(i+10)*.6);

  ctx.strokeStyle="#526b43";
  ctx.lineWidth=2;
  ctx.beginPath();
  ctx.moveTo(x+w/2,y-30);
  ctx.quadraticCurveTo(lx-3,ly+12,lx,ly);
  ctx.stroke();

  ctx.beginPath();
  ctx.ellipse(lx,ly,5,13,hash(i+30),0,Math.PI*2);
  ctx.fillStyle=i%2?"#718f59":"#91a96d";
  ctx.fill();
 }
}

function drawSink(f){
 const x=f.x,y=f.y;
 shadow(x+f.w/2,y+2,f.w*.55,.2);

 wood(x,y-76,f.w,76,"#a77b52",90);
 wood(x-5,y-86,f.w+10,11,"#d0b18b",93);

 rounded(x+40,y-81,101,37,8,gradient(x+40,y-81,101,37,"#e1e5e1","#727e7e"),"#667170");
 rounded(x+46,y-76,89,27,7,gradient(x+46,y-76,89,27,"#53605f","#aeb8b5"),"#d7ddda");

 ctx.save();
 ctx.translate(x+94,y-84);
 ctx.strokeStyle="#747e7e";
 ctx.lineWidth=8;
 ctx.beginPath();
 ctx.moveTo(0,0);
 ctx.lineTo(0,-25);
 ctx.quadraticCurveTo(0,-42,15,-42);
 ctx.lineTo(32,-42);
 ctx.stroke();
 ctx.restore();

 if(waterOn){
  ctx.strokeStyle="#8bd8f0";
  ctx.lineWidth=3;
  ctx.beginPath();
  ctx.moveTo(x+126,y-126);
  ctx.lineTo(x+126,y-80);
  ctx.stroke();
 }
}

function drawFurniture(){
 for(const f of furniture){
  if(f.type==="table")drawTable(f);
  if(f.type==="sofa")drawSofa(f);
  if(f.type==="shelf")drawShelf(f);
  if(f.type==="lamp")drawLamp(f);
  if(f.type==="plant")drawPlant(f.x,f.y,f.w,f.h);
  if(f.type==="sink")drawSink(f);
 }
}

/* TÜREN UND GEGENSTÄNDE */

function drawDoor(d){
 const x=d.x;
 shadow(x+50,FLOOR+3,55,.2);
 wood(x-5,244,110,198,"#68452e",100);
 wood(x+4,251,92,185,"#b58a60",101);

 ctx.fillStyle=gradient(x+8,255,84,174,"#b88b60","#765035");
 ctx.fillRect(x+9,256,82,176);

 ctx.strokeStyle="#6b482f";
 ctx.lineWidth=3;
 ctx.strokeRect(x+18,267,64,65);
 ctx.strokeRect(x+18,343,64,76);

 ellipse(x+76,345,4,4,"#d4b77d");

 ctx.fillStyle="#f4eadb";
 ctx.font="12px Arial";
 ctx.textAlign="center";
 ctx.fillText(d.label,x+50,230);
}

function drawBook(o){
 ctx.save();
 rounded(o.x,o.y,o.w,o.h,2,gradient(o.x,o.y,o.w,o.h,o.color,"#302e2b"),"#3e342d");
 ctx.fillStyle="#e8ddc6";
 ctx.fillRect(o.x+4,o.y+2,o.w-7,o.h-4);
 ctx.restore();
}

function drawBox(o){
 ctx.save();
 ctx.fillStyle=gradient(o.x,o.y,o.w,o.h,"#d0a777","#936c43");
 ctx.fillRect(o.x,o.y,o.w,o.h);
 ctx.strokeStyle="#785638";
 ctx.strokeRect(o.x+.5,o.y+.5,o.w-1,o.h-1);
 ctx.fillStyle="#e8d2a1";
 ctx.fillRect(o.x+o.w*.43,o.y,o.w*.14,o.h);
 ctx.restore();
}

function drawPillow(o){
 ctx.beginPath();
 ctx.roundRect(o.x,o.y,o.w,o.h,8);
 ctx.fillStyle=gradient(o.x,o.y,o.w,o.h,"#e0ddd4","#92958e");
 ctx.fill();
 ctx.strokeStyle="#777c75";
 ctx.stroke();
}

function drawObject(o){
 if(o.type==="book")drawBook(o);
 if(o.type==="box")drawBox(o);
 if(o.type==="pillow")drawPillow(o);
 if(o.type==="plant")drawPlant(o.x,o.y+o.h,o.w,o.h);
}

function drawHeldObject(o){
 const copy={...o,x:-o.w/2,y:-o.h/2};
 if(o.type==="book")drawBook(copy);
 if(o.type==="box")drawBox(copy);
 if(o.type==="pillow")drawPillow(copy);
 if(o.type==="plant")drawPlant(-o.w/2,o.h/2,o.w,o.h);
}

function drawPlayerShadow(){
 const h=Math.max(0,FLOOR-(player.y+player.height));
 ctx.save();
 ctx.globalAlpha=clamp(.24-h*.0018,.06,.24);
 ellipse(player.x,FLOOR+2,clamp(27-h*.09,11,27),4,"#17130f");
 ctx.restore();
}

/* INTERAKTION */

function nearestObject(){
 let best=null,dist=90;

 for(const o of objects){
  const d=Math.hypot(
   o.x+o.w/2-player.x,
   o.y+o.h/2-(player.y+player.height/2)
  );

  if(d<dist){
   dist=d;
   best=o;
  }
 }

 return best;
}

function nearestDoor(){
 let best=null,dist=85;

 for(const d of doors){
  const dx=Math.abs(d.x+d.w/2-player.x);
  if(dx<dist){
   dist=dx;
   best=d;
  }
 }

 return best;
}

function nearSink(){
 const s=furniture.find(f=>f.type==="sink");
 return Math.abs(player.x-(s.x+s.w/2))<125;
}

function jump(){
 if(player.grounded){
  player.vy=-465;
  player.grounded=false;
 }
}

function dropItem(){
 if(!player.held)return;

 const o=player.held;
 o.x=player.x-o.w/2+player.facing*38;
 o.y=player.y+player.height-o.h;
 o.vx=player.facing*65;
 o.vy=-65;

 objects.push(o);
 player.held=null;
}

function interact(){
 const door=nearestDoor();

 if(door&&Math.abs(player.x-(door.x+door.w/2))<85){
  location.href=door.url;
  return;
 }

 if(nearSink()){
  waterOn=!waterOn;
  tapTarget=waterOn?-.65:.15;
  return;
 }

 if(player.held){
  dropItem();
  return;
 }

 const o=nearestObject();
 if(!o)return;

 player.held=o;
 objects.splice(objects.indexOf(o),1);
 player.vx*=.5;
}

/* UPDATE */

function update(dt){
 time+=dt;

 const left=keys.a||keys.arrowleft;
 const right=keys.d||keys.arrowright;
 const dir=(right?1:0)-(left?1:0);

 if(dir){
  player.facing=dir;
  player.vx+=dir*1250*dt;
 }else{
  player.vx*=Math.pow(.0007,dt);
 }

 player.vx=clamp(player.vx,-205,205);
 player.x=clamp(player.x+player.vx*dt,35,WORLD-35);

 const was=player.grounded;

 player.vy+=1350*dt;
 player.y+=player.vy*dt;

 if(player.y+player.height>=FLOOR){
  if(!was&&player.vy>100)player.landing=1;
  player.y=FLOOR-player.height;
  player.vy=0;
  player.grounded=true;
 }else{
  player.grounded=false;
 }

 player.landing*=Math.pow(.025,dt);
 if(player.landing<.015)player.landing=0;

 if(Math.abs(player.vx)>8&&player.grounded){
  player.walk+=dt*10;
 }

 for(const o of objects){
  o.vx=(o.vx||0)*Math.pow(.08,dt);
  o.vy=(o.vy||0)+1150*dt;
  o.x+=o.vx*dt;
  o.y+=o.vy*dt;

  if(o.y+o.h>FLOOR){
   o.y=FLOOR-o.h;
   o.vy=0;
  }

  o.x=clamp(o.x,0,WORLD-o.w);
 }

 tapAngle=lerp(tapAngle,tapTarget,1-Math.pow(.0001,dt));

 cameraX=lerp(
  cameraX,
  clamp(player.x-W*.42,0,WORLD-W),
  1-Math.pow(.0005,dt)
 );

 const door=nearestDoor();
 const item=nearestObject();

 if(door&&Math.abs(player.x-(door.x+door.w/2))<85){
  prompt.style.display="block";
  prompt.textContent="E drücken · "+door.label+" öffnen";
 }else if(nearSink()){
  prompt.style.display="block";
  prompt.textContent="E drücken · Wasser "+(waterOn?"ausschalten":"anmachen");
 }else if(player.held){
  prompt.style.display="block";
  prompt.textContent="E oder Q drücken · Gegenstand ablegen";
 }else if(item){
  prompt.style.display="block";
  prompt.textContent="E drücken · "+item.id+" aufheben";
 }else{
  prompt.style.display="none";
 }

 statusText.textContent=waterOn?"Wasser läuft":"Ein gemütlicher Tag im Zimmer";
 heldText.textContent=player.held?"Trägt: "+player.held.id:"Hände frei";
}

/* ZEICHNEN */

function draw(){
 ctx.setTransform(sx,0,0,sy,0,0);
 ctx.clearRect(0,0,W,H);

 ctx.save();
 ctx.translate(-cameraX,0);

 drawRoom();
 drawFurniture();

 for(const d of doors)drawDoor(d);
 for(const o of objects)drawObject(o);

 drawPlayerShadow();
 drawChair();

 ctx.restore();
}

function loop(now){
 const dt=Math.min((now-last)/1000||0,.033);
 last=now;
 update(dt);
 draw();
 requestAnimationFrame(loop);
}

requestAnimationFrame(loop);
</script>
