
<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>MEIN ZIMMER – STADT</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#20272b;font-family:Arial,sans-serif}
canvas{display:block;width:100%;height:100%}
#hud{position:fixed;top:14px;left:14px;padding:12px 16px;background:#17191be8;color:white;border:1px solid #ffffff22;border-radius:11px;font-size:12px;line-height:1.7;pointer-events:none}
#online{position:fixed;top:14px;right:14px;padding:10px 14px;background:#17191be8;color:#c5dfc9;border-radius:9px;font-size:12px}
#hint{position:fixed;bottom:15px;left:50%;transform:translateX(-50%);padding:10px 15px;background:#17191be8;color:white;border-radius:10px;font-size:12px;white-space:nowrap;pointer-events:none}
#prompt{position:fixed;bottom:65px;left:50%;transform:translateX(-50%);padding:10px 16px;background:#17191bed;color:white;border-radius:9px;font-size:13px;display:none;white-space:nowrap}
#fade{position:fixed;inset:0;background:#111;opacity:0;pointer-events:none;transition:opacity .35s}
</style>
</head>
<body>
<canvas id="world"></canvas>
<div id="hud"><b>MEIN ZIMMER / STADT</b><br><span id="status">Willkommen in der Stadt</span><br><span id="held">Hände frei</span></div>
<div id="online">● Offline</div>
<div id="prompt"></div>
<div id="hint">A / D · Laufen | LEERTASTE · Springen | E · Interagieren | Q · Ablegen</div>
<div id="fade"></div>

<script src="supabase.js"></script>
<script>
"use strict";

const canvas=document.getElementById("world");
const ctx=canvas.getContext("2d");
const statusText=document.getElementById("status");
const heldText=document.getElementById("held");
const prompt=document.getElementById("prompt");

const W=960,H=540,FLOOR=440,WORLD=4700;
const SAVE_KEY="mein-zimmer-save-v1";

let sx=1,sy=1,cameraX=0,last=0,time=0;
let waterOn=false;

function resize(){
 const d=Math.min(devicePixelRatio||1,2);
 canvas.width=innerWidth*d;
 canvas.height=innerHeight*d;
 sx=canvas.width/W;
 sy=canvas.height/H;
}
addEventListener("resize",resize);
resize();

const keys={};
addEventListener("keydown",e=>{
 const k=e.key.toLowerCase();
 keys[k]=true;
 if([" ","arrowleft","arrowright","arrowup"].includes(k))e.preventDefault();
 if(!e.repeat){
  if(k===" "||k==="arrowup"||k==="w")jump();
  if(k==="e")interact();
  if(k==="q")dropItem();
 }
});
addEventListener("keyup",e=>keys[e.key.toLowerCase()]=false);

const player={
 x:115,y:FLOOR-68,vx:0,vy:0,
 width:48,height:68,
 grounded:true,facing:1,walk:0,
 held:null,landing:0
};

const defaults={
 money:120,unlocked:[],
 equipped:{head:null,face:null,clothes:null,back:null,pants:null},
 inventory:[],placed:[],orders:[],received:[],
 faucetOn:false,bucketWater:0
};

function readSave(){
 try{
  const s=JSON.parse(localStorage.getItem(SAVE_KEY)||"null");
  return s?{...defaults,...s,equipped:{...defaults.equipped,...(s.equipped||{})}}:structuredClone(defaults);
 }catch{return structuredClone(defaults)}
}

let wardrobe=readSave().equipped;
addEventListener("storage",e=>{
 if(e.key===SAVE_KEY)wardrobe=readSave().equipped;
});

function clamp(v,a,b){return Math.max(a,Math.min(b,v))}
function lerp(a,b,t){return a+(b-a)*t}
function hash(n){const v=Math.sin(n*127.1+311.7)*43758.5453;return v-Math.floor(v)}
function gradient(x,y,w,h,c1,c2){
 const g=ctx.createLinearGradient(x,y,x+w,y+h);
 g.addColorStop(0,c1);g.addColorStop(1,c2);return g;
}
function rounded(x,y,w,h,r,fill,stroke){
 ctx.beginPath();ctx.roundRect(x,y,w,h,r);
 if(fill){ctx.fillStyle=fill;ctx.fill()}
 if(stroke){ctx.strokeStyle=stroke;ctx.stroke()}
}
function ellipse(x,y,rx,ry,fill){
 ctx.beginPath();ctx.ellipse(x,y,rx,ry,0,0,Math.PI*2);ctx.fillStyle=fill;ctx.fill();
}
function shadow(x,y,rx,alpha=.2){
 ctx.save();ctx.globalAlpha=alpha;ellipse(x,y,rx,5,"#17130f");ctx.restore();
}
function softLight(x,y,rx,ry,color,alpha){
 ctx.save();ctx.globalAlpha=alpha;
 const g=ctx.createRadialGradient(x,y,0,x,y,rx);
 g.addColorStop(0,color);g.addColorStop(1,"#ffffff00");
 ctx.fillStyle=g;ctx.beginPath();ctx.ellipse(x,y,rx,ry,0,0,Math.PI*2);ctx.fill();ctx.restore();
}

/* =====================================================
   STADT – HIMMEL UND HINTERGRUND
===================================================== */

function drawSky(){
 const g=ctx.createLinearGradient(0,0,0,H);
 g.addColorStop(0,"#708797");
 g.addColorStop(.55,"#b4bcb6");
 g.addColorStop(1,"#e1cbb0");
 ctx.fillStyle=g;ctx.fillRect(0,0,W,H);

 const sun=ctx.createRadialGradient(750,100,5,750,100,110);
 sun.addColorStop(0,"#ffe9bd");
 sun.addColorStop(1,"#ffe9bd00");
 ctx.fillStyle=sun;ctx.fillRect(620,0,250,220);

 for(let i=0;i<9;i++){
  const x=((i*190-cameraX*.12)%1150+1150)%1150-80;
  const y=65+(i%3)*43;
  ctx.fillStyle="#f7f0e5";ctx.globalAlpha=.24;
  ctx.beginPath();
  ctx.ellipse(x,y,45,12,0,0,Math.PI*2);
  ctx.ellipse(x+28,y-7,29,15,0,0,Math.PI*2);
  ctx.ellipse(x+55,y,37,11,0,0,Math.PI*2);
  ctx.fill();ctx.globalAlpha=1;
 }

 // Entfernte Häuser
 for(let i=0;i<24;i++){
  const x=i*105-cameraX*.24;
  const h=100+(i*37%100);
  ctx.fillStyle=["#77858a","#89918d","#687b82"][i%3];
  ctx.fillRect(x,350-h,100,h);
  for(let wy=0;wy<4;wy++)for(let wx=0;wx<3;wx++){
   ctx.fillStyle="#c3c8ba";
   ctx.fillRect(x+12+wx*29,365-h+wy*25,12,14);
  }
 }
}

/* =====================================================
   GEBÄUDE
===================================================== */

const shops=[
 {x:120,w:380,name:"CAFÉ MORGENROT",type:"cafe",sub:"Kaffee · Kuchen · Frühstück"},
 {x:590,w:390,name:"CITY MARKET",type:"market",sub:"Lebensmittel · Getränke"},
 {x:1060,w:380,name:"PIZZERIA BELLA",type:"pizza",sub:"Pizza · Pasta · Amore",open:true},
 {x:1530,w:390,name:"BOOKS & MORE",type:"book",sub:"Bücher · Magazine"},
 {x:2010,w:390,name:"FLOWER HOUSE",type:"flower",sub:"Blumen · Pflanzen"},
 {x:2500,w:400,name:"FASHION STUDIO",type:"fashion",sub:"Mode · Accessoires"},
 {x:3000,w:390,name:"GAME ZONE",type:"game",sub:"Games · Technik"},
 {x:3480,w:390,name:"BAKERY NO. 7",type:"bakery",sub:"Brot · Brötchen"},
 {x:3960,w:410,name:"HOME & LIVING",type:"home",sub:"Wohnen · Möbel"}
];

function drawUpperBuilding(s,x){
 const w=s.w;
 const facades=["#b9aa9b","#a2aaa6","#c4b7a7","#aeb2aa"];
 ctx.fillStyle=facades[Math.floor(s.x/400)%4];
 ctx.fillRect(x,95,w,225);
 ctx.fillStyle="#ded4c5";ctx.fillRect(x-5,90,w+10,8);
 ctx.fillStyle="#79766e";ctx.fillRect(x,315,w,5);

 for(let i=0;i<5;i++){
  const bx=x+20+i*(w-65)/5;
  ctx.fillStyle="#536267";ctx.fillRect(bx,122,54,78);
  ctx.fillStyle="#aebfbe";ctx.fillRect(bx+4,126,46,70);
  ctx.fillStyle="#697b7d";ctx.fillRect(bx+25,126,3,70);
  ctx.fillRect(bx+4,160,46,3);
  ctx.fillStyle="#80796f";ctx.fillRect(bx-4,201,62,5);
  ctx.fillStyle="#ddd2c2";ctx.fillRect(bx-7,206,68,4);
 }

 for(let i=0;i<3;i++){
  const bx=x+55+i*130;
  ctx.fillStyle="#777b76";ctx.fillRect(bx,225,76,5);
  ctx.strokeStyle="#555e5e";ctx.lineWidth=2;
  ctx.beginPath();ctx.moveTo(bx+5,230);ctx.lineTo(bx+5,254);ctx.moveTo(bx+71,230);ctx.lineTo(bx+71,254);
  ctx.moveTo(bx+5,238);ctx.lineTo(bx+71,238);ctx.moveTo(bx+5,254);ctx.lineTo(bx+71,254);ctx.stroke();
  ctx.fillStyle="#657b60";ctx.fillRect(bx+10,214,16,12);ctx.fillRect(bx+45,214,18,12);
 }
}

function drawPlant(x,y,scale=1){
 ctx.save();ctx.translate(x,y);ctx.scale(scale,scale);
 ctx.fillStyle="#765744";ctx.fillRect(-10,-5,20,8);
 ctx.fillStyle="#6d815f";ctx.fillRect(-7,-15,14,10);
 ctx.strokeStyle="#55785a";ctx.lineWidth=3;
 ctx.beginPath();ctx.moveTo(0,-12);ctx.lineTo(-7,-36);ctx.moveTo(0,-12);ctx.lineTo(8,-39);ctx.moveTo(0,-12);ctx.lineTo(0,-43);ctx.stroke();
 ctx.fillStyle="#608765";
 ctx.beginPath();ctx.ellipse(-8,-33,9,5,-.5,0,Math.PI*2);ctx.ellipse(8,-37,9,5,.5,0,Math.PI*2);ctx.ellipse(0,-44,8,5,0,0,Math.PI*2);ctx.fill();
 ctx.restore();
}

function drawPizza(x,y,r){
 ellipse(x,y,r,r,"#d5a65d");
 ellipse(x,y,r-4,r-4,"#b84f39");
 for(let i=0;i<5;i++)ellipse(x+Math.cos(i*1.25)*9,y+Math.sin(i*1.25)*9,3,3,"#e7c66e");
}
function drawBread(x,y){
 ctx.fillStyle="#c18a4c";ctx.beginPath();ctx.ellipse(x,y,13,7,-.2,0,Math.PI*2);ctx.fill();
 ctx.strokeStyle="#f2d19a";ctx.lineWidth=1;
 ctx.beginPath();ctx.moveTo(x-5,y-3);ctx.lineTo(x-2,y+2);ctx.moveTo(x+1,y-4);ctx.lineTo(x+4,y+1);ctx.stroke();
}

/* =====================================================
   EINRICHTUNG IN DEN SCHAUFENSTERN
===================================================== */

function drawInterior(s,x,w){
 const top=323;
 const wall=ctx.createLinearGradient(0,top,0,419);
 wall.addColorStop(0,"#394347");wall.addColorStop(1,"#20282a");
 ctx.fillStyle=wall;ctx.fillRect(x,top,w,96);

 ctx.fillStyle="#f5dba4";
 for(let i=0;i<4;i++){
  const lx=x+35+i*(w-70)/3;
  ctx.globalAlpha=.6;ellipse(lx,332,15,4,"#f5dba4");ctx.globalAlpha=1;
 }
 ctx.fillStyle="#72695e";ctx.fillRect(x,407,w,12);

 if(s.type==="cafe"){
  ctx.fillStyle="#76513c";ctx.fillRect(x+18,371,115,36);
  ctx.fillStyle="#c8a77a";ctx.fillRect(x+18,366,115,7);
  ctx.fillStyle="#9fa6a3";ctx.fillRect(x+43,346,34,20);
  for(let i=0;i<2;i++){
   const tx=x+190+i*100;
   ctx.fillStyle="#a77b51";ctx.fillRect(tx,376,55,6);
   ctx.fillStyle="#5a4535";ctx.fillRect(tx+24,382,5,25);
  }
  drawPlant(x+w-45,383,.7);
 }

 if(s.type==="market"){
  for(let i=0;i<3;i++){
   const sx=x+25+i*105;
   ctx.fillStyle="#7a6048";ctx.fillRect(sx,350,82,54);
   ctx.fillStyle="#b99b70";ctx.fillRect(sx,350,82,5);
   for(let j=0;j<4;j++){
    ctx.fillStyle=["#a6a65c","#c47a59","#7795a1","#c4aa6e"][(i+j)%4];
    ctx.fillRect(sx+7+j*18,360,12,13);
    ctx.fillStyle=["#c7a75d","#7b9b76","#b8796c","#d0c0a0"][(i+j)%4];
    ctx.fillRect(sx+7+j*18,380,12,14);
   }
  }
 }

 if(s.type==="pizza"){
  ctx.fillStyle="#784a32";ctx.fillRect(x+20,370,150,38);
  ctx.fillStyle="#c69a65";ctx.fillRect(x+20,364,150,7);
  ctx.fillStyle="#ddd0b8";ctx.fillRect(x+40,339,105,25);
  drawPizza(x+225,383,17);drawPizza(x+285,383,17);
  drawPlant(x+w-48,385,.75);
 }

 if(s.type==="book"){
  for(let i=0;i<3;i++){
   const bx=x+24+i*110;
   ctx.fillStyle="#634d3c";ctx.fillRect(bx,347,90,58);
   ctx.fillStyle="#b99b73";ctx.fillRect(bx,347,90,5);
   for(let j=0;j<7;j++){
    ctx.fillStyle=["#a75b4e","#66818a","#c1a16d","#71856c","#8d7790"][(i+j)%5];
    ctx.fillRect(bx+5+j*12,355,9,35);
   }
  }
 }

 if(s.type==="flower"){
  for(let i=0;i<5;i++){
   const px=x+28+i*70;
   drawPlant(px,397,.85);
   for(let j=0;j<5;j++)ellipse(px-8+j*4,365+(j%2)*3,5,5,["#c47c91","#e5bd6b","#a98cb8","#d77b63"][i%4]);
  }
 }

 if(s.type==="fashion"){
  ctx.fillStyle="#806a55";ctx.fillRect(x+30,348,100,56);
  for(let i=0;i<4;i++){
   const hx=x+43+i*22;
   ctx.strokeStyle="#d2bda1";ctx.lineWidth=2;
   ctx.beginPath();ctx.moveTo(hx,355);ctx.lineTo(hx,397);ctx.stroke();
   ctx.fillStyle=["#8c6871","#617c86","#a68b5f","#6c8269"][i];
   ctx.fillRect(hx-7,362,14,28);
  }
  ctx.fillStyle="#b6a18a";ctx.fillRect(x+190,365,95,40);
 }

 if(s.type==="game"){
  ctx.fillStyle="#494e54";ctx.fillRect(x+20,355,145,50);
  ctx.fillStyle="#7f8d91";ctx.fillRect(x+32,338,120,17);
  ctx.fillStyle="#b3c7c8";ctx.fillRect(x+45,342,95,10);
  ctx.fillStyle="#393f46";ctx.fillRect(x+195,350,95,55);
  ctx.fillStyle="#6e9c9a";ctx.fillRect(x+205,358,75,36);
 }

 if(s.type==="bakery"){
  ctx.fillStyle="#98734e";ctx.fillRect(x+20,375,140,30);
  for(let i=0;i<4;i++)drawBread(x+38+i*30,369);
  ctx.fillStyle="#87694b";ctx.fillRect(x+195,370,115,35);
  drawBread(x+220,365);drawBread(x+260,365);
 }

 if(s.type==="home"){
  ctx.fillStyle="#7e6955";ctx.fillRect(x+20,365,130,40);
  ctx.fillStyle="#b5a084";ctx.fillRect(x+30,349,110,16);
  rounded(x+190,375,120,28,6,"#8a776a");
  rounded(x+200,364,100,24,5,"#a69787");
  drawPlant(x+w-42,390,.7);
 }
}

/* =====================================================
   LEITERN, WERKZEUGE UND BAUSTELLEN
===================================================== */

function drawConstruction(x,w){
 const lx=x+w*.67,top=350,bottom=405;
 ctx.strokeStyle="#c0b6a0";ctx.lineWidth=5;
 ctx.beginPath();
 ctx.moveTo(lx,bottom);ctx.lineTo(lx+18,top);
 ctx.moveTo(lx+28,bottom);ctx.lineTo(lx+46,top);
 ctx.stroke();

 for(let i=0;i<6;i++){
  const yy=bottom-i*10;
  const xx=lx+5+i*3;
  ctx.strokeStyle="#ded4bb";ctx.lineWidth=3;
  ctx.beginPath();ctx.moveTo(xx,yy);ctx.lineTo(xx+28,yy);ctx.stroke();
 }

 // Werkzeugkiste
 ctx.fillStyle="#a55f35";ctx.fillRect(x+w*.44,390,42,18);
 ctx.fillStyle="#c98a4d";ctx.fillRect(x+w*.44+5,385,32,5);
 ctx.fillStyle="#d5d0c4";ctx.fillRect(x+w*.28,384,26,25);
 ctx.fillStyle="#777d7d";ctx.fillRect(x+w*.28,383,26,4);

 // Kartons
 ctx.fillStyle="#a98c65";ctx.fillRect(x+w*.12,390,32,18);
 ctx.strokeStyle="#6f5940";ctx.beginPath();ctx.moveTo(x+w*.12+16,390);ctx.lineTo(x+w*.12+16,408);ctx.stroke();

 // Baustellen-Gerüst
 ctx.strokeStyle="#8c9694";ctx.lineWidth=3;
 ctx.strokeRect(x+12,355,52,50);
 ctx.beginPath();ctx.moveTo(x+12,355);ctx.lineTo(x+64,405);ctx.moveTo(x+64,355);ctx.lineTo(x+12,405);ctx.stroke();
}

function drawBarrier(x,y,w){
 // Pfosten
 for(let i=0;i<4;i++){
  const px=x+i*w/3;
  ctx.fillStyle="#55504a";ctx.fillRect(px-3,y-20,6,23);
  rounded(px-7,y-23,14,5,2,"#c7bba5");
  ellipse(px,y+3,9,3,"#48443f");
 }
 // Band
 for(let k=0;k<3;k++){
  const yy=y-18+k*6;
  ctx.strokeStyle="#eee5d6";ctx.lineWidth=4;
  ctx.beginPath();ctx.moveTo(x,yy);ctx.lineTo(x+w,yy);ctx.stroke();
  ctx.strokeStyle="#b74437";ctx.lineWidth=3;
  for(let j=0;j<w;j+=25){
   ctx.beginPath();ctx.moveTo(x+j,yy-2);ctx.lineTo(x+j+8,yy+2);ctx.stroke();
  }
 }
}

function drawShop(s){
 const x=s.x-cameraX,w=s.w;
 if(x+w<-50||x>W+50)return;

 drawUpperBuilding(s,x);

 // Erdgeschoss
 ctx.fillStyle="#554d46";ctx.fillRect(x,315,w,105);
 ctx.fillStyle="#d0c3ad";ctx.fillRect(x,315,w,7);

 // Fensterrahmen und Innenraum
 ctx.fillStyle="#343c3d";ctx.fillRect(x+8,324,w-16,89);
 drawInterior(s,x+14,w-28);

 // Glasreflexion
 ctx.save();ctx.globalAlpha=.13;ctx.fillStyle="#fff";
 ctx.beginPath();ctx.moveTo(x+18,329);ctx.lineTo(x+88,329);ctx.lineTo(x+49,410);ctx.lineTo(x+18,410);ctx.closePath();ctx.fill();ctx.restore();

 // Fensterrahmen
 ctx.fillStyle="#c6b9a4";ctx.fillRect(x+8,324,w-16,5);ctx.fillRect(x+8,411,w-16,5);
 ctx.fillStyle="#9d9688";ctx.fillRect(x+w*.48,328,5,84);

 // Ladenschild
 ctx.fillStyle="#30383a";ctx.fillRect(x+18,277,w-36,37);
 ctx.fillStyle=s.type==="pizza"?"#963f31":"#e1d2b8";ctx.fillRect(x+23,282,w-46,27);
 ctx.fillStyle=s.type==="pizza"?"#fff0d5":"#343331";
 ctx.font="bold 15px Arial";ctx.textAlign="center";ctx.fillText(s.name,x+w/2,300);
 ctx.fillStyle="#f0e5d1";ctx.font="10px Arial";ctx.fillText(s.sub,x+w/2,320);ctx.textAlign="left";

 // Eingangstür
 const dx=x+w-57;
 ctx.fillStyle="#303b3d";ctx.fillRect(dx,328,39,83);
 ctx.fillStyle="#6e7774";ctx.fillRect(dx+4,332,31,75);
 ctx.fillStyle="#9ba9a5";ctx.fillRect(dx+7,337,25,36);
 ctx.fillStyle="#5b6b6c";ctx.fillRect(dx+7,377,25,25);
 ellipse(dx+29,372,2,2,"#e1c58e");

 if(s.open){
  ctx.fillStyle="#3d754e";ctx.fillRect(dx-5,340,48,13);
  ctx.fillStyle="#fff";ctx.font="bold 8px Arial";ctx.textAlign="center";
  ctx.fillText("GEÖFFNET",dx+19,349);ctx.textAlign="left";
 }else{
  // COMING SOON im Schaufenster
  rounded(x+28,337,Math.min(w-95,180),24,3,"#e7d9bd","#8b6e4d");
  ctx.fillStyle="#34302b";ctx.font="bold 13px Arial";ctx.textAlign="center";
  ctx.fillText("COMING SOON",x+28+Math.min(w-95,180)/2,354);ctx.textAlign="left";

  drawConstruction(x+14,w-28);

  // halbtransparente Baustellenfolie
  ctx.save();ctx.globalAlpha=.12;ctx.fillStyle="#d3c9ad";ctx.fillRect(x+14,330,w-28,78);ctx.restore();

  // Warnschild
  ctx.fillStyle="#e4c65d";ctx.fillRect(x+w-90,385,54,24);
  ctx.strokeStyle="#574d30";ctx.strokeRect(x+w-90,385,54,24);
  ctx.fillStyle="#332e24";ctx.font="bold 8px Arial";ctx.textAlign="center";
  ctx.fillText("BAUSTELLE",x+w-63,400);ctx.textAlign="left";

  // Absperrband vor dem Eingang
  drawBarrier(x+5,432,w-10);
 }
}

/* =====================================================
   STRASSE UND STADTDETAILS
===================================================== */

function drawGround(){
 ctx.fillStyle="#aaa397";ctx.fillRect(0,420,W,20);
 for(let x=-(cameraX%80);x<W;x+=80){
  ctx.fillStyle="#b7b0a4";ctx.fillRect(x,420,78,20);
  ctx.strokeStyle="#928d84";ctx.beginPath();ctx.moveTo(x,420);ctx.lineTo(x,440);ctx.stroke();
 }
 ctx.fillStyle="#858782";ctx.fillRect(0,440,W,9);
 ctx.fillStyle="#d5d0c5";ctx.fillRect(0,440,W,2);
 ctx.fillStyle="#454a4d";ctx.fillRect(0,449,W,91);

 for(let i=0;i<90;i++){
  const x=(i*113-cameraX*.7)%W;
  const y=456+i*29%77;
  ctx.fillStyle="#687071";ctx.fillRect((x+W)%W,y,2,1);
 }
 for(let x=-(cameraX%100);x<W;x+=100){
  ctx.fillStyle="#c9c5b7";ctx.fillRect(x,495,48,3);
 }
 for(let i=0;i<3;i++){
  const x=((i*390-cameraX*.9)%1100+1100)%1100;
  ctx.strokeStyle="#747b7a";ctx.lineWidth=2;
  ctx.beginPath();ctx.ellipse(x,469,16,6,0,0,Math.PI*2);ctx.stroke();
 }
}

function drawStreetFurniture(){
 for(let i=0;i<14;i++){
  const wx=300+i*340,x=wx-cameraX;
  if(x<-50||x>W+50)continue;

  // Laterne
  ctx.fillStyle="#3d4546";ctx.fillRect(x,230,5,190);
  ctx.fillRect(x-12,230,28,5);
  rounded(x+8,229,14,7,3,"#f1d9a0");
  softLight(x+15,237,35,35,"#f4dca8",.16);

  // Baum
  const tx=wx+115-cameraX;

let roomId=null,ownPlayerId=null,onlineReady=false;
let otherPlayers=[];
let lastPositionSend=0;

function extractRoomId(room){
 if(!room)return null;
 return room.room_id||room.id||room.room?.id||room.room?.room_id||null;
}

async function startOnline(){
 const badge=document.getElementById("online");
 try{
  if(!window.GameOnline){badge.textContent="● Offline";return}
  const active=JSON.parse(sessionStorage.getItem("mein-zimmer-active-room")||"null");
  if(!active){badge.textContent="● Kein Raum";return}
  if(typeof GameOnline.login==="function")await GameOnline.login("Spieler");
  roomId=extractRoomId(active);
  if(!roomId){badge.textContent="● Raum nicht gefunden";return}

  const client=GameOnline.getClient();
  if(client?.auth){
   const result=await client.auth.getUser();
   ownPlayerId=result?.data?.user?.id||null;
  }

  if(typeof GameOnline.watchPlayers==="function"){
   await GameOnline.watchPlayers(roomId,async rows=>{
    const list=Array.isArray(rows)?rows:[];
    const ids=list.map(p=>p.player_id).filter(Boolean);
    let names={};
    if(client&&ids.length){
     try{
      const response=await client.from("profiles").select("id,player_name").in("id",ids);
      for(const profile of response.data||[])names[profile.id]=profile.player_name;
     }catch(e){}
    }
    otherPlayers=list.map(p=>({...p,player_name:names[p.player_id]||"Spieler"}));
   });
  }
  onlineReady=true;
  badge.textContent="● Online";
 }catch(e){
  console.warn("Multiplayer:",e);
  badge.textContent="● Offline";
 }
}

async function sendPosition(){
 if(!onlineReady||!roomId||!window.GameOnline)return;
 const now=performance.now();
 if(now-lastPositionSend<150)return;
 lastPositionSend=now;
 try{await GameOnline.updatePosition(roomId,"stadt",player.x,player.y)}catch(e){}
}

function drawOtherPlayers(){
 for(const p of otherPlayers){
  if(!p||p.player_id===ownPlayerId||p.area!=="stadt")continue;
  const x=Number(p.x)-cameraX,y=Number(p.y);
  if(!Number.isFinite(x)||!Number.isFinite(y)||x<-100||x>W+100)continue;

  // Andere Spieler als kleine Stuhl-Silhouette.
  // Die eigene Originalzeichnung bleibt vollständig unangetastet.
  ctx.save();ctx.translate(x,y+68);ctx.scale(.58,.58);ctx.translate(-42,-116);
  drawChairLeg(29,75,0);

  ctx.beginPath();ctx.roundRect(23,5,13,70,2);ctx.fill();ctx.stroke();
  ctx.fillStyle=gradient(20,67,78,12,"#e2b77f","#956039");
  ctx.beginPath();ctx.roundRect(20,67,78,12,2);ctx.fill();ctx.stroke();
  drawChairLeg(88,77,0);

  rounded(x+24-width/2,y-20,width,17,5,"#20292ddd");
  ctx.fillStyle="#fff";ctx.fillText(name,x+24,y-8);ctx.textAlign="left";
 }
}

/* =====================================================
   PHYSIK
===================================================== */

function update(dt){
 time+=dt;
 const left=keys.a||keys.arrowleft;
 const right=keys.d||keys.arrowright;
 const dir=(right?1:0)-(left?1:0);

 if(dir){player.facing=dir;player.vx+=dir*1250*dt}
 else player.vx*=Math.pow(.0007,dt);

 player.vx=clamp(player.vx,-205,205);
 player.x=clamp(player.x+player.vx*dt,35,WORLD-35);

 const was=player.grounded;
 player.vy+=1350*dt;
 player.y+=player.vy*dt;

 if(player.y+player.height>=FLOOR){
  if(!was&&player.vy>100)player.landing=1;
  player.y=FLOOR-player.height;player.vy=0;player.grounded=true;
 }else player.grounded=false;

 player.landing*=Math.pow(.025,dt);
 if(player.landing<.015)player.landing=0;
 if(Math.abs(player.vx)>8&&player.grounded)player.walk+=dt*10;

 cameraX=lerp(cameraX,clamp(player.x-W*.42,0,WORLD-W),1-Math.pow(.0005,dt));

 const s=nearestShop();
 if(s)showPrompt("E drücken · "+(s.type==="pizza"?"Pizzeria betreten":s.name+" – COMING SOON"));
 else if(player.x<170)showPrompt("E drücken · Zurück nach Hause");
 else showPrompt("");

 statusText.textContent=s?(s.type==="pizza"?"Pizzeria geöffnet":"Geschäft noch im Bau"):"Erkunde die Stadt";
 heldText.textContent="Hände frei";
 sendPosition();
}

 for(const s of shops)drawShop(s);

 // Gehweg
 ctx.fillStyle="#aaa397";ctx.fillRect(0,420,WORLD,20);
 for(let x=0;x<WORLD;x+=80){
  ctx.strokeStyle="#928d84";ctx.beginPath();ctx.moveTo(x,420);ctx.lineTo(x,440);ctx.stroke();
 }
 ctx.fillStyle="#858782";ctx.fillRect(0,440,WORLD,9);
 ctx.fillStyle="#d5d0c5";ctx.fillRect(0,440,WORLD,2);
 ctx.fillStyle="#454a4d";ctx.fillRect(0,449,WORLD,91);
 for(let x=0;x<WORLD;x+=100){
  ctx.fillStyle="#c9c5b7";ctx.fillRect(x,495,48,3);
 }

 drawStreetFurniture();
 drawCars(0);
 drawOtherPlayers();

 // Bodenschatten und Originalstuhl
 const h=Math.max(0,FLOOR-(player.y+player.height));
 ctx.save();ctx.globalAlpha=clamp(.24-h*.0018,.06,.24);
 ellipse(player.x,FLOOR+2,clamp(27-h*.09,11,27),4,"#17130f");
 ctx.restore();

 drawChair();

 ctx.restore();
}

/* =====================================================
   HAUPTSCHLEIFE
===================================================== */

function loop(now){
 const dt=Math.min((now-last)/1000||0,.033);
 last=now;
 update(dt);
 draw();
 requestAnimationFrame(loop);
}

startOnline();
requestAnimationFrame(loop);
</script>
