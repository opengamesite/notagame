<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mein Zimmer – Pixel Adventure</title>
<style>
:root{color-scheme:light;--ink:#292e35;--paper:#f5eddf;--muted:#a99d8c;--accent:#d9b46c;--blue:#587e96;--border:#d8c9b5;font-family:"Courier New",monospace}
*{box-sizing:border-box}
html,body{width:100%;height:100%;margin:0;overflow:hidden;background:#252a30}
body{display:grid;place-items:center}
button{font:inherit;cursor:pointer}
#game{position:relative;width:min(100vw,177.778vh);height:min(100vh,56.25vw);overflow:hidden;background:#e7d7c1;isolation:isolate;box-shadow:0 18px 70px #0006}
#world{position:absolute;inset:0;width:100%;height:100%;image-rendering:pixelated;touch-action:none;outline:none}
.hud{position:absolute;z-index:2;top:15px;left:17px;right:17px;display:flex;align-items:center;justify-content:space-between;gap:12px;pointer-events:none}
.brand{display:flex;align-items:center;gap:10px;min-width:0;padding:10px 13px;background:#f7efdf;border:2px solid #bca58a;box-shadow:3px 3px 0 #634a3540}
.brand-icon{display:grid;place-items:center;width:32px;height:32px;flex-shrink:0;color:#f8eedc;background:#292e35;border:2px solid #35586d;font-size:22px}
.brand strong{display:block;font-size:17px;letter-spacing:1.3px}
.brand small{display:block;margin-top:4px;color:#756858;font-size:12px}
.money{display:flex;align-items:center;gap:8px;padding:10px 15px;color:var(--ink);background:#f7efdf;border:2px solid #bc8b3e;box-shadow:3px 3px 0 #634a3540;font-size:17px}
.money span{color:#59411d}
.bottom-hud{position:absolute;z-index:2;bottom:14px;left:15px;right:15px;display:flex;justify-content:space-between;align-items:end;gap:10px;pointer-events:none}
.controls{display:flex;align-items:center;flex-wrap:wrap;gap:7px 13px;max-width:calc(100% - 50px);padding:9px 12px;color:#f7eddd;background:#292e35;box-shadow:3px 3px 0 #0002;font-size:12px}
.controls span{display:flex;gap:5px;align-items:center}
kbd{display:inline-grid;place-items:center;min-width:19px;height:19px;padding:2px 5px;color:#292e35;background:#f5eddf;border:2px solid #c7b79f;font-weight:bold}
.small-button,.close-button{display:grid;place-items:center;background:#343941;color:#f8efe1;border:2px solid #1f2329;cursor:pointer}
.small-button{width:38px;height:38px;font-size:20px;pointer-events:auto}
.hint{display:none!important}
.panel{position:absolute;z-index:5;top:50%;left:50%;display:flex;flex-direction:column;width:min(680px,calc(100% - 30px));max-height:min(82%,620px);overflow:hidden;transform:translate(-50%,-50%);color:var(--ink);background:#f7efdf;border:3px solid #a88c6b;box-shadow:0 18px 40px #0005}
.panel.hidden{display:none}
.panel-head{display:flex;justify-content:space-between;align-items:center;gap:15px;padding:17px 19px;background:#e9dcc8;border-bottom:2px solid #c8b69e}
.panel-head small{color:#7c6b57;font-size:10px;letter-spacing:1.4px}
.panel-head h1{margin:5px 0 0;font-size:clamp(19px,3vw,27px);line-height:1.15}
.close-button{width:36px;height:36px;flex-shrink:0;font-size:26px;line-height:1}
.panel-content{overflow-y:auto;overscroll-behavior:contain;padding:17px 19px 21px;scrollbar-width:thin}
.panel-intro{margin:0 0 16px;color:#675c4e;font-size:12px;line-height:1.7}
.panel-content h2{margin:22px 0 10px;padding-bottom:7px;border-bottom:2px solid var(--border);font-size:14px;letter-spacing:.5px}
.item-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.item-card{display:flex;align-items:center;gap:10px;min-width:0;padding:12px;background:#fffaf1;border:2px solid #d8c9b5;box-shadow:2px 2px 0 #6b50301a}
.item-info{flex:1;min-width:0}
.item-info strong{display:block;font-size:12px;line-height:1.4;overflow-wrap:anywhere}
.item-info p{margin:5px 0;color:#716555;font-size:11px;line-height:1.5}
.item-info small{display:block;color:#8b7659;font-size:10px;line-height:1.5}
.action-button,.secondary-button{min-height:34px;padding:8px 10px;color:#fff8ec;background:#587e96;border:2px solid #35586d;font-size:11px;font-weight:bold;transition:background .12s,transform .12s}
.action-button:hover:not(:disabled){background:#395b70;transform:translateY(-1px)}
.action-button:disabled{opacity:.45;cursor:default}
.action-button.muted{background:#777}
.secondary-button{margin-top:15px;color:#51483e;background:#e5d8c5;border-color:#c4b199}
.balance-line,.notice,.empty-state{margin:12px 0;padding:12px;color:#4c5b5c;background:#e2ece6;border:2px solid #b9cfc4;font-size:11px;line-height:1.7}
.empty-state{background:#f0e6d7;border-style:dashed;border-color:#c8b79f;color:#827463}
.order-row{display:flex;justify-content:space-between;align-items:start;gap:12px;padding:12px;border-bottom:1px solid #d8c9b5;font-size:12px}
.order-row small{max-width:55%;color:#7c6b57;text-align:right;font-size:10px;line-height:1.5}
@media(max-width:620px){.brand{padding:7px}.brand-icon{width:26px;height:26px}.brand strong{font-size:13px}.brand small{font-size:10px}.hud{top:8px;left:8px;right:8px}.money{padding:8px;font-size:14px}.controls{gap:5px 8px;padding:7px;font-size:10px}.bottom-hud{left:8px;right:8px;bottom:8px}.item-grid{grid-template-columns:1fr}.panel-head{padding:12px}.panel-content{padding:12px}}
</style>
</head>
<body>
<main id="game">
<canvas id="world" width="960" height="540" aria-label="Pixel-Art-Spielzimmer"></canvas>
<header class="hud">
<div class="brand"><span class="brand-icon">▦</span><div><strong>MEIN ZIMMER</strong><small>Dein kleines Zuhause</small></div></div>
<div class="money"><span>¢</span> <b id="money">120</b></div>
</header>
<div class="bottom-hud">
<div class="controls"><span><kbd>A</kbd> <kbd>D</kbd> Bewegen</span><span><kbd>W</kbd> Springen</span><span><kbd>E</kbd> Interagieren</span><span><kbd>ESC</kbd> Schließen</span></div>
<button id="soundButton" class="small-button" type="button" aria-label="Sound ein oder ausschalten">♫</button>
</div>
<div id="hint" class="hint"></div>
<section id="panel" class="panel hidden" aria-modal="true" role="dialog" aria-labelledby="panelTitle">
<div class="panel-head"><div><small id="panelEyebrow">DEIN ZUHAUSE</small><h1 id="panelTitle">Zimmer</h1></div><button id="closePanel" class="close-button" type="button" aria-label="Schließen">×</button></div>

</main>

function drawStar(x,y,r,color){

function getNearby(){
const px=player.x+player.w/2,py=player.y+player.h/2;
let best=null,bestDistance=Infinity;
const targets={wardrobe:{x:190,y:330},computer:{x:636,y:325},bed:{x:285,y:405},sink:{x:790,y:355},faucet:{x:842,y:310},bucket:{x:bucket.x+bucket.w/2,y:bucket.y+bucket.h/2},door:{x:875,y:390}};
for(const obj of objects){
if(carrying==="bucket"&&obj.id==="bucket")continue;
const target=targets[obj.id]||{x:obj.x+obj.w/2,y:obj.y+obj.h/2};
const dx=Math.max(0,Math.abs(px-target.x)-18),dy=Math.max(0,Math.abs(py-target.y)-24),d=Math.hypot(dx,dy);
if(d<96&&d<bestDistance){best=obj;bestDistance=d}
}
return best;
}

  function interact(){
if(carrying==="bucket"){
bucket.x=Math.max(8,Math.min(W-bucket.w-8,player.x+player.w/2-bucket.w/2+player.facing*25));
bucket.y=FLOOR-bucket.h;carrying=null;persist();playTone(330,.06,"triangle");return;
}
const obj=getNearby();
if(!obj)return;
switch(obj.id){
case "wardrobe":window.location.href="Schrank.html";break;
case "computer":openPanel("computer");break;
case "door":
if(save.orders.some(o=>o.status==="arrived"))openPanel("door");
else window.location.href="Stadt.html";
break;
case "sink":openPanel("sink");break;
case "faucet":
save.faucetOn=!save.faucetOn;persist();playTone(save.faucetOn?540:300,.07,"triangle");break;
case "bucket":carrying="bucket";bucket.x=player.x+player.w/2-bucket.w/2+player.facing*18;bucket.y=player.y+34;playTone(520,.07,"triangle");break;
case "bed":
player.vx=0;keys.clear();playTone(340,.12,"triangle");player.x=170;player.y=FLOOR-player.h;player.facing=1;break;
}
}
function update(dt){
gameTime+=dt;saveTimer+=dt;
if(!activePanel){
const left=keys.has("a")||keys.has("arrowleft");
const right=keys.has("d")||keys.has("arrowright");
player.vx=left?-185:right?185:0;
if(left)player.facing=-1;
if(right)player.facing=1;
player.x+=player.vx*dt;
player.x=Math.max(8,Math.min(W-player.w-8,player.x));
if(player.vx!==0)player.walk+=dt*12;
if(keys.has("w")||keys.has("arrowup")||keys.has(" ")){
if(player.grounded){player.vy=-365;player.grounded=false;playTone(280,.05,"triangle")}
}
player.vy+=900*dt;player.y+=player.vy*dt;
if(player.y+player.h>=FLOOR){player.y=FLOOR-player.h;player.vy=0;player.grounded=true}
if(carrying==="bucket"){bucket.x=player.x+player.w/2-bucket.w/2+player.facing*18;bucket.y=player.y+34}
}else player.vx=0;
if(save.faucetOn){
const under=bucket.x+bucket.w>805&&bucket.x<855&&bucket.y+bucket.h>315&&bucket.y<405;
if(under&&save.bucketWater<1){faucetTimer+=dt;if(faucetTimer>=1){save.bucketWater=Math.min(1,save.bucketWater+.05);faucetTimer=0;persist()}}
}else faucetTimer=0;
if(postmanMode==="walking-in"){postmanX-=150*dt;if(postmanX<=902){postmanX=902;postmanMode="waiting"}}
else if(postmanMode==="walking-out"){postmanX+=180*dt;if(postmanX>W+35){postmanMode="waiting";postmanX=902}}
for(const order of save.orders){
if(order.status==="ordered"){
order.remaining-=dt;
if(order.remaining<=0){order.remaining=0;order.status="arrived";postmanX=970;postmanMode="walking-in";playTone(740,.15,"triangle")}
}
}
if(saveTimer>=1){saveTimer=0;persist()}
}
function setupControls(){
window.addEventListener("keydown",event=>{
const key=event.key.toLowerCase();
if(["arrowleft","arrowright","arrowup"," "].includes(key))event.preventDefault();
if(key==="escape"){
if(!panel.classList.contains("hidden"))closePanel();
else if(carrying)interact();
return;
}
if(key==="e"){
if(!panel.classList.contains("hidden"))return;
interact();return;
}
if(!panel.classList.contains("hidden"))return;
keys.add(key);
});
window.addEventListener("keyup",event=>keys.delete(event.key.toLowerCase()));
window.addEventListener("blur",()=>keys.clear());
$("closePanel").addEventListener("click",closePanel);
$("soundButton").addEventListener("click",()=>{
soundOn=!soundOn;
$("soundButton").textContent=soundOn?"♫":"♪";
if(soundOn)playTone(540,.08,"triangle");
});
}
function frame(now){
const dt=Math.min((now-lastTime)/1000,.04);
lastTime=now;
if(panel.classList.contains("hidden"))update(dt);
draw();
requestAnimationFrame(frame);
}
function init(){
persist();setupControls();panel.classList.add("hidden");requestAnimationFrame(frame);
}
init();
})();
