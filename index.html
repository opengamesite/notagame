
<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Mein Zimmer</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;font-family:Arial,sans-serif;background:#20252a;color:#292e35}
#game{position:relative;width:100%;height:100%;overflow:hidden}
#world{position:absolute;inset:0;width:100%;height:100%;display:block}
.hud{position:absolute;z-index:2;top:16px;left:18px;right:18px;display:flex;justify-content:space-between;pointer-events:none}
.brand,.money{background:#fffaf1eF;border:1px solid #d4c6b3;border-radius:12px;padding:12px 17px;box-shadow:0 4px 18px #0002}
.brand strong{display:block;font-size:16px;letter-spacing:1px}
.brand small{color:#887a68;font-size:12px}
.money{font-size:17px}
.money span{color:#b18a42}
.bottom{position:absolute;bottom:16px;left:18px;right:18px;display:flex;justify-content:space-between;align-items:end;pointer-events:none}
.controls{background:#252b31dd;color:white;border-radius:10px;padding:11px 15px;font-size:12px}
button{cursor:pointer;font:inherit}
.sound{pointer-events:auto;border:0;border-radius:10px;background:#fffaf1;padding:12px 15px;font-size:19px}
.panel{position:absolute;z-index:5;top:50%;left:50%;transform:translate(-50%,-50%);width:min(680px,calc(100% - 28px));max-height:82%;display:flex;flex-direction:column;background:#faf5eb;border:1px solid #d7c8b4;border-radius:16px;box-shadow:0 20px 70px #0006;overflow:hidden}
.hidden{display:none!important}
.panel-head{display:flex;justify-content:space-between;align-items:center;padding:17px 20px;background:#eee5d7;border-bottom:1px solid #d7c8b4}
.panel-head small{font-size:10px;letter-spacing:1.5px;color:#87745d}
.panel-head h1{font-size:23px;margin:5px 0 0}
.close{border:0;border-radius:8px;background:#343a40;color:white;width:36px;height:36px;font-size:23px}
.content{padding:18px;overflow:auto}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.card{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:13px;background:white;border:1px solid #e0d5c6;border-radius:10px}
.card strong{font-size:13px}
.card small{display:block;color:#887a68;font-size:11px;margin-top:5px}
.action{border:0;border-radius:7px;background:#587e96;color:white;padding:9px 12px;font-size:12px}
.action:disabled{opacity:.4}
.secondary{background:#e9dfd0;color:#50483e}
.balance,.notice{padding:12px;background:#e5eee8;border-radius:8px;margin-bottom:13px;font-size:13px}
.order{display:flex;justify-content:space-between;padding:12px 3px;border-bottom:1px solid #ddd2c2;font-size:13px}
@media(max-width:600px){.grid{grid-template-columns:1fr}.brand{padding:9px 12px}.controls{font-size:10px;padding:9px}}
</style>
</head>
<body>
<main id="game">
<canvas id="world"></canvas>
<header class="hud">
 <div class="brand"><strong>MEIN ZIMMER</strong><small>Dein kleines Zuhause</small></div>
 <div class="money"><span>¢</span> <b id="money">120</b></div>
</header>
<div class="bottom">
 <div class="controls">WASD – Bewegen &nbsp; · &nbsp; E – Interagieren &nbsp; · &nbsp; ESC – Schließen</div>
 <button class="sound" id="soundButton">♫</button>
</div>
<section id="panel" class="panel hidden" role="dialog" aria-modal="true">
 <div class="panel-head">
  <div><small id="panelEyebrow">DEIN ZUHAUSE</small><h1 id="panelTitle">Zimmer</h1></div>
  <button class="close" id="closePanel">×</button>
 </div>
 <div id="panelContent" class="content"></div>
</section>
</main>

<script type="module">
import * as THREE from "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js";

const $=id=>document.getElementById(id);
const canvas=$("world");
const renderer=new THREE.WebGLRenderer({canvas,antialias:true});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.shadowMap.enabled=true;
renderer.shadowMap.type=THREE.PCFSoftShadowMap;
renderer.outputColorSpace=THREE.SRGBColorSpace;
renderer.toneMapping=THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure=1.15;

const scene=new THREE.Scene();
scene.background=new THREE.Color("#c9d3d4");
scene.fog=new THREE.Fog("#c9d3d4",18,35);

const camera=new THREE.PerspectiveCamera(42,1,.1,100);
camera.position.set(8,9,12);
camera.lookAt(0,1,0);

scene.add(new THREE.HemisphereLight("#fff4df","#77716b",2));

const sun=new THREE.DirectionalLight("#fff0d7",3);
sun.position.set(-5,10,7);
sun.castShadow=true;
sun.shadow.mapSize.set(2048,2048);
sun.shadow.camera.left=-12;
sun.shadow.camera.right=12;
sun.shadow.camera.top=12;
sun.shadow.camera.bottom=-12;
scene.add(sun);

const mats={};
function mat(name,color,roughness=.8,metalness=0){
 if(!mats[name])mats[name]=new THREE.MeshStandardMaterial({color,roughness,metalness});
 return mats[name];
}
const wood=mat("wood","#a8784d");
const darkWood=mat("darkwood","#65452f");
const wall=mat("wall","#e6d9c7");
const floorMat=mat("floor","#a98160");
const fabric=mat("fabric","#d5c8b5");
const blueFabric=mat("bluefabric","#71899a");
const metal=mat("metal","#737c80",.35,.7);
const white=mat("white","#eeeae1");
const glass=mat("glass","#9fcbd0",.2);
const green=mat("green","#658c68");
const black=mat("black","#252a2e",.3);

function box(parent,x,y,z,w,h,d,material,cast=true){
 const m=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),material);
 m.position.set(x,y,z);
 m.castShadow=cast;m.receiveShadow=true;
 parent.add(m);return m;
}
function cylinder(parent,x,y,z,r1,r2,h,material,segments=24){
 const m=new THREE.Mesh(new THREE.CylinderGeometry(r1,r2,h,segments),material);
 m.position.set(x,y,z);m.castShadow=true;m.receiveShadow=true;parent.add(m);return m;
}
function sphere(parent,x,y,z,r,material){
 const m=new THREE.Mesh(new THREE.SphereGeometry(r,20,14),material);
 m.position.set(x,y,z);m.castShadow=true;parent.add(m);return m;
}
function group(parent,x=0,y=0,z=0){
 const g=new THREE.Group();g.position.set(x,y,z);parent.add(g);return g;
}

// Zimmer
const room=group(scene);
box(room,0,-.18,0,16,.35,12,floorMat);
box(room,0,2.3,-6,16,5,.25,wall);
box(room,-8,2.3,0,.25,5,12,wall);
box(room,8,2.3,0,.25,5,12,wall);
box(room,0,4.85,0,16,.2,12,mat("ceiling","#eee7db"),false);

// Fußleisten
box(room,0,.08,-5.82,15.8,.16,.08,darkWood);
box(room,-7.82,.08,0,.08,.16,11.7,darkWood);
box(room,7.82,.08,0,.08,.16,11.7,darkWood);

// Fenster
const windowGroup=group(room,-1.5,2.9,-5.82);
box(windowGroup,0,0,0,3.2,1.9,.12,darkWood);
box(windowGroup,0,0,.08,2.95,1.65,.04,glass,false);
box(windowGroup,0,0,.13,.07,1.65,.04,white,false);
box(windowGroup,0,0,.13,2.95,.07,.04,white,false);

// Bett
const bed=group(room,-5.2,0,-2.7);
box(bed,0,.35,0,3.4,.5,2.2,darkWood);
box(bed,0,.68,0,3.3,.22,2.1,fabric);
box(bed,0,.84,.55,3.25,.2,.95,blueFabric);
box(bed,-.9,.9,-.55,.85,.22,.65,white);
box(bed,.05,.9,-.55,.85,.22,.65,white);
box(bed,0,.85,-1.05,3.35,1.5,.16,wood);

// Kleiderschrank
const wardrobe=group(room,-6.3,0,1.2);
box(wardrobe,0,1.35,0,2.1,2.7,.85,wood);
box(wardrobe,0,1.35,.46,1.95,2.55,.06,darkWood);
box(wardrobe,-.49,1.35,.51,.91,2.45,.05,wood);
box(wardrobe,.49,1.35,.51,.91,2.45,.05,wood);
sphere(wardrobe,-.1,1.35,.57,.055,metal);
sphere(wardrobe,.1,1.35,.57,.055,metal);

// Schreibtisch
const desk=group(room,2.2,0,-3.6);
box(desk,0,1.25,0,3.3,.2,1.3,wood);
box(desk,-1.4,.62,0,.18,1.2,.9,darkWood);
box(desk,1.4,.62,0,.18,1.2,.9,darkWood);
box(desk,0,1.9,-.35,1.05,.8,.12,black);
box(desk,0,1.9,-.26,.92,.65,.035,mat("screen","#426b76",.3));
box(desk,0,1.43,-.1,.55,.07,.45,metal);
box(desk,0,1.38,.5,1.1,.08,.4,black);

// Waschbecken
const sink=group(room,6,0,-1.5);
box(sink,0,1.05,0,1.7,.2,.85,wood);
box(sink,0,1.2,0,1.6,.18,.78,white);
box(sink,0,1.3,0,1.05,.05,.45,mat("basin","#b9c6c5"));
cylinder(sink,0,1.58,-.3,.045,.045,.48,metal);
box(sink,0,1.8,-.08,.35,.06,.06,metal);

// Tür
const door=group(room,7.75,0,3.2);
box(door,0,1.45,0,.15,2.9,1.55,darkWood);
box(door,-.09,1.45,0,.05,2.7,1.35,wood);
sphere(door,-.17,1.4,.45,.07,metal);

// Dekoration
function plant(x,z){
 const p=group(room,x,0,z);
 cylinder(p,0,.25,0,.25,.3,.5,mat("pot","#a9684e"));
 cylinder(p,0,.85,0,.035,.035,.75,green);
 for(let i=0;i<6;i++){
  const a=i*Math.PI/3;
  const leaf=sphere(p,Math.cos(a)*.28,.85+Math.sin(i*2)*.12,Math.sin(a)*.28,.19,green);
  leaf.scale.set(1.4,.45,.65);leaf.rotation.z=-a;
 }
}
plant(4.7,2.7);plant(-3.4,-4.5);

// Teppich
const rug=box(room,0,.015,1.5,5,.035,3,blueFabric,false);

// Stuhl als Spielfigur
const player=group(scene,0,0,2.8);
const chairParts={};
const chairWood=mat("chairwood","#9b714c");
const seatFabric=mat("seatfabric","#b9a58c");
const chairMetal=mat("chairmetal","#44494b",.35,.65);

function makeChair(){
 const body=group(player);
 chairParts.body=body;
 // Sitzfläche
 box(body,0,.85,0,.95,.18,.9,seatFabric);
 box(body,0,.94,0,1,.07,.95,chairWood);
 // Rückenlehne
 box(body,0,1.48,-.39,.95,1.05,.13,chairWood);
 box(body,0,1.49,-.31,.78,.85,.08,seatFabric);
 // Beine
 for(const x of [-.38,.38])for(const z of [-.35,.35]){
  const leg=box(body,x,.4,z,.12,.8,.12,chairWood);
  leg.rotation.z=(x>0?.025:-.025);
 }
 // Streben
 box(body,0,.35,-.35,.8,.08,.08,darkWood);
 box(body,0,.35,.35,.8,.08,.08,darkWood);
 // Tragearme: zunächst unsichtbar
 const arms=group(body);
 chairParts.arms=arms;
 for(const side of [-1,1]){
  const arm=group(arms,side*.48,.8,0);
  box(arm,side*.12,.05,0,.12,.12,.65,chairWood);
  const upper=box(arm,side*.1,.32,-.05,.1,.5,.1,chairWood);
  upper.rotation.z=side*.3;
  sphere(arm,side*.1,.58,-.05,.09,chairWood);
 }
 arms.visible=false;
}
makeChair();

// Gegenstände
const objects=[];
function addObject(id,name,x,z,build){
 const g=group(scene,x,0,z);build(g);
 objects.push({id,name,group:g,x,z});
 return g;
}
addObject("lamp","Schreibtischlampe",2.2,-3.6,g=>{
 cylinder(g,0,1.4,0,.16,.16,.08,metal);
 cylinder(g,0,1.75,0,.035,.035,.65,metal);
 const shade=cylinder(g,0,2.1,0,.25,.1,.25,mat("lampshade","#dfc27e"));
 shade.rotation.x=Math.PI;
});
addObject("poster","Poster",-3.7,-5.8,g=>{
 box(g,0,2.8,0,1.2,.85,.08,darkWood);
 box(g,0,2.8,.05,1.05,.7,.025,mat("poster","#91a99d"));
});
addObject("teddy","Teddybär",-4.2,-2.4,g=>{
 sphere(g,0,.35,0,.32,mat("teddy","#ae8056"));
 sphere(g,-.2,.62,0,.15,mat("teddy2","#ae8056"));
 sphere(g,.2,.62,0,.15,mat("teddy2","#ae8056"));
});
const bucket=addObject("bucket","Eimer",4.5,-.3,g=>{
 cylinder(g,0,.25,0,.25,.31,.5,mat("bucket","#879b9d"));
});
let placed=[];

const defaults={
 money:120,unlocked:[],equipped:{head:null,face:null,clothes:null,back:null,pants:null},
 inventory:[],placed:[],orders:[],received:[],faucetOn:false,bucketWater:0
};
const STORAGE_KEY="mein-zimmer-save-v1";
function loadSave(){
 try{
  const s=JSON.parse(localStorage.getItem(STORAGE_KEY)||"null");
  if(!s)return structuredClone(defaults);
  return {...structuredClone(defaults),...s,equipped:{...defaults.equipped,...(s.equipped||{})}};
 }catch{return structuredClone(defaults)}
}
let save=loadSave();
function persist(){
 localStorage.setItem(STORAGE_KEY,JSON.stringify(save));
 $("money").textContent=save.money;
}
persist();

// Bewegung und Tragen
const keys=new Set();
let carrying=null,carryingItem=null;
let walkTime=0,gameTime=0;
const velocity=new THREE.Vector3();
const clock=new THREE.Clock();
const raycaster=new THREE.Raycaster();
const pointer=new THREE.Vector2();
let nearby=null;

function setCarrying(value){
 carrying=value;
 chairParts.arms.visible=!!value;
}
function chairCosmetics(){
 const eq=save.equipped||{};
 const colors={
  blue:"#547b9a",red:"#a95149",green:"#658b68",black:"#30363b",
  white:"#e9e4d9",gold:"#b7954f",wood:"#9b714c"
 };
 if(eq.clothes&&colors[eq.clothes]){
  chairParts.body.children[0].material=mat("chaircustom",colors[eq.clothes]);
 }
}
function movePlayer(dt){
 let x=0,z=0;
 if(keys.has("a")||keys.has("arrowleft"))x-=1;
 if(keys.has("d")||keys.has("arrowright"))x+=1;
 if(keys.has("w")||keys.has("arrowup"))z-=1;
 if(keys.has("s")||keys.has("arrowdown"))z+=1;
 const moving=x!==0||z!==0;
 if(moving){
  const len=Math.hypot(x,z);x/=len;z/=len;
  player.position.x+=x*3.2*dt;
  player.position.z+=z*3.2*dt;
  player.rotation.y=Math.atan2(x,z);
  walkTime+=dt*9;
 }
 player.position.x=THREE.MathUtils.clamp(player.position.x,-7,7);
 player.position.z=THREE.MathUtils.clamp(player.position.z,-5.3,5.2);
 player.position.y=moving?Math.abs(Math.sin(walkTime))*.025:0;
 chairParts.body.rotation.z=moving?Math.sin(walkTime)*.025:0;
}

// Panel-System
const panel=$("panel"),content=$("panelContent");
let activePanel=null;
function openPanel(kind){
 activePanel=kind;panel.classList.remove("hidden");renderPanel();
}
function closePanel(){panel.classList.add("hidden");activePanel=null}
$("closePanel").onclick=closePanel;

const shopItems=[
 {id:"plant",name:"Zimmerpflanze",price:35,desc:"Eine kleine Pflanze für dein Zimmer."},
 {id:"lamp",name:"Schreibtischlampe",price:45,desc:"Warmes Licht für den Abend."},
 {id:"poster",name:"Poster",price:25,desc:"Dekoration für die Wand."},
 {id:"teddy",name:"Teddybär",price:40,desc:"Ein gemütlicher Mitbewohner."},
 {id:"rug",name:"Teppich",price:50,desc:"Macht den Boden gemütlicher."},
 {id:"star",name:"Sternen-Deko",price:60,desc:"Kleine Sterne für die Wand."}
];
const cosmetics=[
 {id:"blue",name:"Blauer Stuhl",price:25,desc:"Ein blauer Stoffbezug."},
 {id:"red",name:"Roter Stuhl",price:30,desc:"Ein roter Stoffbezug."},
 {id:"green",name:"Grüner Stuhl",price:30,desc:"Ein grüner Stoffbezug."},
 {id:"black",name:"Schwarzer Stuhl",price:40,desc:"Ein dunkler Look."},
 {id:"white",name:"Weißer Stuhl",price:40,desc:"Ein heller Bezug."},
 {id:"gold",name:"Goldene Details",price:80,desc:"Edle goldene Akzente."}
];

function button(text,fn,disabled=false){
 const b=document.createElement("button");b.className="action";b.textContent=text;b.disabled=disabled;b.onclick=fn;return b;
}
function card(name,detail,action,disabled=false){
 const el=document.createElement("div");el.className="card";
 const info=document.createElement("div");info.innerHTML=`<strong>${name}</strong><small>${detail}</small>`;
 el.append(info,action);return el;
}
function renderPanel(){
 content.innerHTML="";
 const titles={
 computer:["DEIN ZUHAUSE","Bestellungen"],
 door:["LIEFERUNG","An deiner Tür"],
 wardrobe:["DEIN STUHL","Stuhl-Cosmetics"],
 sink:["WASSER","Waschbecken"],
 bucket:["EIMER","Wasser auffüllen"]
 };
 const t=titles[activePanel]||["DEIN ZUHAUSE","Zimmer"];
 $("panelEyebrow").textContent=t[0];$("panelTitle").textContent=t[1];

 if(activePanel==="computer")renderShop();
 if(activePanel==="wardrobe")renderWardrobe();
 if(activePanel==="door")renderDoor();
 if(activePanel==="sink"||activePanel==="bucket")renderWater();
}
function renderShop(){
 const bal=document.createElement("div");bal.className="balance";bal.textContent=`Guthaben: ${save.money} Münzen`;content.append(bal);
 const grid=document.createElement("div");grid.className="grid";
 for(const item of shopItems){
  const owned=save.inventory.includes(item.id)||save.placed.some(p=>p.id===item.id)||save.orders.some(o=>o.id===item.id);
  grid.append(card(item.name,`${item.desc} · ${item.price} Münzen`,
   button("Bestellen",()=>{
    if(save.money<item.price)return;
    save.money-=item.price;save.orders.push({id:item.id,status:"ordered",remaining:20});persist();renderPanel();
   },owned||save.money<item.price)));
 }
 content.append(grid);
 const h=document.createElement("h2");h.textContent="Bestellungen";content.append(h);
 for(const o of save.orders){
  const row=document.createElement("div");row.className="order";
  row.textContent=`${shopItems.find(i=>i.id===o.id)?.name||o.id} – ${o.status==="arrived"?"An der Tür":o.status==="received"?"Abgeholt":Math.ceil(o.remaining)+" Sekunden"}`;
  content.append(row);
 }
}
function renderWardrobe(){
 const grid=document.createElement("div");grid.className="grid";
 for(const item of cosmetics){
  const owned=save.unlocked.includes(item.id);
  const active=save.equipped.clothes===item.id;
  grid.append(card(item.name,`${item.desc} · ${owned?"Freigeschaltet":item.price+" Münzen"}`,
   button(owned?(active?"Ausziehen":"Anziehen"):"Kaufen",()=>{
    if(!owned){
     if(save.money<item.price)return;
     save.money-=item.price;save.unlocked.push(item.id);
    }
    save.equipped.clothes=active?null:item.id;
    chairCosmetics();persist();renderPanel();
   },!owned&&save.money<item.price)));
 }
 content.append(grid);
}
function renderDoor(){
 const arrived=save.orders.filter(o=>o.status==="arrived");
 if(!arrived.length){content.textContent="Momentan ist keine Lieferung angekommen.";return}
 for(const o of arrived){
  const item=shopItems.find(i=>i.id===o.id);
  content.append(card(item.name,"Dein Paket ist angekommen.",
   button("Abholen",()=>{
    o.status="received";save.received.push(o.id);save.inventory.push(o.id);persist();renderPanel();
   })));
 }
}
function renderWater(){
 const status=document.createElement("div");status.className="balance";
 status.textContent=save.bucketWater>0?"Der Eimer enthält Wasser.":"Der Eimer ist leer.";
 content.append(status);
 content.append(button(save.faucetOn?"Wasserhahn ausschalten":"Wasserhahn einschalten",()=>{
  save.faucetOn=!save.faucetOn;persist();renderPanel();
 }));
 content.append(button("Eimer auffüllen",()=>{
  save.bucketWater=1;persist();renderPanel();
 }));
}

// Interaktion
const targets=[
 {id:"wardrobe",x:-6.3,z:1.2},
 {id:"computer",x:2.2,z:-3.6},
 {id:"bed",x:-5.2,z:-2.7},
 {id:"sink",x:6,z:-1.5},
 {id:"door",x:7.75,z:3.2},
 {id:"bucket",x:4.5,z:-.3}
];
function findNearby(){
 let best=null,distance=Infinity;
 for(const t of targets){
  const d=Math.hypot(player.position.x-t.x,player.position.z-t.z);
  if(d<2.1&&d<distance){best=t;distance=d}
 }
 return best;
}
function interact(){
 if(!panel.classList.contains("hidden"))return;
 if(carrying){
  if(carrying==="bucket"){
   bucket.group.position.set(player.position.x,0,player.position.z-1);
  }else{
   const item=objects.find(o=>o.id===carrying);
   if(item)item.group.position.set(player.position.x,0,player.position.z-1);
  }
  setCarrying(null);return;
 }
 const near=findNearby();
 if(near){
  if(near.id==="wardrobe")openPanel("wardrobe");
  if(near.id==="computer")openPanel("computer");
  if(near.id==="door"){
   if(save.orders.some(o=>o.status==="arrived"))openPanel("door");
   else window.location.href="Stadt.html";
  }
  if(near.id==="sink")openPanel("sink");
  if(near.id==="bucket")setCarrying("bucket");
  return;
 }
 // Aufgestellte Gegenstände aufnehmen
 let nearest=null,dist=1.5;
 for(const o of objects){
  if(["bucket"].includes(o.id))continue;
  const d=Math.hypot(player.position.x-o.group.position.x,player.position.z-o.group.position.z);
  if(d<dist){dist=d;nearest=o}
 }
 if(nearest){setCarrying(nearest.id);return}
 if(save.inventory.length){
  const id=save.inventory.shift();
  const item=objects.find(o=>o.id===id);
  if(item){item.group.position.set(player.position.x,0,player.position.z-1);setCarrying(id)}
  persist();
 }
}
window.addEventListener("keydown",e=>{
 const k=e.key.toLowerCase();
 if(["arrowup","arrowdown","arrowleft","arrowright"," "].includes(k))e.preventDefault();
 if(k==="escape"){if(!panel.classList.contains("hidden"))closePanel();else if(carrying)interact();return}
 if(k==="e"){interact();return}
 if(!panel.classList.contains("hidden"))return;
 keys.add(k);
});
window.addEventListener("keyup",e=>keys.delete(e.key.toLowerCase()));
window.addEventListener("blur",()=>keys.clear());

// Sound
let soundOn=true;
$("soundButton").onclick=()=>{
 soundOn=!soundOn;$("soundButton").textContent=soundOn?"♫":"♪";
};

// Responsive
function resize(){
 const w=canvas.clientWidth,h=canvas.clientHeight;
 renderer.setSize(w,h,false);camera.aspect=w/h;camera.updateProjectionMatrix();
}
window.addEventListener("resize",resize);
resize();

// Kamera folgt dem Stuhl
function animate(){
 requestAnimationFrame(animate);
 const dt=Math.min(clock.getDelta(),.04);
 gameTime+=dt;
 if(panel.classList.contains("hidden")){
  movePlayer(dt);
  const target=new THREE.Vector3(player.position.x+7,8,player.position.z+9);
  camera.position.lerp(target,1-Math.pow(.001,dt));
  camera.lookAt(player.position.x,1,player.position.z);
 }
 if(carrying){
  chairParts.arms.visible=true;
  chairParts.arms.rotation.z=Math.sin(gameTime*4)*.025;
 }
 for(const o of save.orders){
  if(o.status==="ordered"){
   o.remaining-=dt;
   if(o.remaining<=0){o.remaining=0;o.status="arrived";persist()}
  }
 }
 renderer.render(scene,camera);
}
animate();
</script>
</body>
</html>
