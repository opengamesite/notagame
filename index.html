<main id="game">
  <canvas id="world" width="960" height="540" aria-label="Pixel-Art-Spielzimmer"></canvas>

    <div class="brand">

        <small>Dein kleines Zuhause</small>
      </div>
    </div>
    <div class="money"><span>¢</span> <b id="money">120</b></div>
  </header>

  <div class="bottom-hud">

      <span><kbd>W</kbd> Springen</span>

  <section id="panel" class="panel hidden" aria-modal="true" role="dialog" aria-labelledby="panelTitle">

      <div>
        <small id="panelEyebrow">DEIN ZUHAUSE</small>

      <button id="closePanel" class="close-button" type="button" aria-label="Schließen">×</button>

function showHint(text) {

  clearTimeout(hintTimer);

function playTone(freq=440,duration=.07,wave="square") {
  if (!soundOn) return;
  try {
    audio ||= new (window.AudioContext || window.webkitAudioContext)();
    if(audio.state==="suspended") audio.resume();
    const osc=audio.createOscillator();
    const gain=audio.createGain();
    osc.type=wave;
    osc.frequency.value=freq;
    gain.gain.setValueAtTime(.045,audio.currentTime);
    gain.gain.exponentialRampToValueAtTime(.001,audio.currentTime+duration);
    osc.connect(gain);
    gain.connect(audio.destination);
    osc.start();
    osc.stop(audio.currentTime+duration);
  } catch {}
}

function rect(x,y,w,h,color) {
  ctx.fillStyle=color;
  ctx.fillRect(Math.round(x),Math.round(y),Math.round(w),Math.round(h));
}

function line(x1,y1,x2,y2,color,width=2) {
  ctx.strokeStyle=color;
  ctx.lineWidth=width;
  ctx.lineCap="square";
  ctx.beginPath();
  ctx.moveTo(Math.round(x1),Math.round(y1));
  ctx.lineTo(Math.round(x2),Math.round(y2));
  ctx.stroke();
}

function pixelText(text,x,y,color="#433a38",size=10) {
  ctx.fillStyle=color;
  ctx.font=`${size}px monospace`;
  ctx.fillText(text,x,y);
}

    rect(-16,-35,3,3,"#9bdc83");

  ctx.restore();
}

function drawStar(x,y,r,color) {
  ctx.fillStyle=color;
  ctx.beginPath();
  for(let i=0;i<10;i++) {
    const a=-Math.PI/2+i*Math.PI/5;
    const rr=i%2===0?r:r*.45;
    const px=x+Math.cos(a)*rr,py=y+Math.sin(a)*rr;
    if(i===0)ctx.moveTo(px,py);else ctx.lineTo(px,py);
  }
  ctx.closePath();
  ctx.fill();
}

function drawFaucetWater() {
  if(!save.faucetOn)return;
  const under=bucket.x+bucket.w>805&&bucket.x<855&&
    bucket.y+bucket.h>315&&bucket.y<405;
  const endY=under?bucket.y+5:329;
  const wobble=Math.sin(gameTime*15)*1.5;
  line(850,299,850+wobble,endY,"#8cd9ec",3);
  for(let i=0;i<5;i++) {
    const yy=302+((gameTime*42+i*17)%Math.max(8,endY-302));
    rect(847+Math.round(Math.sin(gameTime*8+i)*2),yy,3,4,"#d6f5ff");
  }
  if(under&&save.bucketWater>0) {
    const fill=Math.min(20,save.bucketWater*20);
    rect(bucket.x+5,bucket.y+bucket.h-6-fill,bucket.w-10,fill,"#69c9e7");
  }
}

}

function drawPlayer() {
  const x=player.x,y=player.y,f=player.facing;
  const moving=Math.abs(player.vx)>.1&&player.grounded&&!dragging;
  const swing=moving?Math.sin(player.walk)*7:0;
  const lift=player.grounded?0:Math.sin(gameTime*12)*1.5;
  const skin="#d5b18a",edge="#805b3c",wood="#b98552",light="#dfb47b";
  const cx=x+player.w/2,shoulderY=y+31+lift,hipY=y+52+lift,headY=y+7+lift;

  rect(cx-18,FLOOR-3,36,3,"#805d46");
  rect(cx-12,FLOOR-5,24,2,"#8b6b52");

  function segment(a,b,width,color,outline=edge) {
    line(a.x,a.y,b.x,b.y,outline,width+4);
    line(a.x,a.y,b.x,b.y,color,width);
    rect(a.x-width/2,a.y-width/2,width,width,light);
  }
  function joint(p,r=4) {
    rect(p.x-r-1,p.y-r-1,(r+1)*2,(r+1)*2,edge);
    rect(p.x-r,p.y-r,r*2,r*2,wood);
    rect(p.x-r+1,p.y-r+1,Math.max(2,r-1),2,light);
  }

  const lh={x:cx-5,y:hipY},rh={x:cx+5,y:hipY};
  const lk={x:cx-7-swing*.4,y:y+65+lift},rk={x:cx+7+swing*.4,y:y+65+lift};
  const lf={x:cx-9+swing,y:y+77+lift},rf={x:cx+9-swing,y:y+77+lift};
  segment(lh,lk,7,wood);segment(lk,lf,6,wood);
  segment(rh,rk,7,wood);segment(rk,rf,6,wood);
  [lh,rh,lk,rk].forEach(p=>joint(p,4));
  [lf,rf].forEach(p=>joint(p,3));
  rect(lf.x-5,lf.y-1,10,5,edge);rect(lf.x-4,lf.y,8,3,wood);
  rect(rf.x-5,rf.y-1,10,5,edge);rect(rf.x-4,rf.y,8,3,wood);

  const holding=carrying==="bucket";
  const ls={x:cx-10,y:shoulderY},rs={x:cx+10,y:shoulderY};
  const le=holding?{x:cx-13,y:y+39+lift}:{x:cx-15-swing*.55,y:y+43+lift};
  const re=holding?{x:cx+13,y:y+39+lift}:{x:cx+15+swing*.55,y:y+43+lift};
  const lhand=holding?{x:cx-7,y:y+36+lift}:{x:cx-14-swing,y:y+54+lift};
  const rhand=holding?{x:cx+7,y:y+36+lift}:{x:cx+14+swing,y:y+54+lift};
  segment(ls,le,6,wood);segment(le,lhand,5,wood);
  segment(rs,re,6,wood);segment(re,rhand,5,wood);
  [ls,rs].forEach(p=>joint(p,4));[le,re].forEach(p=>joint(p,3));
  [lhand,rhand].forEach(p=>joint(p,3));

  rect(cx-11,shoulderY-3,22,24,edge);
  rect(cx-8,shoulderY,16,18,wood);
  rect(cx-6,shoulderY+2,4,13,light);
  rect(cx-5,hipY-1,10,5,edge);rect(cx-4,hipY,8,3,wood);

  const clothes=save.equipped.clothes;
  const colors={shirt:"#c64c48",hoodie:"#3977bd",jacket:"#454c5a",stripedshirt:"#e9e3d7",purplehoodie:"#8759a8"};
  if(clothes==="scarf") {
    rect(cx-10,shoulderY-2,20,6,"#4d995f");
    rect(cx+3,shoulderY+1,5,15,"#4d995f");
  } else if(colors[clothes]) {
    rect(cx-10,shoulderY-2,20,20,colors[clothes]);
    if(clothes==="hoodie"||clothes==="purplehoodie") {
      rect(cx-7,shoulderY-5,14,6,clothes==="hoodie"?"#28578b":"#664080");
      rect(cx-1,shoulderY+2,2,9,"#d9d5ce");
    } else if(clothes==="jacket") {
      rect(cx-1,shoulderY+1,2,17,"#252b35");
      rect(cx-7,shoulderY+7,4,3,"#a8adb4");
      rect(cx+3,shoulderY+7,4,3,"#a8adb4");
    } else if(clothes==="stripedshirt") {
      rect(cx-9,shoulderY+3,18,3,"#527b9e");
      rect(cx-9,shoulderY+10,18,3,"#527b9e");
      rect(cx-9,shoulderY+17,18,2,"#527b9e");
    }
  }

  rect(cx-4,shoulderY-7,8,7,edge);
  rect(cx-3,shoulderY-6,6,6,wood);
  const hx=cx-11;
  rect(hx,headY,22,23,edge);
  rect(hx+2,headY+2,18,19,skin);
  rect(hx+4,headY+4,14,15,wood);
  rect(hx+5,headY+5,4,11,light);
  rect(hx+10,headY+5,7,11,"#c99a64");
  rect(hx+5,headY+17,12,2,edge);
  rect(cx-6,headY+10,3,3,"#43362c");
  rect(cx+4,headY+10,3,3,"#43362c");
  rect(cx-2,headY+16,5,2,"#8c5944");

  const head=save.equipped.head;
  if(head==="cap") {
    rect(cx-13,headY+1,26,5,"#3977bd");
    rect(cx-10,headY-5,20,7,"#3977bd");
    rect(cx+4,headY+4,10,3,"#285a91");
  } else if(head==="crown") {
    rect(cx-12,headY-4,24,5,"#d8a92e");
    rect(cx-12,headY-11,5,8,"#f4c64e");
    rect(cx-4,headY-14,6,11,"#f4c64e");
    rect(cx+5,headY-10,6,7,"#f4c64e");
  } else if(head==="beanie") {
    rect(cx-12,headY-4,24,9,"#4d995f");
    rect(cx-9,headY-8,18,6,"#4d995f");
    rect(cx-12,headY+2,24,3,"#347344");
  } else if(head==="headphones") {
    rect(cx-14,headY+1,4,14,"#343b48");
    rect(cx+10,headY+1,4,14,"#343b48");
    rect(cx-12,headY-5,24,5,"#343b48");
  } else if(head==="flowercrown") {
    rect(cx-12,headY+1,24,3,"#47764b");
    for(const [dx,dy,c] of [[-10,0,"#e88aaa"],[-5,-4,"#f0c45d"],[0,-5,"#d98cbd"],[5,-4,"#f0c45d"],[10,0,"#e88aaa"]]) {
      rect(cx+dx-2,headY+dy-2,5,5,c);
    }
  }

  const face=save.equipped.face;
  if(face==="glasses"||face==="sunglasses") {
    const c=face==="glasses"?"#29323c":"#202934";
    rect(cx-9,headY+9,8,6,c);rect(cx+1,headY+9,8,6,c);

    rect(cx-7,headY+10,4,2,"#9fc9d6");
    rect(cx+3,headY+10,4,2,"#9fc9d6");
  } else if(face==="mask") {

}

function createWaterParticles(x,y) {
  for(let i=0;i<16;i++) {
    waterParticles.push({
      x:x+(Math.random()-.5)*20,
      y:y+Math.random()*5,
      vx:(Math.random()-.5)*65,
      vy:-25-Math.random()*75,
      life:.35+Math.random()*.45,
      maxLife:.8,
      size:2+Math.random()*3
    });
  }
}

function updateWaterParticles(dt) {
  for(const p of waterParticles) {
    p.x+=p.vx*dt;
    p.y+=p.vy*dt;
    p.vy+=150*dt;
    p.life-=dt;
  }
  waterParticles=waterParticles.filter(p=>p.life>0);
}

function drawWaterParticles() {
  for(const p of waterParticles) {
    ctx.globalAlpha=Math.max(0,p.life/p.maxLife);
    rect(p.x,p.y,p.size,p.size+1,"#75d9ff");
  }
  ctx.globalAlpha=1;
}

function openPanel(kind,placedId=null) {
  activePanel=kind;
  activePlacedId=placedId;
  inventoryOpen=kind==="inventory";
  panel.classList.remove("hidden");
  renderPanel();
  playTone(540,.06,"triangle");
}

function closePanel() {
  activePanel=null;
  activePlacedId=null;
  inventoryOpen=false;
  panel.classList.add("hidden");
  panelContent.innerHTML="";
  keys.clear();
  canvas.focus();
}

function makeButton(text,action,className="action-button") {
  const button=document.createElement("button");
  button.type="button";
  button.className=className;
  button.textContent=text;
  button.addEventListener("click",action);
  return button;
}

function makeCard(title,description,detail,actionText,action,disabled=false) {
  const card=document.createElement("article");
  card.className="item-card";
  const info=document.createElement("div");
  info.className="item-info";
  const h=document.createElement("strong");
  h.textContent=title;
  const p=document.createElement("p");
  p.textContent=description;
  const meta=document.createElement("small");
  meta.textContent=detail;
  info.append(h,p,meta);
  card.append(info,makeButton(actionText,action,"action-button"+(disabled?" muted":"")));
  if(disabled)card.querySelector("button").disabled=true;
  return card;
}

function renderPanel() {
  panelContent.replaceChildren();
  const headings={
    wardrobe:["DEIN STYLE","Kleiderschrank"],
    computer:["ONLINE-SHOP","Dein Computer"],
    door:["LIEFERUNG","An deiner Tür"],
    sink:["WASSER & ALLTAG","Waschbecken"],
    bucket:["GEGENSTAND","Eimer"],
    placed:["DEIN ZIMMER","Gegenstand benutzen"],
    inventory:["DEIN ZUHAUSE","Inventar"]
  };
  const h=headings[activePanel]||["DEIN ZUHAUSE","Zimmer"];
  $("panelEyebrow").textContent=h[0];
  $("panelTitle").textContent=h[1];

  if(activePanel==="wardrobe")renderWardrobe();
  else if(activePanel==="computer")renderShop();
  else if(activePanel==="door")renderDoor();
  else if(activePanel==="sink")renderSink();
  else if(activePanel==="bucket")renderBucket();
  else if(activePanel==="placed")renderPlacedItem();
  else if(activePanel==="inventory")renderInventory();
}

function renderWardrobe() {
  const intro=document.createElement("p");
  intro.className="panel-intro";
  intro.textContent="Schalte neue Styles frei und zieh sie direkt an. Deine freigeschalteten Cosmetics bleiben dir erhalten.";
  panelContent.append(intro);

  for(const cat of [
    {title:"Kopf",slot:"head"},
    {title:"Gesicht",slot:"face"},
    {title:"Kleidung",slot:"clothes"}
  ]) {
    const heading=document.createElement("h2");
    heading.textContent=cat.title;
    panelContent.append(heading);
    const grid=document.createElement("div");
    grid.className="item-grid";
    for(const item of cosmetics.filter(c=>c.type===cat.title)) {
      const owned=save.unlocked.includes(item.id);
      const equipped=save.equipped[cat.slot]===item.id;
      panelContent.appendChild; // wird im nächsten Teil entfernt
      const card=makeCard(
        item.name,item.desc,
        owned?(equipped?"Gerade angezogen":"Freigeschaltet"):`${item.price} Münzen`,
        owned?(equipped?"Ausziehen":"Anziehen"):"Freischalten",
        ()=>{
          if(owned) {

            if(save.money<item.price) {
              showHint("Dafür hast du noch nicht genug Münzen.");
              playTone(180,.1);

            save.unlocked.push(item.id);
            save.equipped[cat.slot]=item.id;
          }
          persist();
          playTone(660,.08,"triangle");
          renderPanel();
        }
      );
      grid.append(card);
    }
    panelContent.append(grid);
  }
}

function renderShop() {

        }

        });

function findPlacement(id) {
  const spots=[
    {x:315,y:438},{x:475,y:438},{x:760,y:438},
    {x:700,y:438},{x:320,y:438},{x:450,y:438},
    {x:400,y:438},{x:600,y:438},{x:820,y:438}
  ];
  const occupied=save.placed.map(p=>`${p.x},${p.y}`);
  return spots.find(p=>!occupied.includes(`${p.x},${p.y}`))||null;
}

function placeItem(id) {
  if(!save.inventory.includes(id)) {
    showHint("Dieser Gegenstand ist nicht in deinem Inventar.");
    return;
  }
  const spot=findPlacement(id);
  if(!spot) {
    showHint("Kein Platz frei. Lege zuerst einen Gegenstand zurück.");
    return;
  }
  save.placed.push({id,x:spot.x,y:spot.y,on:false,watered:false});
  save.inventory=save.inventory.filter(i=>i!==id);
  persist();
  playTone(620,.08,"triangle");
  showHint("Gegenstand platziert. Geh hin und drücke E.");
}

  const definition=shopItems.find(i=>i.id===item.id);

      item.on=!item.on;

      playTone(item.on?660:300,.08,"triangle");
      renderPanel();
      showHint(item.on?"Die Lampe leuchtet.":"Die Lampe ist ausgeschaltet.");
    }));

    panelContent.append(makeButton("Pflanze mit E gießen",()=>{

      showHint("Die Pflanze wurde gegossen!");
    }));
    const status=document.createElement("div");
    status.className="notice";
    status.textContent=item.watered
      ?"Die Blätter sind frisch und grün."
      :"Die Pflanze wartet auf Wasser.";
    panelContent.append(status);
  } else if(item.id==="teddy") {
    panelContent.append(makeButton("Mit dem Teddy spielen",()=>{
      playTone(660,.08,"triangle");
      showHint("Du spielst mit deinem Teddybären.");
    }));
  } else if(item.id==="poster") {
    panelContent.append(makeButton("Poster betrachten",()=>{
      playTone(480,.08,"triangle");
      showHint("Dein Pixel-Poster dekoriert das Zimmer.");
    }));
  } else if(item.id==="rug") {
    panelContent.append(makeButton("Auf dem Teppich entspannen",()=>{
      playTone(390,.12,"triangle");
      showHint("Du entspannst dich einen Moment.");
    }));
  } else if(item.id==="star") {
    panelContent.append(makeButton("Sternen-Deko betrachten",()=>{
      playTone(780,.12,"sine");
      showHint("Die Sternen-Deko funkelt.");
    }));
  }

  panelContent.append(makeButton("Gegenstand ins Inventar zurücklegen",()=>{
    save.placed=save.placed.filter(p=>p!==item);
    save.inventory.push(item.id);
    persist();
    playTone(420,.08,"triangle");
    showHint("Gegenstand zurückgelegt.");
    openPanel("inventory");
  },"secondary-button"));

  panelContent.append(makeButton("Fertig",closePanel,"secondary-button"));
}

function renderSink() {
  const intro=document.createElement("p");
  intro.className="panel-intro";
  intro.textContent="Stelle den Eimer unter den laufenden Wasserhahn, um Wasser aufzufangen.";
  panelContent.append(intro);

  panelContent.append(makeButton(
    save.faucetOn?"Wasserhahn ausschalten":"Wasserhahn einschalten",
    ()=>{
      save.faucetOn=!save.faucetOn;
      persist();
      playTone(save.faucetOn?540:300,.07,"triangle");
      renderPanel();
    }
  ));

  const status=document.createElement("div");
  status.className="notice";
  status.textContent=save.faucetOn?"Der Wasserhahn läuft.":"Der Wasserhahn ist ausgeschaltet.";
  panelContent.append(status);

  const amount=document.createElement("p");
  amount.className="empty-state";
  amount.textContent=`Wasser im Eimer: ${Math.round(save.bucketWater*100)} %`;
  panelContent.append(amount);
}

function renderBucket() {
  const intro=document.createElement("p");
  intro.className="panel-intro";
  intro.textContent="Der Eimer fängt Wasser auf, wenn er unter dem Wasserhahn steht.";
  panelContent.append(intro);

  panelContent.append(makeButton("Eimer unter den Wasserhahn stellen",()=>{
    carrying=null;
    bucket.x=814;
    bucket.y=FLOOR-bucket.h;
    persist();
    showHint("Der Eimer steht jetzt unter dem Wasserhahn.");
    renderPanel();
  }));

  const status=document.createElement("div");
  status.className="notice";
  status.textContent=`Füllstand: ${Math.round(save.bucketWater*100)} %`;
  panelContent.append(status);

  panelContent.append(makeButton("Eimer zurückstellen",()=>{
    bucket.x=575;
    bucket.y=FLOOR-bucket.h;
    persist();
    renderPanel();
  },"secondary-button"));
}

function getPostmanNearby() {
  if(!save.orders.some(o=>o.status==="arrived"))return false;
  const px=player.x+player.w/2,py=player.y+player.h/2;
  return Math.hypot(Math.max(0,Math.abs(px-902)-18),Math.max(0,Math.abs(py-(FLOOR-38))-24))<96;
}

function getNearby() {
  if(getPostmanNearby())return {id:"postman",x:884,y:FLOOR-77,w:36,h:77};

  const px=player.x+player.w/2,py=player.y+player.h/2;
  let best=null,bestDistance=Infinity;
  const targets={
    wardrobe:{x:190,y:330},computer:{x:636,y:325},bed:{x:285,y:405},
    sink:{x:790,y:355},faucet:{x:842,y:310},
    bucket:{x:bucket.x+bucket.w/2,y:bucket.y+bucket.h/2},door:{x:875,y:390}
  };

  for(const obj of objects) {
    if(carrying==="bucket"&&obj.id==="bucket")continue;
    const target=targets[obj.id]||{x:obj.x+obj.w/2,y:obj.y+obj.h/2};
    const dx=Math.max(0,Math.abs(px-target.x)-18);
    const dy=Math.max(0,Math.abs(py-target.y)-24);
    const d=Math.hypot(dx,dy);
    if(d<96&&d<bestDistance) {best=obj;bestDistance=d;}
  }

  for(const item of save.placed) {
    const dx=Math.max(0,Math.abs(px-item.x)-18);
    const dy=Math.max(0,Math.abs(py-(item.y-12))-24);
    const d=Math.hypot(dx,dy);
    if(d<78&&d<bestDistance) {
      best={id:"placed",itemId:item.id,x:item.x,y:item.y};
      bestDistance=d;
    }
  }
  return best;
}

function drawObjectLabels() {
  const nearby=getNearby();
  if(!nearby)return;
  let text;

  if(nearby.id==="postman")text="E  PAKET ANNEHMEN";
  else if(nearby.id==="placed") {
    const names={plant:"PFLANZE",lamp:"LAMPE",poster:"POSTER",teddy:"TEDDY",rug:"TEPPICH",star:"STERNEN-DEKO"};
    text="E  "+(names[nearby.itemId]||"GEGENSTAND")+" BENUTZEN";
  } else {
    text=nearby.id==="wardrobe"?"E  SCHRANK ÖFFNEN":
      nearby.id==="computer"?"E  COMPUTER BENUTZEN":
      nearby.id==="faucet"?"E  WASSERHAHN":
      nearby.id==="bucket"?"E  EIMER":
      nearby.id==="door"?"E  STADT BETRETEN":
      nearby.id==="sink"?"E  WASCHBECKEN":
      "E  "+(labels[nearby.id]||nearby.id).toUpperCase();
  }

  ctx.font="bold 12px monospace";
  const width=ctx.measureText(text).width+20;
  const px=Math.max(5,Math.min(W-width-5,player.x+player.w/2-width/2));
  const py=Math.max(22,player.y-25);
  rect(px,py,width,21,"#292e35");
  rect(px+2,py+2,width-4,17,"#f4ead8");
  pixelText(text,px+10,py+14,"#343941",10);
}

function interact() {
  if(carrying==="bucket") {
    bucket.x=Math.max(8,Math.min(W-bucket.w-8,player.x+player.w/2-bucket.w/2+player.facing*25));
    bucket.y=FLOOR-bucket.h;
    carrying=null;
    persist();
    playTone(330,.06,"triangle");
    showHint("Eimer abgestellt.");
    return;
  }

  const obj=getNearby();
  if(!obj)return;

  if(obj.id==="postman") {openPanel("door");return;}
  if(obj.id==="placed") {openPanel("placed",obj.itemId);return;}

  switch(obj.id) {
    case "wardrobe":openPanel("wardrobe");break;
    case "computer":openPanel("computer");break;
    case "door":
      persist();
      window.location.href="Stadt.html";
      break;
    case "sink":openPanel("sink");break;
    case "faucet":
      save.faucetOn=!save.faucetOn;
      persist();
      showHint(save.faucetOn?"Wasserhahn eingeschaltet.":"Wasserhahn ausgeschaltet.");
      playTone(save.faucetOn?540:300,.07,"triangle");
      break;
    case "bucket":
      carrying="bucket";
      bucket.x=player.x+player.w/2-bucket.w/2+player.facing*18;
      bucket.y=player.y+34;
      playTone(520,.07,"triangle");
      showHint("Eimer aufgenommen.");
      break;
    case "bed":
      showHint("Ein gemütliches Bett. Vielleicht kannst du hier später schlafen.");
      playTone(340,.07,"triangle");
      break;
  }
}

function update(dt) {
  gameTime+=dt;
  saveTimer+=dt;

  if(!dragging&&!activePanel) {
    const left=keys.has("a")||keys.has("arrowleft");
    const right=keys.has("d")||keys.has("arrowright");
    player.vx=left?-185:right?185:0;

    if(left)player.facing=-1;
    if(right)player.facing=1;
    player.x=Math.max(8,Math.min(W-player.w-8,player.x+player.vx*dt));
    if(player.vx!==0)player.walk+=dt*12;

    if(keys.has("w")||keys.has("arrowup")||keys.has(" ")) {
      if(player.grounded) {
        player.vy=-365;
        player.grounded=false;
        playTone(280,.05,"triangle");
      }
    }

    player.vy+=900*dt;
    player.y+=player.vy*dt;
    if(player.y+player.h>=FLOOR) {
      player.y=FLOOR-player.h;
      player.vy=0;
      player.grounded=true;
    }

    if(carrying==="bucket") {
      bucket.x=player.x+player.w/2-bucket.w/2+player.facing*18;
      bucket.y=player.y+34;
    }
  } else {
    player.vx=0;
  }

  if(save.faucetOn) {
    const under=bucket.x+bucket.w>805&&bucket.x<855&&
      bucket.y+bucket.h>315&&bucket.y<405;
    if(under&&save.bucketWater<1) {
      faucetTimer+=dt;
      if(faucetTimer>=1) {
        save.bucketWater=Math.min(1,save.bucketWater+.05);
        faucetTimer=0;
        persist();
      }
    }
  } else {
    faucetTimer=0;
  }

  for(const order of save.orders) {
    if(order.status==="ordered") {
      order.remaining-=dt;
      if(order.remaining<=0) {
        order.remaining=0;
        order.status="arrived";
        playTone(740,.15,"triangle");
        showHint("Ding-dong! Eine Lieferung ist angekommen.");
      }
    }
  }

  updateWaterParticles(dt);
  if(saveTimer>=1) {
    saveTimer=0;
    persist();
  }
}

function setupControls() {
  window.addEventListener("keydown",event=>{
    const key=event.key.toLowerCase();

    if(["arrowleft","arrowright","arrowup"," "].includes(key))event.preventDefault();

    if(key==="escape") {
      if(!panel.classList.contains("hidden"))closePanel();
      else if(carrying)interact();
      return;
    }

    if(key==="i") {
      if(!panel.classList.contains("hidden"))closePanel();
      else openPanel("inventory");
      return;
    }

    if(/^[1-9]$/.test(key)) {
      selectedSlot=Number(key)-1;
      renderHotbar();
      const id=getHotbarItems()[selectedSlot];
      const item=shopItems.find(i=>i.id===id);
      if(item)showHint(`${item.name} ausgewählt.`);
      return;
    }

    if(key==="e") {
      if(!panel.classList.contains("hidden"))return;
      interact();
      return;
    }

    if(!panel.classList.contains("hidden"))return;
    keys.add(key);
  });

  window.addEventListener("keyup",event=>keys.delete(event.key.toLowerCase()));
  window.addEventListener("blur",()=>keys.clear());
  $("closePanel").addEventListener("click",closePanel);

  $("soundButton").addEventListener("click",()=>{
    soundOn=!soundOn;
    $("soundButton").textContent=soundOn?"♫":"♪";
    if(soundOn)playTone(540,.08,"triangle");
    showHint(soundOn?"Sound eingeschaltet.":"Sound ausgeschaltet.");
  });

  canvas.addEventListener("pointerdown",event=>{
    if(!panel.classList.contains("hidden"))return;
    const r=canvas.getBoundingClientRect();
    const x=(event.clientX-r.left)*W/r.width;
    const y=(event.clientY-r.top)*H/r.height;
    if(x>=player.x-5&&x<=player.x+player.w+5&&y>=player.y-5&&y<=player.y+player.h+5) {
      dragging=true;
      dragOffset.x=x-player.x;
      dragOffset.y=y-player.y;
      player.dragging=true;
      canvas.setPointerCapture(event.pointerId);
    }
  });

  canvas.addEventListener("pointermove",event=>{
    if(!dragging)return;
    const r=canvas.getBoundingClientRect();
    const x=(event.clientX-r.left)*W/r.width;
    const y=(event.clientY-r.top)*H/r.height;
    player.x=Math.max(8,Math.min(W-player.w-8,x-dragOffset.x));
    player.y=Math.max(0,Math.min(FLOOR-player.h,y-dragOffset.y));
    player.grounded=player.y+player.h>=FLOOR;
  });

  function stopDragging() {
    if(!dragging)return;
    dragging=false;
    player.dragging=false;
    if(player.y+player.h>=FLOOR) {
      player.y=FLOOR-player.h;
      player.grounded=true;
    }
  }
  canvas.addEventListener("pointerup",stopDragging);
  canvas.addEventListener("pointercancel",stopDragging);
  canvas.addEventListener("lostpointercapture",stopDragging);
}

function frame(now) {
  const dt=Math.min((now-lastTime)/1000,.04);
  lastTime=now;
  if(panel.classList.contains("hidden"))update(dt);
  draw();
  requestAnimationFrame(frame);
}

function init() {
  persist();
  setupControls();
  panel.classList.add("hidden");
  requestAnimationFrame(frame);
}

init();
})();
</script>
