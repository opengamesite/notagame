<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mein Zimmer – Pixel Adventure</title>
<style>
:root{color-scheme:light;--ink:#292e35;--paper:#f5eddf;--muted:#a99d8c;--accent:#d9b46c;--blue:#587e96;--border:#d8c9b5;font-family:"Courier New",monospace}
*{box-sizing:border-box}
html,body{width:100%;height:100%;margin:0;overflow:hidden;background:#252a30}
body{display:grid;place-items:center}
button{font:inherit;cursor:pointer}
#game{position:relative;width:min(100vw,177.778vh);height:min(100vh,56.25vw);overflow:hidden;background:#e7d7c1;isolation:isolate;box-shadow:0 18px 70px #0006}
#world{position:absolute;inset:0;width:100%;height:100%;image-rendering:pixelated;touch-action:none;outline:none}
.hud{position:absolute;z-index:2;top:15px;left:17px;right:17px;display:flex;align-items:center;justify-content:space-between;gap:12px;pointer-events:none}
.brand{display:flex;align-items:center;gap:10px;min-width:0;padding:10px 13px;background:#f7efdf;border:2px solid #bca58a;box-shadow:3px 3px 0 #634a3540}
.brand-icon{display:grid;place-items:center;width:32px;height:32px;flex-shrink:0;color:#f8eedc;background:#292e35;border:2px solid #35586d;font-size:22px}
.brand strong{display:block;font-size:17px;letter-spacing:1.3px}
.brand small{display:block;margin-top:4px;color:#756858;font-size:12px}
.money{display:flex;align-items:center;gap:8px;padding:10px 15px;color:var(--ink);background:#f7efdf;border:2px solid #bc8b3e;box-shadow:3px 3px 0 #634a3540;font-size:17px}
.money span{color:#59411d}
.bottom-hud{position:absolute;z-index:2;bottom:14px;left:15px;right:15px;display:flex;justify-content:space-between;align-items:end;gap:10px;pointer-events:none}
.controls{display:flex;align-items:center;flex-wrap:wrap;gap:7px 13px;max-width:calc(100% - 50px);padding:9px 12px;color:#f7eddd;background:#292e35;box-shadow:3px 3px 0 #0002;font-size:12px}
.controls span{display:flex;gap:5px;align-items:center}
kbd{display:inline-grid;place-items:center;min-width:19px;height:19px;padding:2px 5px;color:#292e35;background:#f5eddf;border:2px solid #c7b79f;font-weight:bold}
.small-button,.close-button{display:grid;place-items:center;background:#343941;color:#f8efe1;border:2px solid #1f2329;cursor:pointer}
.small-button{width:38px;height:38px;font-size:20px;pointer-events:auto}
.hint{position:absolute;z-index:3;left:50%;bottom:66px;transform:translateX(-50%);color:var(--ink);background:#f7efdf;border:3px solid #a88c6b;box-shadow:3px 3px 0 #0002;padding:10px 15px;font-size:13px;max-width:calc(100% - 30px);text-align:center;opacity:0;pointer-events:none;transition:opacity .16s}
.hint.visible{opacity:1}
.panel{position:absolute;z-index:5;top:50%;left:50%;display:flex;flex-direction:column;width:min(680px,calc(100% - 30px));max-height:min(82%,620px);overflow:hidden;transform:translate(-50%,-50%);color:var(--ink);background:#f7efdf;border:3px solid #a88c6b;box-shadow:0 18px 40px #0005}
.panel.hidden{display:none}
.panel-head{display:flex;justify-content:space-between;align-items:center;gap:15px;padding:17px 19px;background:#e9dcc8;border-bottom:2px solid #c8b69e}
.panel-head small{color:#7c6b57;font-size:10px;letter-spacing:1.4px}
.panel-head h1{margin:5px 0 0;font-size:clamp(19px,3vw,27px);line-height:1.15}
.close-button{width:36px;height:36px;flex-shrink:0;color:#f8efe1;background:#343941;font-size:26px;line-height:1}
.panel-content{overflow-y:auto;overscroll-behavior:contain;padding:17px 19px 21px;scrollbar-width:thin}
.panel-intro{margin:0 0 16px;color:#675c4e;font-size:12px;line-height:1.7}
.panel-content h2{margin:22px 0 10px;padding-bottom:7px;border-bottom:2px solid var(--border);font-size:14px;letter-spacing:.5px}
.item-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.item-card{display:flex;align-items:center;gap:10px;min-width:0;padding:12px;background:#fffaf1;border:2px solid #d8c9b5;box-shadow:2px 2px 0 #6b50301a}
.item-info{flex:1;min-width:0}
.item-info strong{display:block;font-size:12px;line-height:1.4;overflow-wrap:anywhere}
.item-info p{margin:5px 0;color:#716555;font-size:11px;line-height:1.5}
.item-info small{display:block;color:#8b7659;font-size:10px;line-height:1.5}
.action-button,.secondary-button{min-height:34px;padding:8px 10px;color:#fff8ec;background:#587e96;border:2px solid #35586d;font-size:11px;font-weight:bold;transition:background .12s,transform .12s}
.action-button:hover:not(:disabled){background:#395b70;transform:translateY(-1px)}
.action-button:disabled{opacity:.45;cursor:default}
.action-button.muted{background:#777}
.secondary-button{margin-top:15px;color:#51483e;background:#e5d8c5;border-color:#c4b199}
.balance-line,.notice,.empty-state{margin:12px 0;padding:12px;color:#4c5b5c;background:#e2ece6;border:2px solid #b9cfc4;font-size:11px;line-height:1.7}
.empty-state{background:#f0e6d7;border-style:dashed;border-color:#c8b79f;color:#827463}
.order-row{display:flex;justify-content:space-between;align-items:start;gap:12px;padding:12px;border-bottom:1px solid #d8c9b5;font-size:12px}
.order-row small{max-width:55%;color:#7c6b57;text-align:right;font-size:10px;line-height:1.5}
.city-button{position:absolute;z-index:2;top:76px;right:17px;padding:8px 12px;background:#f7efdf;border:2px solid #bca58a;color:#292e35;font-weight:bold;pointer-events:auto}
@media(max-width:620px){.brand{padding:7px}.brand-icon{width:26px;height:26px}.brand strong{font-size:13px}.brand small{font-size:10px}.hud{top:8px;left:8px;right:8px}.money{padding:8px;font-size:14px}.controls{gap:5px 8px;padding:7px;font-size:10px}.bottom-hud{left:8px;right:8px;bottom:8px}.item-grid{grid-template-columns:1fr}.panel-head{padding:12px}.panel-content{padding:12px}.hint{bottom:60px}}
</style>
</head>
<body>
<main id="game">
  <canvas id="world" width="960" height="540" aria-label="Pixel-Art-Spielzimmer"></canvas>

    <div class="brand"><span class="brand-icon">▦</span><div><strong>MEIN ZIMMER</strong><small>Dein kleines Zuhause</small></div></div>
    <div class="money"><span>¢</span> <b id="money">120</b></div>
  </header>
  <button id="cityButton" class="city-button" type="button">Stadt besuchen ↗</button>
  <div class="bottom-hud">

  <div id="hint" class="hint">Erkunde dein Zimmer.</div>
  <section id="panel" class="panel hidden" aria-modal="true" role="dialog" aria-labelledby="panelTitle">

</main>

function interact(){
 if(cityMode){if(player.x>850){enterRoom();return;}showHint("Erkunde die Stadt. Geh zur Haustür zurück, um heimzukehren.");return;}
 const px=player.x+player.w/2,py=player.y+player.h/2;
 const nearby=objects.map(o=>({...o,d:Math.hypot(px-(o.x+o.w/2),py-(o.y+o.h/2))})).sort((a,b)=>a.d-b.d)[0];
 if(!nearby||nearby.d>115){showHint("Hier ist gerade nichts zum Interagieren. Geh näher heran.");return;}
 switch(nearby.id){
  case"wardrobe":openPanel("wardrobe");break;
  case"computer":openPanel("computer");break;
  case"door":openPanel("door");break;
  case"sink":openPanel("sink");break;
  case"faucet":save.faucetOn=!save.faucetOn;persist();playTone(save.faucetOn?600:300);showHint(save.faucetOn?"Wasser läuft.":"Wasserhahn geschlossen.");break;
  case"bucket":openPanel("bucket");break;
  case"bed":openPanel("bed");break;
  default:showHint("Schau dich weiter um!");
 }
}
function buyCosmetic(id){
 const c=cosmetics.find(c=>c.id===id);if(!c)return;
 if(save.unlocked.includes(id)){equipCosmetic(id);return;}
 if(save.money<c.price){showHint("Dafür hast du noch nicht genug Münzen.");return;}
 save.money-=c.price;save.unlocked.push(id);equipCosmetic(id);persist();playTone(760);
}
function equipCosmetic(id){
 const c=cosmetics.find(c=>c.id===id);if(!c)return;

function buyItem(id){

function updatePostman(dt){
 const hasArrived=save.orders.some(o=>o.status==="arrived");
 if(postmanMode==="waiting"&&!hasArrived){postmanMode="leaving";postmanTimer=0;}
 if(postmanMode==="arriving"){
  postmanX-=dt*90;
  if(postmanX<808){postmanX=808;postmanMode="waiting";showHint("Ding-dong! Der Postbote ist da. Geh zur Haustür.");playTone(800,.12);}
 }
 if(postmanMode==="leaving"){
  postmanTimer+=dt;postmanX+=dt*100;
  if(postmanX>955){postmanMode="gone";postmanX=955;}
 }
 if(postmanMode==="gone"&&hasArrived){postmanMode="arriving";postmanX=955;}
}
function update(dt){
 gameTime+=dt;
 if(sleepUntil>0&&gameTime>=sleepUntil){sleepUntil=0;showHint("Du hast dich ausgeruht. Willkommen zurück!");}
 for(const order of save.orders){
  if(order.status==="ordered"){
   order.remaining-=dt;
   if(order.remaining<=0){
    order.remaining=0;order.status="arrived";postmanMode="arriving";postmanX=955;
    showHint("Ding-dong! Eine Lieferung ist da. Schau an der Haustür nach.");playTone(780,.14);
    persist();
   }
  }
 }
 updatePostman(dt);
 if(!dragging&&!activePanel&&gameTime>=sleepUntil){
  const left=keys.has("a")||keys.has("arrowleft"),right=keys.has("d")||keys.has("arrowright");
  player.vx=left?-185:right?185:0;
  if(left)player.facing=-1;if(right)player.facing=1;
  if(player.grounded&&(keys.has("w")||keys.has(" ")||keys.has("arrowup"))){player.vy=-365;player.grounded=false;playTone(260,.05);}
  player.x+=player.vx*dt;
  if(!cityMode)player.x=Math.max(8,Math.min(850,player.x));
  else player.x=Math.max(12,Math.min(920,player.x));
  player.vy+=850*dt;player.y+=player.vy*dt;
  if(player.y+player.h>=FLOOR){player.y=FLOOR-player.h;player.vy=0;player.grounded=true;}
  player.walk+=Math.abs(player.vx)*dt*.045;
 }
 if(save.faucetOn){faucetTimer+=dt;if(faucetTimer>8){faucetTimer=0;save.bucketWater=1;persist();}}
 saveTimer+=dt;if(saveTimer>5){saveTimer=0;persist();}
}
function frame(now){
 const dt=Math.min((now-lastTime)/1000,.04);lastTime=now;
 update(dt);draw();requestAnimationFrame(frame);
}

 return{x:(e.clientX-r.left)*W/r.width,y:(e.clientY-r.top)*H/r.height};
}

 if(activePanel)return;
 const p=canvasPosition(e);
 if(p.x>=player.x-10&&p.x<=player.x+player.w+10&&p.y>=player.y-10&&p.y<=player.y+player.h+10){
  dragging=true;dragOffset.x=p.x-player.x;dragOffset.y=p.y-player.y;canvas.setPointerCapture(e.pointerId);
 }
});
canvas.addEventListener("pointermove",e=>{
 if(!dragging)return;
 const p=canvasPosition(e);
 player.x=Math.max(0,Math.min(W-player.w,p.x-dragOffset.x));
 player.y=Math.max(0,Math.min(FLOOR-player.h,p.y-dragOffset.y));
 player.vx=0;player.vy=0;player.grounded=player.y+player.h>=FLOOR;
});
canvas.addEventListener("pointerup",()=>dragging=false);
canvas.addEventListener("pointercancel",()=>dragging=false);
window.addEventListener("keydown",e=>{
 const k=e.key.toLowerCase();
 if(["arrowleft","arrowright","arrowup"," "].includes(k))e.preventDefault();
 if(k==="escape"){closePanel();return;}
 if(k==="e"&&!e.repeat){interact();return;}
 keys.add(k);
});
window.addEventListener("keyup",e=>keys.delete(e.key.toLowerCase()));
window.addEventListener("blur",()=>keys.clear());
$("closePanel").addEventListener("click",closePanel);
panelContent.addEventListener("click",handlePanelClick);
$("cityButton").addEventListener("click",()=>cityMode?enterRoom():enterCity());
$("soundButton").addEventListener("click",()=>{
 soundOn=!soundOn;$("soundButton").textContent=soundOn?"♫":"♪";
 showHint(soundOn?"Sound eingeschaltet.":"Sound ausgeschaltet.");if(soundOn)playTone(440);
});
window.addEventListener("beforeunload",persist);
persist();
requestAnimationFrame(frame);
})();
</script>
</body>
</html>
