
<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Mein Zimmer</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;font-family:Arial,sans-serif;background:#20252a;color:#292e35}
#game{position:relative;width:100%;height:100%;overflow:hidden}
#world{position:absolute;inset:0;width:100%;height:100%;display:block}
.hud{position:absolute;z-index:2;top:16px;left:18px;right:18px;display:flex;justify-content:space-between;pointer-events:none}
.brand,.money{background:#fffaf1ef;border:1px solid #d4c6b3;border-radius:12px;padding:12px 17px;box-shadow:0 4px 18px #0002}
.brand strong{display:block;font-size:16px;letter-spacing:1px}
.brand small{color:#887a68;font-size:12px}
.money{font-size:17px}
.money span{color:#b18a42}
.bottom{position:absolute;bottom:16px;left:18px;right:18px;display:flex;justify-content:space-between;align-items:end;pointer-events:none}
.controls{background:#252b31dd;color:white;border-radius:10px;padding:11px 15px;font-size:12px}
button{cursor:pointer;font:inherit}
.sound{pointer-events:auto;border:0;border-radius:10px;background:#fffaf1;padding:12px 15px;font-size:19px}
.panel{position:absolute;z-index:5;top:50%;left:50%;transform:translate(-50%,-50%);width:min(680px,calc(100% - 28px));max-height:82%;display:flex;flex-direction:column;background:#faf5eb;border:1px solid #d7c8b4;border-radius:16px;box-shadow:0 20px 70px #0006;overflow:hidden}
.hidden{display:none!important}
.panel-head{display:flex;justify-content:space-between;align-items:center;padding:17px 20px;background:#eee5d7;border-bottom:1px solid #d7c8b4}
.panel-head small{font-size:10px;letter-spacing:1.5px;color:#87745d}
.panel-head h1{font-size:23px;margin:5px 0 0}
.close{border:0;border-radius:8px;background:#343a40;color:white;width:36px;height:36px;font-size:23px}
.content{padding:18px;overflow:auto}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.card{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:13px;background:white;border:1px solid #e0d5c6;border-radius:10px}
.card strong{font-size:13px}
.card small{display:block;color:#887a68;font-size:11px;margin-top:5px}
.action{border:0;border-radius:7px;background:#587e96;color:white;padding:9px 12px;font-size:12px}
.action:disabled{opacity:.4}
.secondary{background:#e9dfd0;color:#50483e}
.balance,.notice{padding:12px;background:#e5eee8;border-radius:8px;margin-bottom:13px;font-size:13px}
.order{display:flex;justify-content:space-between;padding:12px 3px;border-bottom:1px solid #ddd2c2;font-size:13px}
.section-title{font-size:14px;margin:20px 0 10px}
@media(max-width:600px){.grid{grid-template-columns:1fr}.brand{padding:9px 12px}.controls{font-size:10px;padding:9px}}
</style>
</head>
<body>
<main id="game">
<canvas id="world"></canvas>

<header class="hud">
 <div class="brand"><strong>MEIN ZIMMER</strong><small>Dein kleines Zuhause</small></div>
 <div class="money"><span>¢</span> <b id="money">120</b></div>
</header>

<div class="bottom">
 <div class="controls">A / D – Bewegen &nbsp; · &nbsp; W – Hüpfen &nbsp; · &nbsp; E – Interagieren</div>
 <button class="sound" id="soundButton">♫</button>
</div>

<section id="panel" class="panel hidden" role="dialog" aria-modal="true">
 <div class="panel-head">
  <div><small id="panelEyebrow">DEIN ZUHAUSE</small><h1 id="panelTitle">Zimmer</h1></div>
  <button class="close" id="closePanel">×</button>
 </div>
 <div id="panelContent" class="content"></div>
</section>
</main>

<script>
const $=id=>document.getElementById(id);
const canvas=$("world");
const ctx=canvas.getContext("2d");

const W=960,H=540;
let dpr=1;

function resize(){
 dpr=Math.min(window.devicePixelRatio||1,2);
 canvas.width=W*dpr;
 canvas.height=H*dpr;
 canvas.style.width="100%";
 canvas.style.height="100%";
 ctx.setTransform(dpr,0,0,dpr,0,0);
}
window.addEventListener("resize",resize);
resize();

/* SPIELSTAND */
const defaults={
 money:120,
 unlocked:[],
 equipped:{head:null,face:null,clothes:null,back:null,pants:null,seat:null,legs:null,extra:null},
 inventory:[],
 placed:[],
 orders:[],
 received:[],
 faucetOn:false,
 bucketWater:0
};

const STORAGE_KEY="mein-zimmer-save-v1";

function loadSave(){
 try{
  const s=JSON.parse(localStorage.getItem(STORAGE_KEY)||"null");
  if(!s)return structuredClone(defaults);
  return {
   ...structuredClone(defaults),
   ...s,
   equipped:{...defaults.equipped,...(s.equipped||{})}
  };
 }catch{return structuredClone(defaults)}
}

let save=loadSave();

function persist(){
 localStorage.setItem(STORAGE_KEY,JSON.stringify(save));
 $("money").textContent=save.money;
}
persist();

/* SPIELER */
const player={
 x:455,
 y:0,
 vy:0,
 facing:1,
 moving:false,
 walk:0
};

const keys=new Set();
let carrying=null;
let nearby=null;
let gameTime=0;

/* ZIMMERPOSITIONEN */
const targets=[
 {id:"wardrobe",x:125,y:330},
 {id:"computer",x:680,y:325},
 {id:"bed",x:300,y:350},
 {id:"sink",x:830,y:340},
 {id:"door",x:900,y:350},
 {id:"bucket",x:790,y:405}
];

const objects=[
 {id:"lamp",name:"Schreibtischlampe",x:650,y:278},
 {id:"poster",name:"Poster",x:350,y:165},
 {id:"teddy",name:"Teddybär",x:285,y:390}
];

let placedObjects=[];

/* FARBEN */
const colors={
 blue:"#547b9a",
 red:"#a95149",
 green:"#658b68",
 black:"#30363b",
 white:"#e9e4d9",
 gold:"#b7954f",
 wood:"#9b714c"
};

function roundedRect(x,y,w,h,r,color){
 ctx.fillStyle=color;
 ctx.beginPath();
 ctx.roundRect(x,y,w,h,r);
 ctx.fill();
}

function line(x1,y1,x2,y2,color,width=3){
 ctx.strokeStyle=color;
 ctx.lineWidth=width;
 ctx.lineCap="round";
 ctx.beginPath();
 ctx.moveTo(x1,y1);
 ctx.lineTo(x2,y2);
 ctx.stroke();
}

function ellipse(x,y,rx,ry,color){
 ctx.fillStyle=color;
 ctx.beginPath();
 ctx.ellipse(x,y,rx,ry,0,0,Math.PI*2);
 ctx.fill();
}

/* ZIMMER ZEICHNEN */
function drawRoom(){
 // Hintergrundwand
 const wall=ctx.createLinearGradient(0,0,0,430);
 wall.addColorStop(0,"#e9dfd1");
 wall.addColorStop(1,"#d9cbbb");
 ctx.fillStyle=wall;
 ctx.fillRect(0,0,W,430);

 // Wandstruktur
 ctx.fillStyle="#ffffff18";
 for(let x=0;x<W;x+=80)ctx.fillRect(x,0,1,430);

 // Fenster
 roundedRect(390,65,190,125,5,"#76543d");
 roundedRect(398,73,174,109,2,"#9fcbd0");
 ctx.fillStyle="#d9e9e6";
 ctx.fillRect(482,74,5,108);
 ctx.fillRect(398,126,174,5);

 // Fensterlicht
 ctx.fillStyle="#fff5d522";
 ctx.beginPath();
 ctx.moveTo(398,182);ctx.lineTo(570,182);
 ctx.lineTo(670,430);ctx.lineTo(300,430);
 ctx.closePath();ctx.fill();

 // Poster
 roundedRect(45,95,100,76,3,"#76543d");
 roundedRect(51,101,88,64,2,"#b6c5b3");
 ctx.fillStyle="#819c87";
 ctx.beginPath();ctx.arc(95,130,20,0,Math.PI*2);ctx.fill();

 // Boden
 const floor=ctx.createLinearGradient(0,430,0,540);
 floor.addColorStop(0,"#ae8968");
 floor.addColorStop(1,"#89664d");
 ctx.fillStyle=floor;
 ctx.fillRect(0,430,W,110);

 // Dielen
 for(let y=445;y<540;y+=27){
  line(0,y,W,y,"#6f503c55",1);
 }
 for(let x=20;x<W;x+=120){
  line(x,430,x-20,540,"#6f503c35",1);
 }

 // Fußleiste
 ctx.fillStyle="#805d43";
 ctx.fillRect(0,421,W,9);
 ctx.fillStyle="#c39b75";
 ctx.fillRect(0,421,W,3);

 // Teppich
 ellipse(490,465,210,35,"#657f8b");
 ellipse(490,461,195,28,"#8299a0");
}

/* MÖBEL */
function drawBed(){
 // Bett
 roundedRect(205,325,210,90,8,"#79563c");
 roundedRect(210,315,205,85,8,"#e4d8c6");
 roundedRect(220,325,190,58,8,"#7d98a8");
 roundedRect(230,320,65,37,8,"#f0eae0");
 roundedRect(305,320,65,37,8,"#f0eae0");
 ctx.fillStyle="#6b4932";
 ctx.fillRect(205,400,12,30);
 ctx.fillRect(398,400,12,30);
}

function drawWardrobe(){
 roundedRect(45,235,135,190,5,"#8d6343");
 roundedRect(53,243,119,175,3,"#a8784d");
 ctx.fillStyle="#704b32";
 ctx.fillRect(110,245,3,170);
 ellipse(101,330,4,4,"#d6b46f");
 ellipse(123,330,4,4,"#d6b46f");
}

function drawDesk(){
 // Tischplatte
 roundedRect(570,305,220,15,3,"#875c3d");
 ctx.fillStyle="#65452f";
 ctx.fillRect(585,320,12,100);
 ctx.fillRect(765,320,12,100);

 // Monitor
 roundedRect(640,220,95,75,5,"#30383d");
 roundedRect(647,227,81,59,2,"#557e89");
 ctx.fillStyle="#a5c5c5";
 ctx.fillRect(655,235,65,2);
 ctx.fillRect(655,242,43,2);
 ctx.fillStyle="#42494c";
 ctx.fillRect(682,295,12,10);
 roundedRect(660,300,55,5,2,"#4c5559");

 // Tastatur
 roundedRect(650,305,90,7,2,"#30383d");

 // Lampe
 if(!objects.some(o=>o.id==="lamp"&&o.hidden)){
  line(610,304,610,270,"#52585a",5);
  line(610,270,625,255,"#52585a",4);
  roundedRect(615,246,28,13,5,"#d9bd83");
 }
}

function drawSink(){
 roundedRect(800,310,125,18,4,"#805a3d");
 roundedRect(810,292,105,20,7,"#eee9df");
 ellipse(860,302,25,7,"#b6c4c2");
 line(860,292,860,273,"#737e80",5);
 line(860,273,876,273,"#737e80",5);
}

function drawDoor(){
 roundedRect(880,160,70,265,4,"#704a32");
 roundedRect(887,168,56,250,3,"#a8784d");
 ellipse(932,300,4,4,"#d9b66c");
}

function drawPlant(x,y){
 roundedRect(x-12,y-25,24,25,4,"#a9684e");
 line(x,y-25,x,y-65,"#547d53",4);
 line(x,y-43,x-18,y-58,"#547d53",5);
 line(x,y-49,x+18,y-65,"#547d53",5);
 ellipse(x-19,y-59,10,5,"#6b966c");
 ellipse(x+19,y-66,10,5,"#6b966c");
 ellipse(x,y-70,9,14,"#6b966c");
}

function drawBucket(x,y){
 roundedRect(x-15,y-25,30,27,5,"#81999b");
 ctx.strokeStyle="#586e70";
 ctx.lineWidth=3;
 ctx.beginPath();
 ctx.arc(x,y-22,15,Math.PI,Math.PI*2);
 ctx.stroke();
 if(save.bucketWater>0){
  ctx.fillStyle="#79bdcf";
  ctx.fillRect(x-11,y-12,22,10);
 }
}

/* GEGENSTÄNDE */
function drawObjects(){
 drawPlant(510,420);
 drawPlant(845,420);

 drawBucket(790,425);

 for(const o of objects){
  if(o.id==="lamp"&&o.hidden)continue;

  if(o.id==="teddy"){
   ellipse(o.x,o.y,19,20,"#ae8056");
   ellipse(o.x-12,o.y-17,9,9,"#ae8056");
   ellipse(o.x+12,o.y-17,9,9,"#ae8056");
   ellipse(o.x,o.y-8,15,14,"#c29468");
   ellipse(o.x-5,o.y-10,2,2,"#302b29");
   ellipse(o.x+5,o.y-10,2,2,"#302b29");
  }

  if(o.id==="poster"){
   roundedRect(o.x-28,o.y-20,56,40,3,"#79563d");
   roundedRect(o.x-24,o.y-16,48,32,2,"#91a99d");
   ellipse(o.x,o.y,10,10,"#e5d2a6");
  }
 }
}

/* STUHL-SPIELFIGUR */
function drawChair(){
 const x=player.x;
 const floorY=430-player.y;
 const bob=player.moving?Math.sin(player.walk)*2:0;
 const seatColor=colors[save.equipped.clothes]||"#b9a58c";
 const backColor=save.equipped.seat&&colors[save.equipped.seat]||seatColor;
 const legColor=save.equipped.legs==="gold"?"#b7954f":"#514b45";

 ctx.save();
 ctx.translate(x,floorY+bob);
 ctx.scale(player.facing,1);

 // Schatten
 ellipse(0,0,45,8,"#352b2530");

 // Stuhlbeine
 ctx.fillStyle=legColor;
 ctx.fillRect(-30,-42,8,42);
 ctx.fillRect(26,-42,8,42);
 ctx.fillRect(-28,-42,62,6);

 // Sitzfläche
 roundedRect(-39,-65,83,25,7,seatColor);
 roundedRect(-42,-69,88,10,4,"#805e43");

 // Rückenlehne
 roundedRect(-44,-137,18,76,7,"#8e6948");
 roundedRect(-41,-133,13,65,5,backColor);

 // Rückenlehnenkante
 roundedRect(-45,-140,20,9,4,"#76543b");

 // Sitzdetails
 line(-28,-58,30,-58,"#ffffff44",2);

 // Tragearme: klappen beim Tragen aus
 if(carrying){
  // seitliche Halterung
  line(-5,-68,8,-88,"#76543b",7);
  line(8,-88,42,-88,"#76543b",7);
  line(42,-88,55,-75,"#76543b",6);
  line(8,-88,42,-88,"#c29a69",3);
  ellipse(55,-75,5,5,"#76543b");

  // zweiter Arm als dezente Silhouette
  line(-15,-66,-22,-82,"#76543b",5);
  line(-22,-82,-35,-82,"#76543b",5);
 }

 // Cosmetics
 drawChairCosmetics();

 // Getragener Gegenstand
 if(carrying){
  drawCarriedItem(62,-105);
 }

 ctx.restore();
}

function drawChairCosmetics(){
 const eq=save.equipped||{};

 // Klorollen-Hut
 if(eq.head==="toiletroll"){
  ctx.fillStyle="#f4f1e8";
  ctx.fillRect(-40,-158,23,20);
  ctx.fillStyle="#d5d0c5";
  ctx.fillRect(-40,-158,23,4);
  ellipse(-28.5,-148,4,4,"#b9b4aa");
  ellipse(-28.5,-148,2,2,"#eeeae1");
 }

 // Doppel-Klorolle
 if(eq.back==="doubleRoll"){
  for(const y of [-120,-96]){
   ellipse(-54,y,10,10,"#f5f1e9");
   ellipse(-54,y,4,4,"#bcb7ad");
  }
 }

 // Schleife
 if(eq.extra==="bow"){
  ellipse(-27,-145,9,6,"#cf7779");
  ellipse(-10,-145,9,6,"#cf7779");
  ellipse(-19,-145,4,4,"#a84f59");
 }

 // Partyhut
 if(eq.head==="partyhat"){
  ctx.fillStyle="#e7a64c";
  ctx.beginPath();
  ctx.moveTo(-43,-137);ctx.lineTo(-20,-137);ctx.lineTo(-31,-175);
  ctx.closePath();ctx.fill();
  ellipse(-31,-175,4,4,"#d66c65");
 }

 // Sitzdeko
 if(eq.seat==="gold"){
  line(-30,-67,30,-67,"#d4ae60",3);
 }
}

/* GETRAGENE GEGENSTÄNDE */
function drawCarriedItem(x,y){
 if(carrying==="bucket"){
  roundedRect(x-13,y-4,27,26,4,"#829a9c");
  if(save.bucketWater>0){
   ctx.fillStyle="#77bed0";ctx.fillRect(x-10,y+9,21,10);
  }
 }else if(carrying==="lamp"){
  line(x,y+10,x,y-18,"#777",4);
  roundedRect(x-12,y-24,25,12,4,"#dfc27e");
 }else if(carrying==="teddy"){
  ellipse(x,y,13,14,"#ae8056");
  ellipse(x-8,y-10,6,6,"#ae8056");
  ellipse(x+8,y-10,6,6,"#ae8056");
 }else{
  roundedRect(x-12,y-12,24,24,4,"#91a99d");
 }
}

/* COSMETICS */
const cosmetics=[
 {id:"blue",name:"Blauer Stuhl",price:25,desc:"Blauer Stoffbezug.",slot:"clothes"},
 {id:"red",name:"Roter Stuhl",price:30,desc:"Roter Stoffbezug.",slot:"clothes"},
 {id:"green",name:"Grüner Stuhl",price:30,desc:"Grüner Stoffbezug.",slot:"clothes"},
 {id:"black",name:"Schwarzer Stuhl",price:40,desc:"Dunkler Stoffbezug.",slot:"clothes"},
 {id:"white",name:"Weißer Stuhl",price:40,desc:"Heller Stoffbezug.",slot:"clothes"},
 {id:"gold",name:"Goldene Details",price:80,desc:"Goldene Stuhl-Details.",slot:"seat"},
 {id:"toiletroll",name:"Klorollen-Hut",price:20,desc:"Eine Klorolle auf der Lehne.",slot:"head"},
 {id:"doubleRoll",name:"Doppel-Klorolle",price:35,desc:"Zwei Rollen als Rücken-Deko.",slot:"back"},
 {id:"bow",name:"Rosa Schleife",price:25,desc:"Eine kleine Schleife.",slot:"extra"},
 {id:"partyhat",name:"Partyhut",price:30,desc:"Der Stuhl ist bereit für die Party.",slot:"head"}
];

const shopItems=[
 {id:"plant",name:"Zimmerpflanze",price:35,desc:"Eine kleine Pflanze für dein Zimmer."},
 {id:"lamp",name:"Schreibtischlampe",price:45,desc:"Warmes Licht für den Abend."},
 {id:"poster",name:"Poster",price:25,desc:"Dekoration für die Wand."},
 {id:"teddy",name:"Teddybär",price:40,desc:"Ein gemütlicher Mitbewohner."},
 {id:"rug",name:"Teppich",price:50,desc:"Macht den Boden gemütlicher."},
 {id:"star",name:"Sternen-Deko",price:60,desc:"Kleine Sterne für die Wand."}
];

/* PANEL */
const panel=$("panel");
const content=$("panelContent");
let activePanel=null;

function openPanel(kind){
 activePanel=kind;
 panel.classList.remove("hidden");
 renderPanel();
}
function closePanel(){
 panel.classList.add("hidden");
 activePanel=null;
}
$("closePanel").onclick=closePanel;

function button(text,fn,disabled=false){
 const b=document.createElement("button");
 b.className="action";
 b.textContent=text;
 b.disabled=disabled;
 b.onclick=fn;
 return b;
}

function card(name,detail,action){
 const el=document.createElement("div");
 el.className="card";
 const info=document.createElement("div");
 const strong=document.createElement("strong");
 strong.textContent=name;
 const small=document.createElement("small");
 small.textContent=detail;
 info.append(strong,small);
 el.append(info,action);
 return el;
}

function renderPanel(){
 content.innerHTML="";
 const titles={
 computer:["DEIN ZUHAUSE","Bestellungen"],
 door:["LIEFERUNG","An deiner Tür"],
 wardrobe:["DEIN STUHL","Stuhl-Cosmetics"],
 sink:["WASSER","Waschbecken"],
 bucket:["EIMER","Wasser auffüllen"]
 };
 const t=titles[activePanel]||["DEIN ZUHAUSE","Zimmer"];
 $("panelEyebrow").textContent=t[0];
 $("panelTitle").textContent=t[1];

 if(activePanel==="computer")renderShop();
 if(activePanel==="wardrobe")renderWardrobe();
 if(activePanel==="door")renderDoor();
 if(activePanel==="sink"||activePanel==="bucket")renderWater();
}

function renderShop(){
 const bal=document.createElement("div");
 bal.className="balance";
 bal.textContent=`Guthaben: ${save.money} Münzen`;
 content.append(bal);

 const grid=document.createElement("div");
 grid.className="grid";

 for(const item of shopItems){
  const owned=save.inventory.includes(item.id)||
   save.placed.some(p=>p.id===item.id)||
   save.orders.some(o=>o.id===item.id);

  grid.append(card(item.name,`${item.desc} · ${item.price} Münzen`,
   button("Bestellen",()=>{
    if(save.money<item.price)return;
    save.money-=item.price;
    save.orders.push({id:item.id,status:"ordered",remaining:20});
    persist();renderPanel();
   },owned||save.money<item.price)));
 }
 content.append(grid);

 const h=document.createElement("h3");
 h.className="section-title";
 h.textContent="Bestellungen";
 content.append(h);

 for(const o of save.orders){
  const row=document.createElement("div");
  row.className="order";
  const item=shopItems.find(i=>i.id===o.id);
  row.textContent=`${item?.name||o.id} – ${o.status==="arrived"?"An der Tür":Math.ceil(o.remaining||0)+" Sekunden"}`;
  content.append(row);
 }
}

function renderWardrobe(){
 const intro=document.createElement("div");
 intro.className="notice";
 intro.textContent="Wähle deine Cosmetics. Alle ausgewählten Gegenstände werden direkt an deinem Stuhl angezeigt.";
 content.append(intro);

 const slots=[
  ["head","Kopf"],
  ["back","Rücken"],
  ["clothes","Stuhlbezug"],
  ["seat","Sitzfläche"],
  ["extra","Extras"]
 ];

 for(const [slot,label] of slots){
  const heading=document.createElement("h3");
  heading.className="section-title";
  heading.textContent=label;
  content.append(heading);

  const grid=document.createElement("div");
  grid.className="grid";

  const items=cosmetics.filter(i=>i.slot===slot);

  if(slot==="head"||slot==="back"||slot==="extra"||slot==="seat"||slot==="clothes"){
   grid.append(card("Ohne Cosmetic","Zurück zum normalen Aussehen.",
    button(save.equipped[slot]?"Ablegen":"Ausgewählt",()=>{
     save.equipped[slot]=null;
     persist();renderPanel();
    },!save.equipped[slot])));
  }

  for(const item of items){
   const owned=save.unlocked.includes(item.id);
   const active=save.equipped[slot]===item.id;

   grid.append(card(item.name,
    `${item.desc} · ${owned?"Freigeschaltet":item.price+" Münzen"}`,
    button(!owned?"Kaufen":active?"Ablegen":"Anziehen",()=>{
     if(!owned){
      if(save.money<item.price)return;
      save.money-=item.price;
      save.unlocked.push(item.id);
     }
     save.equipped[slot]=active?null:item.id;
     persist();renderPanel();
    },!owned&&save.money<item.price)));
  }
  content.append(grid);
 }
}

function renderDoor(){
 const arrived=save.orders.filter(o=>o.status==="arrived");
 if(!arrived.length){
  content.textContent="Momentan ist keine Lieferung angekommen.";
  return;
 }
 for(const o of arrived){
  const item=shopItems.find(i=>i.id===o.id);
  content.append(card(item?.name||o.id,"Dein Paket ist angekommen.",
   button("Abholen",()=>{
    o.status="received";
    save.received.push(o.id);
    save.inventory.push(o.id);
    persist();renderPanel();
   })));
 }
}

function renderWater(){
 const status=document.createElement("div");
 status.className="balance";
 status.textContent=save.bucketWater>0?"Der Eimer enthält Wasser.":"Der Eimer ist leer.";
 content.append(status);

 content.append(button(save.faucetOn?"Wasserhahn ausschalten":"Wasserhahn einschalten",()=>{
  save.faucetOn=!save.faucetOn;
  persist();renderPanel();
 }));

 content.append(button("Eimer auffüllen",()=>{
  save.bucketWater=1;
  persist();renderPanel();
 }));
}

/* INTERAKTION */
function findNearby(){
 let best=null;
 let distance=Infinity;
 for(const t of targets){
  const d=Math.hypot(player.x-t.x,430-t.y);
  if(d<95&&d<distance){best=t;distance=d}
 }
 return best;
}

function interact(){
 if(!panel.classList.contains("hidden"))return;

 if(carrying){
  if(carrying==="bucket"){
   targets.find(t=>t.id==="bucket").x=player.x+55;
  }else{
   const o=objects.find(o=>o.id===carrying);
   if(o){o.x=player.x+55;o.y=385;}
  }
  carrying=null;
  return;
 }

 const near=findNearby();

 if(near){
  if(near.id==="wardrobe")openPanel("wardrobe");
  if(near.id==="computer")openPanel("computer");
  if(near.id==="door"){
   if(save.orders.some(o=>o.status==="arrived"))openPanel("door");
   else window.location.href="Stadt.html";
  }
  if(near.id==="sink")openPanel("sink");
  if(near.id==="bucket")carrying="bucket";
  if(near.id==="bed")player.x=300;
  return;
 }

 // Gegenstände aufnehmen
 let nearest=null;
 let dist=65;
 for(const o of objects){
  const d=Math.hypot(player.x-o.x,430-o.y);
  if(d<dist){dist=d;nearest=o}
 }
 if(nearest){
  carrying=nearest.id;
  return;
 }

 // Inventar verwenden
 if(save.inventory.length){
  const id=save.inventory.shift();
  if(id==="plant"){
   placedObjects.push({id,x:player.x,y:420});
  }else if(id==="rug"){
   placedObjects.push({id,x:player.x,y:420});
  }else if(id==="star"){
   placedObjects.push({id,x:player.x,y:200});
  }else{
   const o=objects.find(o=>o.id===id);
   if(o){o.x=player.x+55;o.y=385;carrying=id;}
  }
  persist();
 }
}

window.addEventListener("keydown",e=>{
 const k=e.key.toLowerCase();
 if(["arrowup","arrowdown","arrowleft","arrowright"," "].includes(k))e.preventDefault();

 if(k==="escape"){
  if(!panel.classList.contains("hidden"))closePanel();
  else if(carrying)interact();
  return;
 }
 if(k==="e"){interact();return}
 if(!panel.classList.contains("hidden"))return;

 keys.add(k);

 if(k==="w"&&!player.y&&!player.vy)player.vy=7;
});
window.addEventListener("keyup",e=>keys.delete(e.key.toLowerCase()));
window.addEventListener("blur",()=>keys.clear());

/* BEWEGUNG */
function movePlayer(dt){
 let direction=0;
 if(keys.has("a")||keys.has("arrowleft"))direction--;
 if(keys.has("d")||keys.has("arrowright"))direction++;

 player.moving=direction!==0;

 if(direction){
  player.x+=direction*210*dt;
  player.facing=direction;
  player.walk+=dt*10;
 }

 player.x=Math.max(35,Math.min(925,player.x));

 if(player.vy||player.y){
  player.y+=player.vy;
  player.vy-=18*dt;
  if(player.y<=0){player.y=0;player.vy=0;}
 }
}

/* ZEICHNEN */
function draw(){
 ctx.clearRect(0,0,W,H);

 drawRoom();
 drawWardrobe();
 drawBed();
 drawDesk();
 drawSink();
 drawDoor();
 drawObjects();

 // Abgestellte Deko
 for(const p of placedObjects){
  if(p.id==="plant")drawPlant(p.x,p.y);
  if(p.id==="rug")ellipse(p.x,p.y,65,15,"#718c9a");
  if(p.id==="star"){
   ctx.fillStyle="#d5b76e";
   ctx.font="28px Arial";
   ctx.fillText("★",p.x,p.y);
  }
 }

 drawChair();

 // Interaktionshinweis
 nearby=findNearby();
 if(nearby&&!carrying&&panel.classList.contains("hidden")){
  roundedRect(player.x-48,350-player.y,96,28,8,"#283139dd");
  ctx.fillStyle="white";
  ctx.font="bold 12px Arial";
  ctx.textAlign="center";
  const names={
   wardrobe:"E · Kleiderschrank",
   computer:"E · Computer",
   bed:"E · Bett",
   sink:"E · Waschbecken",
   door:"E · Tür",
   bucket:"E · Eimer"
  };
  ctx.fillText(names[nearby.id],player.x,369-player.y);
  ctx.textAlign="left";
 }
}

/* SOUND */
let soundOn=true;
$("soundButton").onclick=()=>{
 soundOn=!soundOn;
 $("soundButton").textContent=soundOn?"♫":"♪";
};

/* GAME LOOP */
let last=performance.now();

function animate(now){
 const dt=Math.min((now-last)/1000,.04);
 last=now;
 gameTime+=dt;

 if(panel.classList.contains("hidden")){
  movePlayer(dt);
 }

 // Lieferungen
 let changed=false;
 for(const o of save.orders){
  if(o.status==="ordered"){
   o.remaining-=dt;
   if(o.remaining<=0){
    o.remaining=0;
    o.status="arrived";
    changed=true;
   }
  }
 }
 if(changed)persist();

 draw();
 requestAnimationFrame(animate);
}

$("money").textContent=save.money;
requestAnimationFrame(animate);
</script>
</body>
</html>
