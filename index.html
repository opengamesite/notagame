<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MEIN ZIMMER</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#17191b;font-family:Arial,sans-serif}
canvas{display:block;width:100%;height:100%}
#hud{position:fixed;top:15px;left:16px;z-index:5;color:#f5eee2;background:#17191bd9;border:1px solid #ffffff25;border-radius:9px;padding:10px 14px;font-size:13px;letter-spacing:1.5px}
#status{position:fixed;top:15px;right:16px;z-index:5;color:#eee;background:#17191bd9;border:1px solid #ffffff25;border-radius:9px;padding:9px 12px;font-size:12px}
#hint{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);z-index:5;color:#eee;background:#17191be8;border:1px solid #ffffff30;border-radius:8px;padding:11px 17px;font-size:13px;text-align:center;white-space:nowrap;max-width:92vw}
#money{position:fixed;top:58px;left:16px;z-index:5;color:#f4d58d;background:#17191bd9;border:1px solid #ffffff25;border-radius:8px;padding:8px 12px;font-size:13px}
#fade{position:fixed;inset:0;background:#111;opacity:0;pointer-events:none;transition:opacity .25s;z-index:20}
</style>
</head>
<body>
<div id="hud">MEIN ZIMMER <span style="opacity:.5">/</span> ZUHAUSE</div>
<div id="status">Wird gestartet …</div>
<div id="money">0 €</div>
<div id="hint">A / D – Bewegen &nbsp; · &nbsp; LEERTASTE – Springen &nbsp; · &nbsp; E – Interagieren</div>
<div id="fade"></div>
<canvas id="game"></canvas>

<script src="supabase.js"></script>
<script>
"use strict";

/* =========================================================
   GRUNDLAGEN
========================================================= */
const canvas=document.getElementById("game");
const ctx=canvas.getContext("2d");
const W=960,H=540;
const WORLD=3100,FLOOR=440;
const SAVE_KEY="mein-zimmer-save-v1";

let sx=1,sy=1,cameraX=0,last=0,time=0;
let keys={};
let message="",messageUntil=0;
let onlineRoom=null,onlineReady=false;
let otherPlayers={};

function resize(){
  const dpr=Math.min(window.devicePixelRatio||1,2);
  canvas.width=Math.floor(innerWidth*dpr);
  canvas.height=Math.floor(innerHeight*dpr);
  sx=canvas.width/W;
  sy=canvas.height/H;
}
window.addEventListener("resize",resize);
resize();

function clamp(v,a,b){return Math.max(a,Math.min(b,v))}
function lerp(a,b,t){return a+(b-a)*t}
function roundRect(c,x,y,w,h,r){
  c.beginPath();
  c.roundRect(x,y,w,h,r);
}
function say(text,duration=2400){
  message=text;
  messageUntil=performance.now()+duration;
  document.getElementById("hint").textContent=text;
}
function clone(v){return JSON.parse(JSON.stringify(v))}

/* =========================================================
   SPIELSTAND
========================================================= */
const defaults={
  money:120,
  inventory:[],
  equipped:{head:null,face:null,clothes:null},
  faucetOn:false,
  bucketWater:0,
  orders:[],
  received:[],
  playerX:180
};

function readSave(){
  try{
    const s=JSON.parse(localStorage.getItem(SAVE_KEY)||"null");
    return s
      ? {...clone(defaults),...s,equipped:{...defaults.equipped,...(s.equipped||{})}}
      : clone(defaults);
  }catch(e){
    console.warn("Spielstand konnte nicht geladen werden:",e);
    return clone(defaults);
  }
}
let save=readSave();

function writeSave(){
  try{localStorage.setItem(SAVE_KEY,JSON.stringify(save))}
  catch(e){console.warn("Spielstand konnte nicht gespeichert werden:",e)}
  document.getElementById("money").textContent=(save.money||0)+" €";
}
writeSave();

/* =========================================================
   SPIELFIGUR – HOLZSTUHL
========================================================= */
const player={
  x:clamp(Number(save.playerX)||180,40,WORLD-80),
  y:FLOOR-68,
  vx:0,vy:0,
  width:48,height:68,
  grounded:true,
  facing:1,
  walk:0,
  held:null,
  landing:0
};

function drawChairLeg(x,y,h,angle=0){
  ctx.save();
  ctx.translate(x,y);
  ctx.rotate(angle);

  ctx.fillStyle="#49301f";
  ctx.beginPath();
  ctx.moveTo(-4,0);
  ctx.lineTo(4,0);
  ctx.lineTo(3,h);
  ctx.lineTo(-3,h);
  ctx.closePath();
  ctx.fill();

  ctx.fillStyle="#a8794d";
  ctx.fillRect(-2,2,1.5,h-4);

  ctx.restore();
}

function drawChair(){
  const moving=Math.abs(player.vx)>5&&player.grounded;
  const bodyBob=moving?Math.sin(player.walk)*1.2:0;
  const landingBob=player.landing>0?Math.sin(player.landing*Math.PI)*3:0;

  ctx.save();

  // Originaler Stuhl-Transform
  ctx.translate(player.x,player.y+player.height);
  ctx.scale(player.facing*.58,.58);
  ctx.translate(-42,-116+bodyBob+landingBob);

  // Hintere Stuhlbeine
  drawChairLeg(31,72,42,-.025);
  drawChairLeg(83,72,42,.025);

  // Sitzfläche – Holz mit natürlicher Maserung
  const seat=ctx.createLinearGradient(20,65,20,86);
  seat.addColorStop(0,"#bd8955");
  seat.addColorStop(.35,"#98643b");
  seat.addColorStop(1,"#684329");
  ctx.fillStyle=seat;
  ctx.beginPath();
  ctx.moveTo(20,65);
  ctx.lineTo(91,65);
  ctx.lineTo(86,82);
  ctx.lineTo(25,82);
  ctx.closePath();
  ctx.fill();

  ctx.strokeStyle="#d2a16c";
  ctx.lineWidth=1.5;
  ctx.beginPath();
  ctx.moveTo(25,68);
  ctx.lineTo(86,68);
  ctx.stroke();

  // Vorderbeine
  drawChairLeg(28,80,45,-.035);
  drawChairLeg(84,80,45,.035);

  // Rückenlehne
  const back=ctx.createLinearGradient(25,0,92,0);
  back.addColorStop(0,"#70472b");
  back.addColorStop(.3,"#b17a49");
  back.addColorStop(.7,"#98623a");
  back.addColorStop(1,"#603d27");

  ctx.fillStyle=back;
  ctx.beginPath();
  ctx.moveTo(25,8);
  ctx.quadraticCurveTo(25,3,31,3);
  ctx.lineTo(83,3);
  ctx.quadraticCurveTo(90,3,90,9);
  ctx.lineTo(86,65);
  ctx.lineTo(30,65);
  ctx.closePath();
  ctx.fill();

  ctx.strokeStyle="#d1a071";
  ctx.lineWidth=2;
  ctx.beginPath();
  ctx.moveTo(31,10);
  ctx.lineTo(34,58);
  ctx.stroke();

  // Holzmaserung
  ctx.strokeStyle="#68442d";
  ctx.globalAlpha=.5;
  ctx.lineWidth=1;
  for(let i=0;i<5;i++){
    ctx.beginPath();
    ctx.moveTo(38+i*10,13);
    ctx.quadraticCurveTo(35+i*10,30,39+i*10,51);
    ctx.stroke();
  }
  ctx.globalAlpha=1;

  // Oberkante
  ctx.strokeStyle="#d8a777";
  ctx.lineWidth=2;
  ctx.beginPath();
  ctx.moveTo(31,7);
  ctx.lineTo(83,7);
  ctx.stroke();

  ctx.restore();
}

/* =========================================================
   HINTERGRUND
========================================================= */
function drawBackground(){
  const wall=ctx.createLinearGradient(0,0,0,FLOOR);
  wall.addColorStop(0,"#d2c7b6");
  wall.addColorStop(1,"#b8a995");
  ctx.fillStyle=wall;
  ctx.fillRect(0,0,W,H);

  // Wandputz
  ctx.globalAlpha=.08;
  for(let i=0;i<90;i++){
    const x=(i*137-cameraX*.15)%W;
    const y=(i*71)%FLOOR;
    ctx.fillStyle=i%2?"#fff":"#5d5145";
    ctx.fillRect(x,y,2,2);
  }
  ctx.globalAlpha=1;

  // Sockelleiste
  ctx.fillStyle="#786b5b";
  ctx.fillRect(0,FLOOR-12,W,12);
  ctx.fillStyle="#e3d7c5";
  ctx.fillRect(0,FLOOR-12,W,3);

  // Boden
  const floor=ctx.createLinearGradient(0,FLOOR,0,H);
  floor.addColorStop(0,"#80684f");
  floor.addColorStop(1,"#4b3c30");
  ctx.fillStyle=floor;
  ctx.fillRect(0,FLOOR,W,H-FLOOR);

  // Parkettbretter
  for(let x=-((cameraX*.95)%160);x<W+160;x+=160){
    ctx.fillStyle="#a18464";
    ctx.globalAlpha=.25;
    ctx.fillRect(x,FLOOR+2,158,H-FLOOR);
    ctx.globalAlpha=1;
    ctx.strokeStyle="#493a2d";
    ctx.lineWidth=1;
    ctx.beginPath();
    ctx.moveTo(x,FLOOR+2);
    ctx.lineTo(x,H);
    ctx.stroke();
    ctx.strokeStyle="#c1a17b";
    ctx.globalAlpha=.3;
    ctx.beginPath();
    ctx.moveTo(x+5,FLOOR+25);
    ctx.lineTo(x+145,FLOOR+25);
    ctx.stroke();
    ctx.globalAlpha=1;
  }
}

/* =========================================================
   FENSTER
========================================================= */
function drawWindow(x,y,w,h){
  ctx.save();

  ctx.fillStyle="#675849";
  ctx.fillRect(x-7,y-7,w+14,h+14);

  const glass=ctx.createLinearGradient(x,y,x+w,y+h);
  glass.addColorStop(0,"#9bb9c3");
  glass.addColorStop(.45,"#d5e1df");
  glass.addColorStop(1,"#7895a1");
  ctx.fillStyle=glass;
  ctx.fillRect(x,y,w,h);

  // Lichtreflexe
  ctx.fillStyle="#ffffff55";
  ctx.beginPath();
  ctx.moveTo(x+8,y+8);
  ctx.lineTo(x+25,y+8);
  ctx.lineTo(x+w-10,y+h-8);
  ctx.lineTo(x+w-25,y+h-8);
  ctx.closePath();
  ctx.fill();

  // Rahmen
  ctx.fillStyle="#eee4d4";
  ctx.fillRect(x+w/2-5,y,10,h);
  ctx.fillRect(x,y+h/2-4,w,8);
  ctx.strokeStyle="#594c3f";
  ctx.lineWidth=2;
  ctx.strokeRect(x,y,w,h);

  // Fensterbank
  ctx.fillStyle="#eee4d4";
  ctx.fillRect(x-12,y+h,w+24,9);
  ctx.fillStyle="#9d8a75";
  ctx.fillRect(x-12,y+h+8,w+24,3);

  ctx.restore();
}

/* =========================================================
   MÖBEL – REALISTISCHE DETAILS
========================================================= */
function drawSofa(x,y){
  ctx.save();

  // Bodenschatten
  ctx.fillStyle="#201a16";
  ctx.globalAlpha=.3;
  ctx.beginPath();
  ctx.ellipse(x+115,y+83,125,13,0,0,Math.PI*2);
  ctx.fill();
  ctx.globalAlpha=1;

  // Füße
  ctx.fillStyle="#3c2b20";
  ctx.fillRect(x+28,y+65,9,18);
  ctx.fillRect(x+192,y+65,9,18);

  // Unterteil
  const base=ctx.createLinearGradient(x,y+25,x,y+75);
  base.addColorStop(0,"#9b806e");
  base.addColorStop(.5,"#72594d");
  base.addColorStop(1,"#493a34");
  ctx.fillStyle=base;
  roundRect(ctx,x,y+27,225,49,12);
  ctx.fill();

  // Rückenpolster
  const back=ctx.createLinearGradient(x,y-30,x,y+35);
  back.addColorStop(0,"#b69b86");
  back.addColorStop(.6,"#927663");
  back.addColorStop(1,"#70594c");
  ctx.fillStyle=back;
  roundRect(ctx,x+12,y-26,201,62,13);
  ctx.fill();

  // Sitzkissen
  ctx.fillStyle="#a58b78";
  roundRect(ctx,x+14,y+20,195,38,9);
  ctx.fill();

  ctx.strokeStyle="#d1b7a0";
  ctx.globalAlpha=.5;
  ctx.lineWidth=1;
  ctx.beginPath();
  ctx.moveTo(x+111,y+23);
  ctx.lineTo(x+111,y+54);
  ctx.stroke();
  ctx.globalAlpha=1;

  // Armlehnen
  const arm=ctx.createLinearGradient(x,y,x+20,y);
  arm.addColorStop(0,"#665043");
  arm.addColorStop(.5,"#b49a84");
  arm.addColorStop(1,"#70594c");
  ctx.fillStyle=arm;
  roundRect(ctx,x-3,y+5,30,58,9);
  ctx.fill();
  ctx.fillStyle=arm;
  roundRect(ctx,x+198,y+5,30,58,9);
  ctx.fill();

  // Kissen
  ctx.save();
  ctx.translate(x+60,y+9);
  ctx.rotate(-.09);
  ctx.fillStyle="#d2c1a9";
  roundRect(ctx,-20,-18,42,38,7);
  ctx.fill();
  ctx.strokeStyle="#9f8b76";
  ctx.stroke();
  ctx.restore();

  ctx.restore();
}

function drawBed(x,y){
  ctx.save();

  ctx.fillStyle="#241d18";
  ctx.globalAlpha=.3;
  ctx.beginPath();
  ctx.ellipse(x+120,y+73,135,12,0,0,Math.PI*2);
  ctx.fill();
  ctx.globalAlpha=1;

  // Bettgestell
  const wood=ctx.createLinearGradient(x,y,x,y+70);
  wood.addColorStop(0,"#98704d");
  wood.addColorStop(1,"#4e3828");
  ctx.fillStyle=wood;
  ctx.fillRect(x,y+24,245,42);
  ctx.fillRect(x-5,y+5,14,65);
  ctx.fillRect(x+235,y+15,14,55);

  // Matratze
  ctx.fillStyle="#e4ded2";
  roundRect(ctx,x+9,y+8,225,43,8);
  ctx.fill();

  // Decke
  const blanket=ctx.createLinearGradient(x,y+22,x,y+60);
  blanket.addColorStop(0,"#8c9b9b");
  blanket.addColorStop(1,"#526b6b");
  ctx.fillStyle=blanket;
  roundRect(ctx,x+68,y+20,163,39,6);
  ctx.fill();

  ctx.strokeStyle="#c1c9c2";
  ctx.globalAlpha=.45;
  for(let i=0;i<5;i++){
    ctx.beginPath();
    ctx.moveTo(x+80+i*30,y+25);
    ctx.lineTo(x+80+i*30,y+55);
    ctx.stroke();
  }
  ctx.globalAlpha=1;

  // Kissen
  ctx.fillStyle="#f5eee3";
  roundRect(ctx,x+17,y+13,48,26,7);
  ctx.fill();
  ctx.strokeStyle="#c7bbaa";
  ctx.stroke();

  ctx.restore();
}

function drawDesk(x,y){
  ctx.save();

  // Tischbeine
  const leg=ctx.createLinearGradient(x,y,x+10,y);
  leg.addColorStop(0,"#4c3525");
  leg.addColorStop(.5,"#9a7048");
  leg.addColorStop(1,"#493322");
  ctx.fillStyle=leg;
  ctx.fillRect(x+12,y+18,9,75);
  ctx.fillRect(x+184,y+18,9,75);

  // Tischplatte
  const top=ctx.createLinearGradient(x,y,x,y+18);
  top.addColorStop(0,"#c19767");
  top.addColorStop(.4,"#9a7048");
  top.addColorStop(1,"#65472e");
  ctx.fillStyle=top;
  roundRect(ctx,x,y,205,19,3);
  ctx.fill();

  // Maserung
  ctx.strokeStyle="#d5ad7c";
  ctx.globalAlpha=.4;
  ctx.beginPath();
  ctx.moveTo(x+20,y+5);
  ctx.lineTo(x+180,y+5);
  ctx.stroke();
  ctx.globalAlpha=1;

  // Laptop
  ctx.fillStyle="#292c2d";
  roundRect(ctx,x+72,y-35,72,35,3);
  ctx.fill();
  ctx.fillStyle="#a5c3c7";
  ctx.fillRect(x+77,y-30,62,25);
  ctx.fillStyle="#4b5153";
  ctx.beginPath();
  ctx.moveTo(x+65,y);
  ctx.lineTo(x+151,y);
  ctx.lineTo(x+145,y+4);
  ctx.lineTo(x+71,y+4);
  ctx.closePath();
  ctx.fill();

  ctx.restore();
}

/* =========================================================
   SCHRANK
========================================================= */
function drawWardrobe(x,y){
  ctx.save();

  ctx.fillStyle="#201a15";
  ctx.globalAlpha=.3;
  ctx.beginPath();
  ctx.ellipse(x+62,y+174,70,9,0,0,Math.PI*2);
  ctx.fill();
  ctx.globalAlpha=1;

  const wood=ctx.createLinearGradient(x,y,x+130,y);
  wood.addColorStop(0,"#493323");
  wood.addColorStop(.2,"#986b45");
  wood.addColorStop(.5,"#b08458");
  wood.addColorStop(.8,"#805837");
  wood.addColorStop(1,"#402c20");

  ctx.fillStyle=wood;
  ctx.fillRect(x,y,125,170);

  ctx.fillStyle="#33251b";
  ctx.fillRect(x+8,y+8,53,154);
  ctx.fillRect(x+65,y+8,52,154);

  // Innenflächen
  ctx.fillStyle="#a47a50";
  ctx.fillRect(x+11,y+11,47,148);
  ctx.fillRect(x+68,y+11,46,148);

  // Türen
  ctx.strokeStyle="#d1a678";
  ctx.lineWidth=2;
  ctx.strokeRect(x+4,y+4,57,162);
  ctx.strokeRect(x+64,y+4,57,162);

  // Griffe
  ctx.fillStyle="#d6c29e";
  ctx.beginPath();
  ctx.arc(x+54,y+86,3,0,Math.PI*2);
  ctx.arc(x+70,y+86,3,0,Math.PI*2);
  ctx.fill();

  ctx.restore();
}

/* =========================================================
   COMPUTER / LIEFERUNGEN
========================================================= */
function drawComputer(x,y){
  ctx.save();

  // Tisch
  drawDesk(x,y+50);

  // Bildschirm
  ctx.fillStyle="#222729";
  roundRect(ctx,x+70,y-30,95,70,5);
  ctx.fill();

  const screen=ctx.createLinearGradient(x+75,y-25,x+160,y+35);
  screen.addColorStop(0,"#263d43");
  screen.addColorStop(1,"#111e24");
  ctx.fillStyle=screen;
  roundRect(ctx,x+76,y-24,83,57,2);
  ctx.fill();

  ctx.fillStyle="#8bb5a5";
  ctx.font="bold 9px Arial";
  ctx.fillText("MEIN ZIMMER",x+84,y-9);
  ctx.fillStyle="#d4c58e";
  ctx.fillRect(x+84,y+1,47,2);
  ctx.fillStyle="#8bb5a5";
  ctx.fillRect(x+84,y+10,60,2);
  ctx.fillRect(x+84,y+17,37,2);

  ctx.restore();
}

/* =========================================================
   WASCHBECKEN UND EIMER
========================================================= */
function drawSink(x,y){
  ctx.save();

  // Unterschrank
  const wood=ctx.createLinearGradient(x,y,x+100,y);
  wood.addColorStop(0,"#5a4535");
  wood.addColorStop(.5,"#9b7958");
  wood.addColorStop(1,"#49372a");
  ctx.fillStyle=wood;
  ctx.fillRect(x,y+25,100,95);

  ctx.strokeStyle="#d2b18a";
  ctx.strokeRect(x+8,y+38,84,70);

  // Becken
  ctx.fillStyle="#aeb8b8";
  ctx.beginPath();
  ctx.ellipse(x+50,y+24,58,15,0,0,Math.PI*2);
  ctx.fill();
  ctx.fillStyle="#697879";
  ctx.beginPath();
  ctx.ellipse(x+50,y+22,46,9,0,0,Math.PI*2);
  ctx.fill();

  // Wasserhahn
  ctx.strokeStyle="#aab7b8";
  ctx.lineWidth=6;
  ctx.lineCap="round";
  ctx.beginPath();
  ctx.moveTo(x+72,y+19);
  ctx.lineTo(x+72,y-7);
  ctx.quadraticCurveTo(x+72,y-20,x+58,y-20);
  ctx.stroke();

  ctx.strokeStyle="#e4e8e5";
  ctx.lineWidth=2;
  ctx.beginPath();
  ctx.moveTo(x+69,y-7);
  ctx.lineTo(x+69,y+13);
  ctx.stroke();

  // Eimer
  const bx=x+135,by=y+75;
  ctx.fillStyle="#4e5d5c";
  ctx.beginPath();
  ctx.moveTo(bx,by);
  ctx.lineTo(bx+45,by);
  ctx.lineTo(bx+39,by+47);
  ctx.lineTo(bx+6,by+47);
  ctx.closePath();
  ctx.fill();

  ctx.strokeStyle="#aebbb7";
  ctx.lineWidth=3;
  ctx.beginPath();
  ctx.ellipse(bx+22,by,22,6,0,0,Math.PI*2);
  ctx.stroke();

  if(save.bucketWater>0){
    ctx.fillStyle="#76b8c5";
    ctx.beginPath();
    ctx.ellipse(bx+22,by+8,17,4,0,0,Math.PI*2);
    ctx.fill();
  }

  ctx.restore();
}

/* =========================================================
   DEKORATIONEN
========================================================= */
function drawShelf(x,y){
  ctx.save();
  ctx.fillStyle="#533b2a";
  ctx.fillRect(x,y,180,9);
  ctx.fillStyle="#b28a5f";
  ctx.fillRect(x,y,180,3);

  const colors=["#a76c4f","#647b7b","#c2a16d","#8b6658","#73866d"];
  for(let i=0;i<5;i++){
    ctx.fillStyle=colors[i];
    ctx.fillRect(x+12+i*23,y-39+(i%2)*5,17,39-(i%2)*5);
    ctx.fillStyle="#ffffff33";
    ctx.fillRect(x+15+i*23,y-35+(i%2)*5,2,30);
  }
  ctx.restore();
}

function drawPlant(x,y){
  ctx.save();

  ctx.fillStyle="#79533a";
  ctx.beginPath();
  ctx.moveTo(x-18,y-28);
  ctx.lineTo(x+18,y-28);
  ctx.lineTo(x+14,y);
  ctx.lineTo(x-14,y);
  ctx.closePath();
  ctx.fill();

  ctx.strokeStyle="#426448";
  ctx.lineWidth=4;
  ctx.beginPath();
  ctx.moveTo(x,y-27);
  ctx.lineTo(x,y-88);
  ctx.stroke();

  const leaves=[[-18,-72,-.7],[18,-80,.7],[-23,-51,-.8],[24,-57,.8],[-11,-91,-.3],[13,-99,.4]];
  for(const [dx,dy,a] of leaves){
    ctx.save();
    ctx.translate(x+dx,y+dy);
    ctx.rotate(a);
    const g=ctx.createLinearGradient(-10,-4,10,4);
    g.addColorStop(0,"#31533b");
    g.addColorStop(1,"#71916a");
    ctx.fillStyle=g;
    ctx.beginPath();
    ctx.ellipse(0,0,15,6,0,0,Math.PI*2);
    ctx.fill();
    ctx.restore();
  }
  ctx.restore();
}

/* =========================================================
   INTERAKTIONSPUNKTE
========================================================= */
const objects={
  wardrobe:{x:520,w:125,label:"Kleiderschrank"},
  computer:{x:1230,w:205,label:"Computer"},
  sink:{x:1960,w:190,label:"Waschbecken"},
  city:{x:2880,w:90,label:"Ausgang zur Stadt"}
};

function nearObject(obj){
  return Math.abs((player.x+player.width/2)-(obj.x+obj.w/2))<105;
}

function interact(){
  if(nearObject(objects.wardrobe)){
    transition("Schrank.html");
    return;
  }

  if(nearObject(objects.computer)){
    say("Computer: Hier kannst du später Bestellungen verwalten.");
    return;
  }

  if(nearObject(objects.sink)){
    save.faucetOn=!save.faucetOn;
    if(save.faucetOn){
      save.bucketWater=clamp((save.bucketWater||0)+1,0,5);
      say("Du hast den Wasserhahn geöffnet. Eimer gefüllt!");
    }else{
      say("Wasserhahn geschlossen.");
    }
    writeSave();
    return;
  }

  if(nearObject(objects.city)){
    transition("Stadt.html");
    return;
  }

  say("Hier gibt es gerade nichts zu tun.");
}

function transition(url){
  document.getElementById("fade").style.opacity="1";
  save.playerX=player.x;
  writeSave();
  setTimeout(()=>location.href=url,250);
}

/* =========================================================
   WELT ZEICHNEN
========================================================= */

  drawWindow(170,65,210,160);
  drawWindow(930,80,190,145);
  drawWindow(1730,65,210,160);
  drawWindow(2470,80,190,145);

  // Bilderrahmen
  ctx.fillStyle="#604b39";
  ctx.fillRect(650,80,120,95);
  ctx.fillStyle="#e5d6bd";
  ctx.fillRect(657,87,106,81);
  ctx.fillStyle="#83938b";
  ctx.fillRect(670,100,80,55);
  ctx.fillStyle="#d7c8a9";
  ctx.fillRect(676,106,68,43);

  // Möbel
  drawPlant(90,FLOOR);
  drawSofa(420,FLOOR-78);
  drawWardrobe(520,FLOOR-170);
  drawShelf(780,190);
  drawDesk(1160,FLOOR-90);
  drawComputer(1160,FLOOR-140);
  drawBed(1510,FLOOR-75);
  drawPlant(1810,FLOOR);
  drawSink(1960,FLOOR-120);
  drawShelf(2250,190);
  drawSofa(2500,FLOOR-78);

  // Ausgang
  ctx.fillStyle="#49382b";
  ctx.fillRect(2870,FLOOR-205,100,205);
  const door=ctx.createLinearGradient(2870,0,2970,0);
  door.addColorStop(0,"#674b35");
  door.addColorStop(.5,"#9b754e");
  door.addColorStop(1,"#4f3828");
  ctx.fillStyle=door;
  ctx.fillRect(2878,FLOOR-198,84,198);
  ctx.strokeStyle="#c29b6c";
  ctx.lineWidth=3;
  ctx.strokeRect(2884,FLOOR-192,72,184);
  ctx.fillStyle="#d4b477";
  ctx.beginPath();
  ctx.arc(2945,FLOOR-95,4,0,Math.PI*2);
  ctx.fill();

  ctx.fillStyle="#eee2cf";
  ctx.font="bold 12px Arial";
  ctx.textAlign="center";
  ctx.fillText("STADT",2920,FLOOR-218);
  ctx.textAlign="left";

  // Interaktionsmarkierungen
  const targets=[
    [objects.wardrobe,"E"],
    [objects.computer,"E"],
    [objects.sink,"E"],
    [objects.city,"E"]
  ];
  for(const [o,label] of targets){
    const active=nearObject(o);
    if(active){
      ctx.fillStyle="#202323dd";
      roundRect(ctx,o.x+o.w/2-13,FLOOR-225,26,25,5);

}

/* =========================================================
   SCHATTEN UND SPIELFIGUR
========================================================= */
function drawPlayerShadow(){
  ctx.save();
  ctx.fillStyle="#17120e";
  ctx.globalAlpha=.3;
  ctx.beginPath();
  ctx.ellipse(player.x+24,FLOOR-2,24,5,0,0,Math.PI*2);
  ctx.fill();
  ctx.restore();
}

function drawOtherPlayers(){
  for(const [id,p] of Object.entries(otherPlayers)){
    if(!p||id==="self")continue;
    const x=Number(p.x);
    if(!Number.isFinite(x))continue;
    ctx.save();
    ctx.globalAlpha=.65;
    ctx.fillStyle="#a77b50";
    ctx.fillRect(x+10,FLOOR-67,29,9);
    ctx.fillRect(x+13,FLOOR-58,5,55);
    ctx.fillRect(x+33,FLOOR-58,5,55);
    ctx.fillRect(x+13,FLOOR-105,25,43);
    ctx.restore();
  }
}

/* =========================================================
   PHYSIK
========================================================= */
function update(dt){
  const left=keys["a"]||keys["arrowleft"];
  const right=keys["d"]||keys["arrowright"];
  const speed=230;

  if(left){
    player.vx=-speed;
    player.facing=-1;
  }else if(right){
    player.vx=speed;
    player.facing=1;
  }else{
    player.vx*=Math.pow(.001,dt);
    if(Math.abs(player.vx)<2)player.vx=0;
  }

  player.x+=player.vx*dt;
  player.x=clamp(player.x,20,WORLD-player.width-20);

  player.vy+=1100*dt;
  player.y+=player.vy*dt;

  if(player.y+player.height>=FLOOR){
    if(!player.grounded&&player.vy>100)player.landing=1;
    player.y=FLOOR-player.height;
    player.vy=0;
    player.grounded=true;
  }else{
    player.grounded=false;
  }

  if(player.grounded&&Math.abs(player.vx)>5){
    player.walk+=dt*11;
  }
  player.landing=Math.max(0,player.landing-dt*3);

  cameraX=clamp(player.x-W*.42,0,WORLD-W);

  save.playerX=player.x;
}

/* =========================================================
   ZEICHNEN
========================================================= */
function draw(){
  ctx.setTransform(sx,0,0,sy,0,0);
  ctx.clearRect(0,0,W,H);

  drawBackground();

  ctx.save();
  ctx.translate(-cameraX,0);

  drawWorld();
  drawOtherPlayers();
  drawPlayerShadow();
  drawChair();

  ctx.restore();

  // Raumbeleuchtung
  const light=ctx.createRadialGradient(W*.5,H*.35,20,W*.5,H*.35,570);
  light.addColorStop(0,"#fff7e500");
  light.addColorStop(1,"#241b171c");
  ctx.fillStyle=light;
  ctx.fillRect(0,0,W,H);

  // Interaktionshinweis
  const nearby=Object.values(objects).some(nearObject);
  if(nearby){
    document.getElementById("hint").textContent="E – Interagieren";
  }else if(performance.now()>messageUntil){
    document.getElementById("hint").textContent=
      "A / D – Bewegen   ·   LEERTASTE – Springen   ·   E – Interagieren";
  }else{
    document.getElementById("hint").textContent=message;
  }
}

/* =========================================================
   TASTENSTEUERUNG
========================================================= */
window.addEventListener("keydown",e=>{
  const k=e.key.toLowerCase();
  if([" ","arrowup","arrowleft","arrowright"].includes(k))e.preventDefault();

  if(!keys[k]){
    if(k===" "||k==="w"||k==="arrowup"){
      if(player.grounded){
        player.vy=-440;
        player.grounded=false;
      }
    }
    if(k==="e")interact();
    if(k==="q"){
      player.held=null;
      say("Gegenstand abgelegt.");
    }
  }
  keys[k]=true;
});

window.addEventListener("keyup",e=>{
  keys[e.key.toLowerCase()]=false;
});
window.addEventListener("blur",()=>keys={});

/* =========================================================
   MULTIPLAYER – OPTIONAL
========================================================= */
async function initOnline(){
  const status=document.getElementById("status");

  try{
    const room=JSON.parse(sessionStorage.getItem("mein-zimmer-active-room")||"null");
    if(!room||!window.GameOnline){
      status.textContent="Offline – Einzelspieler";
      return;
    }

    onlineRoom=room;
    if(typeof GameOnline.login==="function"){
      await GameOnline.login("Spieler");
    }

    const client=typeof GameOnline.getClient==="function"
      ?GameOnline.getClient():null;

    if(client&&typeof GameOnline.watchPlayers==="function"){
      GameOnline.watchPlayers(room.id||room.room_id,players=>{
        otherPlayers=players||{};
      });
    }

    onlineReady=true;
    status.textContent="Online – Raum aktiv";
  }catch(e){
    console.warn("Multiplayer nicht verfügbar:",e);
    status.textContent="Offline – Einzelspieler";
  }
}

let networkTimer=0;
async function sendOnline(dt){
  if(!onlineReady||!onlineRoom||!window.GameOnline)return;
  networkTimer+=dt;
  if(networkTimer<.15)return;
  networkTimer=0;

  try{
    if(typeof GameOnline.updatePosition==="function"){
      await GameOnline.updatePosition(
        onlineRoom.id||onlineRoom.room_id,
        "zimmer",
        player.x,
        player.y
      );
    }
  }catch(e){
    console.warn("Position konnte nicht gesendet werden:",e);
  }
}

/* =========================================================
   SPIELSCHLEIFE
========================================================= */
function loop(now){
  const dt=Math.min((now-last)/1000||0,.033);
  last=now;
  time+=dt;

  update(dt);
  draw();
  sendOnline(dt);

  requestAnimationFrame(loop);
}

initOnline();
requestAnimationFrame(loop);

window.addEventListener("beforeunload",()=>{
  save.playerX=player.x;
  writeSave();
});
</script>
