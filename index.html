
<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Mein Zimmer</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#17191b;font-family:Arial,sans-serif}
canvas{display:block;width:100%;height:100%}
#hud{position:fixed;top:14px;left:14px;padding:12px 16px;background:#17191be8;color:white;border:1px solid #ffffff22;border-radius:11px;font-size:12px;line-height:1.7;pointer-events:none}
#hint{position:fixed;bottom:15px;left:50%;transform:translateX(-50%);padding:10px 15px;background:#17191be8;color:white;border-radius:10px;font-size:12px;white-space:nowrap;pointer-events:none}
#prompt{position:fixed;bottom:65px;left:50%;transform:translateX(-50%);padding:10px 16px;background:#17191bed;color:white;border-radius:9px;font-size:13px;display:none;white-space:nowrap}
</style>
</head>
<body>
<canvas id="world"></canvas>

<div id="hud">
 <b>MEIN ZIMMER</b><br>
 <span id="status">Willkommen zu Hause</span><br>
 <span id="held">Hände frei</span>
</div>
<div id="prompt"></div>
<div id="hint">A / D · Laufen &nbsp; | &nbsp; LEERTASTE · Springen &nbsp; | &nbsp; E · Interagieren &nbsp; | &nbsp; Q · Ablegen</div>

<script>
"use strict";

/* =====================================================
   GRUNDEINSTELLUNGEN
===================================================== */

const canvas=document.getElementById("world");
const ctx=canvas.getContext("2d");
const statusText=document.getElementById("status");
const heldText=document.getElementById("held");
const prompt=document.getElementById("prompt");

const W=960,H=540,FLOOR=440,WORLD=3100;
let sx=1,sy=1,cameraX=0,last=0,time=0;

function resize(){
 const d=Math.min(devicePixelRatio||1,2);
 canvas.width=innerWidth*d;
 canvas.height=innerHeight*d;
 sx=canvas.width/W;
 sy=canvas.height/H;
}
addEventListener("resize",resize);
resize();

const keys={};

addEventListener("keydown",e=>{
 const k=e.key.toLowerCase();
 keys[k]=true;
 if([" ","arrowleft","arrowright","arrowup"].includes(k))e.preventDefault();

 if(!e.repeat){
  if(k===" "||k==="arrowup"||k==="w")jump();
  if(k==="e")interact();
  if(k==="q")dropItem();
 }
});
addEventListener("keyup",e=>keys[e.key.toLowerCase()]=false);


/* =====================================================
   SPIELER
===================================================== */

const player={
 x:180,y:FLOOR-68,vx:0,vy:0,
 width:48,height:68,
 grounded:true,facing:1,walk:0,held:null
};


/* =====================================================
   GEGENSTÄNDE
===================================================== */

const objects=[
 {id:"Buch",type:"book",x:440,y:0,w:38,h:10,color:"#526c78"},
 {id:"Paket",type:"box",x:680,y:0,w:43,h:38},
 {id:"Kissen",type:"pillow",x:930,y:0,w:49,h:23},
 {id:"Blumentopf",type:"plant",x:1240,y:0,w:34,h:50},
 {id:"Buch",type:"book",x:1640,y:0,w:38,h:10,color:"#89534b"}
];

objects.forEach(o=>{o.y=FLOOR-o.h});


/* =====================================================
   MÖBEL UND TÜREN
===================================================== */

const furniture=[
 {type:"table",x:470,y:FLOOR,w:180,h:85},
 {type:"sofa",x:790,y:FLOOR,w:240,h:110},
 {type:"shelf",x:1250,y:FLOOR,w:130,h:155},
 {type:"lamp",x:1730,y:FLOOR,w:65,h:170},
 {type:"plant",x:2010,y:FLOOR,w:65,h:105},
 {type:"sink",x:2240,y:FLOOR,w:180,h:115}
];

const doors=[
 {x:2630,w:130,label:"Kleiderschrank",url:"Schrank.html",type:"wardrobe"},
 {x:2910,w:100,label:"Stadt",url:"Stadt.html",type:"exit"}
];

let waterOn=false,tapAngle=0,tapTarget=0;


/* =====================================================
   ZEICHEN-HILFSFUNKTIONEN
===================================================== */

function clamp(v,a,b){return Math.max(a,Math.min(b,v))}
function lerp(a,b,t){return a+(b-a)*t}

function round(x,y,w,h,r,fill,stroke){
 ctx.beginPath();
 ctx.roundRect(x,y,w,h,r);
 if(fill){ctx.fillStyle=fill;ctx.fill()}
 if(stroke){ctx.strokeStyle=stroke;ctx.stroke()}
}

function grad(x,y,w,h,a,b){
 const g=ctx.createLinearGradient(x,y,x+w,y+h);
 g.addColorStop(0,a);g.addColorStop(1,b);
 return g;
}

function wood(x,y,w,h,base="#95613d"){
 round(x,y,w,h,2,grad(x,y,w,h,"#d0a071",base));
 ctx.save();
 ctx.globalAlpha=.25;

 for(let i=0;i<Math.max(3,Math.floor(h/7));i++){
  const yy=y+3+i*h/Math.max(3,Math.floor(h/7));
  ctx.beginPath();
  ctx.moveTo(x+2,yy);
  ctx.bezierCurveTo(x+w*.25,yy-2,x+w*.7,yy+2,x+w-2,yy);
  ctx.strokeStyle=i%2?"#402719":"#f5d1a2";
  ctx.lineWidth=.7;
  ctx.stroke();
 }
 ctx.restore();

 ctx.strokeStyle="#4c301d55";
 ctx.lineWidth=1;
 ctx.strokeRect(x+.5,y+.5,w-1,h-1);
}

function fabric(x,y,w,h,light="#aaa99e",dark="#62665f"){
 round(x,y,w,h,9,grad(x,y,w,h,light,dark),"#454b45");
 ctx.save();
 ctx.beginPath();
 ctx.roundRect(x+2,y+2,w-4,h-4,7);
 ctx.clip();

 // Feine Stoffstruktur
 ctx.globalAlpha=.13;
 for(let yy=y+3;yy<y+h;yy+=4){
  ctx.strokeStyle=yy%8?"#fff":"#20251f";
  ctx.lineWidth=.7;
  ctx.beginPath();
  ctx.moveTo(x+2,yy);
  ctx.lineTo(x+w-2,yy);
  ctx.stroke();
 }
 for(let xx=x+4;xx<x+w;xx+=5){
  ctx.strokeStyle="#ffffff";
  ctx.beginPath();
  ctx.moveTo(xx,y+3);
  ctx.lineTo(xx,y+h-3);
  ctx.stroke();
 }
 ctx.restore();
}

function shadow(x,y,rx,ry,alpha=.2){
 ctx.fillStyle="rgba(0,0,0,"+alpha+")";
 ctx.beginPath();
 ctx.ellipse(x,y,rx,ry,0,0,Math.PI*2);
 ctx.fill();
}


/* =====================================================
   ZIMMER
===================================================== */

function drawRoom(){
 ctx.fillStyle=grad(0,0,0,FLOOR,"#eee8de","#c9bdad");
 ctx.fillRect(0,0,WORLD,FLOOR);

 // Dezente Wandstruktur
 for(let x=0;x<WORLD;x+=160){
  ctx.strokeStyle="#ffffff22";
  ctx.lineWidth=1;
  ctx.beginPath();
  ctx.moveTo(x,0);ctx.lineTo(x,FLOOR);
  ctx.stroke();
 }

 // Sockelleiste
 ctx.fillStyle="#a58d76";
 ctx.fillRect(0,416,WORLD,24);
 ctx.fillStyle="#e0cbb0";
 ctx.fillRect(0,416,WORLD,4);
 ctx.fillStyle="#76604c";
 ctx.fillRect(0,437,WORLD,3);

 // Fenster
 for(const x of [100,1040,1880]){
  ctx.fillStyle="#eee5d7";
  ctx.fillRect(x-7,55,254,208);

  ctx.fillStyle=grad(x,65,240,190,"#9fc4d8","#e5e8dc");
  ctx.fillRect(x,65,240,190);

  // Landschaft draußen
  ctx.fillStyle="#a9b99a";
  ctx.fillRect(x,184,240,71);
  ctx.fillStyle="#829b76";
  ctx.beginPath();
  ctx.moveTo(x,211);
  ctx.quadraticCurveTo(x+75,165,x+130,208);
  ctx.quadraticCurveTo(x+190,175,x+240,207);
  ctx.lineTo(x+240,255);ctx.lineTo(x,255);
  ctx.fill();

  for(let i=0;i<6;i++){
   ctx.beginPath();
   ctx.arc(x+20+i*43,194+(i%3)*7,17,0,Math.PI*2);
   ctx.fillStyle=i%2?"#718b6c":"#8ba17c";
   ctx.fill();
  }

  ctx.fillStyle="#eee5d7";
  ctx.fillRect(x+116,65,7,190);
  ctx.fillRect(x,155,240,7);
  ctx.fillStyle="#9c8268";
  ctx.fillRect(x-10,53,260,10);
  ctx.fillRect(x-10,257,260,9);
 }

 // Holzboden
 ctx.fillStyle=grad(0,FLOOR,0,100,"#b08a63","#654a34");
 ctx.fillRect(0,FLOOR,WORLD,100);

 // Bodenplanken
 for(let y=FLOOR;y<540;y+=25){
  ctx.strokeStyle="#49352255";
  ctx.lineWidth=1.5;
  ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(WORLD,y);ctx.stroke();
 }
 for(let x=0;x<WORLD;x+=130){
  ctx.strokeStyle="#49352255";
  ctx.beginPath();ctx.moveTo(x,FLOOR);ctx.lineTo(x,540);ctx.stroke();
  ctx.strokeStyle="#e3c39b33";
  ctx.beginPath();ctx.moveTo(x+3,FLOOR+2);ctx.lineTo(x+3,538);ctx.stroke();
 }

 // Licht vom Fenster
 ctx.save();
 ctx.globalAlpha=.09;
 ctx.fillStyle="#fff2cf";
 ctx.beginPath();
 ctx.moveTo(110,250);ctx.lineTo(330,250);
 ctx.lineTo(530,440);ctx.lineTo(180,440);
 ctx.fill();
 ctx.restore();

 // Wandbilder
 for(const x of [490,1510]){
  ctx.fillStyle="#705943";ctx.fillRect(x,92,82,94);
  ctx.fillStyle="#eee6d8";ctx.fillRect(x+5,97,72,84);
  ctx.fillStyle="#899a78";
  ctx.beginPath();
  ctx.moveTo(x+10,175);ctx.lineTo(x+40,120);ctx.lineTo(x+72,175);
  ctx.fill();
 }
}


/* =====================================================
   TISCH
===================================================== */

function drawTable(f){
 const x=f.x,y=f.y,w=f.w;
 shadow(x+w/2,y+3,w*.55,7,.16);

 // Tischbeine
 wood(x+17,y-4,13,88,"#765033");
 wood(x+w-30,y-4,13,88,"#765033");

 // Zarge
 wood(x+17,y-24,w-34,23,"#95643e");

 // Tischplatte
 wood(x-4,y-34,w+8,13,"#9b6b43");
 ctx.fillStyle="#e3bd91";
 ctx.fillRect(x,y-33,w,1.5);
}


/* =====================================================
   SOFA – STOFF, POLSTER UND NÄHTE
===================================================== */

function drawSofa(f){
 const x=f.x,y=f.y,w=f.w;

 shadow(x+w/2,y+3,w*.55,7,.2);

 // Füße
 wood(x+22,y-5,12,17,"#60432e");
 wood(x+w-34,y-5,12,17,"#60432e");

 // Unterbau
 round(x+5,y-45,w-10,44,8,
  grad(x,y-45,w,44,"#747b74","#424a45"),"#3c443f");

 // Untere Stoffkante
 ctx.strokeStyle="#c4c8bd66";
 ctx.lineWidth=1;
 ctx.beginPath();ctx.moveTo(x+15,y-12);ctx.lineTo(x+w-15,y-12);ctx.stroke();

 // Rückenlehne
 fabric(x+13,y-108,w-26,77,"#999d94","#555e57");

 // Armlehnen
 fabric(x,y-70,43,68,"#a4a69b","#5b625a");
 fabric(x+w-43,y-70,43,68,"#a4a69b","#5b625a");

 // Armlehnen-Oberflächen
 ctx.strokeStyle="#d9d9ce88";
 ctx.lineWidth=1.5;
 ctx.beginPath();
 ctx.moveTo(x+8,y-65);ctx.lineTo(x+34,y-65);
 ctx.moveTo(x+w-34,y-65);ctx.lineTo(x+w-8,y-65);
 ctx.stroke();

 // Drei Rückenpolster
 const cushionW=(w-76)/3;
 for(let i=0;i<3;i++){
  const cx=x+39+i*(cushionW+2);
  fabric(cx,y-101,cushionW,60,
   i===1?"#a9ada3":"#999f95",
   i===1?"#687168":"#59635b");

  // Polsterkontur und Nähte
  ctx.strokeStyle="#d9dacf99";
  ctx.lineWidth=1;
  ctx.beginPath();
  ctx.moveTo(cx+8,y-94);ctx.lineTo(cx+8,y-49);
  ctx.moveTo(cx+cushionW-8,y-94);ctx.lineTo(cx+cushionW-8,y-49);
  ctx.stroke();

  ctx.strokeStyle="#424b4388";
  ctx.beginPath();
  ctx.moveTo(cx+7,y-44);ctx.lineTo(cx+cushionW-7,y-44);
  ctx.stroke();
 }

 // Sitzpolster
 const seatW=(w-56)/3;
 for(let i=0;i<3;i++){
  const px=x+28+i*(seatW+2);
  fabric(px,y-48,seatW,25,"#a9ada3","#626b63");

  ctx.strokeStyle="#d8d9cf99";
  ctx.lineWidth=1;
  ctx.beginPath();
  ctx.moveTo(px+9,y-43);ctx.lineTo(px+seatW-9,y-43);
  ctx.stroke();

  // dezente Sitzfalte
  ctx.strokeStyle="#424a4355";
  ctx.beginPath();
  ctx.moveTo(px+seatW/2,y-25);
  ctx.quadraticCurveTo(px+seatW/2+5,y-29,px+seatW/2+10,y-25);
  ctx.stroke();
 }

 // Dezente Lichtkante
 ctx.strokeStyle="#d8dbd188";
 ctx.lineWidth=1;
 ctx.beginPath();
 ctx.moveTo(x+17,y-105);ctx.lineTo(x+w-17,y-105);
 ctx.stroke();
}


/* =====================================================
   REGAL
===================================================== */

function drawShelf(f){
 const x=f.x,y=f.y,w=f.w,h=f.h;

 shadow(x+w/2,y+2,w*.5,6,.15);
 wood(x,y-h,w,10,"#714a30");
 wood(x+4,y-h,10,h,"#805438");
 wood(x+w-14,y-h,10,h,"#805438");

 for(let yy=y-h+50;yy<y-12;yy+=48){
  wood(x+10,yy,w-20,7,"#805438");
 }

 const colors=["#8a5144","#526b79","#a88a59","#66765c","#9b6b4d"];
 for(let row=0;row<2;row++){
  let xx=x+17;
  for(let i=0;i<5;i++){
   const bh=19+(i%3)*4;
   const by=y-h+39+row*48-bh;
   ctx.fillStyle=colors[(i+row*2)%5];
   ctx.fillRect(xx,by,12,bh);
   ctx.fillStyle="#ffffff55";ctx.fillRect(xx+3,by+3,2,bh-6);
   ctx.fillStyle="#33251e55";ctx.fillRect(xx+10,by,2,bh);
   xx+=19;
  }
 }
}


/* =====================================================
   LAMPE
===================================================== */

function drawLamp(f){
 const x=f.x,y=f.y;

 shadow(x+34,y+2,29,5,.15);
 ctx.fillStyle="#6e6255";
 ctx.fillRect(x+30,y-140,6,140);

 ctx.fillStyle=grad(x,y-180,65,40,"#c2a987","#76634e");
 ctx.beginPath();
 ctx.moveTo(x+3,y-140);
 ctx.lineTo(x+18,y-180);
 ctx.lineTo(x+52,y-180);
 ctx.lineTo(x+68,y-140);
 ctx.closePath();ctx.fill();

 ctx.strokeStyle="#e1ceb0";
 ctx.lineWidth=1;
 ctx.beginPath();ctx.moveTo(x+18,y-178);ctx.lineTo(x+52,y-178);ctx.stroke();

 ctx.fillStyle="#e7d5a6";
 ctx.beginPath();ctx.ellipse(x+35,y-140,33,6,0,0,Math.PI*2);ctx.fill();

 // Lichtkegel
 ctx.save();
 ctx.globalAlpha=.07;
 ctx.fillStyle="#ffe7ac";
 ctx.beginPath();
 ctx.moveTo(x+8,y-137);ctx.lineTo(x+62,y-137);
 ctx.lineTo(x+130,y);ctx.lineTo(x-55,y);
 ctx.fill();
 ctx.restore();
}


/* =====================================================
   PFLANZE
===================================================== */

function drawPlant(x,y,w,h){
 shadow(x+w/2,y+2,w*.55,5,.15);

 // Topf
 ctx.beginPath();
 ctx.moveTo(x+7,y-30);
 ctx.lineTo(x+w-7,y-30);
 ctx.lineTo(x+w-12,y);
 ctx.lineTo(x+12,y);
 ctx.closePath();
 ctx.fillStyle=grad(x,y-30,w,30,"#c28b67","#75472f");
 ctx.fill();
 ctx.strokeStyle="#69432e";ctx.lineWidth=1;ctx.stroke();

 ctx.fillStyle="#d0a080";
 ctx.fillRect(x+7,y-30,w-14,4);
 ctx.fillStyle="#4e3929";
 ctx.fillRect(x+10,y-26,w-20,3);

 const leaves=[
  [.5,.9,-.2],[.35,.7,.5],[.65,.65,-.6],
  [.25,.5,.8],[.75,.45,-.1],[.48,.55,.2]
 ];

 for(const s of leaves){
  ctx.strokeStyle="#536b43";ctx.lineWidth=2;
  ctx.beginPath();ctx.moveTo(x+w/2,y-28);
  ctx.lineTo(x+w*s[0],y-s[1]*h);ctx.stroke();

  ctx.fillStyle=grad(x,y-h,w,h,"#91a66e","#405b37");
  ctx.beginPath();
  ctx.ellipse(x+w*s[0],y-s[1]*h,7,14,s[2],0,Math.PI*2);
  ctx.fill();
  ctx.strokeStyle="#b6c58a77";ctx.lineWidth=1;
  ctx.beginPath();
  ctx.moveTo(x+w*s[0],y-s[1]*h-9);
  ctx.lineTo(x+w*s[0],y-s[1]*h+9);ctx.stroke();
 }
}


/* =====================================================
   SPÜLE
===================================================== */

function drawSink(f){
 const x=f.x,y=f.y;

 wood(x,y-75,f.w,75,"#a17b58");
 ctx.fillStyle="#72543b";ctx.fillRect(x+8,y-68,f.w-16,59);

 ctx.strokeStyle="#c19a72";ctx.lineWidth=2;
 ctx.strokeRect(x+12,y-64,f.w/2-15,50);
 ctx.strokeRect(x+f.w/2+3,y-64,f.w/2-15,50);

 ctx.fillStyle="#d5c5ad";
 ctx.fillRect(x+f.w/2-3,y-45,5,5);
 ctx.fillRect(x+f.w-35,y-45,5,5);

 wood(x-5,y-83,f.w+10,10,"#72503a");

 // Becken
 ctx.fillStyle="#777f80";
 ctx.beginPath();ctx.roundRect(x+40,y-78,100,39,8);ctx.fill();
 ctx.fillStyle="#c4ccca";
 ctx.beginPath();ctx.roundRect(x+44,y-78,92,32,8);ctx.fill();
 ctx.fillStyle="#596365";
 ctx.beginPath();ctx.ellipse(x+90,y-60,35,12,0,0,Math.PI*2);ctx.fill();

 // Hahn
 ctx.save();
 ctx.translate(x+92,y-82);
 ctx.strokeStyle="#8e9998";ctx.lineWidth=8;ctx.lineCap="round";
 ctx.beginPath();
 ctx.moveTo(0,0);ctx.lineTo(0,-29);
 ctx.quadraticCurveTo(0,-43,14,-43);
 ctx.lineTo(35,-43);ctx.stroke();

 ctx.strokeStyle="#e2e8e5";ctx.lineWidth=2;
 ctx.beginPath();ctx.moveTo(3,-6);ctx.lineTo(3,-28);ctx.stroke();

 ctx.translate(0,-31);ctx.rotate(tapAngle);
 ctx.strokeStyle="#747f80";ctx.lineWidth=5;
 ctx.beginPath();ctx.moveTo(-11,0);ctx.lineTo(11,0);ctx.stroke();
 ctx.fillStyle="#c6cecb";ctx.beginPath();ctx.arc(0,0,4,0,Math.PI*2);ctx.fill();
 ctx.restore();

 if(waterOn){
  ctx.save();
  ctx.strokeStyle="#75c8e8";ctx.lineWidth=4;ctx.globalAlpha=.85;
  ctx.beginPath();ctx.moveTo(x+127,y-125);ctx.lineTo(x+127,y-80);ctx.stroke();
  ctx.restore();

  for(let i=0;i<9;i++){
   const phase=(time*190+i*13)%44;
   const yy=y-80+phase;
   const xx=x+127+Math.sin(time*8+i)*2;
   ctx.fillStyle="#8ed9f4";
   ctx.beginPath();ctx.ellipse(xx,yy,1.8,3.2,0,0,Math.PI*2);ctx.fill();
  }
  ctx.fillStyle="#9bdcf3";
  ctx.beginPath();ctx.ellipse(x+90,y-58,20,4,0,0,Math.PI*2);ctx.fill();
 }
}


function drawFurniture(){
 for(const f of furniture){
  if(f.type==="table")drawTable(f);
  if(f.type==="sofa")drawSofa(f);
  if(f.type==="shelf")drawShelf(f);
  if(f.type==="lamp")drawLamp(f);
  if(f.type==="plant")drawPlant(f.x,f.y,f.w,f.h);
  if(f.type==="sink")drawSink(f);
 }
}


/* =====================================================
   KLEIDERSCHRANK UND STADTTÜR
===================================================== */

function drawWardrobe(d){
 const x=d.x,y=FLOOR;

 shadow(x+65,y+3,75,7,.18);

 // Schrankkorpus
 wood(x,y-218,130,218,"#805333");
 wood(x+7,y-211,116,203,"#a4774e");

 // Innenfläche / zwei Türen
 const doorW=54;
 for(let i=0;i<2;i++){
  const dx=x+10+i*56;

  round(dx,y-204,doorW,190,2,
   grad(dx,y-204,doorW,190,"#c39768","#805333"),
   "#68472e");

  // Holzmaserung
  ctx.save();
  ctx.globalAlpha=.23;
  for(let j=0;j<5;j++){
   ctx.strokeStyle=j%2?"#59391f":"#f1d0a2";
   ctx.lineWidth=1;
   ctx.beginPath();
   ctx.moveTo(dx+8+j*9,y-194);
   ctx.bezierCurveTo(dx+5+j*9,y-145,dx+13+j*9,y-95,dx+8+j*9,y-25);
   ctx.stroke();
  }
  ctx.restore();

  // Türrahmen
  ctx.strokeStyle="#e0b98c";
  ctx.lineWidth=2;
  ctx.strokeRect(dx+5,y-198,doorW-10,178);

  // Griff
  ctx.fillStyle="#c6a36d";
  ctx.beginPath();
  ctx.roundRect(dx+(i===0?42:7),y-112,5,22,2);
  ctx.fill();

  ctx.fillStyle="#f0d5a0";
  ctx.fillRect(dx+(i===0?43:8),y-109,1,16);
 }

 // Sockel und Deckplatte
 wood(x-4,y-10,138,10,"#68452c");
 wood(x-3,y-222,136,8,"#bd9161");

 // Beschriftung
 ctx.fillStyle="#eee5d7";
 ctx.font="12px Arial";
 ctx.textAlign="center";
 ctx.fillText("KLEIDERSCHRANK",x+65,y-236);
 ctx.textAlign="left";
}

function drawExitDoor(d){
 const x=d.x,y=FLOOR;

 shadow(x+50,y+3,55,6,.18);

 // Türrahmen
 wood(x-5,y-198,110,198,"#68452f");
 ctx.fillStyle="#35291f";
 ctx.fillRect(x+5,y-190,90,190);

 // Türblatt
 ctx.fillStyle=grad(x+10,y-186,80,186,"#9c704b","#593a28");
 ctx.fillRect(x+10,y-186,80,186);

 // Türfüllungen
 ctx.strokeStyle="#c69b70";
 ctx.lineWidth=2;
 ctx.strokeRect(x+19,y-175,62,67);
 ctx.strokeRect(x+19,y-98,62,84);

 // Holzmaserung
 ctx.save();
 ctx.globalAlpha=.18;
 for(let i=0;i<5;i++){
  ctx.strokeStyle=i%2?"#3b281c":"#e2bd91";
  ctx.beginPath();
  ctx.moveTo(x+22+i*13,y-181);
  ctx.lineTo(x+22+i*13,y-8);
  ctx.stroke();
 }
 ctx.restore();

 // Klinke
 ctx.fillStyle="#d2b16f";
 ctx.beginPath();ctx.arc(x+75,y-92,4,0,Math.PI*2);ctx.fill();
 ctx.strokeStyle="#f2d89c";ctx.lineWidth=1;
 ctx.beginPath();ctx.arc(x+75,y-92,2,0,Math.PI*2);ctx.stroke();

 ctx.fillStyle="#eee5d7";
 ctx.font="12px Arial";
 ctx.textAlign="center";
 ctx.fillText("STADT",x+50,y-211);
 ctx.textAlign="left";
}

function drawDoor(d){
 if(d.type==="wardrobe")drawWardrobe(d);
 else drawExitDoor(d);
}


/* =====================================================
   GEGENSTÄNDE
===================================================== */

function drawBook(o){
 ctx.save();
 ctx.translate(o.x,o.y);

 // Buchblock
 round(0,1,o.w,o.h,2,o.color,"#42352c");
 ctx.fillStyle="#e8dfca";
 ctx.fillRect(4,2,o.w-8,o.h-3);

 // Buchrücken
 ctx.fillStyle="#ffffff33";
 ctx.fillRect(1,1,3,o.h-2);
 ctx.fillStyle="#30251e55";
 ctx.fillRect(o.w-4,2,2,o.h-3);

 // Papierkanten
 ctx.strokeStyle="#b6aa91";
 ctx.lineWidth=.5;
 for(let i=0;i<3;i++){
  ctx.beginPath();ctx.moveTo(5,3+i*2);ctx.lineTo(o.w-5,3+i*2);ctx.stroke();
 }
 ctx.restore();
}

function drawBox(o){
 ctx.save();
 ctx.translate(o.x,o.y);

 const g=grad(0,0,o.w,o.h,"#d8b78b","#99704a");
 ctx.fillStyle=g;ctx.fillRect(0,0,o.w,o.h);

 ctx.fillStyle="#c49a68";
 ctx.beginPath();ctx.moveTo(0,0);ctx.lineTo(o.w*.5,7);ctx.lineTo(o.w,0);ctx.closePath();ctx.fill();

 ctx.strokeStyle="#805b3b";ctx.lineWidth=1;
 ctx.strokeRect(.5,.5,o.w-1,o.h-1);
 ctx.beginPath();ctx.moveTo(o.w*.5,7);ctx.lineTo(o.w*.5,o.h);ctx.stroke();

 // Klebestreifen
 ctx.fillStyle="#e7d3a5";
 ctx.fillRect(o.w*.43,0,o.w*.14,o.h);
 ctx.fillStyle="#ffffff55";
 ctx.fillRect(o.w*.45,0,2,o.h);

 ctx.restore();
}

function drawPillow(o){
 ctx.save();
 ctx.shadowColor="#00000025";
 ctx.shadowBlur=4;
 round(o.x,o.y,o.w,o.h,9,grad(o.x,o.y,o.w,o.h,"#e2ddd2","#888d88"),"#777b75");
 ctx.shadowBlur=0;

 // Stofffalte und Naht
 ctx.strokeStyle="#ffffff88";ctx.lineWidth=1;
 ctx.beginPath();
 ctx.moveTo(o.x+8,o.y+5);
 ctx.quadraticCurveTo(o.x+o.w/2,o.y+o.h/2,o.x+o.w-8,o.y+5);
 ctx.stroke();

 ctx.strokeStyle="#62675f66";
 ctx.beginPath();
 ctx.moveTo(o.x+8,o.y+o.h-5);
 ctx.quadraticCurveTo(o.x+o.w/2,o.y+o.h-1,o.x+o.w-8,o.y+o.h-5);
 ctx.stroke();
 ctx.restore();
}

function drawObject(o){
 if(o.type==="book")drawBook(o);
 if(o.type==="box")drawBox(o);
 if(o.type==="pillow")drawPillow(o);
 if(o.type==="plant")drawPlant(o.x,o.y+o.h,o.w,o.h);
}


/* =====================================================
   STUHL – REALISTISCHER HOLZSTUHL
===================================================== */

function chairLeg(x,y,w,h,angle){
 ctx.save();
 ctx.translate(x,y);
 ctx.rotate(angle);

 ctx.beginPath();
 ctx.moveTo(-w/2,0);
 ctx.lineTo(w/2,0);
 ctx.lineTo(w*.42,h);
 ctx.lineTo(-w*.42,h);
 ctx.closePath();
 ctx.fillStyle=grad(-w/2,0,w,h,"#c18b5a","#68432a");
 ctx.fill();
 ctx.strokeStyle="#593820";ctx.lineWidth=1;ctx.stroke();

 ctx.strokeStyle="#e5bd8b88";ctx.lineWidth=1;
 ctx.beginPath();ctx.moveTo(-w/2+2,3);ctx.lineTo(-w*.42+2,h-3);ctx.stroke();

 ctx.restore();
}

function drawChair(){
 const moving=Math.abs(player.vx)>8&&player.grounded;
 const cycle=moving?Math.sin(player.walk):0;
 const bob=moving?Math.abs(cycle)*.6:0;
 const scale=.58;

 ctx.save();
 ctx.translate(player.x,player.y+player.height);
 ctx.scale(player.facing*scale,scale);
 ctx.translate(-42,-116+bob);

 // Hintere Rückenpfosten
 chairLeg(22,5,8,69,0);
 chairLeg(68,5,8,69,0);

 // Rückenlehne oben
 wood(19,0,52,42,"#a8794d");

 // Holzmaserung Rückenlehne
 ctx.save();
 ctx.globalAlpha=.28;
 for(let i=0;i<7;i++){
  ctx.strokeStyle=i%2?"#563820":"#f2c994";
  ctx.lineWidth=1;
  ctx.beginPath();
  ctx.moveTo(23,5+i*5);
  ctx.bezierCurveTo(35,3+i*5,52,8+i*5,67,5+i*5);
  ctx.stroke();
 }
 ctx.restore();

 // Untere Rückenstrebe
 wood(23,49,44,20,"#b08051");

 // Sitzfläche
 ctx.beginPath();
 ctx.moveTo(7,69);
 ctx.lineTo(82,69);
 ctx.lineTo(78,83);
 ctx.lineTo(11,83);
 ctx.closePath();
 ctx.fillStyle=grad(7,69,75,14,"#d5a06a","#87532f");
 ctx.fill();
 ctx.strokeStyle="#57371f";ctx.lineWidth=1;ctx.stroke();

 // Sitzkante
 ctx.strokeStyle="#edc18c";
 ctx.lineWidth=1.5;
 ctx.beginPath();ctx.moveTo(10,71);ctx.lineTo(79,71);ctx.stroke();

 // Zwei sichtbare Vorder-/Seitenbeine in Seitenansicht
 chairLeg(16,82,9,42,cycle*.12);
 chairLeg(72,82,9,42,-cycle*.12);

 // Verbindung zwischen den Beinen
 wood(17,99,54,4,"#85512f");

 // Tragegegenstand liegt auf der Sitzfläche
 if(player.held){
  const o=player.held;
  ctx.save();
  ctx.translate(44,58);
  if(o.type==="book")drawBook({...o,x:-o.w/2,y:-o.h/2});
  if(o.type==="box")drawBox({...o,x:-o.w/2,y:-o.h/2});
  if(o.type==="pillow")drawPillow({...o,x:-o.w/2,y:-o.h/2});
  if(o.type==="plant")drawPlant(-o.w/2,-o.h/2+o.h,o.w,o.h);
  ctx.restore();
 }

 ctx.restore();
}


/* =====================================================
   BODENSCHATTEN
===================================================== */

function drawPlayerShadow(){
 const heightAboveFloor=Math.max(0,FLOOR-(player.y+player.height));
 const shadowWidth=clamp(30-heightAboveFloor*.10,12,30);
 const shadowAlpha=clamp(.27-heightAboveFloor*.002,.07,.27);

 ctx.fillStyle="rgba(0,0,0,"+shadowAlpha+")";
 ctx.beginPath();
 ctx.ellipse(player.x,FLOOR+2,shadowWidth,4,0,0,Math.PI*2);
 ctx.fill();
}


/* =====================================================
   INTERAKTIONEN
===================================================== */

function nearestObject(){
 let best=null,dist=90;
 for(const o of objects){
  const d=Math.hypot(
   o.x+o.w/2-player.x,
   o.y+o.h/2-(player.y+player.height/2)
  );
  if(d<dist){dist=d;best=o}
 }
 return best;
}

function nearestDoor(){
 let best=null,dist=110;
 for(const d of doors){
  const center=d.x+d.w/2;
  const dx=Math.abs(center-player.x);
  if(dx<dist){dist=dx;best=d}
 }
 return best;
}

function nearSink(){
 const s=furniture.find(f=>f.type==="sink");
 return Math.abs(player.x-(s.x+s.w/2))<125;
}

function jump(){
 if(player.grounded){
  player.vy=-465;
  player.grounded=false;
 }
}

function dropItem(){
 if(!player.held)return;

 const o=player.held;
 o.x=player.x-o.w/2+player.facing*38;
 o.y=player.y+player.height-o.h;
 o.vx=player.facing*65;
 o.vy=-65;
 objects.push(o);
 player.held=null;
}

function interact(){
 const door=nearestDoor();

 if(door&&Math.abs(player.x-(door.x+door.w/2))<110){
  location.href=door.url;
  return;
 }

 if(nearSink()){
  waterOn=!waterOn;
  tapTarget=waterOn?-.65:.15;
  return;
 }

 if(player.held){
  dropItem();
  return;
 }

 const o=nearestObject();
 if(!o)return;

 player.held=o;
 objects.splice(objects.indexOf(o),1);
 player.vx*=.5;
}


/* =====================================================
   UPDATE
===================================================== */

function update(dt){
 time+=dt;

 const left=keys.a||keys.arrowleft;
 const right=keys.d||keys.arrowright;
 const dir=(right?1:0)-(left?1:0);

 if(dir){
  player.facing=dir;
  player.vx+=dir*1250*dt;
 }else{
  player.vx*=Math.pow(.0007,dt);
 }

 player.vx=clamp(player.vx,-205,205);
 player.x=clamp(player.x+player.vx*dt,35,WORLD-35);

 // Schwerkraft
 player.vy+=1350*dt;
 player.y+=player.vy*dt;

 if(player.y+player.height>=FLOOR){
  player.y=FLOOR-player.height;
  player.vy=0;
  player.grounded=true;
 }else{
  player.grounded=false;
 }

 if(Math.abs(player.vx)>8&&player.grounded)player.walk+=dt*10;

 // Gegenstände mit Gravitation
 for(const o of objects){
  o.vx=(o.vx||0)*Math.pow(.08,dt);
  o.vy=(o.vy||0)+1150*dt;
  o.x+=o.vx*dt;
  o.y+=o.vy*dt;

  if(o.y+o.h>FLOOR){
   o.y=FLOOR-o.h;
   o.vy=0;
  }
  o.x=clamp(o.x,0,WORLD-o.w);
 }

 tapAngle=lerp(tapAngle,tapTarget,1-Math.pow(.0001,dt));

 const target=clamp(player.x-W*.42,0,WORLD-W);
 cameraX=lerp(cameraX,target,1-Math.pow(.0005,dt));

 // Interaktionshinweise
 const door=nearestDoor();
 const item=nearestObject();

 if(door&&Math.abs(player.x-(door.x+door.w/2))<110){
  prompt.style.display="block";
  prompt.textContent="E drücken · "+door.label+" öffnen";
 }else if(nearSink()){
  prompt.style.display="block";
  prompt.textContent="E drücken · Wasser "+(waterOn?"ausschalten":"anmachen");
 }else if(player.held){
  prompt.style.display="block";
  prompt.textContent="E oder Q drücken · Gegenstand ablegen";
 }else if(item){
  prompt.style.display="block";
  prompt.textContent="E drücken · "+item.id+" aufheben";
 }else{
  prompt.style.display="none";
 }

 statusText.textContent=waterOn?"Wasser läuft":"Ein gemütlicher Tag im Zimmer";
 heldText.textContent=player.held?"Trägt: "+player.held.id:"Hände frei";
}


/* =====================================================
   ZEICHNEN
===================================================== */

function draw(){
 ctx.setTransform(sx,0,0,sy,0,0);
 ctx.clearRect(0,0,W,H);

 ctx.save();
 ctx.translate(-cameraX,0);

 drawRoom();
 drawFurniture();

 for(const d of doors)drawDoor(d);
 for(const o of objects)drawObject(o);

 drawPlayerShadow();
 drawChair();

 ctx.restore();
}


/* =====================================================
   SPIELSCHLEIFE
===================================================== */

function loop(now){
 const dt=Math.min((now-last)/1000||0,.033);
 last=now;
 update(dt);
 draw();
 requestAnimationFrame(loop);
}

requestAnimationFrame(loop);
</script>
</body>
</html>
