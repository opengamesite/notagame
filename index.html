
<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mein Zimmer</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;font-family:Arial,sans-serif;background:#d8c9b5}
canvas{display:block;width:100%;height:100%}
#hud{position:fixed;top:18px;left:18px;display:flex;gap:10px;align-items:center;z-index:5}
.pill,.ui-button{border:1px solid #ffffff80;background:#fffaf0e8;color:#554638;padding:12px 17px;border-radius:15px;font-weight:bold;box-shadow:0 4px 15px #46301e20}
.ui-button{cursor:pointer}
#controls{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:#fffaf0e8;color:#594b3c;padding:12px 18px;border-radius:14px;font-size:13px;white-space:nowrap;box-shadow:0 4px 15px #46301e20}
#panel{position:fixed;right:18px;top:18px;bottom:18px;width:min(340px,calc(100vw - 36px));z-index:10;background:#fffaf4;border-radius:22px;padding:22px;box-shadow:0 12px 45px #35231540;overflow:auto;color:#514337}
#panel.hidden{display:none}
#panel h2{margin:8px 0 18px}
#closePanel{float:right;border:0;background:#eee2d5;border-radius:10px;padding:8px 12px;cursor:pointer;font-size:18px}
.panel-card{background:#f2e8dc;border-radius:14px;padding:14px;margin:10px 0}
.panel-card button{margin-top:8px}
.small{font-size:12px;color:#8b7967}
@media(max-width:600px){#controls{font-size:10px;padding:10px 12px;bottom:10px}.pill,.ui-button{padding:10px;font-size:12px}}
</style>
</head>
<body>

<canvas id="world"></canvas>

<div id="hud">
  <div class="pill">🪙 <span id="money">120</span></div>
  <button class="ui-button" id="soundButton">♫</button>
  <button class="ui-button" id="wardrobeButton">👕 Schrank</button>
  <button class="ui-button" id="cityButton">🌆 Stadt</button>
</div>

<div id="controls">
  A / D Bewegen · LEERTASTE Springen · E Aufheben / Interagieren · Q Ablegen
</div>

<aside id="panel" class="hidden">
  <button id="closePanel">✕</button>
  <div class="small" id="panelEyebrow">MEIN ZIMMER</div>
  <h2 id="panelTitle">Schrank</h2>
  <div id="panelContent"></div>
</aside>

<script>
"use strict";

(() => {
const canvas = document.getElementById("world");
const ctx = canvas.getContext("2d");

const $ = id => document.getElementById(id);
const W = 960, H = 540;

let dpr = 1;
let lastTime = 0;
let money = 120;
let soundOn = true;
let panelOpen = false;
let keys = {};
let cameraX = 0;
let worldWidth = 1800;
let carried = null;
let selectedCosmetic = "wood";
let notice = "";
let noticeTime = 0;

const player = {
  x: 180, y: 0, vx: 0, vy: 0,
  width: 48, height: 76,
  grounded: false,
  facing: 1,
  walk: 0,
  jump: 0,
  blink: 0,
  emotion: 0
};

const floorY = 435;

const objects = [
  {id:"book",name:"Buch",x:410,y:0,w:35,h:12,color:"#d56d54",weight:1},
  {id:"plant",name:"Pflanze",x:600,y:0,w:38,h:55,color:"#6e9b69",weight:2},
  {id:"ball",name:"Ball",x:760,y:0,w:28,h:28,color:"#e6a74f",weight:1},
  {id:"box",name:"Geschenkbox",x:1000,y:0,w:40,h:35,color:"#d78d9b",weight:2},
  {id:"lamp",name:"Lampe",x:1280,y:0,w:28,h:60,color:"#e9c875",weight:2}
];

objects.forEach(o => {
  o.y = floorY - o.h;
  o.vy = 0;
  o.grounded = true;
});

function resize(){
  dpr = Math.min(window.devicePixelRatio || 1, 2);
  canvas.width = Math.round(innerWidth * dpr);
  canvas.height = Math.round(innerHeight * dpr);
}
window.addEventListener("resize", resize);
resize();

function scale(){
  return Math.min(canvas.width / W, canvas.height / H);
}

function save(){
  try{
    localStorage.setItem("mein-zimmer-save-v2", JSON.stringify({
      money, selectedCosmetic,
      objects: objects.map(o => ({
        id:o.id,x:o.x,y:o.y
      }))
    }));
  }catch(e){}
}

function load(){
  try{
    const data = JSON.parse(localStorage.getItem("mein-zimmer-save-v2"));
    if(!data) return;
    money = Number.isFinite(data.money) ? data.money : 120;
    selectedCosmetic = data.selectedCosmetic || "wood";
    if(Array.isArray(data.objects)){
      data.objects.forEach(saved => {
        const o = objects.find(x => x.id === saved.id);
        if(o && Number.isFinite(saved.x) && Number.isFinite(saved.y)){
          o.x = saved.x;
          o.y = saved.y;
        }
      });
    }
  }catch(e){}
  $("money").textContent = money;
}
load();

function showNotice(text){
  notice = text;
  noticeTime = 2.2;
}

function openPanel(title, eyebrow, html){
  panelOpen = true;
  $("panel").classList.remove("hidden");
  $("panelTitle").textContent = title;
  $("panelEyebrow").textContent = eyebrow;
  $("panelContent").innerHTML = html;
}

function closePanel(){
  panelOpen = false;
  $("panel").classList.add("hidden");
}

$("closePanel").addEventListener("click", closePanel);

$("wardrobeButton").addEventListener("click", () => {
  openPanel("Dein Stuhl", "KLEIDERSCHRANK", `
    <p>Verändere das Aussehen deiner Spielfigur.</p>
    <div class="panel-card">
      <strong>🪵 Natürliches Holz</strong><br>
      <button class="ui-button" data-cosmetic="wood">Auswählen</button>
    </div>
    <div class="panel-card">
      <strong>🌸 Rosa Lack</strong><br>
      <button class="ui-button" data-cosmetic="pink">Auswählen · 20 Münzen</button>
    </div>
    <div class="panel-card">
      <strong>🌿 Grüner Lack</strong><br>
      <button class="ui-button" data-cosmetic="green">Auswählen · 20 Münzen</button>
    </div>
    <p class="small">Dein Aussehen wird gespeichert.</p>
  `);
});

$("panelContent").addEventListener("click", e => {
  const button = e.target.closest("[data-cosmetic]");
  if(!button) return;
  const type = button.dataset.cosmetic;
  if(type !== selectedCosmetic && type !== "wood"){
    if(money < 20){
      showNotice("Du brauchst 20 Münzen!");
      return;
    }
    money -= 20;
  }
  selectedCosmetic = type;
  $("money").textContent = money;
  save();
  showNotice("Aussehen geändert!");
  closePanel();
});

$("cityButton").addEventListener("click", () => {
  openPanel("Die Stadt", "AUSFLUG", `
    <p>Dein nächstes Abenteuer wartet!</p>
    <div class="panel-card">
      <strong>🌆 Stadt besuchen</strong>
      <p class="small">Die Stadt bekommt eine eigene Welt.</p>
      <button class="ui-button" onclick="location.href='stadt.html'">Stadt öffnen</button>
    </div>
    <div class="panel-card">
      <strong>🏠 Zuhause</strong>
      <p class="small">Du befindest dich gerade in deinem Zimmer.</p>
    </div>
  `);
});

$("soundButton").addEventListener("click", () => {
  soundOn = !soundOn;
  $("soundButton").textContent = soundOn ? "♫" : "♪";
});

function roundedRect(x,y,w,h,r,color){
  ctx.fillStyle = color;
  ctx.beginPath();
  ctx.roundRect(x,y,w,h,r);
  ctx.fill();
}

function drawRoom(){
  // Wand
  const wall = ctx.createLinearGradient(0,0,0,floorY);
  wall.addColorStop(0,"#eadcc9");
  wall.addColorStop(1,"#d7c2a9");
  ctx.fillStyle = wall;
  ctx.fillRect(0,0,worldWidth,floorY);

  // Wanddetails
  ctx.fillStyle = "#c8ad91";
  ctx.fillRect(0,90,worldWidth,3);
  ctx.fillRect(0,350,worldWidth,3);

  // Fenster
  for(let x=120;x<worldWidth;x+=650){
    roundedRect(x,65,150,170,8,"#987d65");
    roundedRect(x+7,72,136,156,4,"#b9d5dd");
    ctx.fillStyle="#e8f0e8";
    ctx.fillRect(x+72,72,5,156);
    ctx.fillRect(x+7,147,136,5);
    ctx.fillStyle="#fff4d6";
    ctx.globalAlpha=.22;
    ctx.beginPath();
    ctx.moveTo(x+7,72);
    ctx.lineTo(x+145,72);
    ctx.lineTo(x+145,228);
    ctx.closePath();
    ctx.fill();
    ctx.globalAlpha=1;
  }

  // Boden
  const floor = ctx.createLinearGradient(0,floorY,0,H);
  floor.addColorStop(0,"#bd916a");
  floor.addColorStop(1,"#916748");
  ctx.fillStyle=floor;
  ctx.fillRect(0,floorY,worldWidth,H-floorY);

  // Holzplanken
  for(let x=0;x<worldWidth;x+=95){
    ctx.strokeStyle="#805a3e55";
    ctx.lineWidth=2;
    ctx.beginPath();
    ctx.moveTo(x,floorY);
    ctx.lineTo(x,H);
    ctx.stroke();
    ctx.beginPath();
    ctx.moveTo(x,floorY+45);
    ctx.lineTo(x+95,floorY+45);
    ctx.stroke();
  }

  // Teppich
  roundedRect(290,390,440,110,18,"#b96e5d");
  roundedRect(300,400,420,90,13,"#d59a7d");
  ctx.strokeStyle="#f0c6a4";
  ctx.lineWidth=3;
  ctx.strokeRect(315,414,390,62);

  // Sockelleiste
  ctx.fillStyle="#f0dfc9";
  ctx.fillRect(0,350,worldWidth,10);
}

function drawFurniture(){
  // Sofa
  ctx.fillStyle="#75574c";
  ctx.beginPath();
  ctx.ellipse(880,420,100,13,0,0,Math.PI*2);
  ctx.fill();
  roundedRect(790,300,180,110,20,"#8b6558");
  roundedRect(805,275,150,75,18,"#a77d6e");
  roundedRect(795,350,170,45,12,"#bb9180");
  ctx.fillStyle="#6c4d42";
  ctx.fillRect(810,400,10,25);
  ctx.fillRect(945,400,10,25);

  // Regal
  roundedRect(1450,155,170,200,7,"#956d4c");
  ctx.fillStyle="#c59a70";
  ctx.fillRect(1460,215,150,8);
  ctx.fillRect(1460,285,150,8);
  ctx.fillStyle="#e0b47e";
  ctx.fillRect(1470,165,25,48);
  ctx.fillRect(1505,170,40,43);
  ctx.fillStyle="#d18c75";
  ctx.fillRect(1475,230,38,52);
  ctx.fillStyle="#78916d";
  ctx.fillRect(1530,235,55,47);
}

function drawObject(o){
  ctx.save();
  ctx.translate(o.x,o.y);

  // Schatten
  ctx.fillStyle="#38291f30";
  ctx.beginPath();
  ctx.ellipse(o.w/2,o.h+4,o.w*.7,5,0,0,Math.PI*2);
  ctx.fill();

  if(o.id==="book"){
    roundedRect(0,3,o.w,o.h-3,3,o.color);
    ctx.fillStyle="#f4e5c7";
    ctx.fillRect(5,4,3,o.h-5);
  }else if(o.id==="plant"){
    roundedRect(5,25,28,30,5,"#bd8060");
    ctx.strokeStyle="#557d4d";
    ctx.lineWidth=5;
    ctx.beginPath();
    ctx.moveTo(19,30);
    ctx.lineTo(19,7);
    ctx.stroke();
    ctx.fillStyle="#6f9c64";
    ctx.beginPath();
    ctx.ellipse(9,13,11,6,-.5,0,Math.PI*2);
    ctx.ellipse(28,9,11,6,.5,0,Math.PI*2);
    ctx.fill();
  }else if(o.id==="ball"){
    ctx.fillStyle=o.color;
    ctx.beginPath();
    ctx.arc(14,14,14,0,Math.PI*2);
    ctx.fill();
    ctx.strokeStyle="#fff8";
    ctx.lineWidth=2;
    ctx.beginPath();
    ctx.arc(14,14,8,-1,1);
    ctx.stroke();
  }else if(o.id==="box"){
    roundedRect(0,5,o.w,o.h-5,4,o.color);
    ctx.fillStyle="#f5d5a2";
    ctx.fillRect(o.w/2-3,5,6,o.h-5);
    ctx.fillRect(0,15,o.w,5);
  }else if(o.id==="lamp"){
    ctx.fillStyle="#80664e";
    ctx.fillRect(12,22,4,38);
    ctx.fillStyle="#e8c77d";
    ctx.beginPath();
    ctx.moveTo(0,25);
    ctx.lineTo(7,0);
    ctx.lineTo(23,0);
    ctx.lineTo(28,25);
    ctx.closePath();
    ctx.fill();
    ctx.fillStyle="#f9e5a5";
    ctx.beginPath();
    ctx.arc(14,29,5,0,Math.PI*2);
    ctx.fill();
  }
  ctx.restore();
}

function drawChair(){
  const x=player.x-cameraX;
  const y=player.y;
  const bob = player.grounded ? Math.abs(Math.sin(player.walk))*2 : 0;
  const tilt = player.grounded ? Math.sin(player.walk)*.035 : -.08;

  ctx.save();
  ctx.translate(x+24,y+player.height-bob);
  ctx.scale(player.facing,1);
  ctx.rotate(tilt);

  // Bodenschatten
  ctx.fillStyle="#30231d35";
  ctx.beginPath();
  ctx.ellipse(0,2,30,7,0,0,Math.PI*2);
  ctx.fill();

  const wood = selectedCosmetic==="pink" ? "#d68e9e" :
               selectedCosmetic==="green" ? "#739879" : "#b78354";
  const dark = selectedCosmetic==="pink" ? "#a75f75" :
               selectedCosmetic==="green" ? "#486e53" : "#805433";
  const light = selectedCosmetic==="pink" ? "#efb9c5" :
                selectedCosmetic==="green" ? "#a7c39b" : "#d9ad7b";

  // Hinterbeine
  ctx.strokeStyle=dark;
  ctx.lineWidth=7;
  ctx.lineCap="round";
  ctx.beginPath();
  ctx.moveTo(-15,-25);ctx.lineTo(-17,-2);
  ctx.moveTo(15,-25);ctx.lineTo(17,-2);
  ctx.stroke();

  // Sitzfläche
  roundedRect(-25,-42,50,14,7,dark);
  roundedRect(-24,-45,48,12,6,wood);

  // Rückenlehne
  roundedRect(-20,-82,40,39,9,dark);
  roundedRect(-17,-80,34,35,8,wood);

  // Rückenlehnen-Details
  ctx.strokeStyle=light;
  ctx.lineWidth=3;
  ctx.beginPath();
  ctx.moveTo(-9,-74);ctx.lineTo(-9,-51);
  ctx.moveTo(9,-74);ctx.lineTo(9,-51);
  ctx.stroke();

  // Vorderbeine
  ctx.strokeStyle=dark;
  ctx.lineWidth=7;
  ctx.beginPath();
  ctx.moveTo(-19,-32);ctx.lineTo(-21,-2);
  ctx.moveTo(19,-32);ctx.lineTo(21,-2);
  ctx.stroke();

  // Kleine Füße
  ctx.strokeStyle=wood;
  ctx.lineWidth=9;
  ctx.beginPath();
  ctx.moveTo(-25,-2);ctx.lineTo(-15,-2);
  ctx.moveTo(15,-2);ctx.lineTo(25,-2);
  ctx.stroke();

  // Arme
  const armMove = player.grounded ? Math.sin(player.walk)*5 : -7;
  ctx.strokeStyle=dark;
  ctx.lineWidth=6;
  ctx.beginPath();
  ctx.moveTo(-23,-48);ctx.lineTo(-31,-38+armMove);
  ctx.moveTo(23,-48);ctx.lineTo(31,-38-armMove);
  ctx.stroke();

  // Augen
  ctx.fillStyle="#fffaf0";
  ctx.beginPath();
  ctx.ellipse(-8,-62,6,8,0,0,Math.PI*2);
  ctx.ellipse(8,-62,6,8,0,0,Math.PI*2);
  ctx.fill();

  ctx.fillStyle="#352a24";
  ctx.beginPath();
  ctx.arc(-7,-62,2.8,0,Math.PI*2);
  ctx.arc(9,-62,2.8,0,Math.PI*2);
  ctx.fill();

  // Mund
  ctx.strokeStyle="#674338";
  ctx.lineWidth=2;
  ctx.beginPath();
  ctx.arc(0,-51,5,.2,Math.PI-.2);
  ctx.stroke();

  // Kleine Glanzpunkte
  ctx.fillStyle="#fff";
  ctx.beginPath();
  ctx.arc(-8,-65,1.5,0,Math.PI*2);
  ctx.arc(8,-65,1.5,0,Math.PI*2);
  ctx.fill();

  // Getragener Gegenstand
  if(carried){
    ctx.save();
    ctx.translate(35,-42);
    ctx.scale(.7,.7);
    drawObject({ ...carried, x:0,y:0 });
    ctx.restore();
  }

  ctx.restore();
}

function nearestObject(){
  let best=null, distance=Infinity;
  for(const o of objects){
    if(o===carried) continue;
    const d=Math.abs((o.x+o.w/2)-(player.x+24));
    if(d<distance && d<85){
      distance=d;
      best=o;
    }
  }
  return best;
}

function pickup(){
  if(carried){
    carried.x=player.x+player.width/2+player.facing*40-carried.w/2;
    carried.y=floorY-carried.h;
    carried.vy=0;
    carried.grounded=true;
    objects.push(carried);
    carried=null;
    showNotice("Gegenstand abgestellt!");
    save();
    return;
  }
  const o=nearestObject();
  if(!o){
    showNotice("Hier ist nichts zum Aufheben.");
    return;
  }
  carried=o;
  objects.splice(objects.indexOf(o),1);
  showNotice(o.name+" aufgehoben!");
  save();
}

function interact(){
  if(panelOpen) return;
  const o=nearestObject();
  if(o){
    pickup();
    return;
  }
  showNotice("Schau dich ein bisschen um!");
}

function update(dt){
  if(panelOpen) return;

  const speed=190;
  let move=0;
  if(keys.KeyA || keys.ArrowLeft) move--;
  if(keys.KeyD || keys.ArrowRight) move++;

  player.vx=move*speed;
  if(move!==0){
    player.facing=move;
    player.walk+=dt*10;
  }else{
    player.walk+=dt*2;
  }

  player.x+=player.vx*dt;
  player.x=Math.max(0,Math.min(worldWidth-player.width,player.x));

  if(keys.Space && player.grounded){
    player.vy=-480;
    player.grounded=false;
    player.jump=1;
  }

  player.vy+=1100*dt;
  player.y+=player.vy*dt;

  if(player.y+player.height>=floorY){
    player.y=floorY-player.height;
    player.vy=0;
    player.grounded=true;
  }

  // Schwerkraft für Gegenstände
  for(const o of objects){
    if(o.grounded) continue;
    o.vy+=1000*dt;
    o.y+=o.vy*dt;
    if(o.y+o.h>=floorY){
      o.y=floorY-o.h;
      o.vy=0;
      o.grounded=true;
    }
  }

  cameraX=Math.max(0,Math.min(worldWidth-W,player.x-W/2));
  if(noticeTime>0) noticeTime-=dt;
}

function draw(){
  ctx.setTransform(1,0,0,1,0,0);
  ctx.clearRect(0,0,canvas.width,canvas.height);

  const s=scale();
  const ox=(canvas.width-W*s)/2;
  const oy=(canvas.height-H*s)/2;
  ctx.setTransform(s,0,0,s,ox,oy);

  ctx.save();
  ctx.translate(-cameraX,0);

  drawRoom();
  drawFurniture();

  for(const o of objects) drawObject(o);

  drawChair();
  ctx.restore();

  // Interaktionshinweis
  if(!panelOpen && nearestObject() && !carried){
    roundedRect(410,350,140,30,10,"#fffaf0e8");
    ctx.fillStyle="#554638";
    ctx.font="bold 13px Arial";
    ctx.textAlign="center";
    ctx.fillText("E  Aufheben",480,370);
  }

  if(carried){
    roundedRect(410,350,140,30,10,"#fffaf0e8");
    ctx.fillStyle="#554638";
    ctx.font="bold 13px Arial";
    ctx.textAlign="center";
    ctx.fillText("Q  Ablegen",480,370);
  }

  if(noticeTime>0){
    ctx.globalAlpha=Math.min(1,noticeTime);
    roundedRect(330,35,300,42,13,"#fffaf0ed");
    ctx.fillStyle="#554638";
    ctx.font="bold 15px Arial";
    ctx.textAlign="center";
    ctx.fillText(notice,480,61);
    ctx.globalAlpha=1;
  }
}

function loop(time){
  const dt=Math.min((time-lastTime)/1000 || 0,0.033);
  lastTime=time;
  update(dt);
  draw();
  requestAnimationFrame(loop);
}

window.addEventListener("keydown",e=>{
  if(["Space","ArrowLeft","ArrowRight"].includes(e.code)) e.preventDefault();
  if(keys[e.code]) return;
  keys[e.code]=true;

  if(e.code==="KeyE") interact();
  if(e.code==="KeyQ" && carried) pickup();
  if(e.code==="Escape") closePanel();
});

window.addEventListener("keyup",e=>{
  keys[e.code]=false;
});

window.addEventListener("blur",()=>{
  keys={};
});

requestAnimationFrame(loop);
})();
</script>
</body>
</html>
