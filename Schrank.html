.right{

function cloneDefaults(){
 return JSON.parse(JSON.stringify(defaults));
}

function loadSave(){
 try{
  const s=JSON.parse(localStorage.getItem(STORAGE_KEY)||"null");
  if(!s)return cloneDefaults();

  return {
   ...cloneDefaults(),
   ...s,
   equipped:{...defaults.equipped,...(s.equipped||{})},
   unlocked:Array.isArray(s.unlocked)?s.unlocked:[]
  };
 }catch{

function hash(n){
 const v=Math.sin(n*127.1+311.7)*43758.5453;
 return v-Math.floor(v);
}

function line(x1,y1,x2,y2,color,width=1){
 ctx.strokeStyle=color;
 ctx.lineWidth=width;
 ctx.lineCap="round";
 ctx.beginPath();
 ctx.moveTo(x1,y1);
 ctx.lineTo(x2,y2);
 ctx.stroke();
}

function ellipse(x,y,rx,ry,color){
 ctx.fillStyle=color;
 ctx.beginPath();
 ctx.ellipse(x,y,rx,ry,0,0,Math.PI*2);
 ctx.fill();
}

function woodGradient(x,y,w,h){
 const g=ctx.createLinearGradient(x,y,x+w,y+h);
 g.addColorStop(0,"#d4a16b");
 g.addColorStop(.45,"#b98552");
 g.addColorStop(1,"#75482b");
 return g;
}

function woodPart(x,y,w,h,r=1){
 ctx.save();
 ctx.fillStyle="#35271d33";
 ctx.fillRect(x+2,y+2,w,h);

 ctx.beginPath();
 ctx.roundRect(x,y,w,h,r);
 ctx.fillStyle=woodGradient(x,y,w,h);
 ctx.fill();
 ctx.strokeStyle="#604027";
 ctx.lineWidth=1.1;
 ctx.stroke();

 ctx.save();
 ctx.beginPath();
 ctx.roundRect(x+1,y+1,w-2,h-2,r);
 ctx.clip();

 for(let i=0;i<Math.max(3,Math.floor(h/3));i++){
  const yy=y+hash(i+x*.7)*h;
  ctx.beginPath();
  ctx.moveTo(x+2,yy);
  ctx.bezierCurveTo(x+w*.3,yy-1,x+w*.7,yy+1,x+w-2,yy);
  ctx.strokeStyle=i%2?"#513820":"#f5d7ae";
  ctx.globalAlpha=i%2?.12:.18;
  ctx.lineWidth=.7;
  ctx.stroke();
 }
 ctx.restore();

 ctx.globalAlpha=1;
 ctx.strokeStyle="#f1c18b99";
 ctx.lineWidth=.8;
 ctx.beginPath();
 ctx.moveTo(x+2,y+1);
 ctx.lineTo(x+w-2,y+1);
 ctx.stroke();
 ctx.restore();
}

function drawLeg(x,y,angle){
 ctx.save();
 ctx.translate(x,y);
 ctx.rotate(angle);

 ctx.beginPath();
 ctx.moveTo(-3,0);
 ctx.lineTo(-2.5,39);
 ctx.quadraticCurveTo(0,42,2.5,39);
 ctx.lineTo(3,0);
 ctx.closePath();

 ctx.fillStyle=woodGradient(-3,0,7,42);
 ctx.fill();
 ctx.strokeStyle="#634127";
 ctx.lineWidth=1;
 ctx.stroke();

 ctx.strokeStyle="#f1c28b88";
 ctx.lineWidth=.8;
 ctx.beginPath();
 ctx.moveTo(-1.5,3);
 ctx.lineTo(-1,36);
 ctx.stroke();
 ctx.restore();
}

function fabric(x,y,w,h,color){
 ctx.save();
 ctx.beginPath();
 ctx.roundRect(x,y,w,h,2);
 ctx.fillStyle=color;
 ctx.fill();
 ctx.strokeStyle="#45382d";
 ctx.lineWidth=.8;
 ctx.stroke();

 ctx.save();
 ctx.beginPath();
 ctx.roundRect(x+1,y+1,w-2,h-2,2);
 ctx.clip();

 for(let i=0;i<Math.floor(w*h/15);i++){
  const px=x+hash(i+17)*w;
  const py=y+hash(i+900)*h;
  ctx.fillStyle=i%2?"#ffffff":"#26302c";
  ctx.globalAlpha=.12;
  ctx.fillRect(px,py,2,1);
 }
 ctx.restore();
 ctx.globalAlpha=1;
 ctx.restore();
}

const balloonColors={
 balloon_red:"#e34d4d",
 balloon_blue:"#438bd1",
 balloon_yellow:"#efc84b",
 balloon_pink:"#ed83ad",
 balloon_green:"#55a96c",
 balloon_purple:"#9871cf",
 balloon_party:"#e65c64",
 balloon_heart:"#e85b85",
 balloon_star:"#e8bd48"
};

function balloonShape(id,x,y,scale){
 ctx.save();
 ctx.translate(x,y);
 ctx.scale(scale,scale);

 const color=balloonColors[id]||"#e34d4d";

 if(id==="balloon_heart"){
  ctx.fillStyle=color;
  ctx.beginPath();
  ctx.moveTo(0,13);
  ctx.bezierCurveTo(-25,-2,-17,-19,-5,-15);
  ctx.bezierCurveTo(0,-13,0,-8,0,-8);
  ctx.bezierCurveTo(0,-8,8,-20,18,-13);
  ctx.bezierCurveTo(32,-3,15,9,0,13);
  ctx.fill();
  ctx.strokeStyle="#a83d61";
  ctx.lineWidth=1;
  ctx.stroke();
 }
 else if(id==="balloon_star"){
  ctx.fillStyle=color;
  ctx.beginPath();
  for(let i=0;i<10;i++){
   const a=-Math.PI/2+i*Math.PI/5;
   const r=i%2?10:20;
   const px=Math.cos(a)*r;
   const py=Math.sin(a)*r;
   if(i===0)ctx.moveTo(px,py);
   else ctx.lineTo(px,py);
  }
  ctx.closePath();
  ctx.fill();
  ctx.strokeStyle="#a17b2d";
  ctx.stroke();
 }
 else{
  ctx.beginPath();
  ctx.ellipse(0,0,13,18,0,0,Math.PI*2);
  const g=ctx.createRadialGradient(-5,-7,1,0,0,20);
  g.addColorStop(0,"#ffffffcc");
  g.addColorStop(.22,color);
  g.addColorStop(1,color);
  ctx.fillStyle=g;
  ctx.fill();
  ctx.strokeStyle="#7a4b4b66";
  ctx.lineWidth=.8;
  ctx.stroke();

  ctx.beginPath();
  ctx.ellipse(-5,-7,2.5,5,-.4,0,Math.PI*2);
  ctx.fillStyle="#ffffff99";
  ctx.fill();
 }

 ctx.beginPath();
 ctx.moveTo(-2,16);
 ctx.lineTo(2,16);
 ctx.lineTo(0,20);
 ctx.closePath();
 ctx.fillStyle=color;
 ctx.fill();

 ctx.restore();
}

function drawBalloonString(startX,startY,endX,endY,phase){
 ctx.save();
 ctx.strokeStyle="#766b60";
 ctx.lineWidth=.8;
 ctx.globalAlpha=.9;
 ctx.beginPath();
 ctx.moveTo(startX,startY);
 const sway=Math.sin(phase)*5;
 ctx.bezierCurveTo(
  startX-10+sway,startY-17,
  endX+12-sway,endY+20,
  endX,endY
 );
 ctx.stroke();
 ctx.restore();
}

function drawBalloons(time){
 const id=save.equipped.face;
 if(!id||!id.startsWith("balloon_"))return;

 const t=time/1000;

 if(id==="balloon_party"){
  const balloons=[
   {x:5,y:-56,phase:0,scale:.85,id:"balloon_pink"},
   {x:35,y:-76,phase:2.1,scale:1,id:"balloon_blue"},
   {x:65,y:-55,phase:4.2,scale:.82,id:"balloon_yellow"}
  ];

  balloons.forEach((b,i)=>{
   const sway=Math.sin(t*1.5+b.phase)*5;
   const float=Math.sin(t*2+b.phase)*4;
   const bx=b.x+sway;
   const by=b.y+float;

   drawBalloonString(30+i*3,8,bx,by+18,t*1.5+b.phase);
   balloonShape(b.id,bx,by,b.scale);
  });
  return;
 }

 const sway=Math.sin(t*1.6)*5;
 const float=Math.sin(t*2.1)*4;
 const bx=35+sway;
 const by=-70+float;

 drawBalloonString(30,8,bx,by+18,t*1.6);
 balloonShape(id,bx,by,1.08);
}

function drawSkin(time=0){
 ctx.clearRect(0,0,canvas.width,canvas.height);
 ctx.save();
 ctx.translate(115,145);
 ctx.scale(2.1,2.1);
 drawChair(time);
 ctx.restore();
}

const animationStart=performance.now();

function animate(now){
 drawSkin(now-animationStart);
 requestAnimationFrame(animate);
}

function playSound(kind="click"){
 try{
  audio=audio||new(window.AudioContext||window.webkitAudioContext)();
  if(audio.state==="suspended")audio.resume();

  const osc=audio.createOscillator();
  const gain=audio.createGain();
  osc.connect(gain);
  gain.connect(audio.destination);

  const now=audio.currentTime;
  const settings={
   click:[520,.055,"square"],
   select:[680,.09,"sine"],
   buy:[880,.13,"triangle"],
   error:[180,.15,"sawtooth"]
  }[kind];

  osc.type=settings[2];
  osc.frequency.setValueAtTime(settings[0],now);

  if(kind==="buy")
   osc.frequency.exponentialRampToValueAtTime(1250,now+.12);
  if(kind==="error")
   osc.frequency.exponentialRampToValueAtTime(100,now+.14);

  gain.gain.setValueAtTime(.055,now);
  gain.gain.exponentialRampToValueAtTime(.001,now+settings[1]);

  osc.start(now);
  osc.stop(now+settings[1]);
 }catch{}
}

function slotFor(type){
 return categorySlot[type];
}

function persist(){
 try{
  localStorage.setItem(STORAGE_KEY,JSON.stringify(save));
  document.getElementById("money").textContent=save.money;
  document.getElementById("status").textContent="✓ Kostenlos gespeichert";
 }catch{
  document.getElementById("status").textContent="Speichern nicht möglich";
 }
}

function renderItems(){
 const list=document.getElementById("items");
 list.innerHTML="";

 document.getElementById("categoryName").textContent=
  currentCategory==="Gesicht"?"BALLONS":currentCategory.toUpperCase()+"-ITEMS";

 const filtered=cosmetics.filter(i=>i.type===currentCategory);
 document.getElementById("itemCount").textContent=filtered.length+" ITEMS";

 filtered.forEach(item=>{
  const selected=save.equipped[slotFor(item.type)]===item.id;

  const button=document.createElement("button");
  button.className="item"+(selected?" selected":"");

  button.innerHTML=
   `<span class="symbol">${item.symbol}</span>`+
   (selected?'<span class="check">✓</span>':"");

  button.addEventListener("click",()=>chooseItem(item));
  list.appendChild(button);
 });
}

function chooseItem(item){
 const slot=slotFor(item.type);

 if(!save.unlocked.includes(item.id)){
  save.unlocked.push(item.id);
 }

 save.equipped[slot]=item.id;

 playSound("select");
 persist();
 renderItems();
 drawSkin(performance.now()-animationStart);
}

document.querySelectorAll(".category").forEach(button=>{
 button.addEventListener("click",()=>{
  document.querySelectorAll(".category").forEach(b=>b.classList.remove("active"));
  button.classList.add("active");
  currentCategory=button.dataset.type;
  playSound("click");
  renderItems();
 });
});

document.getElementById("remove").addEventListener("click",()=>{
 save.equipped[slotFor(currentCategory)]=null;
 playSound("click");
 persist();
 renderItems();
 drawSkin(performance.now()-animationStart);
});

document.getElementById("money").textContent=save.money;

renderItems();
requestAnimationFrame(animate);
</script>
