
<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>MEIN ZIMMER – Kleiderschrank</title>
<style>
:root{
  --paper:#f5eddf;--ink:#292e35;--accent:#d9b46c;
  --blue:#587e96;--border:#c8b69e;
}
*{box-sizing:border-box}
body{
  margin:0;background:#252a30;color:var(--ink);
  font-family:"Courier New",monospace;height:100vh;overflow:hidden
}
button{font:inherit;cursor:pointer}
header{
  height:62px;background:var(--paper);border-bottom:3px solid #a88c6b;
  display:flex;align-items:center;justify-content:space-between;padding:0 22px
}
header strong{font-size:17px;letter-spacing:2px}
.back{
  background:#292e35;color:white;border:2px solid #111;
  padding:9px 14px;font-weight:bold
}
main{
  height:calc(100vh - 62px);
  display:grid;grid-template-columns:minmax(0,1fr) 340px
}
.preview{
  position:relative;display:flex;align-items:center;justify-content:center;
  background-color:#d9cbb6;
  background-image:
  linear-gradient(45deg,#d1c1aa 25%,transparent 25%),
  linear-gradient(-45deg,#d1c1aa 25%,transparent 25%),
  linear-gradient(45deg,transparent 75%,#d1c1aa 75%),
  linear-gradient(-45deg,transparent 75%,#d1c1aa 75%);
  background-size:36px 36px;
  background-position:0 0,0 18px,18px -18px,-18px 0
}
.preview:after{
  content:"";position:absolute;bottom:10%;left:50%;
  transform:translateX(-50%);width:220px;height:14px;
  background:#6b5742;border-radius:50%;opacity:.25;filter:blur(5px)
}
.preview-label{
  position:absolute;top:25px;left:30px;
  color:#766b5d;font-size:11px;letter-spacing:3px
}
#skin{
  width:min(72%,480px);height:min(83%,420px);
  image-rendering:pixelated;position:relative;z-index:1
}
.right{
  background:var(--paper);border-left:4px solid #a88c6b;
  display:flex;flex-direction:column;min-height:0
}
.panel-head{
  padding:20px 19px 13px;border-bottom:2px solid var(--border)
}
.panel-head small{font-size:10px;color:#88765f;letter-spacing:2px}
.panel-head h2{font-size:19px;margin:7px 0 0}
.categories{
  display:grid;grid-template-columns:repeat(3,1fr);
  gap:8px;padding:15px 15px 12px
}
.category{
  height:65px;background:#e8dcc9;border:2px solid #c8b69e;
  color:#51483e;display:grid;place-items:center;
  font-size:25px;position:relative
}
.category.active{
  background:#292e35;color:#f5eddf;border-color:#292e35;
  box-shadow:inset 0 -4px var(--accent)
}
.category span{
  position:absolute;bottom:5px;font-size:8px;letter-spacing:1px
}
.items-head{
  padding:5px 17px 10px;display:flex;justify-content:space-between;
  align-items:center;font-size:11px;color:#766b5d
}
.items{
  overflow-y:auto;padding:0 15px 15px;
  display:grid;grid-template-columns:repeat(3,1fr);gap:9px
}
.item{
  height:91px;position:relative;display:grid;place-items:center;
  background:#fffaf1;border:2px solid #d8c9b5;
  box-shadow:2px 2px 0 #6b50301a;color:#292e35
}
.item:hover{background:#f1e4cf;transform:translateY(-2px)}
.item.selected{
  border:3px solid #587e96;background:#e4eceb;
  box-shadow:inset 0 0 0 2px #fff
}
.item.locked{opacity:.7}
.item .symbol{font-size:34px;filter:drop-shadow(2px 2px 0 #0002)}
.item .check{
  position:absolute;right:4px;top:3px;font-size:12px;
  color:#416d5b;font-weight:bold
}
.item .price{
  position:absolute;bottom:5px;right:5px;font-size:9px;
  color:#80653c;background:#f5eddf;padding:2px 4px
}
.item .tooltip{
  position:absolute;bottom:100%;left:50%;transform:translateX(-50%);
  background:#292e35;color:white;padding:5px 7px;font-size:9px;
  white-space:nowrap;opacity:0;pointer-events:none;z-index:5
}
.item:hover .tooltip{opacity:1}
.footer{
  margin-top:auto;padding:13px 16px;border-top:2px solid var(--border);
  display:flex;align-items:center;justify-content:space-between;gap:8px
}
.balance{font-size:12px;color:#766b5d}
.balance b{color:#292e35}
.remove{
  background:#e8dcc9;border:2px solid #c8b69e;
  padding:9px 10px;font-size:10px;color:#51483e
}
#status{
  min-height:22px;text-align:center;padding:4px;
  font-size:10px;color:#71877b
}
@media(max-width:700px){
  body{height:auto;min-height:100vh;overflow:auto}
  main{height:auto;min-height:calc(100vh - 62px);grid-template-columns:1fr}
  .preview{height:390px}
  #skin{width:340px;height:340px}
  .right{border-left:0;border-top:4px solid #a88c6b;min-height:460px}
}
</style>
</head>
<body>

<header>
  <button class="back" onclick="location.href='index.html'">← ZURÜCK</button>
  <strong>KLEIDERSCHRANK</strong>
  <span>♫</span>
</header>

<main>
  <section class="preview">
    <div class="preview-label">DEIN CHARAKTER · VORSCHAU</div>
    <canvas id="skin" width="480" height="420"></canvas>
  </section>

  <aside class="right">
    <div class="panel-head">
      <small>CHARAKTER EDITOR</small>
      <h2>Dein Outfit</h2>
    </div>

    <div class="categories">
      <button class="category active" data-type="Kopf" title="Kopf">♛<span>KOPF</span></button>
      <button class="category" data-type="Gesicht" title="Gesicht">◉<span>GESICHT</span></button>
      <button class="category" data-type="Kleidung" title="Kleidung">▣<span>STYLE</span></button>
    </div>

    <div class="items-head">
      <b id="categoryName">KOPF-ITEMS</b>
      <span>ITEMS</span>
    </div>

    <div class="items" id="items"></div>

    <div class="footer">
      <div class="balance">¢ <b id="money">120</b></div>
      <button class="remove" id="remove">OUTFIT-TEIL ABLEGEN</button>
    </div>
    <div id="status">Änderungen werden automatisch gespeichert.</div>
  </aside>
</main>

<script>
"use strict";

const STORAGE_KEY="mein-zimmer-save-v1";

const defaults={
  money:120,unlocked:[],
  equipped:{head:null,face:null,clothes:null},
  inventory:[],placed:[],orders:[],received:[],
  faucetOn:false,bucketWater:0
};

function loadSave(){
  try{
    const s=JSON.parse(localStorage.getItem(STORAGE_KEY)||"null");
    if(!s)return structuredClone(defaults);
    return {
      ...structuredClone(defaults),...s,
      equipped:{...defaults.equipped,...(s.equipped||{})},
      unlocked:Array.isArray(s.unlocked)?s.unlocked:[]
    };
  }catch{return structuredClone(defaults)}
}

let save=loadSave();

const cosmetics=[
  {id:"cap",name:"Blaue Cap",type:"Kopf",price:25,symbol:"🧢"},
  {id:"crown",name:"Goldene Krone",type:"Kopf",price:80,symbol:"👑"},
  {id:"glasses",name:"Pixelbrille",type:"Gesicht",price:35,symbol:"👓"},
  {id:"scarf",name:"Grüner Schal",type:"Kleidung",price:30,symbol:"🧣"},
  {id:"shirt",name:"Rotes Shirt",type:"Kleidung",price:45,symbol:"👕"},
  {id:"hoodie",name:"Blauer Hoodie",type:"Kleidung",price:65,symbol:"🧥"}
];

let currentCategory="Kopf";
let gameTime=0;
let soundOn=true;
let audio=null;

const canvas=document.getElementById("skin");
const ctx=canvas.getContext("2d");
ctx.imageSmoothingEnabled=false;

const player={
  x:43,y:18,w:34,h:78,vx:0,vy:0,
  grounded:true,facing:1,walk:0
};

const FLOOR=100;
const carrying=null;

function rect(x,y,w,h,color){
  ctx.fillStyle=color;
  ctx.fillRect(Math.round(x),Math.round(y),Math.round(w),Math.round(h));
}
function line(x1,y1,x2,y2,color,width=2){
  ctx.strokeStyle=color;ctx.lineWidth=width;ctx.lineCap="square";
  ctx.beginPath();ctx.moveTo(Math.round(x1),Math.round(y1));
  ctx.lineTo(Math.round(x2),Math.round(y2));ctx.stroke();
}

/* Originaler Charakter-Zeichenstil aus dem Spiel */
function drawPlayer(){
  const x=player.x,y=player.y,cx=x+player.w/2;
  const lift=player.grounded?0:Math.sin(gameTime*12)*1.5;
  const swing=player.grounded&&Math.abs(player.vx)>.1?Math.sin(player.walk)*7:0;
  const shoulder=y+31+lift,hip=y+52+lift,head=y+7+lift;
  const skin="#d5b18a",edge="#805b3c",wood="#b98552",light="#dfb47b";

  rect(cx-20,FLOOR-3,40,4,"#99754f");

  const legs=[
    {x:cx-6-swing*.35,y:hip+12},
    {x:cx+6+swing*.35,y:hip+12}
  ];
  const feet=[
    {x:cx-7-swing,y:y+70+lift},
    {x:cx+7+swing,y:y+70+lift}
  ];

  legs.forEach((p,i)=>{
    line(p.x,p.y,feet[i].x,feet[i].y,edge,8);
    line(p.x,p.y,feet[i].x,feet[i].y,wood,5);
    rect(feet[i].x-5,feet[i].y-1,10,5,edge);
    rect(feet[i].x-4,feet[i].y,8,3,wood);
  });

  const holding=carrying!==null;
  const le=holding?{x:cx-13,y:y+39+lift}:{x:cx-15-swing*.55,y:y+43+lift};
  const re=holding?{x:cx+13,y:y+39+lift}:{x:cx+15+swing*.55,y:y+43+lift};
  const lh=holding?{x:cx-7,y:y+36+lift}:{x:cx-14-swing,y:y+54+lift};
  const rh=holding?{x:cx+7,y:y+36+lift}:{x:cx+14+swing,y:y+54+lift};

  line(cx-10,shoulder,le.x,le.y,wood,6);
  line(le.x,le.y,lh.x,lh.y,wood,5);
  line(cx+10,shoulder,re.x,re.y,wood,6);
  line(re.x,re.y,rh.x,rh.y,wood,5);

  rect(cx-11,shoulder-3,22,24,edge);
  rect(cx-8,shoulder,16,18,wood);
  rect(cx-6,shoulder+2,4,13,light);
  rect(cx-5,hip-1,10,5,edge);
  rect(cx-4,hip,8,3,wood);

  if(save.equipped.clothes==="scarf"){
    rect(cx-10,shoulder-2,20,6,"#4d995f");
    rect(cx+3,shoulder+1,5,15,"#4d995f");
    rect(cx+4,shoulder+2,2,11,"#78b27c");
  }else if(save.equipped.clothes==="shirt"||save.equipped.clothes==="hoodie"){
    const c=save.equipped.clothes==="shirt"?"#c64c48":"#3977bd";
    rect(cx-10,shoulder-2,20,20,c);
    rect(cx-4,shoulder+1,3,14,save.equipped.clothes==="shirt"?"#e1786b":"#6697d2");
    if(save.equipped.clothes==="hoodie"){
      rect(cx-7,shoulder-5,14,6,"#28578b");
      rect(cx-3,shoulder+13,6,3,"#244f7e");
    }
  }

  rect(cx-4,shoulder-7,8,7,edge);
  rect(cx-3,shoulder-6,6,6,wood);
  rect(cx-11,head,22,23,edge);
  rect(cx-9,head+2,18,19,skin);
  rect(cx-7,head+4,14,15,wood);
  rect(cx-6,head+5,4,11,light);
  rect(cx-1,head+5,8,11,"#c99a64");
  rect(cx-6,head+10,3,3,"#43362c");
  rect(cx+4,head+10,3,3,"#43362c");
  rect(cx-2,head+16,5,2,"#8c5944");

  if(save.equipped.head==="cap"){
    rect(cx-13,head+1,26,5,"#3977bd");
    rect(cx-10,head-5,20,7,"#3977bd");
    rect(cx+4,head+4,10,3,"#285a91");
    rect(cx-7,head-3,9,2,"#79a9e3");
  }else if(save.equipped.head==="crown"){
    rect(cx-12,head-4,24,5,"#d8a92e");
    rect(cx-12,head-11,5,8,"#f4c64e");
    rect(cx-4,head-14,6,11,"#f4c64e");
    rect(cx+5,head-10,6,7,"#f4c64e");
    rect(cx-9,head-3,18,2,"#fff0a4");
  }

  if(save.equipped.face==="glasses"){
    rect(cx-9,head+9,8,6,"#29323c");
    rect(cx+1,head+9,8,6,"#29323c");
    rect(cx-1,head+11,2,2,"#29323c");
    rect(cx-7,head+10,4,2,"#9fc9d6");
    rect(cx+3,head+10,4,2,"#9fc9d6");
  }
}

function drawSkin(){
  ctx.clearRect(0,0,canvas.width,canvas.height);
  ctx.save();
  ctx.scale(4,4);
  drawPlayer();
  ctx.restore();
}

function playSound(kind="click"){
  if(!soundOn)return;
  try{
    audio=audio||new(window.AudioContext||window.webkitAudioContext)();
    if(audio.state==="suspended")audio.resume();
    const osc=audio.createOscillator();
    const gain=audio.createGain();
    osc.connect(gain);gain.connect(audio.destination);
    const now=audio.currentTime;
    const settings={
      click:[520,.055,"square"],
      select:[680,.09,"sine"],
      buy:[880,.13,"triangle"],
      error:[180,.15,"sawtooth"]
    }[kind]||[520,.06,"sine"];
    osc.type=settings[2];
    osc.frequency.setValueAtTime(settings[0],now);
    if(kind==="buy")osc.frequency.exponentialRampToValueAtTime(1250,now+.12);
    if(kind==="error")osc.frequency.exponentialRampToValueAtTime(100,now+.14);
    gain.gain.setValueAtTime(.055,now);
    gain.gain.exponentialRampToValueAtTime(.001,now+settings[1]);
    osc.start(now);osc.stop(now+settings[1]);
  }catch{}
}

function persist(){
  localStorage.setItem(STORAGE_KEY,JSON.stringify(save));
  document.getElementById("money").textContent=save.money;
  document.getElementById("status").textContent="✓ Gespeichert";
}

function categoryKey(type){
  return type==="Kopf"?"head":type==="Gesicht"?"face":"clothes";
}

function renderItems(){
  const list=document.getElementById("items");
  list.innerHTML="";
  document.getElementById("categoryName").textContent=currentCategory.toUpperCase()+"-ITEMS";

  cosmetics.filter(i=>i.type===currentCategory).forEach(item=>{
    const unlocked=save.unlocked.includes(item.id);
    const selected=save.equipped[categoryKey(item.type)]===item.id;

    const button=document.createElement("button");
    button.className="item"+(selected?" selected":"")+(unlocked?"":" locked");
    button.title=item.name;
    button.innerHTML=`
      <span class="symbol">${item.symbol}</span>
      ${selected?'<span class="check">✓</span>':""}
      ${!unlocked?'<span class="price">¢ '+item.price+'</span>':""}
      <span class="tooltip">${item.name}</span>
    `;
    button.addEventListener("click",()=>chooseItem(item));
    list.appendChild(button);
  });
}

function chooseItem(item){
  const key=categoryKey(item.type);
  const unlocked=save.unlocked.includes(item.id);

  if(!unlocked){
    if(save.money<item.price){
      playSound("error");
      document.getElementById("status").textContent="Nicht genug Münzen!";
      return;
    }
    save.money-=item.price;
    save.unlocked.push(item.id);
    playSound("buy");
  }else{
    playSound("select");
  }

  save.equipped[key]=item.id;
  persist();
  renderItems();
  drawSkin();
}

document.querySelectorAll(".category").forEach(button=>{
  button.addEventListener("click",()=>{
    document.querySelectorAll(".category").forEach(b=>b.classList.remove("active"));
    button.classList.add("active");
    currentCategory=button.dataset.type;
    playSound("click");
    renderItems();
  });
});

document.getElementById("remove").addEventListener("click",()=>{
  save.equipped[categoryKey(currentCategory)]=null;
  playSound("click");
  persist();
  renderItems();
  drawSkin();
});

document.getElementById("money").textContent=save.money;
renderItems();
drawSkin();
</script>
</body>
</html>
