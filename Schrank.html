function rect(x,y,w,h,color){
 ctx.fillStyle=color;ctx.fillRect(Math.round(x),Math.round(y),Math.round(w),Math.round(h));
}
function line(x1,y1,x2,y2,color,width=2){
 ctx.strokeStyle=color;ctx.lineWidth=width;ctx.lineCap="square";
 ctx.beginPath();ctx.moveTo(Math.round(x1),Math.round(y1));ctx.lineTo(Math.round(x2),Math.round(y2));ctx.stroke();
}
function playSound(kind="click"){
 try{
  audio=audio||new(window.AudioContext||window.webkitAudioContext)();
  if(audio.state==="suspended")audio.resume();
  const osc=audio.createOscillator(),gain=audio.createGain();
  osc.connect(gain);gain.connect(audio.destination);
  const now=audio.currentTime;
  const settings={click:[520,.055,"square"],select:[680,.09,"sine"],buy:[880,.13,"triangle"],error:[180,.15,"sawtooth"]}[kind];
  osc.type=settings[2];osc.frequency.setValueAtTime(settings[0],now);
  if(kind==="buy")osc.frequency.exponentialRampToValueAtTime(1250,now+.12);
  if(kind==="error")osc.frequency.exponentialRampToValueAtTime(100,now+.14);
  gain.gain.setValueAtTime(.055,now);gain.gain.exponentialRampToValueAtTime(.001,now+settings[1]);
  osc.start(now);osc.stop(now+settings[1]);
 }catch{}
}

 }else{
  rect(cx-10,hip-2,9,29,c);rect(cx+1,hip-2,9,29,c);
  if(id==="cargo"){rect(cx-12,hip+10,5,7,"#566343");rect(cx+7,hip+10,5,7,"#566343")}
  if(id==="overalls"){rect(cx-8,hip-7,16,7,"#487e9a");rect(cx-6,hip-10,3,9,"#487e9a");rect(cx+3,hip-10,3,9,"#487e9a")}
  if(id==="gold_pants"){rect(cx-8,hip+3,4,3,"#f4db80");rect(cx+3,hip+3,4,3,"#f4db80")}
  if(id==="camo"){rect(cx-8,hip+4,5,5,"#414d38");rect(cx+3,hip+14,5,5,"#414d38")}
  if(id==="knight_pants"){rect(cx-9,hip,18,4,"#c3cbd0");rect(cx-5,hip+9,10,3,"#c3cbd0")}
 }
}

function drawPlayer(){
 const x=player.x,y=player.y,cx=x+player.w/2;
 const lift=player.grounded?0:Math.sin(Date.now()/90)*1.5;
 const shoulder=y+31+lift,hip=y+52+lift,head=y+7+lift;
 const skin="#d5b18a",edge="#805b3c",wood="#b98552",light="#dfb47b";
 rect(cx-20,FLOOR-3,40,4,"#99754f");

 drawBack(cx,y);

 const pants=save.equipped.pants;
 const legColor=pants?({
  jeans:"#426e9a",joggers:"#686b76",cargo:"#78805a",shorts:"#bd704c",
  sleep_pants:"#7f76a8",baggy:"#42658b",knight_pants:"#929ca4",
  rain_pants:"#4d7e87",camo:"#65734c",gold_pants:"#c5a13c",
  ski_pants:"#e4e9ef",overalls:"#487e9a"
 }[pants]||"#343c52"):"#343c52";

 line(cx-6,hip+12,cx-7,y+70+lift,edge,8);
 line(cx+6,hip+12,cx+7,y+70+lift,edge,8);
 line(cx-6,hip+12,cx-7,y+70+lift,legColor,5);
 line(cx+6,hip+12,cx+7,y+70+lift,legColor,5);
 rect(cx-12,y+69+lift,10,6,edge);rect(cx+2,y+69+lift,10,6,edge);
 rect(cx-11,y+70+lift,8,3,wood);rect(cx+3,y+70+lift,8,3,wood);

 drawPants(cx,hip,y);

 line(cx-10,shoulder,cx-15,y+54+lift,wood,6);
 line(cx+10,shoulder,cx+15,y+54+lift,wood,6);
 rect(cx-11,shoulder-3,22,24,edge);
 rect(cx-8,shoulder,16,18,wood);
 rect(cx-6,shoulder+2,4,13,light);
 rect(cx-5,hip-1,10,5,edge);rect(cx-4,hip,8,3,wood);

 drawClothes(cx,shoulder,hip);

 rect(cx-4,shoulder-7,8,7,edge);rect(cx-3,shoulder-6,6,6,wood);
 rect(cx-11,head,22,23,edge);rect(cx-9,head+2,18,19,skin);
 rect(cx-7,head+4,14,15,wood);rect(cx-6,head+5,4,11,light);
 rect(cx-1,head+5,8,11,"#c99a64");
 rect(cx-6,head+10,3,3,"#43362c");rect(cx+4,head+10,3,3,"#43362c");
 rect(cx-2,head+16,5,2,"#8c5944");

 drawFaceItem(cx,head);
 drawHeadItem(cx,head);
}

function drawSkin(){
 ctx.clearRect(0,0,canvas.width,canvas.height);
 ctx.save();ctx.scale(4,4);drawPlayer();ctx.restore();
}

function slotFor(type){return categorySlot[type]}
function persist(){
 localStorage.setItem(STORAGE_KEY,JSON.stringify(save));
 document.getElementById("money").textContent=save.money;
 document.getElementById("status").textContent="✓ Gespeichert";
}

function renderItems(){
 const list=document.getElementById("items");list.innerHTML="";
 document.getElementById("categoryName").textContent=currentCategory.toUpperCase()+"-ITEMS";
 const filtered=cosmetics.filter(i=>i.type===currentCategory);
 document.getElementById("itemCount").textContent=filtered.length+" ITEMS";
 filtered.forEach(item=>{
  const unlocked=save.unlocked.includes(item.id);
  const selected=save.equipped[slotFor(item.type)]===item.id;
  const button=document.createElement("button");
  button.className="item"+(selected?" selected":"")+(unlocked?"":" locked");
  button.title=item.name;
  button.innerHTML=`<span class="symbol">${item.symbol}</span>${selected?'<span class="check">✓</span>':""}${!unlocked?'<span class="price">¢ ${item.price}</span>':""}<span class="tooltip">${item.name}</span>`;
  button.addEventListener("click",()=>chooseItem(item));
  list.appendChild(button);
 });
}

function chooseItem(item){
 const slot=slotFor(item.type),unlocked=save.unlocked.includes(item.id);
 if(!unlocked){
  if(save.money<item.price){
   playSound("error");document.getElementById("status").textContent="Nicht genug Münzen!";return;
  }
  save.money-=item.price;save.unlocked.push(item.id);playSound("buy");
 }else playSound("select");
 save.equipped[slot]=item.id;
 persist();renderItems();drawSkin();
}

document.querySelectorAll(".category").forEach(button=>{
 button.addEventListener("click",()=>{
  document.querySelectorAll(".category").forEach(b=>b.classList.remove("active"));
  button.classList.add("active");currentCategory=button.dataset.type;
  playSound("click");renderItems();
 });
});

document.getElementById("remove").addEventListener("click",()=>{
 save.equipped[slotFor(currentCategory)]=null;
 playSound("click");persist();renderItems();drawSkin();
});

document.getElementById("money").textContent=save.money;
renderItems();drawSkin();
</script>
</body>
</html>
