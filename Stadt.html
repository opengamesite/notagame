let sx=1,sy=1,cameraX=0,last=0,time=0;

function resize(){
 const d=Math.min(devicePixelRatio||1,2);
 canvas.width=innerWidth*d;
 canvas.height=innerHeight*d;
 sx=canvas.width/W;
 sy=canvas.height/H;
}
addEventListener("resize",resize);
resize();

const keys={};

addEventListener("keydown",e=>{
 const k=e.key.toLowerCase();
 keys[k]=true;

 if([" ","arrowleft","arrowright","arrowup"].includes(k))
  e.preventDefault();

 if(!e.repeat){
  if(k===" "||k==="arrowup"||k==="w")jump();
  if(k==="e")interact();
  if(k==="q")dropItem();
  if(k==="escape")closeMessage();
 }
});

addEventListener("keyup",e=>{
 keys[e.key.toLowerCase()]=false;
});

/* SPEICHER */

const defaults={
 money:120,

 equipped:{head:null,face:null,clothes:null,back:null,pants:null},
 inventory:[],
 placed:[],
 orders:[],
 received:[],
 faucetOn:false,
 bucketWater:0
};

function readSave(){
 try{
  const s=JSON.parse(localStorage.getItem(SAVE_KEY)||"null");
  return s?{
   ...defaults,
   ...s,
   equipped:{...defaults.equipped,...(s.equipped||{})}
  }:structuredClone(defaults);
 }catch{
  return structuredClone(defaults);
 }
}

let save=readSave();
let wardrobe=save.equipped;

addEventListener("storage",e=>{
 if(e.key===SAVE_KEY){
  save=readSave();
  wardrobe=save.equipped;
 }
});

/* HILFSFUNKTIONEN */

function clamp(v,a,b){
 return Math.max(a,Math.min(b,v));
}

function lerp(a,b,t){
 return a+(b-a)*t;
}

function hash(n){
 const v=Math.sin(n*127.1+311.7)*43758.5453;
 return v-Math.floor(v);
}

function gradient(x,y,w,h,c1,c2){
 const g=ctx.createLinearGradient(x,y,x+w,y+h);
 g.addColorStop(0,c1);
 g.addColorStop(1,c2);
 return g;
}

function rounded(x,y,w,h,r,fill,stroke){
 ctx.beginPath();
 ctx.roundRect(x,y,w,h,r);
 if(fill){
  ctx.fillStyle=fill;
  ctx.fill();
 }
 if(stroke){
  ctx.strokeStyle=stroke;
  ctx.stroke();
 }
}

function ellipse(x,y,rx,ry,color){
 ctx.beginPath();
 ctx.ellipse(x,y,rx,ry,0,0,Math.PI*2);
 ctx.fillStyle=color;
 ctx.fill();
}

function shadow(x,y,rx,alpha=.2){
 ctx.save();
 ctx.globalAlpha=alpha;
 ellipse(x,y,rx,5,"#161514");
 ctx.restore();
}

function wood(x,y,w,h,base="#986c48",seed=1){
 ctx.save();

 rounded(x+2,y+2,w,h,2,"#241c1730");
 rounded(x,y,w,h,2,gradient(x,y,w,h,"#d2ad80",base),"#57402e");

 ctx.beginPath();
 ctx.rect(x+1,y+1,w-2,h-2);
 ctx.clip();

 for(let i=0;i<Math.max(3,h/5);i++){
  const yy=y+hash(seed+i)*h;
  ctx.beginPath();
  ctx.moveTo(x,yy);
  ctx.bezierCurveTo(x+w*.3,yy-1,x+w*.7,yy+1,x+w,yy);
  ctx.strokeStyle=i%2?"#fff0d0":"#49301f";
  ctx.globalAlpha=.11;
  ctx.lineWidth=.8;
  ctx.stroke();
 }

 ctx.restore();
}

/* HIMMEL UND HINTERGRUND */

function drawSky(){
 ctx.fillStyle=gradient(0,0,0,390,"#91b9ca","#d9d7c9");
 ctx.fillRect(0,0,WORLD,390);

 const sunX=750;
 const sunY=85;

 ctx.save();
 const glow=ctx.createRadialGradient(sunX,sunY,5,sunX,sunY,110);
 glow.addColorStop(0,"#fff5d9aa");
 glow.addColorStop(1,"#fff5d900");
 ctx.fillStyle=glow;
 ctx.fillRect(sunX-110,sunY-110,220,220);
 ctx.restore();

 ellipse(sunX,sunY,29,29,"#f4e5bd");

 /* entfernte Gebäude */

 for(let i=0;i<35;i++){
  const x=i*125;
  const h=70+hash(i+20)*125;
  const w=65+hash(i+30)*40;
  const y=345-h;

  ctx.fillStyle=i%2?"#929d9b":"#a7aaa1";
  ctx.fillRect(x,y,w,h);

  for(let r=0;r<3;r++){
   for(let c=0;c<2;c++){
    ctx.fillStyle="#b9cbd0";
    ctx.fillRect(x+12+c*25,y+16+r*26,12,16);
   }
  }
 }
}

function drawWindowBuilding(x,y,w,h){
 ctx.fillStyle="#6d5140";
 ctx.fillRect(x-3,y-3,w+6,h+6);

 ctx.fillStyle=gradient(x,y,w,h,"#b8d0d4","#526c78");
 ctx.fillRect(x+3,y+3,w-6,h-6);

 ctx.fillStyle="#ffffff42";
 ctx.beginPath();
 ctx.moveTo(x+5,y+5);
 ctx.lineTo(x+w*.35,y+5);
 ctx.lineTo(x+w*.68,y+h-5);
 ctx.lineTo(x+w*.48,y+h-5);
 ctx.closePath();
 ctx.fill();

 ctx.fillStyle="#5e5145";
 ctx.fillRect(x+w*.48,y+2,3,h-4);
 ctx.fillRect(x+2,y+h*.48,w-4,3);

 ctx.fillStyle="#d9c6a8";
 ctx.fillRect(x-4,y+h-5,w+8,7);
}

function drawBalcony(x,y,w){
 ctx.fillStyle="#574e46";
 ctx.fillRect(x,y,w,4);
 ctx.fillRect(x,y,3,20);
 ctx.fillRect(x+w-3,y,3,20);

 ctx.strokeStyle="#655b50";
 ctx.lineWidth=2;
 ctx.beginPath();
 ctx.moveTo(x,y+6);
 ctx.lineTo(x+w,y+6);
 ctx.stroke();

 for(let i=1;i<7;i++){
  const xx=x+i*w/7;
  ctx.beginPath();
  ctx.moveTo(xx,y+3);
  ctx.lineTo(xx,y+20);
  ctx.stroke();
 }
}

function drawShopWindow(x,y,w,h){
 ctx.fillStyle="#4e4942";
 ctx.fillRect(x-5,y-5,w+10,h+10);

 ctx.fillStyle=gradient(x,y,w,h,"#b6d3d5","#526e73");
 ctx.fillRect(x,y,w,h);

 ctx.fillStyle="#ffffff45";
 ctx.beginPath();
 ctx.moveTo(x+5,y+5);
 ctx.lineTo(x+w*.35,y+5);
 ctx.lineTo(x+w*.62,y+h-5);
 ctx.lineTo(x+w*.4,y+h-5);
 ctx.closePath();
 ctx.fill();

 ctx.fillStyle="#665b4c";
 ctx.fillRect(x+w*.5,y,3,h);
 ctx.fillRect(x,y+h-5,w,5);
}

function drawBuilding(b){
 const x=b.x;
 const y=FLOOR-b.h;
 const w=b.w;
 const h=b.h;

 /* Fassadenschatten */

 ctx.fillStyle="#3b302a35";
 ctx.fillRect(x+12,y+10,w,h);

 /* Hauptfassade */

 ctx.fillStyle=b.wall;
 ctx.fillRect(x,y,w,h);

 ctx.fillStyle="#ffffff20";
 ctx.fillRect(x+4,y+3,5,h-5);

 /* Sockel */

 ctx.fillStyle="#8a8174";
 ctx.fillRect(x,y+h-20,w,20);

 ctx.fillStyle="#c4b7a2";
 ctx.fillRect(x,y+h-23,w,4);

 /* Dach */

 ctx.fillStyle=b.roof;
 ctx.beginPath();
 ctx.moveTo(x-15,y+8);
 ctx.lineTo(x+w*.12,y-27);
 ctx.lineTo(x+w*.85,y-27);
 ctx.lineTo(x+w+15,y+8);
 ctx.closePath();
 ctx.fill();

 ctx.fillStyle="#ffffff20";
 ctx.beginPath();
 ctx.moveTo(x-10,y+5);
 ctx.lineTo(x+w*.12,y-27);
 ctx.lineTo(x+w*.48,y-27);
 ctx.lineTo(x+w*.35,y+5);
 ctx.closePath();
 ctx.fill();

 ctx.fillStyle="#514136";
 ctx.fillRect(x-9,y+5,w+18,7);

 /* Fensterreihen */

 const rows=Math.max(1,Math.floor((h-100)/85));

 for(let r=0;r<rows;r++){
  for(let c=0;c<3;c++){
   const wx=x+35+c*(w-90)/3;
   const wy=y+35+r*76;

   if(wy+49>FLOOR-60)continue;

   drawWindowBuilding(wx,wy,42,48);

   if((c+r)%3===0){
    drawBalcony(wx-5,wy+48,52);
   }

   /* Fensterbank */

   ctx.fillStyle="#e4d8c7";
   ctx.fillRect(wx-4,wy+48,50,4);
  }
 }

 /* Haustür */

 const doorX=x+w/2-19;
 const doorY=FLOOR-76;

 ctx.fillStyle="#594438";
 ctx.fillRect(doorX-4,doorY-4,46,78);

 ctx.fillStyle=gradient(doorX,doorY,38,70,"#9d7959","#513d30");
 ctx.fillRect(doorX,doorY,38,70);

 ctx.fillStyle="#ffffff25";
 ctx.fillRect(doorX+5,doorY+5,12,54);

 ellipse(doorX+30,doorY+38,2.5,2.5,"#e6c47e");

 /* Schaufenster */

 if(["bakery","cafe","market","shop","pharmacy"].includes(b.type)){
  drawShopWindow(x+24,FLOOR-145,w-48,90);

  ctx.fillStyle="#453a31";
  ctx.fillRect(x+12,FLOOR-169,w-24,28);

  const signColors={
   bakery:"#b77b52",
   cafe:"#485b56",
   market:"#4c755c",
   shop:"#9b6657",
   pharmacy:"#588b85"
  };

  ctx.fillStyle=signColors[b.type];
  ctx.fillRect(x+16,FLOOR-166,w-32,22);

  ctx.fillStyle="#fff6e6";
  ctx.font="bold 13px Arial";
  ctx.textAlign="center";
  ctx.fillText(b.label,x+w/2,FLOOR-151);

  /* Beleuchtung im Laden */

  ctx.save();
  ctx.globalAlpha=.22;
  ctx.fillStyle="#f9dfaa";
  ctx.fillRect(x+28,FLOOR-139,w-56,80);
  ctx.restore();

  /* Ladeninhalte */

  if(b.type==="bakery"){
   for(let i=0;i<5;i++){
    ellipse(x+65+i*42,FLOOR-100,10,6,"#c48b50");
    ellipse(x+65+i*42,FLOOR-102,7,3,"#e5bc78");
   }
  }

  if(b.type==="cafe"){
   for(let i=0;i<3;i++){
    ctx.fillStyle="#70513d";
    ctx.fillRect(x+70+i*75,FLOOR-100,4,24);
    ellipse(x+72+i*75,FLOOR-102,15,7,"#d2c2a7");
   }
  }

  if(b.type==="market"){
   for(let i=0;i<5;i++){
    ctx.fillStyle=["#c85c4e","#d5b04c","#6f9a67"][i%3];
    ctx.fillRect(x+48+i*48,FLOOR-105,23,22);
   }
  }

  if(b.type==="shop"){
   for(let i=0;i<4;i++){
    const px=x+65+i*65;
    ctx.strokeStyle="#54794a";
    ctx.lineWidth=2;
    ctx.beginPath();
    ctx.moveTo(px,FLOOR-70);
    ctx.lineTo(px,FLOOR-112);
    ctx.stroke();
    ellipse(px,FLOOR-112,9,12,i%2?"#a45d6b":"#d38c72");
   }
  }

  if(b.type==="pharmacy"){
   ctx.fillStyle="#f0eee4";
   ctx.fillRect(x+w/2-12,FLOOR-126,24,24);
   ctx.fillStyle="#4a9d8d";
   ctx.fillRect(x+w/2-4,FLOOR-122,8,16);
   ctx.fillRect(x+w/2-8,FLOOR-118,16,8);
  }
 }

 /* Dachrinne */

 ctx.fillStyle="#665b50";
 ctx.fillRect(x+w-13,y+5,5,h-15);
 ctx.fillRect(x+w-18,FLOOR-25,15,5);

 /* kleine Fassadendetails */

 ctx.fillStyle="#ffffff30";
 for(let i=0;i<5;i++){
  ctx.fillRect(x+10+i*12,y+15,2,2);
 }

}

 shadow(x,FLOOR+1,12,.13);

 ctx.fillStyle=gradient(x-3,160,6,280,"#b5b6b1","#555b59");

function drawTree(x,y,scale=1){
 ctx.save();
 ctx.translate(x,y);
 ctx.scale(scale,scale);

 shadow(0,2,24,.15);

 ctx.fillStyle=gradient(-5,-75,12,80,"#8b6040","#4e3828");
 ctx.fillRect(-5,-76,10,78);

 ctx.strokeStyle="#67452e";
 ctx.lineWidth=5;
 ctx.beginPath();
 ctx.moveTo(0,-42);
 ctx.lineTo(-17,-70);
 ctx.moveTo(0,-48);
 ctx.lineTo(19,-78);
 ctx.stroke();

 const leaves=[
  [-17,-90,25,"#647d58"],
  [15,-103,28,"#718b60"],
  [0,-125,29,"#82956a"],
  [-30,-112,22,"#81946c"],
  [29,-80,21,"#657e55"],
  [0,-78,24,"#71885d"]
 ];

 for(const l of leaves){
  ellipse(l[0],l[1],l[2],l[2]*.75,l[3]);
 }

 for(let i=0;i<15;i++){
  ellipse(
   (hash(i+x)*2-1)*35,
   -80-hash(i+80)*55,
   3,3,
   i%2?"#a0ad78":"#506f4e"
  );
 }

 ctx.restore();
}

 rounded(x,y-20,118,20,6,gradient(x,y-20,118,20,"#e6e1d4",color),"#4c4943");

/* STRASSE */

function drawStreet(){
 /* Gehweg */

 ctx.fillStyle="#a9a39a";
 ctx.fillRect(0,390,WORLD,50);

 ctx.fillStyle="#d0c8bb";
 ctx.fillRect(0,390,WORLD,6);

 for(let x=0;x<WORLD;x+=65){
  ctx.strokeStyle="#827c74";
  ctx.lineWidth=1;
  ctx.beginPath();
  ctx.moveTo(x,399);
  ctx.lineTo(x,440);
  ctx.stroke();
 }

 ctx.fillStyle="#d8d0c4";

/* BALLONS */

const balloonColors={
 balloon_red:"#e95b59",
 balloon_blue:"#579bd5",
 balloon_yellow:"#edc64c",
 balloon_pink:"#e77ca5",
 balloon_green:"#65ae79",
 balloon_purple:"#9b7bd3",
 balloon_party:"#e95b59",
 balloon_heart:"#e96b83",
 balloon_star:"#e9bd46"
};

function drawBalloonString(ax,ay,bx,by,phase){
 const sway=Math.sin(time*2.2+phase)*4;
 const wind=Math.sin(time*1.3+phase)*2;

 ctx.strokeStyle="#817b72";
 ctx.lineWidth=1;
 ctx.beginPath();
 ctx.moveTo(ax,ay);
 ctx.bezierCurveTo(
  ax-7+sway,ay-18,
  bx+wind,by+20,
  bx,by+11
 );
 ctx.stroke();
}

function drawBalloonShape(id,x,y){
 const color=balloonColors[id]||"#e95b59";

 ctx.save();
 ctx.translate(x,y);

 if(id==="balloon_heart"){
  ctx.beginPath();
  ctx.moveTo(0,10);
  ctx.bezierCurveTo(-5,5,-13,-1,-10,-8);
  ctx.bezierCurveTo(-7,-15,0,-11,0,-6);
  ctx.bezierCurveTo(0,-11,7,-15,10,-8);
  ctx.bezierCurveTo(13,-1,5,5,0,10);
  ctx.closePath();
 }else if(id==="balloon_star"){
  ctx.beginPath();
  for(let i=0;i<10;i++){
   const a=-Math.PI/2+i*Math.PI/5;
   const r=i%2===0?12:5.5;
   const px=Math.cos(a)*r;
   const py=Math.sin(a)*r;
   if(i===0)ctx.moveTo(px,py);
   else ctx.lineTo(px,py);
  }
  ctx.closePath();
 }else{
  ctx.beginPath();
  ctx.ellipse(0,0,8.5,11.5,0,0,Math.PI*2);
 }

 ctx.fillStyle=gradient(-8,-12,16,24,"#ffffff",color);
 ctx.fill();
 ctx.strokeStyle="#00000030";
 ctx.lineWidth=.8;
 ctx.stroke();

 ellipse(-3,-5,2,4,"#ffffff");

 ctx.fillStyle=color;
 ctx.beginPath();
 ctx.moveTo(-2,11);
 ctx.lineTo(2,11);
 ctx.lineTo(0,14);
 ctx.closePath();
 ctx.fill();

 ctx.restore();
}

function drawBalloons(){
 const id=wardrobe.face;
 if(!id||!id.startsWith("balloon_"))return;

 const trail=clamp(-player.vx*player.facing*.045,-9,9);
 const jumpSway=clamp(-player.vy*.012,-4,4);

 let balloons=[];

 if(id==="balloon_party"){
  balloons=[
   {id:"balloon_red",x:5,y:-45,phase:0},
   {id:"balloon_blue",x:35,y:-66,phase:2},
   {id:"balloon_yellow",x:67,y:-48,phase:4}
  ];
 }else{
  balloons=[{id,x:36,y:-56,phase:0}];
 }

 for(const b of balloons){
  const float=Math.sin(time*2.1+b.phase)*3.5;
  const sway=Math.sin(time*1.5+b.phase)*3;
  drawBalloonString(
   29,13,
   b.x+trail+sway,
   b.y+float+jumpSway,
   b.phase
  );
 }

 for(const b of balloons){
  const float=Math.sin(time*2.1+b.phase)*3.5;
  const sway=Math.sin(time*1.5+b.phase)*3;
  drawBalloonShape(b.id,b.x+trail+sway,b.y+float+jumpSway);
 }
}

function drawChair(){
 const moving=Math.abs(player.vx)>8&&player.grounded;
 const airborne=!player.grounded;
 const phase=player.walk;

 let rearAngle=0,frontAngle=0;

 if(moving){
  rearAngle=Math.sin(phase)*.13;
  frontAngle=Math.sin(phase+Math.PI)*.13;
 }

 if(airborne){
  rearAngle=-.08;
  frontAngle=.08;
 }

 const bodyBob=moving?Math.abs(Math.sin(phase))*.4:0;
 const landingBob=player.landing*.7;

 ctx.save();
 ctx.translate(player.x,player.y+player.height);
 ctx.scale(player.facing*.58,.58);
 ctx.translate(-42,-116+bodyBob+landingBob);

 drawChairLeg(29,75,rearAngle);

 ctx.fillStyle=gradient(23,5,13,70,"#d4a16b","#80502f");
 ctx.strokeStyle="#604027";
 ctx.lineWidth=1.2;
 ctx.beginPath();
 ctx.roundRect(23,5,13,70,2);
 ctx.fill();
 ctx.stroke();

 ctx.strokeStyle="#f1c18b99";
 ctx.lineWidth=1;
 ctx.beginPath();
 ctx.moveTo(25,8);
 ctx.lineTo(25,70);
 ctx.stroke();

 ctx.fillStyle=gradient(20,67,78,12,"#e2b77f","#956039");
 ctx.strokeStyle="#604027";
 ctx.lineWidth=1.3;
 ctx.beginPath();
 ctx.roundRect(20,67,78,12,2);
 ctx.fill();
 ctx.stroke();

 ctx.strokeStyle="#f3d0a0aa";
 ctx.beginPath();
 ctx.moveTo(23,69);
 ctx.lineTo(94,69);
 ctx.stroke();

 drawChairLeg(88,77,frontAngle);

 drawCosmetics();

 if(player.held){
  ctx.save();
  ctx.translate(48,53);
  drawHeldObject(player.held);
  ctx.restore();
 }

 ctx.restore();
}

function drawPlayerShadow(){

/* GEGENSTÄNDE */

function drawBook(o){

 rounded(o.x,o.y,o.w,o.h,2,

function drawObject(o){
 if(o.type==="book")drawBook(o);
 if(o.type==="box")drawBox(o);
 if(o.type==="bag")drawBag(o);
}

function drawHeldObject(o){
 const copy={...o,x:-o.w/2,y:-o.h/2};
 drawObject(copy);
}

/* INTERAKTION */

const places=[
 {x:530,w:120,name:"Bäckerei",description:"Der Duft von frischen Brötchen liegt in der Luft. Im Schaufenster liegen Croissants und Brot."},
 {x:900,w:130,name:"Café",description:"Ein gemütliches kleines Café. Hinter den Fenstern stehen Tische und Kaffeemaschinen."},
 {x:1320,w:130,name:"Supermarkt",description:"Hier gibt es Lebensmittel, Getränke und alles für den Alltag."},
 {x:2070,w:130,name:"Blumenladen",description:"Im Schaufenster stehen frische Blumen in vielen verschiedenen Farben."},
 {x:2930,w:130,name:"Apotheke",description:"Eine kleine Apotheke mitten in der Stadt."}
];

function nearestPlace(){
 let best=null,dist=90;

 for(const p of places){
  const d=Math.abs(player.x-(p.x+p.w/2));
  if(d<dist){
   dist=d;
   best=p;
  }
 }
 return best;
}

function nearestObject(){
 let best=null,dist=85;

 for(const o of objects){
  const d=Math.hypot(
   o.x+o.w/2-player.x,
   o.y+o.h/2-(player.y+player.height/2)
  );

  if(d<dist){
   dist=d;
   best=o;
  }
 }

 return best;
}

function jump(){
 if(player.grounded&&!message.style.display.includes("block")){
  player.vy=-465;
  player.grounded=false;
 }
}

function dropItem(){
 if(!player.held)return;

 const o=player.held;
 o.x=player.x-o.w/2+player.facing*38;
 o.y=player.y+player.height-o.h;
 o.vx=player.facing*65;
 o.vy=-65;

 objects.push(o);
 player.held=null;
}

function showMessage(title,description){
 message.innerHTML=
  "<b>"+title+"</b><br>"+description+
  '<br><button onclick="closeMessage()">Weiter</button>';
 message.style.display="block";
}

function closeMessage(){
 message.style.display="none";
}

function interact(){
 const back=player.x<105;

 if(back){
  location.href="index.html";
  return;
 }

 const place=nearestPlace();

 if(place&&Math.abs(player.x-(place.x+place.w/2))<95){
  showMessage(place.name,place.description);
  return;
 }

 if(player.held){
  dropItem();
  return;
 }

 const o=nearestObject();

 if(o){
  player.held=o;
  objects.splice(objects.indexOf(o),1);
 }
}

/* UPDATE */

function update(dt){
 time+=dt;

 const left=keys.a||keys.arrowleft;
 const right=keys.d||keys.arrowright;
 const dir=(right?1:0)-(left?1:0);

 if(dir){
  player.facing=dir;
  player.vx+=dir*1250*dt;
 }else{
  player.vx*=Math.pow(.0007,dt);
 }

 player.vx=clamp(player.vx,-205,205);
 player.x=clamp(player.x+player.vx*dt,35,WORLD-35);

 const was=player.grounded;

 player.vy+=1350*dt;
 player.y+=player.vy*dt;

 if(player.y+player.height>=FLOOR){
  if(!was&&player.vy>100)player.landing=1;
  player.y=FLOOR-player.height;
  player.vy=0;
  player.grounded=true;
 }else{
  player.grounded=false;
 }

 player.landing*=Math.pow(.025,dt);
 if(player.landing<.015)player.landing=0;

 if(Math.abs(player.vx)>8&&player.grounded){
  player.walk+=dt*10;
 }

 for(const o of objects){
  o.vx=(o.vx||0)*Math.pow(.08,dt);
  o.vy=(o.vy||0)+1150*dt;
  o.x+=o.vx*dt;
  o.y+=o.vy*dt;

  if(o.y+o.h>FLOOR){
   o.y=FLOOR-o.h;
   o.vy=0;
  }

  o.x=clamp(o.x,0,WORLD-o.w);
 }

 cameraX=lerp(
  cameraX,
  clamp(player.x-W*.42,0,WORLD-W),
  1-Math.pow(.0005,dt)
 );

 const place=nearestPlace();
 const item=nearestObject();

 if(player.x<105){
  prompt.style.display="block";
  prompt.textContent="E drücken · Zurück nach Hause";
 }else if(place&&Math.abs(player.x-(place.x+place.w/2))<95){
  prompt.style.display="block";
  prompt.textContent="E drücken · "+place.name+" ansehen";
 }else if(player.held){
  prompt.style.display="block";
  prompt.textContent="E oder Q drücken · Gegenstand ablegen";
 }else if(item){
  prompt.style.display="block";
  prompt.textContent="E drücken · "+item.id+" aufheben";
 }else{
  prompt.style.display="none";
 }

 statusText.textContent="Unterwegs in der Stadt";
 heldText.textContent=player.held?
  "Trägt: "+player.held.id:"Hände frei";
}

/* ZEICHNEN */

function draw(){
 ctx.setTransform(sx,0,0,sy,0,0);
 ctx.clearRect(0,0,W,H);

 ctx.save();
 ctx.translate(-cameraX,0);

 drawWorld();

 for(const o of objects)drawObject(o);

 drawPlayerShadow();
 drawChair();

 ctx.restore();
}

/* SPIELSCHLEIFE */

function loop(now){
 const dt=Math.min((now-last)/1000||0,.033);
 last=now;

 if(message.style.display!=="block"){
  update(dt);
 }

 draw();
 requestAnimationFrame(loop);
}

requestAnimationFrame(loop);
</script>
