
<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>MEIN ZIMMER – Stadt</title>

<style>
*{box-sizing:border-box}
html,body{
 margin:0;width:100%;height:100%;overflow:hidden;
 background:#20252b;font-family:Arial,sans-serif;
}
canvas{display:block;width:100%;height:100%}
#hud{
 position:fixed;top:16px;left:18px;z-index:5;
 color:#fff;background:rgba(24,29,34,.86);
 border:1px solid rgba(255,255,255,.15);
 border-radius:10px;padding:11px 15px;
 box-shadow:0 5px 20px #0004;
}
#hud strong{font-size:14px;letter-spacing:1.5px}
#hud small{display:block;margin-top:5px;color:#c5cbd0;font-size:11px}
#online{
 position:fixed;right:18px;top:18px;z-index:5;
 padding:9px 13px;border-radius:20px;
 background:#202a2d;color:#b9d8c3;
 font-size:12px;border:1px solid #ffffff22;
}
#hint{
 position:fixed;bottom:17px;left:50%;transform:translateX(-50%);
 z-index:5;background:rgba(20,24,28,.88);
 color:#e8e8e8;padding:10px 18px;border-radius:8px;
 font-size:12px;white-space:nowrap;
}
#message{
 position:fixed;bottom:65px;left:50%;transform:translateX(-50%);
 z-index:6;background:rgba(22,27,31,.94);
 color:white;padding:12px 20px;border-radius:9px;
 font-size:13px;opacity:0;pointer-events:none;
 transition:opacity .2s;text-align:center;
}
#message.show{opacity:1}
#fade{
 position:fixed;inset:0;background:#111;
 opacity:0;pointer-events:none;z-index:10;
 transition:opacity .35s;
}
@media(max-width:600px){
 #hint{font-size:10px;padding:9px 11px}
 #hud{top:9px;left:9px}
 #online{top:9px;right:9px}
}
</style>
</head>

<body>
<canvas id="world"></canvas>

<div id="hud">
 <strong>MEIN ZIMMER <span style="color:#d8b477">/ STADT</span></strong>
 <small>Eine kleine Stadt voller Möglichkeiten</small>
</div>

<div id="online">● Offline</div>
<div id="message"></div>
<div id="hint">A / D · Laufen &nbsp; | &nbsp; LEERTASTE · Springen &nbsp; | &nbsp; E · Interagieren</div>
<div id="fade"></div>

<script src="supabase.js"></script>

<script>
"use strict";

/* =====================================================
   GRUNDEINSTELLUNGEN
===================================================== */

const canvas=document.getElementById("world");
const ctx=canvas.getContext("2d");

const W=960,H=540;
const FLOOR=440;
const WORLD=4700;
const SAVE_KEY="mein-zimmer-save-v1";

let dpr=1;
let camera=0;
let lastTime=0;
let messageTimer=null;
let interactPressed=false;

function resize(){
 dpr=Math.min(window.devicePixelRatio||1,2);
 canvas.width=Math.round(innerWidth*dpr);
 canvas.height=Math.round(innerHeight*dpr);
 ctx.setTransform(canvas.width/W,0,0,canvas.height/H,0,0);
}
window.addEventListener("resize",resize);
resize();

/* =====================================================
   SPEICHERSTAND UND ACCESSOIRES
===================================================== */

function readSave(){
 try{
  return JSON.parse(localStorage.getItem(SAVE_KEY)||"{}");
 }catch(e){return {}}
}

const save=readSave();
const wardrobe=save.equipped||{
 head:null,face:null,clothes:null,back:null,pants:null
};

/* =====================================================
   SPIELER
===================================================== */

const player={
 x:115,y:FLOOR-68,
 vx:0,vy:0,
 width:48,height:68,
 grounded:true,
 facing:1,
 walk:0,
 landing:0
};

const keys={};
window.addEventListener("keydown",e=>{
 const k=e.key.toLowerCase();
 keys[k]=true;

 if([" ","arrowup","arrowleft","arrowright"].includes(k))
  e.preventDefault();

 if(k==="e"&&!e.repeat)interact();
 if(k==="escape")location.href="index.html";
});
window.addEventListener("keyup",e=>{
 keys[e.key.toLowerCase()]=false;
});

/* =====================================================
   HILFSFUNKTIONEN
===================================================== */

function clamp(v,a,b){return Math.max(a,Math.min(b,v))}
function rnd(n){return Math.sin(n*127.1+311.7)*43758.5453%1}
function rect(x,y,w,h,c){
 ctx.fillStyle=c;ctx.fillRect(x,y,w,h);
}
function line(x1,y1,x2,y2,c,width=1){
 ctx.strokeStyle=c;ctx.lineWidth=width;
 ctx.beginPath();ctx.moveTo(x1,y1);ctx.lineTo(x2,y2);ctx.stroke();
}
function roundRect(x,y,w,h,r,c){
 ctx.fillStyle=c;
 ctx.beginPath();
 ctx.roundRect(x,y,w,h,r);
 ctx.fill();
}

/* =====================================================
   HIMMEL UND HINTERGRUND
===================================================== */

function drawSky(){
 const g=ctx.createLinearGradient(0,0,0,H);
 g.addColorStop(0,"#71899a");
 g.addColorStop(.55,"#b7c0bb");
 g.addColorStop(1,"#e1cdb0");
 rect(0,0,W,H,g);

 // Abendsonne
 const sun=ctx.createRadialGradient(740,100,5,740,100,95);
 sun.addColorStop(0,"#ffe7b7");
 sun.addColorStop(1,"#ffe7b700");
 ctx.fillStyle=sun;
 ctx.fillRect(640,0,200,200);

 // Wolken
 for(let i=0;i<8;i++){
  let x=((i*190-camera*.12)%1100+1100)%1100-50;
  let y=65+(i%3)*48;
  ctx.fillStyle="#f1eee5";
  ctx.globalAlpha=.22;
  ctx.beginPath();
  ctx.ellipse(x,y,48,12,0,0,Math.PI*2);
  ctx.ellipse(x+28,y-7,29,15,0,0,Math.PI*2);
  ctx.ellipse(x+53,y,38,11,0,0,Math.PI*2);
  ctx.fill();
  ctx.globalAlpha=1;
 }

 // Entfernte Häuser
 for(let i=0;i<18;i++){
  let x=i*125-(camera*.25)%225;
  let h=95+(i*37%90);
  rect(x,350-h,110,h,"#78858a");
  for(let wy=0;wy<4;wy++){
   for(let wx=0;wx<3;wx++){
    rect(x+13+wx*30,365-h+wy*27,12,15,"#aeb9b5");
   }
  }
 }
}

/* =====================================================
   GEBÄUDE UND GESCHÄFTE
===================================================== */

const shops=[
 {
  x:130,w:370,name:"CAFÉ MORGENROT",
  type:"cafe",subtitle:"Kaffee · Kuchen · Frühstück"
 },
 {
  x:590,w:390,name:"CITY MARKET",
  type:"market",subtitle:"Lebensmittel · Getränke"
 },
 {
  x:1040,w:370,name:"PIZZERIA BELLA",
  type:"pizza",subtitle:"Pizza · Pasta · Amore",
  open:true
 },
 {
  x:1510,w:390,name:"BOOKS & MORE",
  type:"book",subtitle:"Bücher · Magazine · Geschenke"
 },
 {
  x:2000,w:390,name:"FLOWER HOUSE",
  type:"flower",subtitle:"Blumen · Pflanzen · Dekoration"
 },
 {
  x:2490,w:400,name:"FASHION STUDIO",
  type:"fashion",subtitle:"Mode · Accessoires"
 },
 {
  x:2990,w:390,name:"GAME ZONE",
  type:"game",subtitle:"Games · Technik · Spaß"
 },
 {
  x:3470,w:390,name:"BAKERY NO. 7",
  type:"bakery",subtitle:"Brot · Brötchen · Gebäck"
 },
 {
  x:3940,w:400,name:"HOME & LIVING",
  type:"home",subtitle:"Wohnen · Möbel · Design"
 }
];

function drawUpperBuilding(s){
 const x=s.x-camera;
 const w=s.w;

 // Fassade
 const facade=["#b8a89a","#9eaaa7","#c0b4a5","#aeb1a9"][Math.floor(s.x/400)%4];
 rect(x,100,w,218,facade);

 // Fassadenstruktur
 rect(x,100,w,8,"#ded4c5");
 rect(x,311,w,8,"#827b70");
 for(let i=0;i<5;i++){
  let bx=x+20+i*(w-40)/5;
  rect(bx,125,54,75,"#59666a");
  rect(bx+4,129,46,67,"#b5c3c1");
  rect(bx+25,129,3,67,"#647579");
  rect(bx,160,54,3,"#647579");
  rect(bx-4,201,62,5,"#817d75");
  rect(bx-7,206,68,4,"#ded4c5");
 }

 // Balkone
 for(let i=0;i<3;i++){
  let bx=x+60+i*130;
  rect(bx,225,75,5,"#777a75");
  line(bx+5,230,bx+5,254,"#555d5d",2);
  line(bx+70,230,bx+70,254,"#555d5d",2);
  line(bx+5,238,bx+70,238,"#555d5d",2);
  line(bx+5,254,bx+70,254,"#555d5d",2);
  rect(bx+10,214,16,12,"#566e58");
  rect(bx+44,214,18,12,"#566e58");
 }

 // Dachkante
 rect(x-5,94,w+10,8,"#6d706b");
 rect(x,88,w,5,"#ded4c5");
}

/* =====================================================
   SCHAUFENSTER-INNENRÄUME
===================================================== */

function drawInterior(s,x,w){
 const top=322;
 const bottom=419;

 // Innenraum hinter dem Glas
 const wall=ctx.createLinearGradient(0,top,0,bottom);
 wall.addColorStop(0,"#343d40");
 wall.addColorStop(1,"#20282a");
 rect(x,top,w,bottom-top,wall);

 // Warme Deckenbeleuchtung
 for(let i=0;i<4;i++){
  const lx=x+35+i*(w-70)/3;
  ctx.fillStyle="#f5dba4";
  ctx.globalAlpha=.6;
  ctx.beginPath();
  ctx.ellipse(lx,331,16,5,0,0,Math.PI*2);
  ctx.fill();
  ctx.globalAlpha=1;
 }

 // Boden
 rect(x,407,w,12,"#72695e");
 for(let i=0;i<w;i+=35){
  line(x+i,407,x+i+15,419,"#8d8272",1);
 }

 // Typische Einrichtung
 if(s.type==="cafe"){
  // Theke
  rect(x+18,371,115,36,"#76513c");
  rect(x+18,366,115,7,"#c8a77a");
  // Kaffeemaschine
  rect(x+43,346,34,20,"#9fa6a3");
  rect(x+49,340,22,7,"#41494a");
  // Tische und Stühle
  for(let i=0;i<2;i++){
   const tx=x+190+i*100;
   rect(tx,376,55,6,"#a77b51");
   rect(tx+24,382,5,25,"#5a4535");
   rect(tx+2,382,5,25,"#5a4535");
   rect(tx+9,384,12,20,"#78624d");
  }
  drawPlant(x+w-45,383,.7);
 }

 if(s.type==="market"){
  for(let i=0;i<3;i++){
   const sx=x+25+i*105;
   rect(sx,350,82,54,"#7a6048");
   rect(sx,350,82,5,"#b99b70");
   for(let j=0;j<4;j++){
    rect(sx+7+j*18,360,12,13,
      ["#a6a65c","#c47a59","#7795a1","#c4aa6e"][(i+j)%4]);
    rect(sx+7+j*18,380,12,14,
      ["#c7a75d","#7b9b76","#b8796c","#d0c0a0"][(i+j)%4]);
   }
  }
 }

 if(s.type==="pizza"){
  rect(x+20,370,150,38,"#784a32");
  rect(x+20,364,150,7,"#c69a65");
  rect(x+40,339,105,25,"#ddd0b8");
  rect(x+52,345,80,13,"#9a4e36");
  // Pizza im Fenster
  drawPizza(x+225,383,17);
  drawPizza(x+285,383,17);
  // Pflanzen
  drawPlant(x+w-48,385,.75);
 }

 if(s.type==="book"){
  for(let i=0;i<3;i++){
   const sx=x+24+i*110;
   rect(sx,347,90,58,"#634d3c");
   rect(sx,347,90,5,"#b99b73");
   for(let j=0;j<7;j++){
    const colors=["#a75b4e","#66818a","#c1a16d","#71856c","#8d7790"];
    rect(sx+5+j*12,355,9,35,colors[(i+j)%5]);
   }
  }
 }

 if(s.type==="flower"){
  for(let i=0;i<5;i++){
   const px=x+28+i*70;
   drawPlant(px,397,.85);
   ctx.fillStyle=["#c47c91","#e5bd6b","#a98cb8","#d77b63"][(i)%4];
   for(let j=0;j<5;j++){
    ctx.beginPath();
    ctx.arc(px-8+j*4,365+(j%2)*3,5,0,Math.PI*2);
    ctx.fill();
   }
  }
 }

 if(s.type==="fashion"){
  rect(x+30,348,100,56,"#806a55");
  for(let i=0;i<4;i++){
   const hx=x+43+i*22;
   line(hx,355,hx,397,"#d2bda1",2);
   ctx.fillStyle=["#8c6871","#617c86","#a68b5f","#6c8269"][i];
   ctx.beginPath();
   ctx.moveTo(hx-9,362);ctx.lineTo(hx+9,362);
   ctx.lineTo(hx+13,390);ctx.lineTo(hx-13,390);
   ctx.closePath();ctx.fill();
  }
  rect(x+190,365,95,40,"#b6a18a");
  rect(x+205,344,65,21,"#d6c7b1");
 }

 if(s.type==="game"){
  rect(x+20,355,145,50,"#494e54");
  rect(x+32,338,120,17,"#7f8d91");
  rect(x+45,342,95,10,"#b3c7c8");
  rect(x+195,350,95,55,"#393f46");
  rect(x+205,358,75,36,"#6e9c9a");
  rect(x+230,371,25,10,"#d7c7a4");
 }

 if(s.type==="bakery"){
  rect(x+20,375,140,30,"#98734e");
  for(let i=0;i<4;i++){
   drawBread(x+38+i*30,369);
  }
  rect(x+195,370,115,35,"#87694b");
  drawBread(x+220,365);
  drawBread(x+260,365);
 }

 if(s.type==="home"){
  rect(x+20,365,130,40,"#7e6955");
  rect(x+30,349,110,16,"#b5a084");
  // kleines Sofa
  roundRect(x+190,375,120,28,6,"#8a776a");
  roundRect(x+200,364,100,24,5,"#a69787");
  drawPlant(x+w-42,390,.7);
 }
}

/* =====================================================
   BAUSTELLENDETAILS IM LADEN
===================================================== */

function drawConstruction(s,x,w){
 // Leiter
 const lx=x+w*.67;
 const ly=350;
 ctx.strokeStyle="#c0b6a0";
 ctx.lineWidth=5;
 ctx.beginPath();
 ctx.moveTo(lx,405);ctx.lineTo(lx+18,ly);
 ctx.moveTo(lx+28,405);ctx.lineTo(lx+46,ly);
 ctx.stroke();

 for(let i=0;i<5;i++){
  line(lx+5+i*4,395-i*10,lx+33+i*4,395-i*10,"#e0d4bb",3);
 }

 // Farbeimer
 roundRect(x+w*.28,384,26,25,4,"#d5d0c4");
 rect(x+w*.28,383,26,4,"#777d7d");
 rect(x+w*.28+4,392,18,7,"#c8b38c");

 // Werkzeugkiste
 rect(x+w*.44,390,42,18,"#a55f35");
 rect(x+w*.44+5,385,32,5,"#c98a4d");
 line(x+w*.44+20,385,x+w*.44+20,390,"#4b4038",2);

 // Gerüstteile im Hintergrund
 rect(x+12,355,6,50,"#8c9694");
 rect(x+12,355,52,5,"#8c9694");
 line(x+12,355,x+64,405,"#8c9694",2);
 line(x+64,355,x+12,405,"#8c9694",2);

 // Kartons
 rect(x+w*.12,390,32,18,"#a98c65");
 line(x+w*.12+16,390,x+w*.12+16,408,"#6f5940",1);
}

/* =====================================================
   SCHILDER UND GESCHÄFTSFASSADEN
===================================================== */

function drawShop(s){
 const x=s.x-camera;
 const w=s.w;

 if(x+w<-50||x>W+50)return;

 drawUpperBuilding(s);

 // Erdgeschoss
 rect(x,315,w,105,"#554d46");
 rect(x,315,w,7,"#d0c3ad");

 // Schaufensterrahmen
 rect(x+12,328,w-24,84,"#343c3d");
 drawInterior(s,x+16,w-32);

 // Glasreflexion
 ctx.fillStyle="#ffffff";
 ctx.globalAlpha=.12;
 ctx.beginPath();
 ctx.moveTo(x+18,330);ctx.lineTo(x+85,330);
 ctx.lineTo(x+48,410);ctx.lineTo(x+18,410);
 ctx.closePath();ctx.fill();
 ctx.globalAlpha=1;

 // Rahmen
 rect(x+8,324,w-16,5,"#c6b9a4");
 rect(x+8,411,w-16,5,"#b4a48f");
 rect(x+Math.floor(w*.48),328,5,84,"#9d9688");

 // Ladenschild
 rect(x+18,277,w-36,37,"#30383a");
 rect(x+23,282,w-46,27,
  s.type==="pizza"?"#963f31":"#e1d2b8");

 ctx.fillStyle=s.type==="pizza"?"#fff0d5":"#343331";
 ctx.textAlign="center";
 ctx.font="bold 15px Arial";
 ctx.fillText(s.name,x+w/2,300);
 ctx.textAlign="left";

 // Untertitel
 ctx.fillStyle="#f0e5d1";
 ctx.font="10px Arial";
 ctx.textAlign="center";
 ctx.fillText(s.subtitle,x+w/2,320);
 ctx.textAlign="left";

 // Tür
 const doorX=x+w-57;
 rect(doorX,328,39,83,"#303b3d");
 rect(doorX+4,332,31,75,"#6e7774");
 rect(doorX+7,337,25,36,"#9ba9a5");
 rect(doorX+7,377,25,25,"#5b6b6c");
 ctx.beginPath();
 ctx.arc(doorX+29,372,2,0,Math.PI*2);
 ctx.fillStyle="#e1c58e";ctx.fill();

 if(s.open){
  // OFFEN-Schild
  rect(doorX-5,340,48,13,"#3d754e");
  ctx.fillStyle="#fff";
  ctx.font="bold 8px Arial";
  ctx.textAlign="center";
  ctx.fillText("GEÖFFNET",doorX+19,349);
  ctx.textAlign="left";
 }else{
  drawComingSoon(s,x,w);
 }
}

/* =====================================================
   COMING SOON – SCHAUFENSTER UND ABSPERRUNGEN
===================================================== */

function drawComingSoon(s,x,w){
 // Schild innen im Schaufenster
 const signX=x+28;
 const signY=337;
 const signW=Math.min(w-95,180);

 roundRect(signX,signY,signW,24,3,"#e7d9bd");
 ctx.strokeStyle="#8b6e4d";
 ctx.lineWidth=1;
 ctx.strokeRect(signX,signY,signW,24);

 ctx.fillStyle="#34302b";
 ctx.font="bold 13px Arial";
 ctx.textAlign="center";
 ctx.fillText("COMING SOON",signX+signW/2,354);
 ctx.textAlign="left";

 // Baustellenmaterial hinter der Scheibe
 drawConstruction(s,x+16,w-32);

 // Baustellenfolie
 ctx.globalAlpha=.13;
 rect(x+17,330,w-34,78,"#d3c9ad");
 ctx.globalAlpha=1;

 // Absperrbänder vor dem Eingang
 const tapeY=426;
 const tapeX=x+5;
 const tapeW=w-10;

 // Pfosten
 for(let i=0;i<4;i++){
  const px=tapeX+i*(tapeW/3);
  rect(px-3,tapeY-20,6,23,"#5d5650");
  roundRect(px-7,tapeY-23,14,5,2,"#c7bba5");
  ctx.beginPath();
  ctx.ellipse(px,tapeY+3,9,3,0,0,Math.PI*2);
  ctx.fillStyle="#48443f";ctx.fill();
 }

 // Rot-weißes Band
 for(let i=0;i<3;i++){
  const y=tapeY-18+i*6;
  line(tapeX,y,tapeX+tapeW,y,"#d7d0c4",4);
  for(let j=0;j<tapeW;j+=25){
   line(tapeX+j,y-2,tapeX+j+8,y+2,"#b74437",3);
  }
 }

 // Kleines Warnschild
 rect(x+w-90,385,54,24,"#e4c65d");
 ctx.strokeStyle="#574d30";
 ctx.strokeRect(x+w-90,385,54,24);
 ctx.fillStyle="#332e24";
 ctx.font="bold 8px Arial";
 ctx.textAlign="center";
 ctx.fillText("BAUSTELLE",x+w-63,400);
 ctx.textAlign="left";
}

/* =====================================================
   DETAILS: PFLANZEN, PIZZA, BROT
===================================================== */

function drawPlant(x,y,scale=1){
 ctx.save();ctx.translate(x,y);ctx.scale(scale,scale);
 rect(-10,-5,20,8,"#765744");
 rect(-7,-15,14,10,"#6d815f");
 line(0,-12,-7,-36,"#55785a",3);
 line(0,-12,8,-39,"#55785a",3);
 line(0,-12,0,-43,"#55785a",3);
 ctx.fillStyle="#608765";
 ctx.beginPath();
 ctx.ellipse(-8,-33,9,5,-.5,0,Math.PI*2);
 ctx.ellipse(8,-37,9,5,.5,0,Math.PI*2);
 ctx.ellipse(0,-44,8,5,0,0,Math.PI*2);
 ctx.fill();
 ctx.restore();
}

function drawPizza(x,y,r){
 ctx.fillStyle="#d5a65d";
 ctx.beginPath();ctx.arc(x,y,r,0,Math.PI*2);ctx.fill();
 ctx.fillStyle="#b84f39";
 ctx.beginPath();ctx.arc(x,y,r-4,0,Math.PI*2);ctx.fill();
 for(let i=0;i<5;i++){
  ctx.fillStyle="#e7c66e";
  ctx.beginPath();
  ctx.arc(x+Math.cos(i*1.25)*9,y+Math.sin(i*1.25)*9,3,0,Math.PI*2);
  ctx.fill();
 }
}

function drawBread(x,y){
 ctx.fillStyle="#c18a4c";
 ctx.beginPath();
 ctx.ellipse(x,y,13,7,-.2,0,Math.PI*2);
 ctx.fill();
 line(x-5,y-3,x-2,y+2,"#f2d19a",1);
 line(x+1,y-4,x+4,y+1,"#f2d19a",1);
}

/* =====================================================
   STRASSE UND GEHWEG
===================================================== */

function drawGround(){
 // Gebäudefundament
 rect(0,420,W,20,"#aaa397");

 // Gehwegplatten
 for(let x=-(camera%80);x<W;x+=80){
  rect(x,420,78,20,"#b7b0a4");
  line(x,420,x,440,"#928d84",1);
  line(x+2,438,x+77,438,"#d1c8b9",1);
 }

 // Bordstein
 rect(0,440,W,9,"#858782");
 rect(0,440,W,2,"#d5d0c5");

 // Straße
 rect(0,449,W,91,"#454a4d");

 // Asphalttextur

function drawCar(x,y,w,color){

 // Schatten
 ctx.fillStyle="#17191b66";
 ctx.beginPath();ctx.ellipse(x+w/2,y+25,w*.56,5,0,0,Math.PI*2);ctx.fill();

 ctx.beginPath();
 ctx.moveTo(x+4,y+13);
 ctx.lineTo(x+13,y+5);
 ctx.lineTo(x+27,y+2);

 ctx.lineTo(x+w-9,y+13);
 ctx.lineTo(x+w-3,y+19);
 ctx.lineTo(x+w,y+24);
 ctx.lineTo(x,y+24);
 ctx.closePath();ctx.fill();

 // Dach und Fenster
 ctx.fillStyle="#374a50";
 ctx.beginPath();
 ctx.moveTo(x+25,y+5);
 ctx.lineTo(x+34,y-7);
 ctx.lineTo(x+w-30,y-7);
 ctx.lineTo(x+w-17,y+5);

 line(x+w/2,y-6,x+w/2,y+5,"#9daeb0",1);

function drawCars(dt){
 for(const c of cars){

}

 line(36,47,36,65,"#80532e",5);

 // Beine mit dezenter Laufbewegung

function drawPlayer(){

let otherPlayers=[];
let ownPlayerId=null;
let roomId=null;
let onlineReady=false;
let lastPositionSend=0;
let lastOnlineRefresh=0;

function drawOtherPlayers(){
 for(const p of otherPlayers){
  if(!p||p.player_id===ownPlayerId||p.area!=="stadt")continue;
  if(!Number.isFinite(Number(p.x))||!Number.isFinite(Number(p.y)))continue;

 }
}

function extractRoomId(room){
 if(!room)return null;
 return room.room_id||room.id||room.room?.id||room.room?.room_id||null;
}

async function startOnline(){
 const badge=document.getElementById("online");

 try{
  if(!window.GameOnline){
   badge.textContent="● Offline";
   return;
  }

  const active=JSON.parse(sessionStorage.getItem("mein-zimmer-active-room")||"null");
  if(!active){
   badge.textContent="● Kein Raum";
   return;
  }

  if(typeof GameOnline.login==="function"){
   await GameOnline.login("Spieler");
  }

  roomId=extractRoomId(active);
  if(!roomId){
   badge.textContent="● Raum nicht gefunden";
   return;
  }

  const client=GameOnline.getClient();
  if(client&&client.auth){
   const result=await client.auth.getUser();
   ownPlayerId=result?.data?.user?.id||null;
  }

  if(typeof GameOnline.watchPlayers==="function"){
   await GameOnline.watchPlayers(roomId,async rows=>{
    const list=Array.isArray(rows)?rows:[];
    const ids=list.map(p=>p.player_id).filter(Boolean);

    let names={};
    if(client&&ids.length){
     try{
      const response=await client.from("profiles")
       .select("id,player_name")
       .in("id",ids);
      for(const profile of response.data||[]){
       names[profile.id]=profile.player_name;
      }
     }catch(e){}
    }

    otherPlayers=list.map(p=>({
     ...p,
     player_name:names[p.player_id]||"Spieler"
    }));
   });
  }

  onlineReady=true;
  badge.textContent="● Online";
 }catch(error){
  console.warn("Multiplayer:",error);
  badge.textContent="● Offline";
 }
}

async function sendPosition(){
 if(!onlineReady||!roomId||!window.GameOnline)return;

 const now=performance.now();
 if(now-lastPositionSend<150)return;
 lastPositionSend=now;

 try{
  await GameOnline.updatePosition(roomId,"stadt",player.x,player.y);
 }catch(e){
  console.warn("Position konnte nicht gesendet werden:",e);
 }
}

function nearestShop(){

 for(const s of shops){
  const center=s.x+s.w/2;
  const d=Math.abs(player.x-center);
  if(d<distance){
   distance=d;best=s;
  }
 }
 return distance<145?best:null;
}

/* =====================================================
   MOTORGERÄUSCHE – WEB AUDIO
===================================================== */

let audioContext=null;
let engineOsc=null;
let engineGain=null;
let audioStarted=false;

function startAudio(){
 if(audioStarted)return;
 try{
  const AC=window.AudioContext||window.webkitAudioContext;
  if(!AC)return;

  audioContext=new AC();
  engineOsc=audioContext.createOscillator();
  engineGain=audioContext.createGain();

  engineOsc.type="sawtooth";
  engineOsc.frequency.value=55;
  engineGain.gain.value=0;

  const filter=audioContext.createBiquadFilter();
  filter.type="lowpass";
  filter.frequency.value=115;

  engineOsc.connect(filter);
  filter.connect(engineGain);
  engineGain.connect(audioContext.destination);
  engineOsc.start();

  audioStarted=true;
 }catch(e){}
}

window.addEventListener("keydown",startAudio,{once:true});

function updateEngineSound(){
 if(!audioStarted||!audioContext)return;

 let nearest=Infinity;
 for(const t of traffic){
  const d=Math.abs(t.x-player.x);
  nearest=Math.min(nearest,d);
 }

 const amount=clamp(1-nearest/650,0,1);
 engineGain.gain.setTargetAtTime(
  amount*.018,audioContext.currentTime,.3
 );
 engineOsc.frequency.setTargetAtTime(
  48+amount*30,audioContext.currentTime,.3
 );
}

/* =====================================================
   SPIELPHYSIK
===================================================== */

function update(dt){
 const left=keys["a"]||keys["arrowleft"];
 const right=keys["d"]||keys["arrowright"];
 const jump=keys[" "]||keys["w"]||keys["arrowup"];

 const acceleration=1250;
 const maxSpeed=205;

 if(left){
  player.vx-=acceleration*dt;
  player.facing=-1;
 }
 if(right){
  player.vx+=acceleration*dt;
  player.facing=1;
 }

 if(!left&&!right){
  player.vx*=Math.pow(.0008,dt);
  if(Math.abs(player.vx)<3)player.vx=0;
 }

 player.vx=clamp(player.vx,-maxSpeed,maxSpeed);

 if(jump&&player.grounded){
  player.vy=-465;
  player.grounded=false;
 }

 player.vy+=1350*dt;
 player.x+=player.vx*dt;
 player.y+=player.vy*dt;

 if(player.y+player.height>=FLOOR){
  player.y=FLOOR-player.height;
  if(!player.grounded&&player.vy>100)player.landing=8;
  player.vy=0;
  player.grounded=true;
 }

 player.x=clamp(player.x,55,WORLD-70);

 if(Math.abs(player.vx)>10){
  player.walk+=dt*Math.abs(player.vx)*.035;
 }

 player.landing=Math.max(0,player.landing-dt*20);

 camera=clamp(player.x-W*.38,0,WORLD-W);

 sendPosition();
}

/* =====================================================
   GESAMTZEICHNUNG
===================================================== */

function render(dt){
 drawSky();

 // Gebäude
 for(const s of shops)drawShop(s);

 // Boden und Straßenelemente
 drawGround();
 drawStreetFurniture();

 // Autos
 drawCars(dt);

 // Spieler
 drawOtherPlayers();
 drawPlayer();
 drawInteractionHint();

 updateEngineSound();
}

/* =====================================================
   HAUPTSCHLEIFE
===================================================== */

function loop(timestamp){
 const dt=Math.min((timestamp-lastTime)/1000||0,.033);
 lastTime=timestamp;

 update(dt);
 render(dt);

 requestAnimationFrame(loop);
}

startOnline();
requestAnimationFrame(loop);

/* =====================================================
   TOUCH-STEUERUNG
===================================================== */

if("ontouchstart" in window){
 const controls=document.createElement("div");
 controls.style.cssText=
  "position:fixed;bottom:65px;left:12px;z-index:8;display:flex;gap:8px";

 function makeTouchButton(label,key){
  const b=document.createElement("button");
  b.textContent=label;
  b.style.cssText=
   "width:55px;height:48px;border:1px solid #ffffff55;border-radius:9px;background:#202a2ddd;color:white;font-size:19px;touch-action:none";
  b.addEventListener("pointerdown",e=>{
   e.preventDefault();keys[key]=true;startAudio();
  });
  ["pointerup","pointercancel","pointerleave"].forEach(ev=>{
   b.addEventListener(ev,()=>keys[key]=false);
  });
  controls.appendChild(b);
 }

 makeTouchButton("◀","a");
 makeTouchButton("▶","d");
 makeTouchButton("↑"," ");

 document.body.appendChild(controls);
}
