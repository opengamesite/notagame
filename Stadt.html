<script>
"use strict";

/* =====================================================
   GRUNDLAGEN
===================================================== */

const canvas=document.getElementById("world");
const ctx=canvas.getContext("2d");

const statusText=document.getElementById("status");
const heldText=document.getElementById("held");
const prompt=document.getElementById("prompt");
const message=document.getElementById("message");
const playerCount=document.getElementById("playerCount");
const soundButton=document.getElementById("sound");

const W=960,H=540;
const FLOOR=440;
const WORLD=3900;
const SAVE_KEY="mein-zimmer-save-v1";
const ROOM_KEY="mein-zimmer-active-room";

let sx=1,sy=1,cameraX=0,last=0,time=0;

function resize(){
 const d=Math.min(devicePixelRatio||1,2);
 canvas.width=innerWidth*d;
 canvas.height=innerHeight*d;
 sx=canvas.width/W;
 sy=canvas.height/H;
}
addEventListener("resize",resize);
resize();

const keys={};

addEventListener("keydown",e=>{
 const k=e.key.toLowerCase();
 keys[k]=true;

 if([" ","arrowleft","arrowright","arrowup"].includes(k))
  e.preventDefault();

 startAudio();

 if(!e.repeat){
  if(k===" "||k==="arrowup"||k==="w")jump();
  if(k==="e")interact();
  if(k==="q")dropItem();
  if(k==="escape")closeMessage();
 }
});

addEventListener("keyup",e=>{
 keys[e.key.toLowerCase()]=false;
});

/* =====================================================
   SPEICHER UND KOSMETIK
===================================================== */

const defaults={
 money:120,
 unlocked:[],
 equipped:{
  head:null,face:null,clothes:null,
  back:null,pants:null
 },
 inventory:[],
 placed:[],
 orders:[],
 received:[],
 faucetOn:false,
 bucketWater:0
};

function readSave(){
 try{
  const s=JSON.parse(localStorage.getItem(SAVE_KEY)||"null");
  return s?{
   ...defaults,
   ...s,
   equipped:{...defaults.equipped,...(s.equipped||{})}
  }:structuredClone(defaults);
 }catch{
  return structuredClone(defaults);
 }
}

let save=readSave();
let wardrobe=save.equipped;

addEventListener("storage",e=>{
 if(e.key===SAVE_KEY){
  save=readSave();
  wardrobe=save.equipped;
 }
});

/* =====================================================
   SPIELER
===================================================== */

const player={
 x:180,y:FLOOR-68,
 vx:0,vy:0,
 width:48,height:68,
 grounded:true,
 facing:1,
 walk:0,
 held:null,
 landing:0
};

const objects=[
 {id:"Zeitung",type:"book",x:820,y:0,w:42,h:12,color:"#d4d0c3"},
 {id:"Paket",type:"box",x:1800,y:0,w:42,h:36},
 {id:"Einkaufstasche",type:"bag",x:2700,y:0,w:28,h:35}
];

/* =====================================================
   HILFSFUNKTIONEN
===================================================== */

function clamp(v,a,b){
 return Math.max(a,Math.min(b,v));
}

function lerp(a,b,t){
 return a+(b-a)*t;
}

function hash(n){
 const v=Math.sin(n*127.1+311.7)*43758.5453;
 return v-Math.floor(v);
}

function gradient(x,y,w,h,c1,c2){
 const g=ctx.createLinearGradient(x,y,x+w,y+h);
 g.addColorStop(0,c1);
 g.addColorStop(1,c2);
 return g;
}

function rounded(x,y,w,h,r,fill,stroke){
 ctx.beginPath();
 ctx.roundRect(x,y,w,h,r);
 if(fill){
  ctx.fillStyle=fill;
  ctx.fill();
 }
 if(stroke){
  ctx.strokeStyle=stroke;
  ctx.stroke();
 }
}

function ellipse(x,y,rx,ry,color){
 ctx.beginPath();
 ctx.ellipse(x,y,rx,ry,0,0,Math.PI*2);
 ctx.fillStyle=color;
 ctx.fill();
}

function shadow(x,y,rx,alpha=.2){
 ctx.save();
 ctx.globalAlpha=alpha;
 ellipse(x,y,rx,5,"#161514");
 ctx.restore();
}

/* =====================================================
   MULTIPLAYER
===================================================== */

let onlineReady=false;
let onlineRoomId=null;
let myPlayerId=null;
let myPlayerName="Spieler";
let remotePlayers=new Map();
let stopWatching=null;
let lastPositionSend=0;
let lastPlayerFetch=0;

function getRoomId(room){
 if(!room)return null;

 if(typeof room==="string")return room;

 return room.room_id||
  room.id||
  room.roomId||
  room.uuid||
  room.data?.room_id||
  room.data?.id||
  null;
}

function getRoom(){
 try{
  return JSON.parse(sessionStorage.getItem(ROOM_KEY)||"null");
 }catch{
  return null;
 }
}

function setOnlineStatus(text){
 statusText.textContent=text;
}

async function connectMultiplayer(){
 const activeRoom=getRoom();
 onlineRoomId=getRoomId(activeRoom);

 if(!onlineRoomId){
  setOnlineStatus("Offline – kein Raum aktiv");
  return;
 }

 if(!window.GameOnline){
  setOnlineStatus("Multiplayer konnte nicht geladen werden");
  return;
 }

 try{
  /*
   * login() stellt die vorhandene anonyme
   * Supabase-Sitzung wieder her.
   */
  const loginResult=await GameOnline.login("Spieler");

  const client=GameOnline.getClient();

  if(client){
   const {data:{user}}=await client.auth.getUser();
   myPlayerId=user?.id||null;

   if(myPlayerId){
    const {data:profile}=await client
     .from("profiles")
     .select("player_name")
     .eq("id",myPlayerId)
     .maybeSingle();

    if(profile?.player_name){
     myPlayerName=profile.player_name;
    }
   }
  }

  /*
   * Bestehende Raumverbindung abonnieren.
   * Nur Spieler aus demselben Raum und
   * demselben Spielbereich anzeigen.
   */
  stopWatching=GameOnline.watchPlayers(
   onlineRoomId,
   rows=>{
    updateRemotePlayers(rows||[]);
   }
  );

  onlineReady=true;
  setOnlineStatus("Mitspieler werden verbunden …");

 }catch(error){
  console.error("Multiplayer:",error);
  setOnlineStatus("Multiplayer-Verbindung fehlgeschlagen");
 }
}

function updateRemotePlayers(rows){
 const now=Date.now();
 const next=new Map();

 for(const row of rows){
  if(!row.player_id)continue;
  if(row.player_id===myPlayerId)continue;
  if(row.area!=="stadt")continue;

  const old=remotePlayers.get(row.player_id);

  next.set(row.player_id,{
   id:row.player_id,
   x:Number(row.x)||0,
   y:Number(row.y)||FLOOR-68,
   targetX:Number(row.x)||0,
   targetY:Number(row.y)||FLOOR-68,
   name:old?.name||"Spieler",
   updatedAt:now
  });
 }

 remotePlayers=next;
 playerCount.textContent=String(remotePlayers.size+1);

 fetchPlayerNames();
}

async function fetchPlayerNames(){
 if(!window.GameOnline)return;

 const client=GameOnline.getClient();
 if(!client)return;

 const ids=[...remotePlayers.keys()];
 if(!ids.length)return;

 try{
  const {data}=await client
   .from("profiles")
   .select("id,player_name")
   .in("id",ids);

  if(!data)return;

  for(const profile of data){
   const p=remotePlayers.get(profile.id);
   if(p&&profile.player_name){
    p.name=profile.player_name;
   }
  }
 }catch(error){
  console.warn("Spielernamen konnten nicht geladen werden",error);
 }
}

async function sendMyPosition(){
 if(!onlineReady||!onlineRoomId)return;

 try{
  await GameOnline.updatePosition(
   onlineRoomId,
   "stadt",
   player.x,
   player.y
  );
 }catch(error){
  console.warn("Position konnte nicht gesendet werden",error);
 }
}

function updateRemoteMovement(dt){
 for(const p of remotePlayers.values()){
  p.x=lerp(p.x,p.targetX,1-Math.pow(.0001,dt));
  p.y=lerp(p.y,p.targetY,1-Math.pow(.0001,dt));
 }
}

connectMultiplayer();

/* =====================================================
   AUDIO – LEISE MOTORGERÄUSCHE
===================================================== */

let audioContext=null;
let engineOscillator=null;
let engineOscillator2=null;
let engineGain=null;
let engineFilter=null;
let soundEnabled=true;
let audioStarted=false;

function startAudio(){
 if(audioStarted||!soundEnabled)return;

 try{
  const AudioContextClass=
   window.AudioContext||window.webkitAudioContext;

  if(!AudioContextClass)return;

  audioContext=new AudioContextClass();

  engineOscillator=audioContext.createOscillator();
  engineOscillator2=audioContext.createOscillator();
  engineFilter=audioContext.createBiquadFilter();
  engineGain=audioContext.createGain();

  engineOscillator.type="sawtooth";
  engineOscillator.frequency.value=58;

  engineOscillator2.type="sine";
  engineOscillator2.frequency.value=116;

  engineFilter.type="lowpass";
  engineFilter.frequency.value=170;

  engineGain.gain.value=0;

  engineOscillator.connect(engineFilter);
  engineOscillator2.connect(engineFilter);
  engineFilter.connect(engineGain);
  engineGain.connect(audioContext.destination);

  engineOscillator.start();
  engineOscillator2.start();

  audioStarted=true;
 }catch(error){
  console.warn("Audio nicht verfügbar",error);
 }
}

function toggleSound(){
 soundEnabled=!soundEnabled;

 soundButton.textContent=
  soundEnabled?"🔊 Sound an":"🔇 Sound aus";

 if(soundEnabled){
  startAudio();
 }else if(engineGain&&audioContext){
  engineGain.gain.setTargetAtTime(
   0,audioContext.currentTime,.15
  );
 }
}

function updateAudio(){
 if(!audioStarted||!audioContext||!engineGain)return;

 let nearest=9999;

 for(const car of cars){
  const d=Math.abs(car.x+55-player.x);
  nearest=Math.min(nearest,d);
 }

 const volume=soundEnabled?
  clamp(1-nearest/650,0,1)*.018:0;

 engineGain.gain.setTargetAtTime(
  volume,audioContext.currentTime,.3
 );

 const frequency=55+clamp(500-nearest,0,500)*.045;

 engineOscillator.frequency.setTargetAtTime(
  frequency,audioContext.currentTime,.3
 );

 engineOscillator2.frequency.setTargetAtTime(
  frequency*2,audioContext.currentTime,.3
 );
}

/* =====================================================
   HIMMEL UND HINTERGRUND
===================================================== */

function drawSky(){
 ctx.fillStyle=gradient(0,0,0,390,"#8eb4c7","#e0ded0");
 ctx.fillRect(0,0,WORLD,390);

 const sunX=760,sunY=86;

 const glow=ctx.createRadialGradient(
  sunX,sunY,5,sunX,sunY,125
 );
 glow.addColorStop(0,"#fff3d6a0");
 glow.addColorStop(1,"#fff3d600");

 ctx.fillStyle=glow;
 ctx.fillRect(sunX-125,sunY-125,250,250);

 ellipse(sunX,sunY,27,27,"#f4e5bd");

 /* Entfernte Stadtsilhouette */

 for(let i=0;i<45;i++){
  const x=i*100;
  const h=75+hash(i+20)*145;
  const w=55+hash(i+30)*35;
  const y=350-h;

  ctx.fillStyle=i%2?"#929f9e":"#a5aaa3";
  ctx.fillRect(x,y,w,h);

  ctx.fillStyle="#b9cbd0";
  for(let r=0;r<4;r++){
   for(let c=0;c<2;c++){
    ctx.fillRect(x+10+c*22,y+15+r*27,11,15);
   }
  }
 }
}

/* =====================================================
   GEBÄUDE
===================================================== */

const buildings=[
 {x:0,w:330,h:290,type:"home",wall:"#d7c5a9",roof:"#795847",label:"WOHNHAUS"},
 {x:360,w:340,h:310,type:"pizza",wall:"#d9c5a7",roof:"#794e3e",label:"PIZZERIA"},
 {x:730,w:370,h:270,type:"cafe",wall:"#c7c6b6",roof:"#4f5d59",label:"CAFÉ"},
 {x:1130,w:410,h:330,type:"market",wall:"#d8d2c2",roof:"#6e5142",label:"SUPERMARKT"},
 {x:1570,w:330,h:285,type:"home",wall:"#d9bfa7",roof:"#6b4c40",label:"WOHNHAUS"},
 {x:1930,w:380,h:305,type:"shop",wall:"#d4c9b4",roof:"#66544b",label:"BLUMENLADEN"},
 {x:2340,w:390,h:275,type:"home",wall:"#c7c9bd",roof:"#6e5b4a",label:"WOHNHAUS"},
 {x:2760,w:390,h:320,type:"pharmacy",wall:"#d8d4c7",roof:"#687d79",label:"APOTHEKE"},
 {x:3180,w:390,h:290,type:"home",wall:"#d5bfa7",roof:"#76513f",label:"WOHNHAUS"},
 {x:3590,w:310,h:280,type:"home",wall:"#c8c6b5",roof:"#675448",label:"WOHNHAUS"}
];

function drawWindow(x,y,w,h){
 ctx.fillStyle="#594b40";
 ctx.fillRect(x-3,y-3,w+6,h+6);

 ctx.fillStyle=gradient(x,y,w,h,"#b8d0d4","#526c78");
 ctx.fillRect(x+3,y+3,w-6,h-6);

 ctx.fillStyle="#ffffff38";
 ctx.beginPath();
 ctx.moveTo(x+5,y+5);
 ctx.lineTo(x+w*.35,y+5);
 ctx.lineTo(x+w*.68,y+h-5);
 ctx.lineTo(x+w*.48,y+h-5);
 ctx.closePath();
 ctx.fill();

 ctx.fillStyle="#5e5145";
 ctx.fillRect(x+w*.48,y+2,3,h-4);
 ctx.fillRect(x+2,y+h*.48,w-4,3);

 ctx.fillStyle="#d9c6a8";
 ctx.fillRect(x-4,y+h-5,w+8,7);
}

function drawBalcony(x,y,w){
 ctx.fillStyle="#574e46";
 ctx.fillRect(x,y,w,4);
 ctx.fillRect(x,y,3,20);
 ctx.fillRect(x+w-3,y,3,20);

 ctx.strokeStyle="#655b50";
 ctx.lineWidth=2;
 ctx.beginPath();
 ctx.moveTo(x,y+6);
 ctx.lineTo(x+w,y+6);
 ctx.stroke();

 for(let i=1;i<7;i++){
  const xx=x+i*w/7;
  ctx.beginPath();
  ctx.moveTo(xx,y+3);
  ctx.lineTo(xx,y+20);
  ctx.stroke();
 }
}

function drawShopWindow(x,y,w,h){
 ctx.fillStyle="#4e4942";
 ctx.fillRect(x-5,y-5,w+10,h+10);

 ctx.fillStyle=gradient(x,y,w,h,"#b6d3d5","#526e73");
 ctx.fillRect(x,y,w,h);

 ctx.fillStyle="#ffffff45";
 ctx.beginPath();
 ctx.moveTo(x+5,y+5);
 ctx.lineTo(x+w*.35,y+5);
 ctx.lineTo(x+w*.62,y+h-5);
 ctx.lineTo(x+w*.4,y+h-5);
 ctx.closePath();
 ctx.fill();

 ctx.fillStyle="#665b4c";
 ctx.fillRect(x+w*.5,y,3,h);
 ctx.fillRect(x,y+h-5,w,5);
}

function drawPizzaDisplay(b){
 const x=b.x;

 /* Pizzakartons und Pizzen im Fenster */

 for(let i=0;i<3;i++){
  const px=x+72+i*75;

  ctx.fillStyle="#b88a51";
  ctx.fillRect(px-18,FLOOR-103,37,5);

  ellipse(px,FLOOR-112,15,9,"#d7a85c");
  ellipse(px,FLOOR-112,11,6,"#d7b66f");

  for(let j=0;j<4;j++){
   ellipse(px-6+(j%2)*12,FLOOR-114+Math.floor(j/2)*5,2,2,
    j%2?"#a74b3d":"#66814d");
  }
 }

 ctx.fillStyle="#f4e4c5";
 ctx.font="bold 11px Arial";
 ctx.textAlign="center";
 ctx.fillText("PIZZA · PASTA · VINO",x+b.w/2,FLOOR-56);
}

function drawBuilding(b){
 const x=b.x,y=FLOOR-b.h,w=b.w,h=b.h;

 ctx.fillStyle="#3b302a35";
 ctx.fillRect(x+12,y+10,w,h);

 ctx.fillStyle=b.wall;
 ctx.fillRect(x,y,w,h);

 ctx.fillStyle="#ffffff20";
 ctx.fillRect(x+4,y+3,5,h-5);

 ctx.fillStyle="#8a8174";
 ctx.fillRect(x,y+h-20,w,20);

 ctx.fillStyle="#c4b7a2";
 ctx.fillRect(x,y+h-23,w,4);

 /* Dach */

 ctx.fillStyle=b.roof;
 ctx.beginPath();
 ctx.moveTo(x-15,y+8);
 ctx.lineTo(x+w*.12,y-27);
 ctx.lineTo(x+w*.85,y-27);
 ctx.lineTo(x+w+15,y+8);
 ctx.closePath();
 ctx.fill();

 ctx.fillStyle="#ffffff20";
 ctx.beginPath();
 ctx.moveTo(x-10,y+5);
 ctx.lineTo(x+w*.12,y-27);
 ctx.lineTo(x+w*.48,y-27);
 ctx.lineTo(x+w*.35,y+5);
 ctx.closePath();
 ctx.fill();

 ctx.fillStyle="#514136";
 ctx.fillRect(x-9,y+5,w+18,7);

 /* Fenster */

 const rows=Math.max(1,Math.floor((h-100)/85));

 for(let r=0;r<rows;r++){
  for(let c=0;c<3;c++){
   const wx=x+35+c*(w-90)/3;
   const wy=y+35+r*76;

   if(wy+49>FLOOR-60)continue;

   drawWindow(wx,wy,42,48);

   if((c+r)%3===0){
    drawBalcony(wx-5,wy+48,52);
   }
  }
 }

 /* Haustür */

 const doorX=x+w/2-19;
 const doorY=FLOOR-76;

 ctx.fillStyle="#594438";
 ctx.fillRect(doorX-4,doorY-4,46,78);

 ctx.fillStyle=gradient(doorX,doorY,38,70,"#9d7959","#513d30");
 ctx.fillRect(doorX,doorY,38,70);

 ctx.fillStyle="#ffffff25";
 ctx.fillRect(doorX+5,doorY+5,12,54);

 ellipse(doorX+30,doorY+38,2.5,2.5,"#e6c47e");

 /* Schaufenster */

 if(["pizza","cafe","market","shop","pharmacy"].includes(b.type)){
  drawShopWindow(x+24,FLOOR-145,w-48,90);

  ctx.fillStyle="#453a31";
  ctx.fillRect(x+12,FLOOR-169,w-24,28);

  const signColors={
   pizza:"#a94437",
   cafe:"#485b56",
   market:"#4c755c",
   shop:"#9b6657",
   pharmacy:"#588b85"
  };

  ctx.fillStyle=signColors[b.type];
  ctx.fillRect(x+16,FLOOR-166,w-32,22);

  ctx.fillStyle="#fff6e6";
  ctx.font="bold 13px Arial";
  ctx.textAlign="center";
  ctx.fillText(b.label,x+w/2,FLOOR-151);

  if(b.type==="pizza"){
   drawPizzaDisplay(b);
  }

  if(b.type==="cafe"){
   for(let i=0;i<3;i++){
    ctx.fillStyle="#70513d";
    ctx.fillRect(x+70+i*75,FLOOR-100,4,24);
    ellipse(x+72+i*75,FLOOR-102,15,7,"#d2c2a7");
   }
  }

  if(b.type==="market"){
   for(let i=0;i<5;i++){
    ctx.fillStyle=["#c85c4e","#d5b04c","#6f9a67"][i%3];
    ctx.fillRect(x+48+i*48,FLOOR-105,23,22);
   }
  }

  if(b.type==="shop"){
   for(let i=0;i<4;i++){
    const px=x+65+i*65;
    ctx.strokeStyle="#54794a";
    ctx.lineWidth=2;
    ctx.beginPath();
    ctx.moveTo(px,FLOOR-70);
    ctx.lineTo(px,FLOOR-112);
    ctx.stroke();
    ellipse(px,FLOOR-112,9,12,i%2?"#a45d6b":"#d38c72");
   }
  }

  if(b.type==="pharmacy"){
   ctx.fillStyle="#f0eee4";
   ctx.fillRect(x+w/2-12,FLOOR-126,24,24);
   ctx.fillStyle="#4a9d8d";
   ctx.fillRect(x+w/2-4,FLOOR-122,8,16);
   ctx.fillRect(x+w/2-8,FLOOR-118,16,8);
  }
 }

 ctx.fillStyle="#665b50";
 ctx.fillRect(x+w-13,y+5,5,h-15);
 ctx.fillRect(x+w-18,FLOOR-25,15,5);
}

/* =====================================================
   STRASSE UND GEHWEG
===================================================== */

function drawStreet(){
 ctx.fillStyle="#a9a39a";
 ctx.fillRect(0,390,WORLD,50);

 ctx.fillStyle="#d0c8bb";
 ctx.fillRect(0,390,WORLD,6);

 for(let x=0;x<WORLD;x+=65){
  ctx.strokeStyle="#827c74";
  ctx.lineWidth=1;
  ctx.beginPath();
  ctx.moveTo(x,399);
  ctx.lineTo(x,440);
  ctx.stroke();
 }

 ctx.fillStyle="#d8d0c4";

function drawBalloonShape(id,x,y){
 const color=balloonColors[id]||"#e95b59";

 ctx.save();
 ctx.translate(x,y);

 if(id==="balloon_heart"){
  ctx.beginPath();
  ctx.moveTo(0,10);
  ctx.bezierCurveTo(-5,5,-13,-1,-10,-8);
  ctx.bezierCurveTo(-7,-15,0,-11,0,-6);
  ctx.bezierCurveTo(0,-11,7,-15,10,-8);
  ctx.bezierCurveTo(13,-1,5,5,0,10);
  ctx.closePath();
 }else if(id==="balloon_star"){
  ctx.beginPath();
  for(let i=0;i<10;i++){
   const a=-Math.PI/2+i*Math.PI/5;
   const r=i%2===0?12:5.5;
   const px=Math.cos(a)*r;
   const py=Math.sin(a)*r;
   if(i===0)ctx.moveTo(px,py);
   else ctx.lineTo(px,py);
  }
  ctx.closePath();
 }else{
  ctx.beginPath();
  ctx.ellipse(0,0,8.5,11.5,0,0,Math.PI*2);
 }

 ctx.fillStyle=gradient(-8,-12,16,24,"#ffffff",color);
 ctx.fill();
 ctx.strokeStyle="#00000030";

 ellipse(-3,-5,2,4,"#ffffff");

 ctx.beginPath();
 ctx.moveTo(-2,11);
 ctx.lineTo(2,11);
 ctx.lineTo(0,14);
 ctx.closePath();
 ctx.fill();

 ctx.restore();
}

function nearestPlace(){
 let best=null,dist=95;

 for(const p of places){
  const d=Math.abs(player.x-(p.x+p.w/2));
  if(d<dist){
   dist=d;
   best=p;
  }
 }

 return best;
}

function nearestObject(){
 let best=null,dist=85;

 for(const o of objects){
  const d=Math.hypot(
   o.x+o.w/2-player.x,
   o.y+o.h/2-(player.y+player.height/2)
  );

  if(d<dist){
   dist=d;
   best=o;
  }
 }

 return best;
}

function jump(){
 if(player.grounded&&message.style.display!=="block"){
  player.vy=-465;
  player.grounded=false;
 }
}

function dropItem(){
 if(!player.held)return;

 const o=player.held;
 o.x=player.x-o.w/2+player.facing*38;
 o.y=player.y+player.height-o.h;
 o.vx=player.facing*65;
 o.vy=-65;

 objects.push(o);
 player.held=null;
}

function showMessage(title,description){
 message.innerHTML=
  "<b>"+title+"</b><br>"+description+
  '<br><button onclick="closeMessage()">Weiter</button>';
 message.style.display="block";
}

function closeMessage(){
 message.style.display="none";
}

function interact(){
 if(player.x<105){
  location.href="index.html";
  return;
 }

 const place=nearestPlace();

 if(place&&Math.abs(player.x-(place.x+place.w/2))<100){
  if(place.url){
   location.href=place.url;
  }else{
   showMessage(place.name,place.description);
  }
  return;
 }

 if(player.held){
  dropItem();
  return;
 }

 const o=nearestObject();

 if(o){
  player.held=o;
  objects.splice(objects.indexOf(o),1);
 }
}

/* =====================================================
   UPDATE
===================================================== */

function update(dt){
 time+=dt;

 const left=keys.a||keys.arrowleft;
 const right=keys.d||keys.arrowright;
 const dir=(right?1:0)-(left?1:0);

 if(dir){
  player.facing=dir;
  player.vx+=dir*1250*dt;
 }else{
  player.vx*=Math.pow(.0007,dt);
 }

 player.vx=clamp(player.vx,-205,205);
 player.x=clamp(player.x+player.vx*dt,35,WORLD-35);

 const was=player.grounded;

 player.vy+=1350*dt;
 player.y+=player.vy*dt;

 if(player.y+player.height>=FLOOR){
  if(!was&&player.vy>100)player.landing=1;
  player.y=FLOOR-player.height;
  player.vy=0;
  player.grounded=true;
 }else{
  player.grounded=false;
 }

 player.landing*=Math.pow(.025,dt);
 if(player.landing<.015)player.landing=0;

 if(Math.abs(player.vx)>8&&player.grounded){
  player.walk+=dt*10;
 }

 for(const o of objects){
  o.vx=(o.vx||0)*Math.pow(.08,dt);
  o.vy=(o.vy||0)+1150*dt;
  o.x+=o.vx*dt;
  o.y+=o.vy*dt;

  if(o.y+o.h>FLOOR){
   o.y=FLOOR-o.h;
   o.vy=0;
  }

  o.x=clamp(o.x,0,WORLD-o.w);
 }

 updateCars(dt);
 updateRemoteMovement(dt);
 updateAudio();

 cameraX=lerp(
  cameraX,
  clamp(player.x-W*.42,0,WORLD-W),
  1-Math.pow(.0005,dt)
 );

 const now=performance.now();

 if(now-lastPositionSend>150){
  lastPositionSend=now;
  sendMyPosition();
 }

 const place=nearestPlace();
 const item=nearestObject();

 if(player.x<105){
  prompt.style.display="block";
  prompt.textContent="E drücken · Zurück nach Hause";
 }else if(place&&Math.abs(player.x-(place.x+place.w/2))<100){
  prompt.style.display="block";

  prompt.textContent=place.url?
   "E drücken · Pizzeria betreten / Pizzajob":
   "E drücken · "+place.name+" ansehen";

 }else if(player.held){
  prompt.style.display="block";
  prompt.textContent="E oder Q drücken · Gegenstand ablegen";
 }else if(item){
  prompt.style.display="block";
  prompt.textContent="E drücken · "+item.id+" aufheben";
 }else{
  prompt.style.display="none";
 }

 if(onlineReady){
  setOnlineStatus("Online in der Stadt");
 }else if(onlineRoomId){
  setOnlineStatus("Verbinde mit Mitspielern …");
 }else{
  setOnlineStatus("Offline – kein Raum aktiv");
 }

 heldText.textContent=player.held?
  "Trägt: "+player.held.id:"Hände frei";
}

/* =====================================================
   ZEICHNEN
===================================================== */

function draw(){
 ctx.setTransform(sx,0,0,sy,0,0);
 ctx.clearRect(0,0,W,H);

 ctx.save();
 ctx.translate(-cameraX,0);

 drawWorld();

 for(const o of objects){
  drawObject(o);
 }

 /* Andere Spieler zuerst */

 drawRemotePlayers();

 /* Eigener Spieler */

 drawPlayerShadowAt(player.x,player.y);
 drawChair();

 /*
  * VORDERGRUND:
  * Autos werden absichtlich NACH den Spielern
  * gezeichnet. Sie fahren vor dem Spieler vorbei.
  */

 for(const car of cars){
  drawCar(car);
 }

 ctx.restore();
}

/* =====================================================
   SPIELSCHLEIFE
===================================================== */

function loop(now){
 const dt=Math.min((now-last)/1000||0,.033);
 last=now;

 if(message.style.display!=="block"){
  update(dt);
 }

 draw();
 requestAnimationFrame(loop);
}

requestAnimationFrame(loop);

/* Multiplayer beim Verlassen aufräumen */

addEventListener("pagehide",()=>{
 if(typeof stopWatching==="function"){
  stopWatching();
 }
});
</script>
</body>
